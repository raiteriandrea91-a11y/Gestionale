/* ==================== SWIPE-BACK: trascina dal bordo sinistro per chiudere ====================
   Stesso gesto delle app native (iOS in particolare): un tocco che parte dai ~28px più a
   sinistra dello schermo, se il movimento è prevalentemente orizzontale, fa scorrere la
   "pagina" di Impostazioni assieme al dito; rilasciando oltre 1/3 dello schermo (o con uno
   scatto deciso) la pagina si chiude, altrimenti torna elasticamente al suo posto.
   Resta inattivo su tutto il resto dello schermo, quindi non interferisce mai con lo scroll
   verticale delle liste. Un solo listener globale: nessun rischio di ascoltatori duplicati
   ogni volta che si apre una nuova pagina. */
(function setupModalSwipeBack(){
  /* Swipe dal bordo sinistro per tornare indietro: vale sia per le pagine a scorrimento
     (Impostazioni e simili) sia per i popup "classici" (form di Movimento, Abbonamento, Auto,
     Manutenzione, ecc.) — stesso gesto, stessa sensazione, ovunque sia aperto qualcosa. */
  const EDGE_ZONE = 28, CLOSE_RATIO = 0.33, FLICK_VELOCITY = 0.55; // px/ms
  let active=false, decided=false, horizontal=false, mode=null;
  let startX=0, startY=0, startT=0, lastX=0, lastT=0, velocity=0;

  document.addEventListener('touchstart', (e)=>{
    const backdrop = document.getElementById('modalBackdrop');
    if(backdrop.classList.contains('closing')) return;
    if(backdrop.classList.contains('settings-page-mode')) mode = 'settings';
    else if(backdrop.classList.contains('show')) mode = 'modal';
    else { mode = null; return; }
    const t = e.touches[0];
    if(t.clientX > EDGE_ZONE) return;
    active = true; decided = false; horizontal = false;
    startX = lastX = t.clientX; startY = t.clientY; startT = lastT = e.timeStamp; velocity = 0;
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(!active) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(!decided){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      decided = true;
      horizontal = Math.abs(dx) > Math.abs(dy);
      if(!horizontal){ active = false; return; }
      document.getElementById('modalBox').style.transition = 'none';
    }
    if(!horizontal) return;
    e.preventDefault();
    const x = Math.max(0, dx);
    velocity = (t.clientX - lastX) / Math.max(1, e.timeStamp - lastT);
    lastX = t.clientX; lastT = e.timeStamp;
    document.getElementById('modalBox').style.transform = `translateX(${x}px)`;
  }, {passive:false});

  document.addEventListener('touchend', ()=>{
    if(!active || !horizontal){ active = false; return; }
    active = false;
    const box = document.getElementById('modalBox');
    const width = window.innerWidth;
    const x = Math.max(0, lastX - startX);
    const shouldClose = x > width*CLOSE_RATIO || velocity > FLICK_VELOCITY;
    box.style.transition = 'transform .26s cubic-bezier(.22,.68,0,1)';
    if(shouldClose){
      box.style.transform = `translateX(${width}px)`;
      if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
      setTimeout(()=>{
        // La chiusura visiva l'ha già fatta lo swipe: qui puliamo lo stato direttamente
        // (stessa pulizia di closeModal(), senza far ripartire una seconda animazione sopra
        // quella appena fatta).
        document.getElementById('modalBackdrop').classList.remove('show','settings-page-mode','closing');
        box.innerHTML = ''; box.className = 'modal'; box.style.transform=''; box.style.transition='';
      }, 260);
    } else {
      box.style.transform = 'translateX(0)';
      setTimeout(()=>{ box.style.transition=''; }, 260);
    }
  }, {passive:true});
})();

/* ==================== RIMBALZO ELASTICO SUI BORDI DELLE LISTE ====================
   Android (a differenza di iOS) non ha di natura il "rubber band" quando si scorre oltre
   inizio/fine di un contenitore scrollabile: qui lo simuliamo su #mainContent, che è l'unico
   elemento che scorre davvero nell'app (vedi nota su html,body{overflow:hidden}). Si attiva
   solo quando si è già all'inizio/fine e si continua a trascinare oltre: il contenuto si
   allunga leggermente seguendo il dito, poi torna elasticamente al suo posto al rilascio. */
(function setupEdgeBounce(){
  const MAX_STRETCH = 70, DAMP = 0.4;
  let el=null, startY=0, dragging=false, edge=null;
  document.addEventListener('touchstart', (e)=>{
    el = document.getElementById('mainContent');
    if(!el) return;
    const atTop = el.scrollTop <= 0;
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
    if(!atTop && !atBottom) { el = null; return; }
    edge = atTop ? 'top' : 'bottom';
    startY = e.touches[0].clientY;
    dragging = false;
  }, {passive:true});
  document.addEventListener('touchmove', (e)=>{
    if(!el) return;
    const dy = e.touches[0].clientY - startY;
    const pulling = (edge==='top' && dy>0) || (edge==='bottom' && dy<0);
    if(!pulling){ if(dragging){ el.style.transform=''; el.style.transition=''; dragging=false; } return; }
    // Se non siamo più davvero al bordo opposto (contenuto rientrato), interrompe
    const atTop = el.scrollTop <= 0, atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
    if((edge==='top' && !atTop) || (edge==='bottom' && !atBottom)) return;
    dragging = true;
    el.style.transition = 'none';
    const stretch = Math.min(MAX_STRETCH, Math.abs(dy) * DAMP) * (edge==='top' ? 1 : -1);
    el.style.transform = `translateY(${stretch}px)`;
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('touchend', ()=>{
    if(!el || !dragging){ el=null; return; }
    el.style.transition = 'transform .35s cubic-bezier(.34,1.4,.64,1)';
    el.style.transform = '';
    dragging = false; el = null;
  }, {passive:true});
})();

/* ==================== OMBRA TABBAR REATTIVA ALLO SCROLL ====================
   Più si scorre velocemente la lista sotto, più l'ombra sotto la pillola di navigazione si
   accentua (dà sensazione di profondità/velocità), poi si rilassa quando lo scroll rallenta/si ferma. */
(function setupTabbarScrollShadow(){
  const main = document.getElementById('mainContent');
  if(!main) return;
  let lastTop = main.scrollTop, lastT = performance.now(), decayTimer = null;
  main.addEventListener('scroll', ()=>{
    const now = performance.now();
    const dt = Math.max(16, now-lastT);
    const dy = Math.abs(main.scrollTop - lastTop);
    const speed = dy / dt; // px/ms
    lastTop = main.scrollTop; lastT = now;
    const boost = Math.min(1, speed / 1.8);
    document.documentElement.style.setProperty('--scroll-boost', boost.toFixed(2));
    clearTimeout(decayTimer);
    decayTimer = setTimeout(()=>{ document.documentElement.style.setProperty('--scroll-boost', '0'); }, 200);
  }, {passive:true});
})();

/* ==================== CALCOLATRICE RAPIDA ==================== */
let calcState = { cur:'0', prev:null, op:null, resetNext:false };
function openCalculatorModal(){
  calcState = { cur:'0', prev:null, op:null, resetNext:false };
  openModal(`
    <div class="modal-head"><h3>${ico('calculator')} Calcolatrice</h3><button class="close-x" id="calcCloseBtn">${ico('x')}</button></div>
    <div class="modal-body">
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="calc-grid">
        <button class="calc-btn calc-op" id="calcClearBtn">C</button>
        <button class="calc-btn calc-op" id="calcSignBtn">±</button>
        <button class="calc-btn calc-op" id="calcPercentBtn">%</button>
        <button class="calc-btn calc-op" data-op="÷">÷</button>

        <button class="calc-btn" data-d="7">7</button>
        <button class="calc-btn" data-d="8">8</button>
        <button class="calc-btn" data-d="9">9</button>
        <button class="calc-btn calc-op" data-op="×">×</button>

        <button class="calc-btn" data-d="4">4</button>
        <button class="calc-btn" data-d="5">5</button>
        <button class="calc-btn" data-d="6">6</button>
        <button class="calc-btn calc-op" data-op="-">−</button>

        <button class="calc-btn" data-d="1">1</button>
        <button class="calc-btn" data-d="2">2</button>
        <button class="calc-btn" data-d="3">3</button>
        <button class="calc-btn calc-op" data-op="+">+</button>

        <button class="calc-btn wide" data-d="0">0</button>
        <button class="calc-btn" id="calcDotBtn">.</button>
        <button class="calc-btn calc-accent" id="calcEqBtn">=</button>
      </div>
    </div>
  `);
  document.getElementById('calcCloseBtn').onclick = closeModal;
  wireCalculator();
}
function updateCalcDisplay(){
  const el = document.getElementById('calcDisplay');
  if(el) el.textContent = calcState.cur;
}
function calcInputDigit(d){
  if(calcState.resetNext || calcState.cur==='0'){ calcState.cur = d; calcState.resetNext=false; }
  else if(calcState.cur.length<16) calcState.cur += d;
  updateCalcDisplay();
}
function calcInputDot(){
  if(calcState.resetNext){ calcState.cur='0.'; calcState.resetNext=false; updateCalcDisplay(); return; }
  if(!calcState.cur.includes('.')) calcState.cur += '.';
  updateCalcDisplay();
}
function calcClear(){ calcState = { cur:'0', prev:null, op:null, resetNext:false }; updateCalcDisplay(); }
function calcToggleSign(){ calcState.cur = String(parseFloat(calcState.cur||'0')*-1); updateCalcDisplay(); }
function calcPercent(){ calcState.cur = String(parseFloat(calcState.cur||'0')/100); updateCalcDisplay(); }
function calcSetOp(op){
  if(calcState.op && !calcState.resetNext) calcCompute();
  calcState.prev = parseFloat(calcState.cur);
  calcState.op = op;
  calcState.resetNext = true;
}
function calcCompute(){
  if(calcState.op===null || calcState.prev===null) return;
  const a = calcState.prev, b = parseFloat(calcState.cur);
  let r;
  switch(calcState.op){
    case '+': r=a+b; break;
    case '-': r=a-b; break;
    case '×': r=a*b; break;
    case '÷': r = b===0 ? NaN : a/b; break;
  }
  calcState.cur = String(Number.isFinite(r) ? Math.round(r*1e8)/1e8 : 'Errore');
  calcState.op = null; calcState.prev = null; calcState.resetNext = true;
  updateCalcDisplay();
}
function wireCalculator(){
  document.querySelectorAll('.calc-btn[data-d]').forEach(b=>b.onclick=()=>calcInputDigit(b.dataset.d));
  document.getElementById('calcDotBtn').onclick = calcInputDot;
  document.getElementById('calcClearBtn').onclick = calcClear;
  document.getElementById('calcSignBtn').onclick = calcToggleSign;
  document.getElementById('calcPercentBtn').onclick = calcPercent;
  document.querySelectorAll('.calc-btn[data-op]').forEach(b=>b.onclick=()=>calcSetOp(b.dataset.op));
  document.getElementById('calcEqBtn').onclick = calcCompute;
}

/* ==================== DASHBOARD ==================== */
function getYears(){
  return movIndex().years;
}
let dashFilter = { anni:[], mesi:[], multi:false };
function initDashDefaultPeriod(){
  let latest = null;
  DB.movimenti.forEach(m=>{ if(m.data && (!latest || m.data>latest)) latest = m.data; });
  if(latest){
    dashFilter.anni = [latest.slice(0,4)];
    dashFilter.mesi = [String(parseInt(latest.slice(5,7),10))];
  }
}

function filteredMovimenti(f){
  // Se sono selezionati anni specifici, si parte solo dai movimenti di quegli anni (via indice)
  // invece di scandire l'intero storico: con più anni di dati accumulati riduce di molto il lavoro
  // per il caso più comune (filtro Dashboard su un anno/mese preciso).
  const base = (f.anni && f.anni.length)
    ? f.anni.flatMap(y => movIndex().byYear[y] || [])
    : DB.movimenti;
  return base.filter(m=>{
    if(!m.data) return false;
    if(f.mesi && f.mesi.length && !f.mesi.includes(String(parseInt(m.data.slice(5,7),10)))) return false;
    return true;
  });
}

/* ---- Confronto spesa vs periodo precedente equivalente (mese vs mese scorso, anno vs anno scorso) ---- */
function computeComparisonInsight(){
  function sumUscite(y, m){
    return DB.movimenti.reduce((s,x)=>{
      if(!x.data || !x.uscite || isExcludedFromTotals(x)) return s;
      if(x.data.slice(0,4)!==String(y)) return s;
      if(m!==null && parseInt(x.data.slice(5,7),10)!==m) return s;
      return s + x.uscite;
    },0);
  }
  let curLabel, prevLabel, curTot, prevTot;
  if(dashFilter.anni.length===1 && dashFilter.mesi.length===1){
    const y = parseInt(dashFilter.anni[0],10), m = parseInt(dashFilter.mesi[0],10);
    let py=y, pm=m-1; if(pm<1){ pm=12; py=y-1; }
    curTot = sumUscite(y,m); prevTot = sumUscite(py,pm);
    curLabel = monthName(m); prevLabel = monthName(pm);
  } else if(dashFilter.anni.length===1 && dashFilter.mesi.length===0){
    const y = parseInt(dashFilter.anni[0],10), py = y-1;
    curTot = sumUscite(y,null); prevTot = sumUscite(py,null);
    curLabel = String(y); prevLabel = String(py);
  } else if(dashFilter.anni.length===0 && dashFilter.mesi.length===0){
    let latest = null;
    DB.movimenti.forEach(x=>{ if(x.data && (!latest || x.data>latest)) latest = x.data; });
    if(!latest) return null;
    const y = parseInt(latest.slice(0,4),10), m = parseInt(latest.slice(5,7),10);
    let py=y, pm=m-1; if(pm<1){ pm=12; py=y-1; }
    curTot = sumUscite(y,m); prevTot = sumUscite(py,pm);
    curLabel = monthName(m)+' '+y; prevLabel = monthName(pm)+' '+py;
  } else {
    return null; // selezione multipla/ambigua: confronto non mostrato
  }
  if(!prevTot) return null;
  const deltaPct = ((curTot-prevTot)/prevTot)*100;
  return { curLabel, prevLabel, deltaPct, positive: deltaPct<=0 };
}

/* Riallinea solo le classi "active" di pillole anni/mesi e del pulsante selezione multipla allo stato
   corrente di dashFilter, senza toccare il resto del DOM: usata dai click sui filtri della Dashboard

function syncDashPillsUI(){
  document.querySelectorAll('#yearPills .pill').forEach(p=>p.classList.toggle('active', dashFilter.anni.includes(p.dataset.year)));
  document.querySelectorAll('#monthGrid .month-tile').forEach(t=>t.classList.toggle('active', dashFilter.mesi.includes(String(t.dataset.month))));
  const btn = document.getElementById('btnMultiToggle');
  if(btn){
    btn.classList.toggle('active', dashFilter.multi);
    const label = dashFilter.multi ? 'Selezione multipla attiva' : 'Attiva selezione multipla di anni e mesi';
    btn.setAttribute('data-tooltip', label);
  }
}

/* ---- Aggiornamento dati Dashboard (KPI, elenco categorie, grafici) ----
   Separata dalla costruzione della struttura HTML (renderDashboard sopra): quando l'utente cambia
   solo il filtro anno/mese, i pulsanti dei filtri richiamano SOLO questa funzione invece di ricostruire
   l'intera pagina. Questo lascia intatti i <canvas> dei grafici tra un click e l'altro, permettendo a
   Chart.js di aggiornarli con chart.update() invece di doverli distruggere e ricreare da zero ad ogni
   cambio di filtro — meno lavoro per il browser e un aggiornamento visivamente più fluido. */
function updateDashboardData(){
  const wStats = welfareStats();
  const kWelfare = document.getElementById('kpiWelfare');
  kWelfare.className = `kpi-value ${saldoClass(wStats.saldo)}`;
  animateNumber(kWelfare, dashPrevWelfare, wStats.saldo);
  // Riflesso "carta fisica" quando il saldo Welfare sale rispetto al render precedente.
  if(dashPrevWelfare!==null && wStats.saldo > dashPrevWelfare){
    const card = document.getElementById('kpiWelfareCard');
    card.classList.remove('card-shine'); void card.offsetWidth; card.classList.add('card-shine');
  }
  dashPrevWelfare = wStats.saldo;

  renderProssimeScadenze();
  renderScadenzeBanner();

  const period = movimentiForTotals(filteredMovimenti(dashFilter));
  const totEntrate = period.reduce((s,m)=>s+(m.entrate||0),0);
  const totUscite = period.reduce((s,m)=>s+(m.uscite||0),0);
  const saldo = totEntrate - totUscite;

  const prev = dashPrevTotals;
  const kEntrate = document.getElementById('kpiEntrate');
  kEntrate.className = 'kpi-value pos';
  animateNumber(kEntrate, prev?prev.entrate:null, totEntrate);
  const cmp = computeComparisonInsight();
  const kUscite = document.getElementById('kpiUscite');
  kUscite.className = 'kpi-value neg';
  kUscite.innerHTML = `<span class="kpi-num"></span>` + (cmp ? `<div class="kpi-compare ${cmp.positive?'pos':'neg'}">${cmp.positive?'▼':'▲'} ${Math.abs(cmp.deltaPct).toFixed(0)}% vs ${esc(cmp.prevLabel)}</div>` : '');
  animateNumber(kUscite.querySelector('.kpi-num'), prev?prev.uscite:null, totUscite);
  const kSaldo = document.getElementById('kpiSaldo');
  kSaldo.className='kpi-value '+saldoClass(saldo);
  animateNumber(kSaldo, prev?prev.saldo:null, saldo);
  dashPrevTotals = {entrate:totEntrate, uscite:totUscite, saldo:saldo};

  // category breakdown (uscite only) for the period, with sub-breakdown by descrizione
  const catTotals = {};
  const catSubTotals = {};
  period.forEach(m=>{
    if(m.uscite){
      catTotals[m.categoria]=(catTotals[m.categoria]||0)+m.uscite;
      catSubTotals[m.categoria] = catSubTotals[m.categoria] || {};
      const sub = m.descrizione || 'Altro';
      catSubTotals[m.categoria][sub] = (catSubTotals[m.categoria][sub]||0) + m.uscite;
    }
  });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

  const accList = document.getElementById('accCatList');
  accList.innerHTML = catEntries.length ? catEntries.map(([cat,val])=>{
    const pct = totUscite>0 ? (val/totUscite*100) : 0;
    const subs = Object.entries(catSubTotals[cat]||{}).sort((a,b)=>b[1]-a[1]);
    const subRows = subs.map(([sub,sv])=>`<div class="acc-sub-row">
        <span>${esc(sub)}</span>
        <b>${fmtEUR(sv)}</b>
      </div>`).join('');
    return `<div class="acc-item" data-cat="${esc(cat)}">
      <div class="acc-head">
        <span class="acc-chevron">▶</span>
        <span class="acc-cat"><span class="tag-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${categoryColor(cat)};"></span>${esc(cat)}</span>
        <span class="acc-pct">${pct.toFixed(1)}%</span>
        <span class="acc-bar-wrap"><span class="acc-bar" style="background:${categoryColor(cat)};width:${pct}%;display:block;"></span></span>
        <span class="acc-amt">${fmtEUR(val)}</span>
      </div>
      <div class="acc-body">${subRows}</div>
    </div>`;
  }).join('') : `<div class="empty-state" style="padding:24px;">Nessuna spesa nel periodo selezionato</div>`;
  accList.querySelectorAll('.acc-head').forEach(h=>h.onclick = ()=>{
    h.parentElement.classList.toggle('open');
  });

  // Trend chart: monthly aggregation
  let trendLabels=[], trendEntrate=[], trendUscite=[];
  if(dashFilter.anni.length===1){
    const y = dashFilter.anni[0];
    const byMonth = {};
    for(let m=1;m<=12;m++) byMonth[m]={e:0,u:0};
    movimentiForTotals(DB.movimenti).filter(m=>m.data && m.data.slice(0,4)===y).forEach(m=>{
      const mo = parseInt(m.data.slice(5,7),10);
      byMonth[mo].e+=m.entrate||0; byMonth[mo].u+=m.uscite||0;
    });
    trendLabels = Object.keys(byMonth).map(m=>monthName(parseInt(m)).slice(0,3));
    trendEntrate = Object.values(byMonth).map(v=>v.e);
    trendUscite = Object.values(byMonth).map(v=>v.u);
  } else if(dashFilter.anni.length>1){
    // più anni selezionati: totali annuali a confronto
    const sel = dashFilter.anni.slice().sort();
    const byYear = {};
    sel.forEach(y=>byYear[y]={e:0,u:0});
    movimentiForTotals(DB.movimenti).filter(m=>m.data && sel.includes(m.data.slice(0,4))).forEach(m=>{
      const y = m.data.slice(0,4);
      byYear[y].e+=m.entrate||0; byYear[y].u+=m.uscite||0;
    });
    trendLabels = sel;
    trendEntrate = sel.map(y=>byYear[y].e);
    trendUscite = sel.map(y=>byYear[y].u);
  } else {
    // nessun anno selezionato = tutti: ultimi 12 mesi presenti nei dati
    const byMonth = {};
    movimentiForTotals(DB.movimenti).forEach(m=>{ if(!m.data) return; const key=m.data.slice(0,7); byMonth[key]=byMonth[key]||{e:0,u:0}; byMonth[key].e+=m.entrate||0; byMonth[key].u+=m.uscite||0; });
    const keys = Object.keys(byMonth).sort().slice(-12);
    trendLabels = keys.map(k=>{ const [y,mo]=k.split('-'); return monthName(parseInt(mo)).slice(0,3)+' \''+y.slice(2); });
    trendEntrate = keys.map(k=>byMonth[k].e);
    trendUscite = keys.map(k=>byMonth[k].u);
  }

  const isDark = currentTheme()!=='light';
  const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
  const textColor = isDark ? '#93A3AA' : '#5C6B72';

  // Sparkline nelle card KPI: stesso array dati già calcolato per il grafico Andamento, quindi a costo
  // pressoché nullo in più. Il saldo periodo per periodo è semplicemente entrate-uscite punto per punto.
  const sparkEntrateEl = document.getElementById('sparkEntrate');
  const sparkUsciteEl = document.getElementById('sparkUscite');
  const sparkSaldoEl = document.getElementById('sparkSaldo');
  if(sparkEntrateEl) sparkEntrateEl.innerHTML = sparklineSVG(trendEntrate, '#49D9A8');
  if(sparkUsciteEl) sparkUsciteEl.innerHTML = sparklineSVG(trendUscite, '#FF7A66');
  if(sparkSaldoEl) sparkSaldoEl.innerHTML = sparklineSVG(trendEntrate.map((e,i)=>e-(trendUscite[i]||0)), 'var(--text-dim)');

  // Il canvas #chartTrend resta lo stesso nodo DOM tra un cambio filtro e l'altro (updateDashboardData
  // non ricostruisce più l'HTML della Dashboard): se l'istanza Chart.js esiste ancora ed è agganciata
  // a quel canvas, le aggiorniamo solo i dati con update() invece di distruggerla e ricrearla.
  const chartTrendEl = document.getElementById('chartTrend');
  if(charts.trend && charts.trend.canvas === chartTrendEl){
    charts.trend.data.labels = trendLabels;
    charts.trend.data.datasets[0].data = trendEntrate;
    charts.trend.data.datasets[1].data = trendUscite;
    charts.trend.options.plugins.legend.labels.color = textColor;
    charts.trend.options.scales.x.ticks.color = textColor;
    charts.trend.options.scales.y.ticks.color = textColor;
    charts.trend.options.scales.y.grid.color = gridColor;
    charts.trend.update();
  } else {
    if(charts.trend) charts.trend.destroy();
    charts.trend = new Chart(chartTrendEl, {
      type:'bar',
      data:{ labels:trendLabels, datasets:[
        {label:'Entrate', data:trendEntrate, backgroundColor:'#49D9A8', borderRadius:4, maxBarThickness:22},
        {label:'Uscite', data:trendUscite, backgroundColor:'#FF7A66', borderRadius:4, maxBarThickness:22}
      ]},
      options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:{duration:650, easing:'easeOutQuart'},
        plugins:{ legend:{ labels:{color:textColor, font:{family:'Inter',size:11.5}}, position:'top', align:'end' } },
        scales:{
          x:{ grid:{display:false}, ticks:{color:textColor,font:{size:11}} },
          y:{ grid:{color:gridColor}, ticks:{color:textColor,font:{size:11}, callback:v=>'€'+v} }
        }
      }
    });
  }

  const sliceOffsets = catEntries.map(()=>8);
  const chartCatEl = document.getElementById('chartCat');
  // Al tap/click su una fetta mostriamo l'importo con un toast dell'app (coerente con il resto
  // dell'interfaccia), invece di affidarci al tooltip nativo di Chart.js che su alcuni browser
  // mobile mostra un testo poco chiaro al tocco. Ridefinito ad ogni render per non restare
  // legato a dati vecchi quando il grafico viene solo aggiornato (non ricreato).
  const catSliceOnClick = (evt, elements)=>{
    if(!elements.length) return;
    const idx = elements[0].index;
    const entry = catEntries[idx];
    if(!entry) return;
    const msg = `${entry[0]}: ${entry[1].toLocaleString('it-IT',{style:'currency',currency:'EUR'})}`;
    const native = evt && evt.native;
    if(native && (native.clientX || (native.touches && native.touches[0]))){
      const pt = native.touches && native.touches[0] ? native.touches[0] : native;
      showChartValueBubble(msg, pt.clientX, pt.clientY);
    } else {
      // Click dalla legenda (nessuna posizione del tocco): mostra la bolla accanto al centro del grafico.
      const rect = chartCatEl.getBoundingClientRect();
      showChartValueBubble(msg, rect.left + rect.width/2, rect.top + rect.height/2);
    }
  };
  if(charts.cat && charts.cat.canvas === chartCatEl){
    charts.cat.data.labels = catEntries.map(e=>e[0]);
    charts.cat.data.datasets[0].data = catEntries.map(e=>e[1]);
    charts.cat.data.datasets[0].backgroundColor = catEntries.map(e=>categoryColor(e[0]));
    charts.cat.data.datasets[0].borderColor = isDark ? '#161D21' : '#FFFFFF';
    charts.cat.data.datasets[0].offset = sliceOffsets;
    charts.cat.options.plugins.legend.labels.color = textColor;
    charts.cat.options.onClick = catSliceOnClick;
    charts.cat.update();
  } else {
    if(charts.cat) charts.cat.destroy();
    charts.cat = new Chart(chartCatEl, {
      type:'pie',
      data:{ labels:catEntries.map(e=>e[0]), datasets:[{
        data:catEntries.map(e=>e[1]),
        backgroundColor:catEntries.map(e=>categoryColor(e[0])),
        borderColor: isDark ? '#161D21' : '#FFFFFF',
        borderWidth:3,
        offset: sliceOffsets,
        hoverOffset: 16,
        borderRadius:4
      }] },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        radius:'86%',
        onClick: catSliceOnClick,
        plugins:{
          legend:{
            position:'right', labels:{color:textColor, boxWidth:9, font:{family:'Inter',size:11}, padding:9},
            onClick:(evt, legendItem, legend)=>{
              // Sostituisce il comportamento di default (nasconde la fetta): la "stacca"
              // brevemente come al tocco diretto, mostrando anche l'importo.
              const chart = legend.chart, idx = legendItem.index;
              chart.setActiveElements([{datasetIndex:0, index:idx}]);
              chart.update();
              catSliceOnClick(evt, [{index:idx}]);
              setTimeout(()=>{ chart.setActiveElements([]); chart.update(); }, 700);
            }
          },
          tooltip:{ enabled:false }
        }
      }
    });
  }
}

/* ==================== NOTIFICHE SCADENZE ==================== */
const SCAD_SOGLIA_GG = 5;
const LS_SCAD_DISMISS = 'ledger_scad_dismiss_v1';
const AUTO_SCAD_DEFS = [
  { key:'assicurazione', label:'Assicurazione auto', icon: ico('shield'), soglia:10, redAt:5, yellowAt:10 },
  { key:'bollo', label:'Bollo auto', icon: ico('fileText'), soglia:10, redAt:5, yellowAt:10 },
  { key:'revisione', label:'Revisione auto', icon: ico('tool'), soglia:SCAD_SOGLIA_GG, redAt:2, yellowAt:5 }
];
function subAvvisoOn(a){ return a.avviso!==false; }
function autoAvvisoOn(key){ return DB.auto[key] && DB.auto[key].avviso!==false; }
function getScadenzeConAvviso(){
  const items = [];
  DB.abbonamenti.forEach(a=>{
    if(a.stato==='Attivo' && a.scadenza && subAvvisoOn(a)){
      items.push({ id:'sub_'+a.id, icon: ico('refreshCw'), label:a.servizio, sub:'Abbonamento', data:a.scadenza, view:'abbonamenti', soglia:SCAD_SOGLIA_GG, redAt:2, yellowAt:5 });
    }
  });
  AUTO_SCAD_DEFS.forEach(d=>{
    const obj = DB.auto[d.key];
    if(obj && obj.scadenza && autoAvvisoOn(d.key)){
      items.push({ id:'auto_'+d.key, icon:d.icon, label:d.label, sub:'Macchina', data:obj.scadenza, view:'auto', soglia:d.soglia, redAt:d.redAt, yellowAt:d.yellowAt });
    }
  });
  items.sort((a,b)=>a.data.localeCompare(b.data));
  return items;
}
function getScadenzeUrgenti(){
  return getScadenzeConAvviso().filter(it=>{
    const d = daysUntil(it.data);
    return d!==null && d<=it.soglia;
  });
}
function updateNavBadges(){
  const urgenti = getScadenzeUrgenti();
  const countFor = view => urgenti.filter(it=>it.view===view).length;
  ['abbonamenti','auto'].forEach(view=>{
    const navEl = document.querySelector(`.nav-item[data-view="${view}"]`);
    if(!navEl) return;
    let badge = navEl.querySelector('.nav-badge');
    const n = countFor(view);
    if(n>0){
      if(!badge){ badge = document.createElement('span'); badge.className='nav-badge'; navEl.appendChild(badge); }
      badge.textContent = n>9 ? '9+' : String(n);
    } else if(badge){ badge.remove(); }
  });
}
function scadDismissKey(){ return new Date().toISOString().slice(0,10); }
function renderScadenzeBanner(){
  const container = document.getElementById('scadenzeBanner');
  if(!container) return;
  const urgenti = getScadenzeUrgenti();
  const dismissed = localStorage.getItem(LS_SCAD_DISMISS);
  if(!urgenti.length || dismissed===scadDismissKey()){ container.innerHTML=''; return; }
  container.innerHTML = `
    <div class="scad-banner">
      <span class="scb-ic">⏰</span>
      <div class="scb-body">
        <div class="scb-title">${urgenti.length} scadenza${urgenti.length>1?'e':''} imminente${urgenti.length>1?'i':''}</div>
        <div class="scb-list">${urgenti.map(it=>`${esc(it.label)} · ${fmtDate(it.data)}`).join(' &nbsp;•&nbsp; ')}</div>
      </div>
      <button class="scb-close" id="scbClose" title="Nascondi per oggi">${ico('x')}</button>
    </div>`;

/* ---- Colore stabile per categoria: sempre lo stesso ovunque nell'app (dashboard, ricerca, PDF) ---- */
const CATEGORY_COLOR_PALETTE = ['#49D9A8','#5FA8FF','#B592FF','#FF7A66','#F5B95C','#4FC3E8','#E88BD8','#8CE05C','#E8C24F','#7A8CFF','#FF6B9E'];
/* Palette ampia e indipendente per la personalizzazione manuale del colore delle etichette */
const ETICHETTA_COLOR_PALETTE = ['#49D9A8','#2FBF8F','#6BDD7A','#8CE05C','#C4E063','#F5D547','#F5B95C','#FF9852','#FF7A66','#FF6B9E','#E88BD8','#D08CF0','#B592FF','#8C7AFF','#7A8CFF','#5FA8FF','#4FC3E8','#4FD6C8','#9AA5B1','#D6D6D6'];
function categoryColor(cat){
  if(DB.categorieColori && DB.categorieColori[cat]) return DB.categorieColori[cat];
  let idx = DB.categorieUscite.indexOf(cat);
  if(idx===-1) idx = DB.categorieEntrate.indexOf(cat);
  if(idx===-1){
    // fallback per categorie non censite: hash stabile del nome
    idx = Math.abs(String(cat||'').split('').reduce((h,c)=>((h*31)+c.charCodeAt(0))|0,7));
  }
  return CATEGORY_COLOR_PALETTE[idx % CATEGORY_COLOR_PALETTE.length];
}

function etichettaColor(nome){

  let idx = DB.etichette.indexOf(nome);
  if(idx===-1) idx = Math.abs(String(nome||'').split('').reduce((h,c)=>((h*31)+c.charCodeAt(0))|0,11));
  return CATEGORY_COLOR_PALETTE[idx % CATEGORY_COLOR_PALETTE.length];

function etichettaChipHtml(nome, opts){
  opts = opts || {};
  const c = etichettaColor(nome);
  const cls = 'etichetta-chip' + (opts.small?' etichetta-chip-sm':'') + (opts.clickable?' etichetta-chip-click':'');
  const attrs = opts.clickable ? ` data-etichetta="${esc(nome)}"` : '';

  return `<span class="${cls}"${attrs} style="background:${c}22;color:${c};border:1px solid ${c}55;">${esc(nome)}${removeBtn}</span>`;

function computeEtichettaStats(nome){
  const rows = DB.movimenti.filter(m=>Array.isArray(m.etichette) && m.etichette.includes(nome)).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  // I movimenti #rimborso/#rimborsato contano nei totali solo quando si sta guardando proprio quell'etichetta;
  // altrove restano visibili nell'elenco ma esclusi dai totali (Entrate/Uscite/Saldo).
  const isRefundTagView = TOTALS_EXCLUDED_TAGS.includes(normalizeEtichettaForMatch(nome));
  const totRows = isRefundTagView ? rows : movimentiForTotals(rows);
  const entrate = totRows.reduce((s,m)=>s+(m.entrate||0),0);
  const uscite = totRows.reduce((s,m)=>s+(m.uscite||0),0);
  return { rows, entrate, uscite, saldo: entrate-uscite };
}

/* Wiring riusabile per un campo a chip di etichette (usato nel modulo Movimento e nel filtro Ricerca) */
function wireEtichetteChipInput(chipsElId, inputElId, getList, setList, onChange){
  function render(){
    const wrap = document.getElementById(chipsElId);
    wrap.innerHTML = getList().map(t=>etichettaChipHtml(t, {removable:true})).join('');
    wrap.querySelectorAll('.etichetta-chip-remove').forEach(b=>b.onclick = ()=>{
      setList(getList().filter(t=>t!==b.dataset.t));
      render();
      if(onChange) onChange();
    });
  }
  render();
  const input = document.getElementById(inputElId);
  function commitPending(){
    const val = input.value.trim().replace(/,$/,'');
    if(val && !getList().includes(val)){
      setList([...getList(), val]);
      render();
      if(onChange) onChange();
    }
    input.value = '';
  }
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      commitPending();
    }
  });
  input.addEventListener('blur', commitPending);
  input._commitPendingEtichetta = commitPending;
}

/* Tocco breve = espande i dettagli della riga; tocco prolungato (~450ms) = entra in modalità
   selezione; con la selezione già attiva, ogni tocco (anche breve) aggiunge/toglie la riga. */
function wireMovDayRows(container){
  container.querySelectorAll('.mov-day-list .mov-row[data-id]').forEach(row=>{
    let pressTimer = null, longPressed = false;
    row.addEventListener('touchstart', ()=>{
      if(movSelectionMode) return;
      longPressed = false;
      pressTimer = setTimeout(()=>{
        pressTimer = null; longPressed = true;
        enterMovSelectionMode(row.dataset.id);
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
      }, 450);
    }, {passive:true});
    const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
    row.addEventListener('touchend', cancelPress, {passive:true});
    row.addEventListener('touchmove', cancelPress, {passive:true});
    row.onclick = (e)=>{
      if(longPressed){ longPressed=false; return; }
      if(e.target.closest('input, button, a, label')) return;
      if(movSelectionMode){ toggleMovRowSelect(row.dataset.id); return; }
      const willExpand = !row.classList.contains('row-expanded');
      row.classList.toggle('row-expanded');
      if(willExpand) suppressGhostClick(row.querySelector('.row-actions'));
    };
  });
  updateMovRowSelectionVisuals();
}

/* ==================== Sistema generico "seleziona con tocco prolungato" ====================
   Riusato da Ricerca, Resoconto Etichetta e Cronologia Metodo (Movimenti ha la propria versione
   sopra, già collegata alla pillola dell'header persistente). Ogni pagina passa un "ctx" con il
   proprio Set di selezionati/stato e una funzione che disegna la propria pillola (nell'header
   persistente per Ricerca, nell'intestazione della pagina a scorrimento per le altre). */
function wireDaySelectable(cfg){
  cfg.container.querySelectorAll('.mov-row[data-id]').forEach(row=>{
    row.classList.toggle('selected', cfg.ctx.selected.has(row.dataset.id));
    let pressTimer = null, longPressed = false;
    row.addEventListener('touchstart', ()=>{
      if(cfg.ctx.active) return;
      longPressed = false;
      pressTimer = setTimeout(()=>{
        pressTimer = null; longPressed = true;
        cfg.ctx.active = true; cfg.ctx.selected.clear(); cfg.ctx.selected.add(row.dataset.id);
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
        daySelRefreshVisuals(cfg);
        cfg.renderPill();
      }, 450);
    }, {passive:true});
    const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
    row.addEventListener('touchend', cancelPress, {passive:true});
    row.addEventListener('touchmove', cancelPress, {passive:true});
    row.onclick = (e)=>{
      if(longPressed){ longPressed=false; return; }
      if(e.target.closest('input, button, a, label')) return;
      if(cfg.ctx.active){
        const id = row.dataset.id;
        if(cfg.ctx.selected.has(id)) cfg.ctx.selected.delete(id); else cfg.ctx.selected.add(id);
        if(cfg.ctx.selected.size===0) cfg.ctx.active = false;
        daySelRefreshVisuals(cfg);
        cfg.renderPill();
        return;
      }
      const willExpand = !row.classList.contains('row-expanded');
      row.classList.toggle('row-expanded');
      if(willExpand) suppressGhostClick(row.querySelector('.row-actions'));
    };
  });
}

  cfg.container.querySelectorAll('.mov-row[data-id]').forEach(row=>{

function closeKebabMenuOnOutside(e){

function openKebabMenu(triggerBtn, items){
  closeKebabMenu();
  const menu = document.createElement('div');
  menu.className = 'kebab-menu';
  menu.innerHTML = items.map((it,i)=>`<button type="button" class="kebab-menu-item ${it.danger?'danger':''}" data-i="${i}">${ico(it.icon||'',15)} ${esc(it.label)}</button>`).join('');
  document.body.appendChild(menu);
  const rect = triggerBtn.getBoundingClientRect();
  // Ancorato in alto a destra del pulsante; si capovolge sopra se non c'è spazio sotto (righe
  // vicine al fondo dello schermo in elenchi lunghi).
  const menuH = menu.offsetHeight;
  const top = (rect.bottom + menuH + 8 > window.innerHeight) ? (rect.top - menuH - 8) : (rect.bottom + 8);
  menu.style.top = Math.max(8, top) + 'px';
  menu.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
  requestAnimationFrame(()=>menu.classList.add('show'));
  menu.querySelectorAll('.kebab-menu-item').forEach((btn,i)=>{

  });

}

          ${m.note?`<div class="mov-row-extra-line">${ico('fileText',13)} ${esc(m.note)}</div>`:''}
          ${m.etichette && m.etichette.length?`<div class="mov-row-extra-line"><span class="etichette-row">${m.etichette.map(t=>etichettaChipHtml(t,{small:true,clickable:true})).join('')}</span></div>`:''}
          <div class="row-actions">
            <button class="btn btn-icon btn-sm kebab-btn ${kebabCls}" data-id="${m.id}" title="Altre azioni">${ico('moreVertical')}</button>
          </div>
        </div></div>
      </div>`;
    }).join('');
    return `<div class="mov-day-block">

        <span class="mov-day-label">${fmtDayShort(day==='n/d'?null:day)}</span>

      </div>
      <div class="mov-day-card">${rowsHtml}</div>
    </div>`;
  }).join('');
}
function renderMovimenti(){
  const el = document.getElementById('view-movimenti');

  // Raggruppa i movimenti per anno (i movimenti senza data finiscono in un gruppo a parte, in coda)
  const byYear = {};
  DB.movimenti.forEach(m=>{
    const y = m.data ? m.data.slice(0,4) : 'Senza data';
    byYear[y] = byYear[y] || [];
    byYear[y].push(m);
  });
  const numericYears = Object.keys(byYear).filter(y=>y!=='Senza data').sort((a,b)=>b.localeCompare(a));
  const yearKeys = byYear['Senza data'] ? [...numericYears, 'Senza data'] : numericYears;

  if(movExpandedYears===null){
    // Avvio con tutti i blocchi anno compressi (nessun anno espanso di default)
    movExpandedYears = new Set();
  }

  el.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">Registro Movimenti</div>
        <div class="page-sub">${DB.movimenti.length} movimenti registrati</div>
      </div>
      <div class="topbar-actions" style="display:flex;gap:8px;">
        <button class="btn btn-icon btn-pianificati" id="btnPianificati" title="Movimenti pianificati">${ico('calendar')}${DB.pianificati.length?`<span class="pian-badge">${DB.pianificati.length}</span>`:''}</button>
        <button class="btn btn-import" id="btnImportExcel"><span>${ico('download')}</span> <span class="btn-label-full">Importa estratti conto</span><span class="btn-label-short">Importa</span> <span class="spark">${ico('sparkle')}</span></button>
        <button class="btn btn-primary" id="btnNewMov"><span class="btn-label-full">+ Nuovo movimento</span><span class="btn-label-short">+ Nuovo</span></button>
      </div>
    </div>
    ${bulkBarHtml('mov')}
    <div id="movYearGroups"></div>
  `;
  document.getElementById('btnNewMov').onclick = ()=>openMovModal();
  document.getElementById('btnImportExcel').onclick = openImportFilesModal;
  document.getElementById('btnPianificati').onclick = openPianificatiModal;
  document.getElementById('movBulkCancelBtn').onclick = ()=>{
    movSelected.clear();
    document.querySelectorAll('.movCheck').forEach(cb=>cb.checked=false);
    updateMovBulkBar();
  };
  document.getElementById('movSelectAllBtn').onclick = ()=>{
    const allIds = Array.from(document.querySelectorAll('.movCheck')).map(cb=>cb.dataset.id);
    const allSelected = allIds.length>0 && allIds.every(id=>movSelected.has(id));
    if(allSelected){ movSelected.clear(); } else { allIds.forEach(id=>movSelected.add(id)); }
    renderMovimenti();
  };
  document.getElementById('movBulkTagBtn').onclick = ()=>{
    if(!movSelected.size) return;
    openBulkEtichettaModal(Array.from(movSelected));
  };
  document.getElementById('movBulkMetodoBtn').onclick = ()=>{
    if(!movSelected.size) return;
    const ids = Array.from(movSelected);
    openBulkMetodoModal(ids.length, metodo=>{
      let n = 0;
      DB.movimenti.forEach(m=>{ if(ids.includes(m.id)){ m.metodoPagamento = metodo; n++; } });
      return n;
    }, renderMovimenti, ()=>movSelected.clear());
  };
  document.getElementById('movBulkCampiBtn').onclick = ()=>{
    if(!movSelected.size) return;
    openBulkCampiModal(Array.from(movSelected), renderMovimenti, ()=>movSelected.clear());
  };
  document.getElementById('movBulkDeleteBtn').onclick = ()=>{
    if(!movSelected.size) return;
    const ids = Array.from(movSelected);
    const n = ids.length;
    movSelected.clear();
    removeManyByIdWithUndo(DB.movimenti, ids, `${n} movimenti eliminati`, renderMovimenti);
  };
  updateMovBulkBar();

  const groupsEl = document.getElementById('movYearGroups');
  if(!yearKeys.length){
    groupsEl.innerHTML = `
      <div class="welcome-empty">
        <div class="welcome-empty-icon">${ico('wallet',34)}</div>
        <h2>Nessun movimento registrato</h2>
        <p>Inizia inserendo la tua prima entrata o uscita, oppure importa in un colpo solo i movimenti dal tuo estratto conto.</p>
        <div class="welcome-empty-actions">
          <button class="btn btn-primary" id="welcomeNewMov2">${ico('plus')} Nuovo movimento</button>
          <button class="btn" id="welcomeImport2">${ico('upload')} Importa estratti conto</button>
        </div>
      </div>`;
    document.getElementById('welcomeNewMov2').onclick = ()=>openMovModal(null, renderMovimenti);
    document.getElementById('welcomeImport2').onclick = openImportFilesModal;
    return;
  }

  groupsEl.innerHTML = yearKeys.map(y=>{
    const rows = byYear[y].slice().sort((a,b)=> (b.data||'').localeCompare(a.data||''));
    const sumEntrate = movimentiForTotals(rows).reduce((s,m)=>s+(m.entrate||0),0);
    const sumUscite = movimentiForTotals(rows).reduce((s,m)=>s+(m.uscite||0),0);
    const isOpen = movExpandedYears.has(y);

    let bodyHtml = '';
    if(isOpen){
      let tRows=''; let lastGroup=null;
      rows.forEach(m=>{
        const group = m.data ? m.data.slice(0,7) : 'n/d';
        if(group!==lastGroup){
          const [gy,mo] = group.split('-');
          const monthIds = rows.filter(r=>(r.data?r.data.slice(0,7):'n/d')===group).map(r=>r.id);
          const monthAllSel = monthIds.length>0 && monthIds.every(id=>movSelected.has(id));
          tRows += `<tr class="group-row"><td class="check-col"><label class="sel-check month-sel-check"><input type="checkbox" class="movMonthCheck" data-month="${esc(group)}" ${monthAllSel?'checked':''}></label></td><td colspan="8">${mo?monthName(parseInt(mo)):''} ${gy||''}</td></tr>`;
          lastGroup = group;
        }
        const fonteIcon = movimentoMetodoIconHtml(m);
        tRows += `<tr data-id="${m.id}">
          <td class="check-col"><label class="sel-check"><input type="checkbox" class="movCheck" data-id="${m.id}" ${movSelected.has(m.id)?'checked':''}></label></td>
          <td class="src-col">${fonteIcon}</td>
          <td>${fmtDate(m.data)}</td>
          <td><span class="tag">${categoryLabelAvatarHtml(m.categoria)}</span></td>
          <td class="desc-cell">${esc(m.descrizione||'—')}${m.etichette && m.etichette.length ? `<span class="etichette-row">${m.etichette.map(t=>etichettaChipHtml(t,{small:true,clickable:true})).join('')}</span>` : ''}</td>
          <td class="desc-cell note-col" style="color:var(--text-faint);">${esc(m.note||'')}</td>
          <td class="num amt pos">${m.entrate?fmtEUR(m.entrate):''}</td>
          <td class="num amt neg">${m.uscite?fmtEUR(m.uscite):''}</td>
          <td><div class="row-actions">
            <button class="btn btn-icon btn-sm kebab-btn movKebab" data-id="${m.id}" title="Altre azioni">${ico('moreVertical')}</button>
          </div></td>
        </tr>`;
      });
      bodyHtml = `<div class="mov-year-body">
        <div class="table-scroll">
          <table class="mov-table">
            <thead><tr><th class="check-col"></th><th class="src-col"></th><th>Data</th><th>Categoria</th><th>Dettaglio</th><th class="note-col">Note</th><th class="num">Entrata</th><th class="num">Uscita</th><th></th></tr></thead>
            <tbody>${tRows}</tbody>
          </table>
        </div>
        <div class="mov-day-list">${dayGroupsHtml(rows)}</div>
      </div>`;
    }

    return `<div class="card list-card mov-year-group ${isOpen?'open':''}" data-year="${esc(y)}">
      <div class="mov-year-head" data-year="${esc(y)}">
        <span class="mov-year-chevron">▶</span>
        <span class="mov-year-label">${esc(y)}</span>
        <span class="mov-year-count">${rows.length} movimenti</span>
        <span class="mov-year-totals">
          <span class="pos">${fmtEUR(sumEntrate)}</span>
          <span class="neg">${fmtEUR(sumUscite)}</span>
        </span>
      </div>
      ${bodyHtml}
    </div>`;
  }).join('');

  groupsEl.querySelectorAll('.mov-year-head').forEach(h=>{
    h.onclick = ()=>{
      const y = h.dataset.year;
      if(movExpandedYears.has(y)) movExpandedYears.delete(y); else movExpandedYears.add(y);
      renderMovimenti();
    };
  });
  // Mobile: tap sulla riga per espandere/comprimere le informazioni secondarie (checkbox,
  // metodo pagamento, note, etichette, azioni). Ignora i click su elementi interattivi interni.
  groupsEl.querySelectorAll('.mov-table tr[data-id]').forEach(row=>{
    row.onclick = (e)=>{
      if(e.target.closest('input, button, a, label')) return;
      const willExpand = !row.classList.contains('row-expanded');
      row.classList.toggle('row-expanded');
      if(willExpand) suppressGhostClick(row.querySelector('.row-actions'));
    };
  });
  wireMovDayRows(groupsEl);
  groupsEl.querySelectorAll('.movKebab').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    openKebabMenu(b, movRowKebabItems({
      onEdit: ()=>openMovModal(b.dataset.id),
      onDuplicate: ()=>duplicaMovimento(b.dataset.id, renderMovimenti),
      onDelete: ()=>removeByIdWithUndo(DB.movimenti, b.dataset.id, 'Movimento eliminato', renderMovimenti)
    }));
  });
  groupsEl.querySelectorAll('.etichetta-chip-click').forEach(c=>c.onclick = (e)=>{
    e.stopPropagation();
    openEtichettaReportModal(c.dataset.etichetta);
  });
  groupsEl.querySelectorAll('[data-src-history]').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    openSourceHistoryModal(b.dataset.srcHistory);
  });
  groupsEl.querySelectorAll('.movCheck').forEach(cb=>{
    cb.onclick = (e)=>e.stopPropagation();
    cb.onchange = ()=>{
      if(cb.checked) movSelected.add(cb.dataset.id); else movSelected.delete(cb.dataset.id);
      updateMovBulkBar();
      const row = cb.closest('tr');
      const group = row ? (row.dataset.id ? (DB.movimenti.find(m=>m.id===row.dataset.id)?.data||'').slice(0,7) : '') : '';
      syncMonthCheckState(group);
    };
  });
  groupsEl.querySelectorAll('.movMonthCheck').forEach(cb=>{
    cb.onclick = (e)=>e.stopPropagation();
    cb.onchange = ()=>{
      const group = cb.dataset.month;
      const idsInMonth = DB.movimenti.filter(m=>(m.data?m.data.slice(0,7):'n/d')===group).map(m=>m.id);
      idsInMonth.forEach(id=>{ if(cb.checked) movSelected.add(id); else movSelected.delete(id); });
      idsInMonth.forEach(id=>{
        const rowCb = groupsEl.querySelector(`.movCheck[data-id="${id}"]`);
        if(rowCb) rowCb.checked = cb.checked;
      });
      updateMovBulkBar();
    };
  });
}
function syncMonthCheckState(group){
  if(!group) return;
  const monthCb = document.querySelector(`.movMonthCheck[data-month="${group}"]`);
  if(!monthCb) return;
  const idsInMonth = DB.movimenti.filter(m=>(m.data?m.data.slice(0,7):'n/d')===group).map(m=>m.id);
  monthCb.checked = idsInMonth.length>0 && idsInMonth.every(id=>movSelected.has(id));
}

/* Helper condiviso tra il form "Nuovo/Modifica movimento" e il form "Voce pianificata": entrambi
   hanno identica logica di aggiornamento Categoria/Dettaglio in base al tipo (Entrata/Uscita),
   solo con id dei campi diversi. Evita di mantenere due copie della stessa logica in giro. */
function wireCategoriaDettaglioFields(catSelId, descSelId, getTipo, editing, opts){
  opts = opts || {};
  // Nel form Movimento le Entrate non mostrano "Altro (specifica)" (categorie/sottocategorie entrata
  // sono chiuse); nel form Voce pianificata invece l'opzione resta disponibile anche per le Entrate.
  // Comportamento distinto per ciascun form, mantenuto qui tramite questo flag.
  const showCustomForEntrata = opts.showCustomForEntrata !== false;
  const ENTRATA_CATEGORIE = ['Stipendio','Altre entrate'];
  function refreshDescLabel(){
    const lbl = document.querySelector('#'+descSelId)?.closest('.field')?.querySelector('label');
    if(lbl) lbl.textContent = getTipo()==='uscita' ? 'Dettaglio' : 'Dettaglio (opzionale)';
  }
  function refreshDescOptions(){
    const catSel = document.getElementById(catSelId);
    const descSel = document.getElementById(descSelId);
    if(getTipo()==='entrata' && !showCustomForEntrata){
      const opts2 = subcategorieFor(catSel.value);
      descSel.innerHTML = opts2.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
      if(editing && opts2.includes(editing.descrizione)) descSel.value = editing.descrizione;
      return;
    }
    const subs = subcategorieFor(catSel.value);
    if(subs.length){
      descSel.innerHTML = subs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('') + `<option value="__custom">Altro (specifica)…</option>`;
      if(editing && subs.includes(editing.descrizione)) descSel.value = editing.descrizione;
    } else {
      descSel.innerHTML = `<option value="__custom">Altro (specifica)…</option>`;
    }
  }
  function refreshCatOptions(){
    const catSel = document.getElementById(catSelId);
    const cats = getTipo()==='entrata' ? ENTRATA_CATEGORIE : DB.categorieUscite;
    catSel.innerHTML = cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if(editing && cats.includes(editing.categoria)) catSel.value = editing.categoria;
    refreshDescLabel();
    refreshDescOptions();
  }
  return { refreshCatOptions, refreshDescOptions, refreshDescLabel };
}
function openMovModal(id, onSaved, duplicateFrom){
  const editing = id ? DB.movimenti.find(m=>m.id===id) : null;
  // duplicateFrom: movimento sorgente quando si duplica un movimento esistente — precompila i campi
  // come per una modifica, ma il salvataggio crea un NUOVO movimento (editing resta null).
  const prefill = editing || duplicateFrom || null;
  const tipo = prefill ? (prefill.entrate ? 'entrata':'uscita') : 'uscita';
  const html = `
    <div class="modal-head"><h3>${editing?'Modifica movimento':'Nuovo movimento'}</h3><button class="close-x" id="mClose">${ico('x')}</button></div>
    <div class="modal-body slim-form">
      <div class="slim-switch">
        <span class="slim-switch-opt sel-entrata ${tipo==='entrata'?'active':''}" data-tipo="entrata">Entrata</span>
        <span class="slim-switch-opt sel-uscita uscita ${tipo==='uscita'?'active':''}" data-tipo="uscita">Uscita</span>
      </div>
      <div class="slim-row"><span class="slim-icon">${ico('calendar',14)}</span><div class="slim-main field"><label>Data</label><input type="date" id="mData" value="${editing?editing.data:new Date().toISOString().slice(0,10)}"></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('creditCard',14)}</span><div class="slim-main field"><label>Metodo</label><select id="mMetodoPagamento"></select></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('folder',14)}</span><div class="slim-main field"><label>Categoria</label><select id="mCategoria"></select></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('tag',14)}</span><div class="slim-main field"><label id="mDescLabel">Dettaglio${tipo==='uscita'?'':' (opzionale)'}</label><select id="mDescrizione"></select></div></div>
      <div class="slim-row slim-amount">
        <span class="slim-icon">${ico('wallet',14)}</span>
        <div class="slim-main field"><label>Importo (€)</label><input type="number" step="0.01" min="0" id="mImporto" value="${prefill?(prefill.entrate||prefill.uscite||''):''}" placeholder="0.00"></div>
      </div>
      <div class="slim-row">
        <span class="slim-icon">${ico('tag',14)}</span>
        <div class="slim-main field">
          <label>Etichette (opzionale)</label>
          <div class="tag-input-wrap">
            <div class="tag-chips" id="mEtichetteChips"></div>
            <input type="text" id="mEtichetteInput" list="etichetteDatalist" placeholder="Scrivi e premi Invio…">
          </div>
        </div>
      </div>
      <div class="slim-row">
        <span class="slim-icon">${ico('fileText',14)}</span>
        <div class="slim-main field">
          <label>Note (opzionale)</label>
          <input type="text" id="mNote" value="${prefill?esc(prefill.note||''):''}" placeholder="Aggiungi una nota">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      ${editing?'<button class="btn btn-danger" id="mDelete">Elimina</button>':''}
      <button class="btn" id="mCancel">${editing?'Annulla':'Chiudi'}</button>
      <button class="btn btn-primary" id="mSave">Salva</button>
    </div>
  `;
  const box = document.getElementById('modalBox');
  box.className = 'modal modal-form';
  box.innerHTML = html;
  showModalBackdrop();
  let curTipo = tipo;
  const { refreshCatOptions, refreshDescOptions } = wireCategoriaDettaglioFields('mCategoria', 'mDescrizione', ()=>curTipo, prefill, { showCustomForEntrata:false });
  document.querySelectorAll('.slim-switch-opt').forEach(r=>r.onclick = ()=>{
    curTipo = r.dataset.tipo;
    document.querySelectorAll('.slim-switch-opt').forEach(x=>x.classList.remove('active'));
    r.classList.add('active');
    refreshCatOptions();
  });
  document.getElementById('mCategoria').onchange = refreshDescOptions;
  refreshCatOptions();
  // "Conto corrente" è sempre la prima opzione e quella selezionata di default (nessuna icona associata).
  const metodoSel = document.getElementById('mMetodoPagamento');
  const metodoOptions = ['Conto corrente', ...DB.metodiPagamento.filter(m=>m!=='Conto corrente')];
  function refreshMetodoOptions(selected){
    metodoSel.innerHTML = metodoOptions.map(m=>`<option value="${esc(m)}" ${m===selected?'selected':''}>${esc(m)}</option>`).join('');
  }
  refreshMetodoOptions((prefill && prefill.metodoPagamento) ? prefill.metodoPagamento : 'Conto corrente');
  refreshEtichetteDatalist();
  let mEtichette = editing ? (editing.etichette||[]).slice() : [];
  wireEtichetteChipInput('mEtichetteChips','mEtichetteInput', ()=>mEtichette, (v)=>{ mEtichette = v; });

  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  if(editing) document.getElementById('mDelete').onclick = ()=>{
    closeModal();
    removeByIdWithUndo(DB.movimenti, editing.id, 'Movimento eliminato', onSaved || renderCurrentView);
  };
  document.getElementById('mSave').onclick = ()=>{
    const mEtichetteInputEl = document.getElementById('mEtichetteInput');
    if(mEtichetteInputEl && mEtichetteInputEl._commitPendingEtichetta) mEtichetteInputEl._commitPendingEtichetta();
    const data = document.getElementById('mData').value;
    let descSel = document.getElementById('mDescrizione').value;
    if(descSel==='__custom'){
      descSel = (prompt('Specifica la descrizione:') || '').trim();
    }
    const importoRaw = document.getElementById('mImporto').value;
    const importo = parseFloat(importoRaw);
    const categoria = document.getElementById('mCategoria').value;
    const metodoPagamento = document.getElementById('mMetodoPagamento').value || 'Conto corrente';
    const note = document.getElementById('mNote').value.trim();

    // Validazione: obbligatori Data, Importo, Categoria, Metodo di pagamento e Dettaglio (solo per le Uscite).
    // Le uniche voci facoltative sono Note ed Etichette.
    const mancanti = [];
    if(!data) mancanti.push('Data');
    if(isNaN(importo) || importo<=0) mancanti.push('Importo');
    if(!categoria) mancanti.push('Categoria');
    if(curTipo==='uscita' && !descSel) mancanti.push('Dettaglio');
    if(!metodoPagamento) mancanti.push('Metodo di pagamento');
    if(mancanti.length){ toast(`Attenzione: compila ${mancanti.join(', ')}`); return; }

    mEtichette.forEach(t=>{ if(!DB.etichette.includes(t)) DB.etichette.push(t); });
    if(editing){
      editing.data = data; editing.categoria = categoria; editing.descrizione = descSel || null;
      editing.entrate = curTipo==='entrata' ? importo : null;
      editing.uscite = curTipo==='uscita' ? importo : null;
      editing.note = note || null;
      editing.etichette = mEtichette;
      editing.metodoPagamento = metodoPagamento;
      if(movExpandedYears) movExpandedYears.add(data.slice(0,4));
      saveDB(); closeModal(); toast('Movimento salvato'); (onSaved || renderCurrentView)();
      return;
    }
    // Nuovo movimento: salva ma NON chiude la finestra, per agevolare l'inserimento di più movimenti
    // consecutivi. Restano invariati Data, Categoria, Dettaglio, Metodo di pagamento; si azzerano solo
    // Importo, Note ed Etichette.
    DB.movimenti.push({ id:uid('m'), data, categoria, descrizione:descSel||null, entrate: curTipo==='entrata'?importo:null, uscite: curTipo==='uscita'?importo:null, note: note||null, etichette: mEtichette, metodoPagamento });
    if(movExpandedYears) movExpandedYears.add(data.slice(0,4));
    saveDB(); toast('Movimento salvato'); (onSaved || renderCurrentView)();
    document.getElementById('mImporto').value = '';
    document.getElementById('mNote').value = '';
    mEtichette = [];
    document.getElementById('mEtichetteChips').innerHTML = '';
    document.getElementById('mImporto').focus();
  };
}

/* ==================== MOVIMENTI PIANIFICATI ====================
   Promemoria di debiti/crediti futuri (es. un pagamento in attesa di credito, un rimborso da ricevere).
   Vivono in DB.pianificati, un array separato: non toccano mai DB.movimenti né i totali reali dell'app.
   "Segna come avvenuto" si limita a rimuovere la voce dall'elenco (con possibilità di annullare). */
function pianificatoIconHtml(p){ return metodoIconHtml(p.metodoPagamento, ''); }
function openPianificatiModal(){
  ensurePianificati();
  const sorted = [...DB.pianificati].sort((a,b)=>(a.data||'9999').localeCompare(b.data||'9999'));
  const uscite = sorted.filter(p=>p.tipo==='uscita');
  const entrate = sorted.filter(p=>p.tipo==='entrata');
  const totUscite = uscite.reduce((s,p)=>s+(p.importo||0),0);

    <div class="modal-head"><h3>${ico('calendar')} Movimenti pianificati</h3><button class="close-x" id="pianClose">${settingsCloseIcon()}</button></div>

      <div class="page-sub" style="margin-top:-6px;margin-bottom:2px;">Promemoria di debiti e crediti futuri: non vengono conteggiati nei Movimenti finché non li registri tu stesso.</div>
      <div class="search-stats" style="margin-bottom:6px;">
        <div class="stat-chip"><div class="lbl">Da pagare</div><div class="val neg">${fmtEUR(totUscite)}</div></div>
        <div class="stat-chip"><div class="lbl">Da ricevere</div><div class="val pos">${fmtEUR(totEntrate)}</div></div>
      </div>
      <button class="btn btn-primary btn-sm" id="pianAddBtn" style="align-self:flex-start;">+ Aggiungi voce</button>
      ${sectionHtml('Uscite (da pagare)', uscite, 'Nessuna uscita pianificata.')}
      ${sectionHtml('Entrate (da ricevere)', entrate, 'Nessuna entrata pianificata.')}
    </div>
    <div class="modal-foot"><button class="btn" id="pianCloseBtn">Chiudi</button></div>

  openSettingsPanel(html);

  document.getElementById('pianCloseBtn').onclick = closeModal;

  });
  document.querySelectorAll('.pianDelete').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.pianificati, b.dataset.id, 'Voce eliminata', back);
  });
}
function openPianificatoFormModal(id, onSaved){
  ensurePianificati();
  const editing = id ? DB.pianificati.find(p=>p.id===id) : null;
  const tipo = editing ? editing.tipo : 'uscita';
  const html = `
    <div class="modal-head"><h3>${ico('calendar')} ${editing?'Modifica voce pianificata':'Nuova voce pianificata'}</h3><button class="close-x" id="pfClose">${ico('x')}</button></div>
    <div class="modal-body">
      <div class="radio-row">
        <div class="radio-opt sel-entrata ${tipo==='entrata'?'active':''}" data-tipo="entrata">${ico('arrowUpRight')} Entrata (da ricevere)</div>
        <div class="radio-opt sel-uscita ${tipo==='uscita'?'active':''}" data-tipo="uscita">${ico('arrowDownRight')} Uscita (da pagare)</div>
      </div>
      <div class="field-row-2">
        <div class="field"><label>Data prevista</label><input type="date" id="pfData" value="${editing?editing.data:new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Metodo di pagamento</label><select id="pfMetodoPagamento"></select></div>
      </div>
      <div class="field-row-2">
        <div class="field"><label>Categoria</label><select id="pfCategoria"></select></div>
        <div class="field"><label>Dettaglio${tipo==='uscita'?'':' (opzionale)'}</label><select id="pfDescrizione"></select></div>
      </div>
      <div class="field-row-2">
        <div class="field"><label>Importo (€)</label><input type="number" step="0.01" min="0" id="pfImporto" value="${editing?editing.importo||'':''}" placeholder="0.00"></div>
        <div class="field"><label>Note (opzionale)</label><input type="text" id="pfNote" value="${editing?esc(editing.note||''):''}" placeholder="Aggiungi una nota"></div>
      </div>
    </div>
    <div class="modal-foot">
      ${editing?'<button class="btn btn-danger" id="pfDelete">Elimina</button>':''}
      <button class="btn" id="pfCancel">Annulla</button>
      <button class="btn btn-primary" id="pfSave">Salva</button>
    </div>
  `;
  const box = document.getElementById('modalBox');
  box.className = 'modal modal-form';
  box.innerHTML = html;
  showModalBackdrop();
  let curTipo = tipo;
  const { refreshCatOptions, refreshDescOptions } = wireCategoriaDettaglioFields('pfCategoria', 'pfDescrizione', ()=>curTipo, editing);
  document.querySelectorAll('.radio-opt').forEach(r=>r.onclick = ()=>{
    curTipo = r.dataset.tipo;
    document.querySelectorAll('.radio-opt').forEach(x=>x.classList.remove('active'));
    r.classList.add('active');
    refreshCatOptions();
  });
  document.getElementById('pfCategoria').onchange = refreshDescOptions;
  refreshCatOptions();
  const metodoSel = document.getElementById('pfMetodoPagamento');
  const metodoOptions = ['Conto corrente', ...DB.metodiPagamento.filter(m=>m!=='Conto corrente')];
  metodoSel.innerHTML = metodoOptions.map(m=>`<option value="${esc(m)}" ${m===((editing&&editing.metodoPagamento)||'Conto corrente')?'selected':''}>${esc(m)}</option>`).join('');

  document.getElementById('pfClose').onclick = closeModal;
  document.getElementById('pfCancel').onclick = closeModal;
  if(editing) document.getElementById('pfDelete').onclick = ()=>{
    closeModal();
    removeByIdWithUndo(DB.pianificati, editing.id, 'Voce eliminata', onSaved || renderCurrentView);
  };
  document.getElementById('pfSave').onclick = ()=>{
    const data = document.getElementById('pfData').value;
    let descSel = document.getElementById('pfDescrizione').value;
    if(descSel==='__custom'){
      descSel = (prompt('Specifica la descrizione:') || '').trim();
    }
    const importo = parseFloat(document.getElementById('pfImporto').value);
    const categoria = document.getElementById('pfCategoria').value;
    const metodoPagamento = document.getElementById('pfMetodoPagamento').value || 'Conto corrente';
    const note = document.getElementById('pfNote').value.trim();

    const mancanti = [];
    if(!data) mancanti.push('Data');
    if(isNaN(importo) || importo<=0) mancanti.push('Importo');
    if(!categoria) mancanti.push('Categoria');
    if(curTipo==='uscita' && !descSel) mancanti.push('Dettaglio');
    if(!metodoPagamento) mancanti.push('Metodo di pagamento');
    if(mancanti.length){ toast(`Attenzione: compila ${mancanti.join(', ')}`); return; }

    if(editing){
      editing.tipo = curTipo; editing.data = data; editing.categoria = categoria; editing.descrizione = descSel || null;
      editing.importo = importo; editing.metodoPagamento = metodoPagamento; editing.note = note || null;
    } else {
      DB.pianificati.push({ id:uid('p'), tipo:curTipo, data, categoria, descrizione:descSel||null, importo, metodoPagamento, note: note||null });
    }
    saveDB(); closeModal(); toast('Voce pianificata salvata'); (onSaved || renderCurrentView)();
  };
}

  }

/* ==================== SCORCIATOIE DA TASTIERA ====================
   Combinazioni Ctrl/Cmd+tasto (mai un tasto da solo, per non interferire mai con la digitazione
   normale nei campi di testo). Personalizzabili da Impostazioni; salvate in localStorage come
   preferenza del dispositivo/browser, non nei dati dell'app. */
const LS_SHORTCUTS = 'ledger_shortcuts_v1';
const DEFAULT_SHORTCUTS = [
  { id:'newMov', key:'n', label:'Nuovo movimento' },
  { id:'goDashboard', key:'1', label:'Vai a Dashboard' },
  { id:'goMovimenti', key:'2', label:'Vai a Movimenti' },
  { id:'goRicerca', key:'3', label:'Vai a Ricerca e Confronto' },
  { id:'goAbbonamenti', key:'4', label:'Vai ad Abbonamenti' },
  { id:'goAuto', key:'5', label:'Vai a Macchina' },
  { id:'goImpostazioni', key:'6', label:'Vai a Impostazioni' },
  { id:'focusSearch', key:'/', label:'Cerca (apre Ricerca e mette il focus sul testo)' }
];
const SHORTCUT_ACTIONS = {
  newMov: ()=>openMovModal(null, renderCurrentView),
  goDashboard: ()=>switchView('dashboard'),
  goMovimenti: ()=>switchView('movimenti'),
  goRicerca: ()=>switchView('ricerca'),
  goAbbonamenti: ()=>switchView('abbonamenti'),
  goAuto: ()=>switchView('auto'),
  goImpostazioni: ()=>switchView('impostazioni'),
  focusSearch: ()=>{
    switchView('ricerca');
    setTimeout(()=>{ const el=document.getElementById('searchTesto'); if(el) el.focus(); }, 60);
  }
};
function getCustomShortcuts(){
  try{ return JSON.parse(localStorage.getItem(LS_SHORTCUTS)) || {}; }catch(e){ return {}; }
}
function shortcutKeyFor(id){
  const custom = getCustomShortcuts();
  if(custom[id]!==undefined) return custom[id];
  const def = DEFAULT_SHORTCUTS.find(s=>s.id===id);
  return def ? def.key : '';
}
function setShortcutKey(id, key){
  const custom = getCustomShortcuts();
  custom[id] = key;
  localStorage.setItem(LS_SHORTCUTS, JSON.stringify(custom));
}
function resetShortcuts(){ localStorage.removeItem(LS_SHORTCUTS); }
let shortcutCaptureActive = false; // true mentre l'utente sta premendo il nuovo tasto in Impostazioni
function handleGlobalShortcut(e){
  if(shortcutCaptureActive) return;
  if(!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const key = e.key.toLowerCase();
  const match = DEFAULT_SHORTCUTS.find(s=>shortcutKeyFor(s.id)===key);
  if(match && SHORTCUT_ACTIONS[match.id]){
    e.preventDefault();
    SHORTCUT_ACTIONS[match.id]();
  }
}
document.addEventListener('keydown', handleGlobalShortcut);

function shortcutKeyDisplay(key){
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
  const mod = isMac ? '⌘' : 'Ctrl';
  return `${mod} + ${key==='/' ? '/' : key.toUpperCase()}`;
}
function openShortcutsModal(){
  const html = `
    <div class="modal-head"><h3>${ico('command')} Scorciatoie da Tastiera</h3><button class="close-x" id="scClose">${settingsCloseIcon()}</button></div>
    <div class="modal-body">
      <div class="page-sub" style="margin-bottom:12px;">Combinazioni con Ctrl (⌘ su Mac), utilizzabili da qualunque punto dell'app. Clicca "Cambia" e premi la combinazione che preferisci.</div>
      <div id="shortcutsList"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="scReset">Ripristina predefinite</button>
      <button class="btn btn-primary" id="scCloseBtn">Chiudi</button>
    </div>
  `;
  openSettingsPanel(html);
  document.getElementById('scClose').onclick = closeModal;
  document.getElementById('scCloseBtn').onclick = closeModal;
  document.getElementById('scReset').onclick = ()=>{ resetShortcuts(); renderShortcutsList(); };
  renderShortcutsList();
}
function renderShortcutsList(){
  const el = document.getElementById('shortcutsList');
  if(!el) return;
  el.innerHTML = DEFAULT_SHORTCUTS.map(s=>`
    <div class="slim-row" style="align-items:center;">
      <div class="slim-main" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <span style="font-weight:600; font-size:13.5px;">${esc(s.label)}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <kbd class="shortcut-kbd" id="scKey-${s.id}">${shortcutKeyDisplay(shortcutKeyFor(s.id))}</kbd>
          <button type="button" class="btn btn-sm scChangeBtn" data-id="${s.id}">Cambia</button>
        </div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.scChangeBtn').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.id;
      const kbdEl = document.getElementById('scKey-'+id);
      const originalText = kbdEl.textContent;
      kbdEl.textContent = 'Premi un tasto…';
      b.textContent = 'Annulla';
      shortcutCaptureActive = true;
      const finish = ()=>{
        shortcutCaptureActive = false;
        document.removeEventListener('keydown', onCapture, true);
        b.onclick = null;
        renderShortcutsList();
      };
      const onCapture = (e)=>{
        e.preventDefault(); e.stopPropagation();
        if(e.key==='Escape'){ finish(); return; }
        // Ignora la pressione dei soli tasti modificatori: aspettiamo il tasto "vero".
        if(['Control','Meta','Alt','Shift'].includes(e.key)) return;
        setShortcutKey(id, e.key.toLowerCase());
        finish();
      };
      document.addEventListener('keydown', onCapture, true);
      b.onclick = finish;
    };
  });
}

function openBulkEtichettaModal(ids, onDone, clearFn){

  `;
  openModal(html);

  document.getElementById('betClose').onclick = close;
  document.getElementById('betCancel').onclick = close;
  document.getElementById('betApply').onclick = ()=>{

    if(inputEl._commitPendingEtichetta) inputEl._commitPendingEtichetta();
    if(!pending.length){ toast('Scrivi almeno un\'etichetta'); return; }
    pending.forEach(t=>{ if(!DB.etichette.includes(t)) DB.etichette.push(t); });

      if(ids.includes(m.id)){

  });

function renameEtichetta(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(DB.etichette.includes(newName)){ toast('Esiste già un\'etichetta con questo nome'); return; }
  const idx = DB.etichette.indexOf(oldName);
  if(idx===-1) return;

    DB.etichetteColori[newName] = DB.etichetteColori[oldName];

}

const REFUND_CAUSALE_RE = /RIMBORS|STORNO|\bRESO\b|REFUND/i;
function isRefundEntrata(causale, importo){
