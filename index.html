          const labels = {1:'Mensile',2:'Bimestrale',3:'Trimestrale',4:'Quadrimestrale',6:'Semestrale',12:'Annuale'};
          return `<option value="${n}">${labels[n] || n+' mesi'}</option>`;
        }).join('')}</select></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('rotateCcw',14)}</span><div class="slim-main field"><label>Rinnovo</label><select id="sRinnovo"><option value="Automatico">Automatico</option><option value="Manuale">Manuale</option></select></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('creditCard',14)}</span><div class="slim-main field"><label>Metodo pagamento</label><select id="sMetodo">${DB.metodiPagamento.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</select></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('folder',14)}</span><div class="slim-main field"><label>Categoria</label><select id="sCategoriaAbb">${DB.categorieAbbonamenti.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('calendar',14)}</span><div class="slim-main field"><label>Data scadenza / rinnovo</label><input type="date" id="sScadenza" value="${editing?editing.scadenza||'':''}"></div></div>
      <div class="slim-row"><span class="slim-icon">${ico('check',14)}</span><div class="slim-main field"><label>Stato</label><select id="sStato"><option value="Attivo">Attivo</option><option value="Non attivo">Non attivo</option></select></div></div>
    </div>
    <div class="modal-foot">
      ${editing?'<button class="btn btn-danger" id="sDelete">Elimina</button>':''}
      <button class="btn" id="sCancel">Annulla</button>
      <button class="btn btn-primary" id="sSave">Salva</button>
    </div>
  `;
  const box = document.getElementById('modalBox');
  box.className = 'modal modal-form';
  box.innerHTML = html;
  showModalBackdrop();
  if(editing){
    document.getElementById('sMesi').value = String(editing.mesi||1);
    document.getElementById('sRinnovo').value = editing.rinnovo||'Automatico';
    document.getElementById('sMetodo').value = editing.metodoPagamento||DB.metodiPagamento[0];
    document.getElementById('sCategoriaAbb').value = editing.categoriaAbb||DB.categorieAbbonamenti[DB.categorieAbbonamenti.length-1];
    document.getElementById('sStato').value = editing.stato||'Attivo';
  }
  document.getElementById('sClose').onclick = closeModal;
  document.getElementById('sCancel').onclick = closeModal;
  if(editing) document.getElementById('sDelete').onclick = ()=>{
    closeModal();
    removeByIdWithUndo(DB.abbonamenti, editing.id, 'Abbonamento eliminato', renderCurrentView);
  };
  document.getElementById('sSave').onclick = ()=>{
    const servizio = document.getElementById('sServizio').value.trim();
    if(!servizio){ toast('Inserisci il nome del servizio'); return; }
    const servizioKey = normalizeMatch(servizio);
    const simile = DB.abbonamenti.find(x => (!editing || x.id!==editing.id) && normalizeMatch(x.servizio)===servizioKey);
    if(simile && !confirm(`Assomiglia a "${simile.servizio}" già presente — vuoi comunque procedere?`)) return;
    const costo = parseFloat(document.getElementById('sCosto').value) || null;
    const mesi = parseInt(document.getElementById('sMesi').value,10);
    const costoMensile = costo!==null ? (mesi>0 ? costo/mesi : costo) : null;
    const payload = {

    else { DB.abbonamenti.push({ id: uid('a'), ...payload }); }
    saveDB(); closeModal(); toast('Abbonamento salvato'); renderCurrentView();
  };
}

function computeAutoSpesePerAnno(){
  const byYear = {};
  movimentiForTotals(DB.movimenti).forEach(m=>{
    if(m.categoria!=='Auto' || !m.data || !m.uscite) return;
    const y = m.data.slice(0,4);
    byYear[y] = (byYear[y]||0) + m.uscite;
  });
  const years = Object.keys(byYear).sort();
  return { years, values: years.map(y=>byYear[y]) };
}

/* ---- Link auto: helper per smistare assicurazione/bollo/amazon dagli "altri link" ---- */
function splitAutoLinks(){
  const links = DB.auto.linkUtili || [];
  const norm = s => (s||'').toLowerCase();
  const assic = links.find(l=>norm(l.nome).includes('assicurazion'));
  const bollo = links.find(l=>norm(l.nome).includes('bollo'));
  const amazon = links.find(l=>norm(l.nome).includes('amazon'));
  const used = new Set([assic,bollo,amazon].filter(Boolean).map(l=>l.id));
  const others = links.filter(l=>!used.has(l.id));
  return {assic, bollo, amazon, others};
}
function autoLinkOpenBtn(link){
  return (link && link.url) ? `<a class="sub-bell" href="${esc(linkUtiliHref(link.url))}" target="_blank" rel="noopener" title="${esc(link.nome)}">${ico('link')}</a>` : '';
}
/* Crea/aggiorna/rimuove il link assicurazione/bollo/amazon a partire da un url (usata dalle modali aggregate) */
function setAutoLinkByCategory(cat, url){
  const { assic, bollo, amazon } = splitAutoLinks();
  const existing = cat==='assicurazione' ? assic : cat==='bollo' ? bollo : amazon;
  const defaultNome = cat==='assicurazione' ? 'Assicurazione' : cat==='bollo' ? 'Bollo' : 'Lista Amazon';
  if(!url){
    if(existing){ const idx = DB.auto.linkUtili.findIndex(l=>l.id===existing.id); if(idx!==-1) DB.auto.linkUtili.splice(idx,1); }
    return;
  }
  if(existing) existing.url = url;
  else DB.auto.linkUtili.push({ id: uid('alu'), nome: defaultNome, url });
}

function recomputeKmAnnuali(){
  // 'totali' (km attuali inseriti dall'utente per ciascun anno) è il dato sorgente.
  // 'annuali' = totali dell'anno - totali dell'anno precedente registrato (o Km iniziali se è il primo).
  const anni = DB.auto.kmAnnuali.anni || {};
  const years = Object.keys(anni).map(Number).sort((x,y)=>x-y);
  let prevTotale = DB.auto.kmAnnuali.kmIniziali || 0;
  years.forEach(y=>{
    const rec = anni[String(y)];
    rec.annuali = (rec.totali||0) - prevTotale;
    prevTotale = rec.totali||0;
  });
}

function renameCategoria(oldName, newName, tipo){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  const arr = tipo==='uscita' ? DB.categorieUscite : DB.categorieEntrate;
  if(arr.includes(newName)){ toast('Esiste già una categoria con questo nome'); return; }
  const doCascade = confirm(`Vuoi rinominare in automatico "${oldName}" in "${newName}" su tutti i movimenti già registrati nel database?`);
  const idx = arr.indexOf(oldName);
  if(idx>-1) arr[idx] = newName;
  if(DB.sottocategorie[oldName]){ DB.sottocategorie[newName] = DB.sottocategorie[oldName]; delete DB.sottocategorie[oldName]; }
  if(DB.categorieColori && DB.categorieColori[oldName]!==undefined){
    DB.categorieColori[newName] = DB.categorieColori[oldName];
    delete DB.categorieColori[oldName];
  }
  if(doCascade){
    DB.movimenti.forEach(m=>{ if(m.categoria===oldName) m.categoria=newName; });
  }
  saveDB(); toast('Categoria aggiornata'); refreshCategorieModal();
}
function renameSottocategoria(cat, oldSub, newSub){
  newSub = (newSub||'').trim();
  if(!newSub || newSub===oldSub) return;
  const list = DB.sottocategorie[cat]||[];
  if(list.includes(newSub)){ toast('Esiste già un dettaglio con questo nome'); return; }
  const doCascade = confirm(`Vuoi rinominare in automatico "${oldSub}" in "${newSub}" su tutti i movimenti già registrati nel database?`);
  const idx = list.indexOf(oldSub);
  if(idx>-1) list[idx] = newSub;
  if(doCascade){
    DB.movimenti.forEach(m=>{ if(m.categoria===cat && m.descrizione===oldSub) m.descrizione=newSub; });
  }
  saveDB(); toast('Dettaglio aggiornato'); refreshCategorieModal();
}

/* ---- Pulizia dettagli duplicati: trova descrizioni scritte in modo diverso ma probabilmente uguali ---- */
function normalizeDupKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function findDuplicateDetails(){
  const groups = {};
  DB.movimenti.forEach(m=>{
    if(!m.descrizione) return;
    const norm = normalizeDupKey(m.descrizione);
    if(!norm) return;
    const key = (m.categoria||'')+'|||'+norm;
    groups[key] = groups[key] || { categoria: m.categoria, norm, variants: {} };
    groups[key].variants[m.descrizione] = (groups[key].variants[m.descrizione]||0) + 1;
  });
  return Object.values(groups).filter(g => Object.keys(g.variants).length > 1);
}
function mergeDuplicateVariants(categoria, normKey, keeper){
  let count = 0;
  DB.movimenti.forEach(m=>{
    if((m.categoria||'')===categoria && normalizeDupKey(m.descrizione)===normKey && m.descrizione!==keeper){
      m.descrizione = keeper; count++;
    }
  });
  if(count) saveDB();
  return count;
}
function renderDupCleanupList(){
  const container = document.getElementById('dupCleanupList');
  if(!container) return;
  const groups = findDuplicateDetails();
  if(!groups.length){
    container.innerHTML = `<div class="empty-state" style="padding:14px 0;">Nessun duplicato evidente trovato ${ico('checkCircle')}</div>`;
    return;
  }
  container.innerHTML = groups.map((g,gi)=>{
    const variants = Object.entries(g.variants).sort((a,b)=>b[1]-a[1]);
    const subList = DB.sottocategorie[g.categoria]||[];
    const suggested = variants.find(([t])=>subList.includes(t));
    const defaultKeeper = suggested ? suggested[0] : variants[0][0];
    return `<div class="dup-group" data-idx="${gi}">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;"><b>${esc(g.categoria||'—')}</b> — ${variants.length} varianti trovate, scegli quella da tenere</div>
      <div class="dup-variants" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        ${variants.map(([text,count])=>`<label class="dup-variant-chip">
          <input type="radio" name="dupKeeper${gi}" value="${esc(text)}" ${text===defaultKeeper?'checked':''}>
          <span>"${esc(text)}"</span><span style="color:var(--text-faint);">×${count}</span>
        </label>`).join('')}
      </div>
      <button class="btn btn-sm btn-primary dupMergeBtn" data-idx="${gi}">Unisci in una sola scrittura</button>
    </div>`;
  }).join('');
  container.querySelectorAll('.dupMergeBtn').forEach(btn=>{
    btn.onclick = ()=>{
      const gi = parseInt(btn.dataset.idx,10);
      const g = groups[gi];
      const checked = container.querySelector(`input[name="dupKeeper${gi}"]:checked`);
      if(!checked) return;
      const keeper = checked.value;
      const n = mergeDuplicateVariants(g.categoria, g.norm, keeper);
      toast(`${n} movimenti aggiornati su "${keeper}"`);
      renderDupCleanupList();
    };
  });
}

/* ---- Drag & drop reale per riordinare categorie e dettagli ---- */
let dragInfo = null; // { kind:'cat'|'sub', cat, sub }
function wireCatDragDrop(listEl){
  // Trascinamento categorie
  listEl.querySelectorAll('.cm-item').forEach(item=>{
    const handle = item.querySelector('.cm-drag-handle');
    handle.addEventListener('dragstart', (e)=>{
      dragInfo = { kind:'cat', cat:item.dataset.cat };
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.dataset.cat);
    });
    handle.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      listEl.querySelectorAll('.cm-item').forEach(x=>x.classList.remove('drag-over-top','drag-over-bottom'));
      dragInfo = null;
    });
    item.addEventListener('dragover', (e)=>{
      if(!dragInfo || dragInfo.kind!=='cat' || dragInfo.cat===item.dataset.cat) return;
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      item.classList.toggle('drag-over-top', before);
      item.classList.toggle('drag-over-bottom', !before);
    });
    item.addEventListener('dragleave', ()=>{ item.classList.remove('drag-over-top','drag-over-bottom'); });
    item.addEventListener('drop', (e)=>{
      if(!dragInfo || dragInfo.kind!=='cat' || dragInfo.cat===item.dataset.cat) return;
      e.preventDefault();
      const arr = catSettingsTab==='uscita' ? DB.categorieUscite : DB.categorieEntrate;
      const fromIdx = arr.indexOf(dragInfo.cat);
      let toIdx = arr.indexOf(item.dataset.cat);
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      if(!before) toIdx++;
      if(fromIdx<toIdx) toIdx--;
      if(fromIdx>-1 && toIdx>-1){
        arr.splice(fromIdx,1);
        arr.splice(toIdx,0,dragInfo.cat);
        saveDB(); refreshCategorieModal();
      }
    });
  });

  // Trascinamento dettagli (solo all'interno della stessa categoria)
  listEl.querySelectorAll('.cm-sub-item').forEach(item=>{
    const handle = item.querySelector('.cm-sub-drag');
    if(!handle) return;
    const cat = item.closest('.cm-item').dataset.cat;
    handle.addEventListener('dragstart', (e)=>{
      e.stopPropagation();
      dragInfo = { kind:'sub', cat, sub:item.dataset.sub };
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.dataset.sub);
    });
    handle.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      listEl.querySelectorAll('.cm-sub-item').forEach(x=>x.classList.remove('drag-over-top','drag-over-bottom'));
      dragInfo = null;
    });
    item.addEventListener('dragover', (e)=>{
      if(!dragInfo || dragInfo.kind!=='sub' || dragInfo.cat!==cat || dragInfo.sub===item.dataset.sub) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      item.classList.toggle('drag-over-top', before);
      item.classList.toggle('drag-over-bottom', !before);
    });
    item.addEventListener('dragleave', ()=>{ item.classList.remove('drag-over-top','drag-over-bottom'); });
    item.addEventListener('drop', (e)=>{
      if(!dragInfo || dragInfo.kind!=='sub' || dragInfo.cat!==cat || dragInfo.sub===item.dataset.sub) return;
      e.preventDefault();
      e.stopPropagation();
      const arr = DB.sottocategorie[cat]||[];
      const fromIdx = arr.indexOf(dragInfo.sub);
      let toIdx = arr.indexOf(item.dataset.sub);
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      if(!before) toIdx++;
      if(fromIdx<toIdx) toIdx--;
      if(fromIdx>-1 && toIdx>-1){
        arr.splice(fromIdx,1);
        arr.splice(toIdx,0,dragInfo.sub);
        saveDB(); refreshCategorieModal();
      }
    });
  });
}

/* ---- Gestione Categorie Abbonamenti: stesso layout/drag&drop dei Metodi di Pagamento (senza icone) ---- */
function renameCategoriaAbb(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(DB.categorieAbbonamenti.includes(newName)){ toast('Esiste già una categoria con questo nome'); return; }
  const idx = DB.categorieAbbonamenti.indexOf(oldName);
  if(idx===-1) return;
  DB.categorieAbbonamenti[idx] = newName;
  DB.abbonamenti.forEach(a=>{ if(a.categoriaAbb===oldName) a.categoriaAbb=newName; });
  saveDB(); toast('Categoria aggiornata'); refreshCategorieAbbModal();
}
function renderCategoriaAbbItem(c){
  return `
    <div class="cm-item mm-item" data-categoriaabb="${esc(c)}">
      <div class="cm-head" style="cursor:default;">
        <span class="cm-drag-handle" draggable="true" title="Trascina per riordinare">⠿</span>
        <span class="tag-dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${categoriaAbbColor(c)};flex-shrink:0;"></span>
        <span class="cm-name">${esc(c)}</span>
        <div class="row-actions cm-actions" style="opacity:1;">
          <button class="btn btn-icon btn-sm renameCategoriaAbb" data-c="${esc(c)}" title="Rinomina">${ico('edit')}</button>
          <button class="btn btn-icon btn-sm delCategoriaAbb" data-c="${esc(c)}" title="Elimina">${ico('trash')}</button>
        </div>
      </div>
    </div>`;
}
function renderCategorieAbbModalBody(){
  return `
    <div class="page-sub" style="margin-bottom:14px;">Trascina l'icona ⠿ per riordinare. Ogni categoria ha un colore stabile, usato come bordo colorato nelle card e nell'elenco Abbonamenti.</div>
    <div id="categorieAbbManageList"></div>
    <div class="add-inline" style="margin-top:14px;">
      <input type="text" id="newCategoriaAbb" placeholder="Nuova categoria abbonamento…">
      <button class="btn btn-sm" id="addCategoriaAbb">+ Aggiungi categoria</button>
    </div>`;
}
function openCategorieAbbModal(){
  const html = `
    <div class="modal-head"><h3>Categorie Abbonamenti</h3><button class="close-x" id="cabmClose">${settingsCloseIcon()}</button></div>
    <div class="modal-body">${renderCategorieAbbModalBody()}</div>
    <div class="modal-foot"><button class="btn" id="cabmCloseBtn">Chiudi</button></div>
  `;
  openSettingsPanel(html);
  document.getElementById('modalBox').dataset.kind = 'categorieabb';
  const close = ()=>{ closeModal(); renderImpostazioni(); };
  document.getElementById('cabmClose').onclick = close;
  document.getElementById('cabmCloseBtn').onclick = close;
  wireCategorieAbbSection();
}
function refreshCategorieAbbModal(){
  const box = document.getElementById('modalBox');
  if(box.dataset.kind==='categorieabb'){
    box.querySelector('.modal-body').innerHTML = renderCategorieAbbModalBody();
    wireCategorieAbbSection();
  } else if(currentView==='impostazioni'){ renderImpostazioni(); }
  if(currentView==='abbonamenti') renderAbbonamenti();
}
function wireCategorieAbbSection(){
  const listEl = document.getElementById('categorieAbbManageList');
  const list = DB.categorieAbbonamenti;
  listEl.innerHTML = list.length ? list.map(c=>renderCategoriaAbbItem(c)).join('')
    : `<div class="empty-state" style="padding:20px;">Nessuna categoria. Aggiungine una qui sotto.</div>`;

  listEl.querySelectorAll('.renameCategoriaAbb').forEach(b=>b.onclick = ()=>{
    const nuovo = prompt(`Rinomina categoria "${b.dataset.c}" in:`, b.dataset.c);
    if(nuovo!==null) renameCategoriaAbb(b.dataset.c, nuovo);
  });
  listEl.querySelectorAll('.delCategoriaAbb').forEach(b=>b.onclick = ()=>{
    const idx = DB.categorieAbbonamenti.indexOf(b.dataset.c);
    if(idx===-1) return;
    const val = b.dataset.c;
    if(DB.categorieAbbonamenti.length<=1){ toast('Deve restare almeno una categoria'); return; }
    if(!confirm(`Eliminare la categoria "${val}"? Gli abbonamenti che la usano passeranno a "${DB.categorieAbbonamenti.find(c=>c!==val)}".`)) return;
    const fallback = DB.categorieAbbonamenti.find(c=>c!==val);
    DB.categorieAbbonamenti.splice(idx,1);
    const affected = [];
    DB.abbonamenti.forEach(a=>{ if(a.categoriaAbb===val){ affected.push(a); a.categoriaAbb=fallback; } });
    saveDB(); refreshCategorieAbbModal();
    toastUndo(`Categoria "${val}" eliminata`, ()=>{
      DB.categorieAbbonamenti.splice(idx,0,val);
      affected.forEach(a=>{ a.categoriaAbb=val; });
      saveDB(); toast('Ripristinata'); refreshCategorieAbbModal();
    });
  });
  document.getElementById('addCategoriaAbb').onclick = ()=>{
    const input = document.getElementById('newCategoriaAbb');
    const val = input.value.trim();
    if(!val) return;
    if(!DB.categorieAbbonamenti.includes(val)){ DB.categorieAbbonamenti.push(val); saveDB(); toast('Categoria aggiunta'); refreshCategorieAbbModal(); }
    else toast('Categoria già esistente');
  };

  wireCategorieAbbDragDrop(listEl);
}
let dragInfoCategoriaAbb = null;
function wireCategorieAbbDragDrop(listEl){
  listEl.querySelectorAll('.mm-item').forEach(item=>{
    const handle = item.querySelector('.cm-drag-handle');
    handle.addEventListener('dragstart', (e)=>{
      dragInfoCategoriaAbb = item.dataset.categoriaabb;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.dataset.categoriaabb);
    });
    handle.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      listEl.querySelectorAll('.mm-item').forEach(x=>x.classList.remove('drag-over-top','drag-over-bottom'));
      dragInfoCategoriaAbb = null;
    });
    item.addEventListener('dragover', (e)=>{
      if(!dragInfoCategoriaAbb || dragInfoCategoriaAbb===item.dataset.categoriaabb) return;
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      item.classList.toggle('drag-over-top', before);
      item.classList.toggle('drag-over-bottom', !before);
    });
    item.addEventListener('dragleave', ()=>{ item.classList.remove('drag-over-top','drag-over-bottom'); });
    item.addEventListener('drop', (e)=>{
      if(!dragInfoCategoriaAbb || dragInfoCategoriaAbb===item.dataset.categoriaabb) return;
      e.preventDefault();
      const arr = DB.categorieAbbonamenti;
      const fromIdx = arr.indexOf(dragInfoCategoriaAbb);
      let toIdx = arr.indexOf(item.dataset.categoriaabb);
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      if(!before) toIdx++;
      if(fromIdx<toIdx) toIdx--;
      if(fromIdx>-1 && toIdx>-1){
        arr.splice(fromIdx,1);
        arr.splice(toIdx,0,dragInfoCategoriaAbb);
        saveDB(); refreshCategorieAbbModal();
      }
    });
  });
}

/* ---- Gestione Metodi di Pagamento: stesso layout/drag&drop delle Categorie ---- */
function renameMetodo(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(DB.metodiPagamento.includes(newName)){ toast('Esiste già un metodo con questo nome'); return; }
  const idx = DB.metodiPagamento.indexOf(oldName);
  if(idx===-1) return;
  const doCascade = confirm(`Vuoi rinominare in automatico "${oldName}" in "${newName}" su tutti gli abbonamenti già registrati?`);
  DB.metodiPagamento[idx] = newName;
  if(DB.metodiIcone && DB.metodiIcone[oldName]!==undefined){
    DB.metodiIcone[newName] = DB.metodiIcone[oldName];
    delete DB.metodiIcone[oldName];
  }
  if(doCascade){
    DB.abbonamenti.forEach(a=>{ if(a.metodoPagamento===oldName) a.metodoPagamento=newName; });
  }
  saveDB(); toast('Metodo aggiornato'); refreshMetodiModal();
}
function renderMetodoItem(m, idx, total){
  const hasCustomIcon = !!(DB.metodiIcone && DB.metodiIcone[m]);
  return `
    <div class="cm-item mm-item" data-metodo="${esc(m)}">
      <div class="cm-head" style="cursor:default;">
        <span class="cm-drag-handle" draggable="true" title="Trascina per riordinare">⠿</span>
        <span class="mm-icon-preview">${metodoIconHtml(m)}</span>
        <span class="cm-name">${esc(m)}</span>
        <div class="row-actions cm-actions" style="opacity:1;">
          <input type="file" class="uploadMetodoIconInput" data-m="${esc(m)}" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none;">
          <button class="btn btn-icon btn-sm uploadMetodoIcon" data-m="${esc(m)}" title="Carica icona personalizzata">${ico('upload')}</button>
          ${hasCustomIcon?`<button class="btn btn-icon btn-sm removeMetodoIcon" data-m="${esc(m)}" title="Rimuovi icona personalizzata">${ico('rotateCcw')}</button>`:''}
          <button class="btn btn-icon btn-sm renameMetodo" data-m="${esc(m)}" title="Rinomina">${ico('edit')}</button>
          <button class="btn btn-icon btn-sm delMetodo" data-m="${esc(m)}" title="Elimina">${ico('trash')}</button>
        </div>
      </div>
    </div>`;
}
function renderMetodiModalBody(){
  return `
    <div class="page-sub" style="margin-bottom:14px;">Trascina l'icona ⠿ per riordinare. Carica un'icona personalizzata (PNG/JPG/WEBP/SVG) oppure lascia quella generata automaticamente. Rinomina o elimina con le azioni rapide.</div>

function openMetodiModal(){
  const html = `

    <div class="modal-body">${renderMetodiModalBody()}</div>
    <div class="modal-foot"><button class="btn" id="metmCloseBtn">Chiudi</button></div>
  `;
  openSettingsPanel(html);

  document.getElementById('metmClose').onclick = close;
  document.getElementById('metmCloseBtn').onclick = close;
  wireMetodiSection();
}
function refreshMetodiModal(){
  const box = document.getElementById('modalBox');
  if(box.dataset.kind==='metodi'){
    box.querySelector('.modal-body').innerHTML = renderMetodiModalBody();
    wireMetodiSection();
  } else if(currentView==='impostazioni'){ renderImpostazioni(); }
}
function wireMetodiSection(){
  const listEl = document.getElementById('metodiManageList');
  const list = DB.metodiPagamento;
  listEl.innerHTML = list.length ? list.map((m,idx)=>renderMetodoItem(m, idx, list.length)).join('')
    : `<div class="empty-state" style="padding:20px;">Nessun metodo di pagamento. Aggiungine uno qui sotto.</div>`;

  listEl.querySelectorAll('.renameMetodo').forEach(b=>b.onclick = ()=>{
    const nuovo = prompt(`Rinomina metodo "${b.dataset.m}" in:`, b.dataset.m);
    if(nuovo!==null) renameMetodo(b.dataset.m, nuovo);
  });
  listEl.querySelectorAll('.uploadMetodoIcon').forEach(b=>b.onclick = ()=>{
    listEl.querySelector(`.uploadMetodoIconInput[data-m="${CSS.escape(b.dataset.m)}"]`).click();
  });
  listEl.querySelectorAll('.uploadMetodoIconInput').forEach(inp=>inp.onchange = ()=>{
    const file = inp.files[0];
    if(!file) return;
    const nome = inp.dataset.m;
    processMetodoIconFile(file, (dataURL, err)=>{
      if(err){ toast(err); return; }
      DB.metodiIcone[nome] = dataURL;
      saveDB(); toast('Icona caricata'); refreshMetodiModal();
    });
  });
  listEl.querySelectorAll('.removeMetodoIcon').forEach(b=>b.onclick = ()=>{
    delete DB.metodiIcone[b.dataset.m];
    saveDB(); toast('Icona personalizzata rimossa, torna quella automatica'); refreshMetodiModal();
  });
  listEl.querySelectorAll('.delMetodo').forEach(b=>b.onclick = ()=>{
    const idx = DB.metodiPagamento.indexOf(b.dataset.m);
    if(idx===-1) return;
    const val = b.dataset.m;
    if(!confirm(`Eliminare il metodo "${val}"? Scomparirà solo la sua icona dai movimenti: nessun movimento verrà modificato o cancellato.`)) return;
    const savedIcon = DB.metodiIcone[val];
    DB.metodiPagamento.splice(idx,1);
    delete DB.metodiIcone[val];
    saveDB(); refreshMetodiModal();
    toastUndo(`Metodo "${val}" eliminato`, ()=>{
      DB.metodiPagamento.splice(idx,0,val);
      if(savedIcon) DB.metodiIcone[val] = savedIcon;
      saveDB(); toast('Ripristinato'); refreshMetodiModal();
    });
  });
  document.getElementById('addMetodo').onclick = ()=>{
    const input = document.getElementById('newMetodo');
    const val = input.value.trim();
    if(!val) return;
    if(!DB.metodiPagamento.includes(val)){ DB.metodiPagamento.push(val); saveDB(); toast('Metodo aggiunto'); refreshMetodiModal(); }
    else toast('Metodo già esistente');
  };

  wireMetodiDragDrop(listEl);
}

/* ---- Impostazioni: Regole Import Excel (apprese automaticamente durante l'import) ---- */
function openImportRulesModal(){
  const html = `
    <div class="modal-head"><h3>Regole Import ${ico('sparkle')}</h3><button class="close-x" id="irmClose">${settingsCloseIcon()}</button></div>
    <div class="modal-body">
      <div class="page-sub" style="margin-bottom:12px;">Ogni volta che correggi manualmente un abbinamento durante l'import, viene salvata qui una regola per riconoscerlo automaticamente nei prossimi caricamenti.</div>
      <div id="importRulesList"></div>
    </div>
    <div class="modal-foot"><button class="btn" id="irmCloseBtn">Chiudi</button></div>
  `;
  openSettingsPanel(html);
  document.getElementById('irmClose').onclick = ()=>{ closeModal(); renderImpostazioni(); };
  document.getElementById('irmCloseBtn').onclick = ()=>{ closeModal(); renderImpostazioni(); };
  wireImportRulesSection();
}
function wireImportRulesSection(){
  const listEl = document.getElementById('importRulesList');
  if(!listEl) return;
  const rules = loadImportRules();
  const keys = Object.keys(rules);
  if(!keys.length){
    listEl.innerHTML = `<div style="text-align:center;color:var(--text-faint);padding:16px;font-size:12.5px;">Nessuna regola salvata finora. Le regole compaiono qui man mano che correggi gli abbinamenti durante un import.</div>`;
    return;
  }
  listEl.innerHTML = keys.sort().map(k=>{
    const r = rules[k];
    return `<div class="imp-rule-row" data-key="${esc(k)}">
      <span class="imp-rule-key">${esc(k)}</span>
      <span class="imp-rule-arrow">${ico('arrowRight')}</span>
      <span class="imp-rule-target">${esc(r.categoria)}${r.dettaglio?' / '+esc(r.dettaglio):''}</span>
      <button class="btn btn-icon btn-sm ruleEditBtn" data-key="${esc(k)}" title="Modifica">${ico('edit')}</button>
      <button class="btn btn-icon btn-sm ruleDelBtn" data-key="${esc(k)}" title="Elimina">${ico('trash')}</button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.ruleDelBtn').forEach(b=>b.onclick = ()=>{
    const rules2 = loadImportRules();
    delete rules2[b.dataset.key];
    saveImportRules(rules2);
    wireImportRulesSection();
    toast('Regola eliminata');
  });
  listEl.querySelectorAll('.ruleEditBtn').forEach(b=>b.onclick = ()=>openImportRuleModal(b.dataset.key));
}
function openImportRuleModal(key){
  const rules = loadImportRules();
  const r = rules[key] || {categoria:'', dettaglio:''};
  const html = `
    <div class="modal-head"><h3>Modifica regola</h3><button class="close-x" id="irClose">${ico('x')}</button></div>
    <div class="modal-body">
      <div class="field"><label>Riconosce la causale</label><input type="text" id="irKey" value="${esc(key)}"></div>
      <div class="field"><label>Categoria</label><select id="irCategoria">${catOptionsHtmlImport(DB.categorieEntrate.includes(r.categoria)?'entrata':'uscita', r.categoria)}</select></div>
      <div class="field"><label>Dettaglio</label><select id="irDettaglio">${detOptionsHtmlImport(r.categoria, r.dettaglio)}</select></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="irCancel">Annulla</button>
      <button class="btn btn-primary" id="irSave">Salva</button>
    </div>`;
  openModal(html);
  document.getElementById('irCategoria').onchange = ()=>{
    document.getElementById('irDettaglio').innerHTML = detOptionsHtmlImport(document.getElementById('irCategoria').value, null);
  };
  document.getElementById('irClose').onclick = openImportRulesModal;
  document.getElementById('irCancel').onclick = openImportRulesModal;
  document.getElementById('irSave').onclick = ()=>{
    const newKey = document.getElementById('irKey').value.trim().toUpperCase();
    const categoria = document.getElementById('irCategoria').value;
    const dettaglio = document.getElementById('irDettaglio').value || null;
    if(!newKey || !categoria){ toast('Compila causale e categoria'); return; }
    const rules2 = loadImportRules();
    if(newKey!==key) delete rules2[key];
    rules2[newKey] = { categoria, dettaglio };
    saveImportRules(rules2);
    toast('Regola salvata');
    openImportRulesModal();
  };
}

function nowStamp(){

  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'}) + ' alle ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
function generatePdfReport(kind){
  const container = document.getElementById('printReport');

function buildDashboardReportHtml(){
  const years = getYears();
  const period = filteredMovimenti(dashFilter);
  const totEntrate = movimentiForTotals(period).reduce((s,m)=>s+(m.entrate||0),0);
  const totUscite = movimentiForTotals(period).reduce((s,m)=>s+(m.uscite||0),0);
  const saldo = totEntrate - totUscite;

  const periodoLabel = (dashFilter.anni.length ? dashFilter.anni.slice().sort().join(', ') : 'Tutti gli anni')
    + (dashFilter.mesi.length ? ' — ' + dashFilter.mesi.slice().sort((a,b)=>a-b).map(m=>monthName(parseInt(m,10))).join(', ') : '');

  const catTotals = {};
  movimentiForTotals(period).forEach(m=>{ if(m.uscite){ catTotals[m.categoria]=(catTotals[m.categoria]||0)+m.uscite; } });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

  const catRows = catEntries.map(([cat,val])=>{
    const pct = totUscite>0 ? (val/totUscite*100) : 0;
    return `<tr><td>${esc(cat)}</td><td class="num">${fmtEUR(val)}</td><td class="num">${pct.toFixed(1)}%</td></tr>`;
  }).join('') || `<tr><td colspan="3" style="color:#888;text-align:center;">Nessuna spesa nel periodo selezionato</td></tr>`;

  let scadenzeRows = '';

  ['assicurazione','bollo','revisione'].forEach(k=>{

  scadenzeRows = scadItems.map(it=>`<tr><td>${esc(it.label)}</td><td>${esc(it.tipo)}</td><td class="num">${fmtDate(it.data)}</td></tr>`).join('')

  return `
    <div class="pr-head">
      <div><h1>${ico('pieChart')} Gestionale — Riepilogo Finanziario</h1><div class="pr-sub">Periodo: ${esc(periodoLabel)}</div></div>

      <div class="pr-kpi"><div class="lbl">Totale Uscite</div><div class="val">${fmtEUR(totUscite)}</div></div>
      <div class="pr-kpi"><div class="lbl">Saldo Periodo</div><div class="val">${fmtEUR(saldo)}</div></div>
    </div>
    <div class="pr-section-title">Ripartizione Spese per Categoria</div>
    <table><thead><tr><th>Categoria</th><th class="num">Importo</th><th class="num">% sul totale</th></tr></thead><tbody>${catRows}</tbody></table>
    <div class="pr-section-title">Prossime Scadenze</div>
    <table><thead><tr><th>Voce</th><th>Tipo</th><th class="num">Scadenza</th></tr></thead><tbody>${scadenzeRows}</tbody></table>
    <div class="pr-footer">Gestionale — Finance &amp; Personal Hub · Report generato automaticamente dai dati salvati nel browser.</div>

    ${autoMatches.length ? `<div class="pr-section-title">Manutenzione Auto (${autoMatches.length})</div>
    <table><thead><tr><th>Data</th><th>Intervento</th><th>Officina</th><th class="num">Costo</th></tr></thead><tbody>${manRows}</tbody></table>` : ''}
    ${!(movMatches.length||subMatches.length||autoMatches.length) ? `<div style="color:#888;padding:20px 0;">Nessun risultato per i filtri impostati</div>` : ''}
    <div class="pr-footer">Gestionale — Finance &amp; Personal Hub · Report generato automaticamente dai dati salvati nel browser.</div>

const LS_LAST_BACKUP = 'ledger_last_backup_v1';
const LS_FIRST_USE = 'ledger_first_use_v1';
const LS_BACKUP_DISMISS = 'ledger_backup_dismiss_v1';
const BACKUP_REMINDER_DAYS = 30;
const BACKUP_SNOOZE_DAYS = 7;

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `gestionale-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem(LS_LAST_BACKUP, String(Date.now()));
  toast('Backup esportato');
  checkBackupBanner();
}

function checkBackupBanner(){
  const banner = document.getElementById('backupBanner');
  if(!banner) return;
  if(!localStorage.getItem(LS_FIRST_USE)) localStorage.setItem(LS_FIRST_USE, String(Date.now()));

  const dismissedAt = parseInt(localStorage.getItem(LS_BACKUP_DISMISS)||'0',10);
  const daysSinceDismiss = (Date.now()-dismissedAt)/86400000;
  if(dismissedAt && daysSinceDismiss < BACKUP_SNOOZE_DAYS){ banner.style.display='none'; return; }

  const lastBackup = parseInt(localStorage.getItem(LS_LAST_BACKUP)||'0',10);
  const refDate = lastBackup || parseInt(localStorage.getItem(LS_FIRST_USE)||String(Date.now()),10);
  const daysSince = (Date.now()-refDate)/86400000;

  if(daysSince < BACKUP_REMINDER_DAYS){ banner.style.display='none'; return; }

  banner.innerHTML = `
    <div class="backup-banner-text"><span class="ic">${ico('save')}</span><span>Non esporti un backup da un po' — i tuoi dati vivono solo in questo browser. Ti conviene salvarne una copia.</span></div>
    <div class="backup-banner-actions">
      <button class="btn btn-primary btn-sm" id="backupBannerExport">Esporta ora</button>
      <button class="btn btn-sm" id="backupBannerDismiss">Più tardi</button>
    </div>`;
  banner.style.display = 'flex';
  document.getElementById('backupBannerExport').onclick = ()=>{ exportBackup(); banner.style.display='none'; };
  document.getElementById('backupBannerDismiss').onclick = ()=>{
    localStorage.setItem(LS_BACKUP_DISMISS, String(Date.now()));
    banner.style.display='none';
  };
}

/* ==================== RIEPILOGO MENSILE ==================== */
const LS_MONTHLY_SEEN = 'ledger_monthly_summary_seen_v1';
/* Mese solare precedente rispetto ad oggi (non l'ultimo movimento registrato): usato sia dal banner
   di notifica sia dalla card di analisi testuale in Dashboard, così restano sempre coerenti tra loro. */
function getPreviousCalendarMonth(){
  const now = new Date();
  const lastDayPrevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
  return { year: lastDayPrevMonth.getFullYear(), month: lastDayPrevMonth.getMonth()+1 };
}
/* ---- Analisi testuale del mese scorso ("come se te lo spiegasse il commercialista") ----
   Non c'è nessuna IA dietro: è testo composto da template con dati calcolati, con qualche variante
   di formulazione scelta in modo stabile (stesso mese = stesse frasi) per non sembrare sempre identico. */
function pickTemplate(key, templates){
  let h = 0; for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) >>> 0;
  return templates[h % templates.length];
}
function computeMonthlyReport(year, month){
  const key = `${year}-${String(month).padStart(2,'0')}`;
  const rows = movimentiForTotals(DB.movimenti.filter(m=>m.data && m.data.slice(0,7)===key));
  if(!rows.length) return null;
  const entrate = rows.reduce((s,m)=>s+(m.entrate||0),0);
  const uscite = rows.reduce((s,m)=>s+(m.uscite||0),0);
  const saldo = entrate-uscite;

  let py=year, pm=month-1; if(pm<1){ pm=12; py=year-1; }
  const prevKey = `${py}-${String(pm).padStart(2,'0')}`;
  const prevUscite = movimentiForTotals(DB.movimenti.filter(m=>m.data && m.data.slice(0,7)===prevKey)).reduce((s,m)=>s+(m.uscite||0),0);
  const deltaPct = prevUscite>0 ? ((uscite-prevUscite)/prevUscite)*100 : null;

  const catTot = {};
  rows.forEach(m=>{ if(m.uscite) catTot[m.categoria]=(catTot[m.categoria]||0)+m.uscite; });
  const catSorted = Object.entries(catTot).sort((a,b)=>b[1]-a[1]);
  const topCat = catSorted[0] ? { nome:catSorted[0][0], importo:catSorted[0][1], pct: uscite>0?(catSorted[0][1]/uscite*100):0 } : null;

  // "Ricorrenti" = spese in categoria Abbonamenti (l'unica categoria che l'app traccia esplicitamente
  // come ricorrente, tramite la scheda Abbonamenti); tutto il resto è considerato una tantum.
  const ricorrenti = catTot['Abbonamenti'] || 0;
  const unaTantum = uscite - ricorrenti;
  const pctRicorrenti = uscite>0 ? (ricorrenti/uscite*100) : 0;

  // Entrate straordinarie: tutto ciò che non è Stipendio (l'entrata ricorrente per definizione).
  const straordinarie = rows.filter(m=>m.entrate && m.categoria!=='Stipendio');
  const totStraordinarie = straordinarie.reduce((s,m)=>s+(m.entrate||0),0);

  return { year, month, key, entrate, uscite, saldo, deltaPct, prevMonthLabel: monthName(pm)+' '+py, topCat, ricorrenti, unaTantum, pctRicorrenti, straordinarie, totStraordinarie };
}
function monthlyReportText(rep){
  const mLabel = monthName(rep.month)+' '+rep.year;
  const paragraphs = [];

  const aperturaTpl = [
    `A <b>${mLabel}</b> hai avuto entrate per ${fmtEUR(rep.entrate)} e uscite per ${fmtEUR(rep.uscite)}, con un saldo ${rep.saldo>=0?'positivo':'negativo'} di ${fmtEUR(Math.abs(rep.saldo))}.`,
    `<b>${mLabel}</b> si chiude con ${fmtEUR(rep.entrate)} di entrate e ${fmtEUR(rep.uscite)} di uscite: il saldo è ${rep.saldo>=0?'in attivo':'in rosso'} di ${fmtEUR(Math.abs(rep.saldo))}.`
  ];
  let apertura = pickTemplate(rep.key, aperturaTpl);
  if(rep.deltaPct!==null){
    if(rep.deltaPct>3) apertura += ` Hai speso il ${Math.abs(rep.deltaPct).toFixed(0)}% in più rispetto a ${rep.prevMonthLabel}.`;
    else if(rep.deltaPct<-3) apertura += ` Hai speso il ${Math.abs(rep.deltaPct).toFixed(0)}% in meno rispetto a ${rep.prevMonthLabel}.`;
    else apertura += ` Le uscite sono rimaste sostanzialmente in linea con ${rep.prevMonthLabel}.`;
  }
  paragraphs.push(apertura);

  if(rep.topCat){
    const catTpl = [
      `La voce che pesa di più è <b>${esc(rep.topCat.nome)}</b>, con ${fmtEUR(rep.topCat.importo)} (il ${rep.topCat.pct.toFixed(0)}% delle uscite totali).`,
      `A guidare la classifica delle spese è <b>${esc(rep.topCat.nome)}</b>: ${fmtEUR(rep.topCat.importo)}, pari al ${rep.topCat.pct.toFixed(0)}% del totale uscite.`
    ];
    paragraphs.push(pickTemplate(rep.key+'c', catTpl));
  }

  if(rep.ricorrenti>0){
    paragraphs.push(`Degli ${fmtEUR(rep.uscite)} spesi, ${fmtEUR(rep.ricorrenti)} (${rep.pctRicorrenti.toFixed(0)}%) sono abbonamenti ricorrenti; il resto — ${fmtEUR(rep.unaTantum)} — sono spese occasionali.`);
  }

  if(rep.straordinarie.length){
    const elenco = rep.straordinarie.slice(0,3).map(m=>`${esc(m.descrizione||m.categoria)} (${fmtEUR(m.entrate)})`).join(', ');
    const extra = rep.straordinarie.length>3 ? ` e altre ${rep.straordinarie.length-3} voci` : '';
    paragraphs.push(`Oltre alle entrate abituali, hai incassato ${fmtEUR(rep.totStraordinarie)} da: ${elenco}${extra}.`);
  }

  const chiusuraTpl = rep.saldo>=0
    ? [`Nel complesso è andato bene: hai messo da parte ${fmtEUR(rep.saldo)}.`, `Bilancio positivo: ${fmtEUR(rep.saldo)} risparmiati questo mese.`]
    : [`Nel complesso hai speso più di quanto guadagnato: può valere la pena tenere d'occhio ${rep.topCat?esc(rep.topCat.nome):'le spese principali'} il prossimo mese.`, `Il mese chiude in rosso di ${fmtEUR(Math.abs(rep.saldo))}: niente panico, ma un occhio in più il prossimo mese non guasta.`];
  paragraphs.push(pickTemplate(rep.key+'z', chiusuraTpl));

  return paragraphs;
}
let monthlyReportOffset = 0; // 0 = mese scorso (default); negativo = mesi precedenti; mai positivo
function renderMonthlyReportCard(){
  const slot = document.getElementById('monthlyReportSlot');
  if(!slot) return;
  const base = getPreviousCalendarMonth();
  let y = base.year, m = base.month + monthlyReportOffset;
  while(m<1){ m+=12; y--; }
  while(m>12){ m-=12; y++; }
  const mLabel = monthName(m)+' '+y;
  const canGoForward = monthlyReportOffset<0;
  const navHtml = `
    <div class="report-nav">
      <button type="button" class="report-nav-btn" id="reportPrevMonth" title="Mese precedente" aria-label="Mese precedente">${ico('chevronLeft',15)}</button>
      <button type="button" class="report-nav-btn" id="reportNextMonth" title="Mese successivo" aria-label="Mese successivo" ${canGoForward?'':'disabled'}>${ico('chevronRight',15)}</button>
    </div>`;
  const rep = computeMonthlyReport(y, m);
  if(!rep){
    slot.innerHTML = `
      <div class="card report-card no-data" id="monthlyReportCard">
        <div class="report-card-head" style="cursor:default;">
          <div class="report-card-icon">${ico('fileText',18)}</div>
          <div class="report-card-body">
            <div class="report-card-title">Come è andato ${mLabel}</div>
            <div class="report-card-teaser">Nessun movimento registrato in questo mese</div>
          </div>
          ${navHtml}
        </div>
      </div>
    `;
    wireMonthlyReportNav();
    return;
  }
  const teaser = `Saldo ${fmtEUR(rep.saldo)}${rep.topCat?' · voce principale: '+esc(rep.topCat.nome):''}`;
  const paragraphsHtml = monthlyReportText(rep).map(p=>`<p>${p}</p>`).join('');
  slot.innerHTML = `
    <div class="card report-card" id="monthlyReportCard">
      <div class="report-card-head" id="reportCardHead">
        <div class="report-card-icon">${ico('fileText',18)}</div>
        <div class="report-card-body">
          <div class="report-card-title">Come è andato ${mLabel}</div>
          <div class="report-card-teaser">${teaser}</div>
        </div>
        ${navHtml}
        <div class="report-card-chevron">${ico('arrowRight',14)}</div>
      </div>
      <div class="report-card-full"><div class="report-card-full-inner">${paragraphsHtml}</div></div>
    </div>
  `;
  // Il tap/click per espandere resta sulla testata, ma non deve scattare cliccando le frecce di
  // navigazione tra i mesi (altrimenti ogni cambio mese aprirebbe/chiuderebbe anche la card).
  document.getElementById('reportCardHead').onclick = (e)=>{
    if(e.target.closest('.report-nav')) return;
    document.getElementById('monthlyReportCard').classList.toggle('open');
  };
  wireMonthlyReportNav();
}
function wireMonthlyReportNav(){
  const prev = document.getElementById('reportPrevMonth');
  const next = document.getElementById('reportNextMonth');
  if(prev) prev.onclick = (e)=>{ e.stopPropagation(); monthlyReportOffset--; renderMonthlyReportCard(); };
  if(next) next.onclick = (e)=>{ e.stopPropagation(); if(monthlyReportOffset<0){ monthlyReportOffset++; renderMonthlyReportCard(); } };
}
function checkMonthlyBanner(){
  const banner = document.getElementById('monthlyBanner');
  if(!banner) return;
  const { year: py, month: pmo } = getPreviousCalendarMonth();
  const key = `${py}-${String(pmo).padStart(2,'0')}`;
  if(localStorage.getItem(LS_MONTHLY_SEEN)===key){ banner.style.display='none'; return; }
  const rows = movimentiForTotals(DB.movimenti.filter(m=>m.data && m.data.slice(0,4)===String(py) && parseInt(m.data.slice(5,7),10)===pmo));
  if(!rows.length){ banner.style.display='none'; return; }
  const entrate = rows.reduce((s,m)=>s+(m.entrate||0),0);
  const uscite = rows.reduce((s,m)=>s+(m.uscite||0),0);
  const saldo = entrate-uscite;
  banner.innerHTML = `
    <div class="backup-banner-text"><span class="ic">${ico('calendar')}</span><span>Ecco come è andato ${monthName(pmo)}: entrate ${fmtEUR(entrate)} · uscite ${fmtEUR(uscite)} · saldo ${saldo>=0?'+':''}${fmtEUR(saldo)}</span></div>
    <div class="backup-banner-actions">
      <button class="btn btn-primary btn-sm" id="monthlyBannerView">Vedi dettaglio</button>
      <button class="btn btn-sm" id="monthlyBannerDismiss">Ok, grazie</button>
    </div>`;
  banner.style.display = 'flex';
  document.getElementById('monthlyBannerView').onclick = ()=>{
    localStorage.setItem(LS_MONTHLY_SEEN, key);
    dashFilter.anni = [String(py)]; dashFilter.mesi = [String(pmo)];
    banner.style.display='none';
    switchView('dashboard');
  };
  document.getElementById('monthlyBannerDismiss').onclick = ()=>{
    localStorage.setItem(LS_MONTHLY_SEEN, key);
    banner.style.display='none';
  };
}

/* ==================== INIT ==================== */
function init(){
  loadDB();
  refreshEtichetteDatalist();
  advanceAutoRenewals();
  gdriveInitOnLoad();
  initDashDefaultPeriod();
  applyTheme(currentTheme());
  applyPrivacy(privacyOn());
  setSidebarCollapsed(sidebarCollapsedPref());
  checkBackupBanner();
  checkMonthlyBanner();

  // Fix grafici mobile: resize esplicito al caricamento e ad ogni resize finestra/orientamento
  window.addEventListener('resize', ()=>{
    Object.keys(charts).forEach(k=>{ if(charts[k]) charts[k].resize(); });
  });
  window.addEventListener('load', ()=>{
    setTimeout(()=>{ Object.keys(charts).forEach(k=>{ if(charts[k]) charts[k].resize(); }); }, 60);
  });

  document.querySelectorAll('.nav-item').forEach(item=>{
    item.onclick = ()=>switchView(item.dataset.view);
  });
  updateNavBadges();
  updateMobileTopbarForView(currentView);
  document.getElementById('sidebarEdgeToggle').onclick = ()=>{
    setSidebarCollapsed(!document.getElementById('sidebar').classList.contains('collapsed'));
  };
  document.getElementById('sidebarThemeBtn').onclick = toggleThemeQuick;
  document.getElementById('mobileSettingsBtn').onclick = (e)=>{
    // Piccolo dettaglio giocoso: l'ingranaggio ruota di uno scatto prima di aprire Impostazioni,
    // invece di un'apertura secca.
    const icon = e.currentTarget.querySelector('svg');
    if(icon){ icon.style.transition = 'transform .35s cubic-bezier(.34,1.4,.64,1)'; icon.style.transform = 'rotate(120deg)'; }
    setTimeout(()=>{ switchView('impostazioni'); if(icon){ icon.style.transform=''; } }, 150);
  };
  document.getElementById('sidebarPrivacyBtn').onclick = togglePrivacyQuick;
  document.getElementById('sidebarCalcBtn').onclick = openCalculatorModal;
  document.getElementById('overlay').onclick = closeSidebarMobile;
  let backdropMouseDownOnSelf = false;
  document.getElementById('modalBackdrop').addEventListener('mousedown', (e)=>{
    backdropMouseDownOnSelf = (e.target.id==='modalBackdrop');
  });
  document.getElementById('modalBackdrop').addEventListener('mouseup', (e)=>{
    if(backdropMouseDownOnSelf && e.target.id==='modalBackdrop'){
      if(importSessionActive && isImportModalVisible()) minimizeImportModal();
      else closeModal();
    }
    backdropMouseDownOnSelf = false;
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(importSessionActive && isImportModalVisible()) minimizeImportModal();
      else closeModal();
    }
  });
  document.getElementById('importMinBadge').onclick = resumeImportModal;

  switchView('dashboard');
}
document.addEventListener('DOMContentLoaded', init);

<script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(!reg) return;
      // Se un aggiornamento era già stato scaricato (es. in una sessione precedente) e sta solo
      // aspettando di attivarsi, lo segnaliamo subito.
      if(reg.waiting && navigator.serviceWorker.controller) showPwaUpdateBanner(reg);
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', ()=>{
          // "installed" + un controller già attivo = non è la prima installazione ma un
          // aggiornamento di una versione già in uso: è qui che ha senso avvisare l'utente.
          if(newWorker.state==='installed' && navigator.serviceWorker.controller){
            showPwaUpdateBanner(reg);
          }
        });
      });
    }).catch(()=>{});
    let pwaReloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(pwaReloading) return;
      pwaReloading = true;
      window.location.reload();
    });
  });
}
function showPwaUpdateBanner(reg){
  if(document.getElementById('pwaUpdateBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'pwaUpdateBanner';
  banner.className = 'pwa-update-banner';
  banner.innerHTML = `<span>${ico('rotateCcw',15)} È disponibile una nuova versione dell'app</span><button class="btn btn-sm btn-primary" id="pwaUpdateBtn" type="button">Aggiorna</button>`;
  document.body.appendChild(banner);
  requestAnimationFrame(()=>banner.classList.add('show'));
  document.getElementById('pwaUpdateBtn').onclick = ()=>{
    // Se il service worker in sw.js ascolta questo messaggio per saltare l'attesa, l'aggiornamento
    // si attiva subito (e il listener su controllerchange sopra ricarica la pagina in automatico);
    // altrimenti, come rete di sicurezza, ricarichiamo comunque dopo un istante.
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    setTimeout(()=>window.location.reload(), 400);
  };
}
</script>
