/* ==================== CONFRONTO PERIODI ==================== */
function periodLabel(p){ return p.mese ? `${monthName(parseInt(p.mese,10)).slice(0,3)} ${p.anno}` : p.anno; }
function periodMatches(m, p){
  if(!m.data) return false;
  const y = m.data.slice(0,4);
  if(p.mese) return y===p.anno && String(parseInt(m.data.slice(5,7),10))===String(p.mese);
  return y===p.anno;
}
function computePeriodStats(p){
  const list = movimentiForTotals(DB.movimenti).filter(m=>periodMatches(m,p));
  let entrate=0, uscite=0;
  const cats = {};
  const monthly = p.mese ? null : Array.from({length:12},()=>0);
  list.forEach(m=>{
    entrate += m.entrate||0; uscite += m.uscite||0;
    const cat = m.categoria || '—';
    cats[cat] = cats[cat] || { entrate:0, uscite:0, sub:{} };
    cats[cat].entrate += m.entrate||0; cats[cat].uscite += m.uscite||0;
    const subKey = m.descrizione || '—';
    cats[cat].sub[subKey] = cats[cat].sub[subKey] || { entrate:0, uscite:0 };
    cats[cat].sub[subKey].entrate += m.entrate||0; cats[cat].sub[subKey].uscite += m.uscite||0;
    if(monthly){ monthly[parseInt(m.data.slice(5,7),10)-1] += (m.uscite||0); }
  });
  return { entrate, uscite, saldo:entrate-uscite, cats, monthly };
}
function compareDeltaHtml(first, last, invert){
  const diff = last-first;
  if(Math.abs(diff)<0.005 && Math.abs(first)<0.005 && Math.abs(last)<0.005) return '';
  const pct = Math.abs(first)>0.005 ? (diff/Math.abs(first))*100 : (Math.abs(last)>0.005 ? 100 : 0);
  const up = diff>0.005, down = diff<-0.005;
  const good = invert ? !up : up;
  const cls = (!up && !down) ? 'even' : (good?'pos':'neg');
  const arrow = (!up && !down) ? '→' : (up?'▲':'▼');
  return `<span class="compare-delta ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
}
function initCompareDefaults(){
  const years = getYears();
  if(!years.length){ compareState.periods = []; return; }
  const latest = DB.movimenti.reduce((acc,m)=> (m.data && (!acc||m.data>acc)) ? m.data : acc, null);
  const latestYear = latest ? latest.slice(0,4) : years[0];
  const latestMonth = latest ? String(parseInt(latest.slice(5,7),10)) : '1';
  if(compareState.granularity==='annuale'){
    const idx = years.indexOf(latestYear);
    const prevYear = years[idx+1] || latestYear;
    compareState.periods = prevYear===latestYear ? [{anno:latestYear}] : [{anno:prevYear},{anno:latestYear}];
  } else {
    let py = parseInt(latestYear,10), pm = parseInt(latestMonth,10)-1;
    if(pm<1){ pm=12; py-=1; }
    compareState.periods = [{anno:String(py), mese:String(pm)}, {anno:latestYear, mese:latestMonth}];
  }
}
function addComparePeriod(){
  if(compareState.periods.length>=4) return;
  const years = getYears();
  const latest = DB.movimenti.reduce((acc,m)=> (m.data && (!acc||m.data>acc)) ? m.data : acc, null);
  const y = latest ? latest.slice(0,4) : (years[0]||String(new Date().getFullYear()));
  const m = latest ? String(parseInt(latest.slice(5,7),10)) : '1';
  compareState.periods.push(compareState.granularity==='annuale' ? {anno:y} : {anno:y, mese:m});
  renderConfrontoBody();
}
function removeComparePeriod(idx){
  if(compareState.periods.length<=2) return;
  compareState.periods.splice(idx,1);
  renderConfrontoBody();
}
function renderPeriodPicker(p, i){
  const years = getYears();
  const hex = COMPARE_COLOR_HEX[COMPARE_COLORS[i]];
  return `<div class="cmp-period-chip" style="--chip-color:${hex};">
    <span class="cmp-period-dot"></span>
    <select class="cpYear" data-idx="${i}">${years.map(y=>`<option value="${y}" ${p.anno===y?'selected':''}>${y}</option>`).join('')}</select>
    ${compareState.granularity==='mensile' ? `<select class="cpMonth" data-idx="${i}">${Array.from({length:12},(_,m)=>m+1).map(m=>`<option value="${m}" ${String(p.mese)===String(m)?'selected':''}>${monthName(m)}</option>`).join('')}</select>` : ''}
    ${compareState.periods.length>2 ? `<button type="button" class="cp-remove" data-idx="${i}" title="Rimuovi periodo">${ico('x',12)}</button>` : ''}
  </div>`;
}
function renderConfrontoBody(){
  const el = document.getElementById('ricercaBody');
  if(!compareState.periods.length) initCompareDefaults();
  if(!compareState.periods.length){
    el.innerHTML = `<div class="empty-state"><div class="ic">${ico('activity')}</div>Nessun movimento disponibile da confrontare.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="card cmp-controls" style="margin-bottom:20px;">
      <div class="time-selector-row">
        <span class="time-selector-label">Vista</span>
        <div class="pill-group" id="compareGranPills">
          <button type="button" class="pill ${compareState.granularity==='mensile'?'active':''}" data-gran="mensile">Mensile</button>
          <button type="button" class="pill ${compareState.granularity==='annuale'?'active':''}" data-gran="annuale">Annuale</button>
        </div>
      </div>
      <div class="cmp-periods" id="comparePeriodsRow">
        ${compareState.periods.map((p,i)=>renderPeriodPicker(p,i)).join('')}
        ${compareState.periods.length<4 ? `<button type="button" class="cmp-add-btn" id="btnAddPeriod">${ico('flag',13)} Aggiungi periodo</button>` : ''}
      </div>
    </div>
    <div id="compareResults"></div>
  `;
  document.getElementById('compareGranPills').querySelectorAll('.pill').forEach(pl=>{
    pl.onclick = ()=>{ compareState.granularity = pl.dataset.gran; initCompareDefaults(); renderConfrontoBody(); };
  });
  document.querySelectorAll('.cpYear').forEach(s=>{ s.onchange = ()=>{ compareState.periods[+s.dataset.idx].anno = s.value; renderConfrontoResults(); }; });
  document.querySelectorAll('.cpMonth').forEach(s=>{ s.onchange = ()=>{ compareState.periods[+s.dataset.idx].mese = s.value; renderConfrontoResults(); }; });
  document.querySelectorAll('.cp-remove').forEach(b=>{ b.onclick = ()=> removeComparePeriod(+b.dataset.idx); });
  const addBtn = document.getElementById('btnAddPeriod'); if(addBtn) addBtn.onclick = addComparePeriod;
  renderConfrontoResults();
}
let compareChartView = 'categoria';
let compareShowAllCats = false; // mostra solo le prime categorie finché non richiesto
const COMPARE_DETAIL_DEFAULT_LIMIT = 6;
/* Frase riassuntiva in cima al Confronto: confronta il primo e l'ultimo periodo selezionato,
   invece di lasciare all'utente il compito di leggere la matrice di numeri e fare il calcolo a mente. */
function compareInsightSentence(stats, periods){
  const first = stats[0], last = stats[stats.length-1];
  const fLabel = esc(periodLabel(periods[0])), lLabel = esc(periodLabel(periods[periods.length-1]));
  const diff = last.uscite - first.uscite;
  if(stats.length<2 || Math.abs(diff)<0.5){
    return `A <b>${lLabel}</b> hai speso circa quanto a <b>${fLabel}</b>.`;
  }
  const pct = Math.abs(first.uscite)>0.005 ? Math.abs(diff/first.uscite*100) : 100;
  const verbo = diff>0 ? 'in più' : 'in meno';
  const cls = diff>0 ? 'neg' : 'pos';
  return `A <b>${lLabel}</b> hai speso <span class="${cls}" style="font-weight:700;">${fmtEUR(Math.abs(diff))} ${verbo}</span> rispetto a <b>${fLabel}</b> (${pct.toFixed(0)}%).`;
}
function renderConfrontoResults(){
  const container = document.getElementById('compareResults');
  const periods = compareState.periods;
  const stats = periods.map(p=>computePeriodStats(p));
  const last = stats.length-1;
  const annuale = periods.every(p=>!p.mese);
  if(!annuale) compareChartView = 'categoria';

  const catTotals = {};
  stats.forEach(s=>Object.keys(s.cats).forEach(c=>{ catTotals[c] = (catTotals[c]||0) + s.cats[c].uscite; }));
  const allCatLabels = Object.keys(catTotals).filter(c=>catTotals[c]>0.005).sort((a,b)=>catTotals[b]-catTotals[a]);
  const catLabels = compareShowAllCats ? allCatLabels : allCatLabels.slice(0, COMPARE_DETAIL_DEFAULT_LIMIT);

  const kpiCardsHtml = stats.map((s,i)=>{
    const hex = COMPARE_COLOR_HEX[COMPARE_COLORS[i]];
    return `<div class="cmp-kpi-card" style="--chip-color:${hex};">
      <div class="cmp-kpi-label"><span class="cmp-period-dot"></span>${esc(periodLabel(periods[i]))}</div>
      <div class="cmp-kpi-row"><span>Entrate</span><span class="mono pos">${fmtEUR(s.entrate)}</span></div>
      <div class="cmp-kpi-row"><span>Uscite</span><span class="mono neg">${fmtEUR(s.uscite)}</span></div>
      <div class="cmp-kpi-row saldo"><span>Saldo</span><span class="mono ${saldoClass(s.saldo)}">${fmtEUR(s.saldo)}</span></div>
      ${i>0 ? `<div class="cmp-kpi-delta">${compareDeltaHtml(stats[0].uscite, s.uscite, true)} vs ${esc(periodLabel(periods[0]))}</div>` : ''}
    </div>`;
  }).join('');

  let html = `<div class="card compare-summary" style="margin-bottom:20px;">
    <div class="cmp-insight">${compareInsightSentence(stats, periods)}</div>
    <div class="cmp-kpi-grid">${kpiCardsHtml}</div>
  </div>`;

  html += `<div class="card cmp-detail-card">
    <div class="cmp-chart-head">
      <div class="section-label" style="margin:0;">${compareChartView==='categoria' ? 'Confronto per categoria' : 'Andamento mensile'}</div>
      ${annuale ? `<div class="pill-group" id="compareChartTogglePills">
        <button type="button" class="pill ${compareChartView==='categoria'?'active':''}" data-view="categoria">Per categoria</button>
        <button type="button" class="pill ${compareChartView==='stagionalita'?'active':''}" data-view="stagionalita">Stagionalità</button>
      </div>` : ''}
    </div>`;

  if(compareChartView==='categoria'){
    // Elenco categorie con barre comparative inline (una per periodo, scala propria della categoria
    // così ogni riga resta leggibile anche se una categoria pesa molto meno di un'altra) — sostituisce
    // sia il vecchio grafico a barre sia la tabella dettaglio nascosta: un'unica vista, non due.
    html += `<div class="cmp-legend">${periods.map((p,i)=>`
      <span class="cmp-legend-item"><span class="cmp-legend-dot" style="background:${COMPARE_COLOR_HEX[COMPARE_COLORS[i]]};"></span>${esc(periodLabel(p))}</span>
    `).join('')}</div>`;

    function catBarsHtml(vals, max){
      return vals.map((v,i)=>`<div class="cmp-cat-bar-row">
        <span class="cmp-cat-bar-track"><span class="cmp-cat-bar-fill" style="width:${max>0?Math.min(100,(v/max)*100):0}%;background:${COMPARE_COLOR_HEX[COMPARE_COLORS[i]]};"></span></span>
        <span class="cmp-cat-bar-val mono">${v>0.005?fmtEUR(v):'—'}</span>
      </div>`).join('');
    }

    const catRows = catLabels.map(cat=>{
      const catVals = stats.map(s=> s.cats[cat] ? s.cats[cat].uscite : 0);
      const catMax = Math.max(0.01, ...catVals);
      const subKeys = new Set();
      stats.forEach(s=>{ if(s.cats[cat]) Object.keys(s.cats[cat].sub).forEach(sk=>subKeys.add(sk)); });
      const subList = Array.from(subKeys)
        .map(sub=>({ sub, vals: stats.map(s=> (s.cats[cat] && s.cats[cat].sub[sub]) ? s.cats[cat].sub[sub].uscite : 0) }))
        .filter(x=>Math.max(...x.vals)>0.005)
        .sort((a,b)=> Math.max(...b.vals) - Math.max(...a.vals));
      const subsHtml = subList.map(({sub,vals})=>{
        const subMax = Math.max(0.01, ...vals);
        return `<div class="cmp-sub-item">
          <span class="cmp-sub-name">${esc(sub)}</span>
          ${catBarsHtml(vals, subMax)}
        </div>`;
      }).join('');
      return `<div class="cmp-cat-item">
        <div class="cmp-cat-head">
          <span class="cdt-chevron">▶</span>
          <span class="cmp-cat-dot" style="background:${categoryColor(cat)};"></span>
          <span class="cmp-cat-name">${esc(cat)}</span>
          ${compareDeltaHtml(catVals[0], catVals[last], true)}
        </div>
        <div class="cmp-cat-body">
          <div class="cmp-cat-bars">${catBarsHtml(catVals, catMax)}</div>
          ${subsHtml ? `<div class="cmp-sub-list">${subsHtml}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    html += `<div class="cmp-cat-list">
      ${catRows || `<div class="empty-state" style="padding:20px;">Nessuna spesa nei periodi selezionati</div>`}
    </div>
    <div class="cmp-cat-list-foot">
      ${catLabels.length ? `<button type="button" class="link-btn" id="btnToggleAllCompareRows" data-state="collapsed">Espandi tutto</button>` : ''}
      ${!compareShowAllCats && allCatLabels.length>catLabels.length ? `<button type="button" class="link-btn" id="btnShowAllCompareCats">Mostra tutte le categorie (${allCatLabels.length})</button>` : ''}
    </div>`;
  } else {
    html += `<div class="chart-wrap"><canvas id="chartCompareMain"></canvas></div>`;
  }

  html += `</div>`;
  container.innerHTML = html;

  container.querySelectorAll('.cmp-cat-head').forEach(h=>h.onclick = ()=>h.closest('.cmp-cat-item').classList.toggle('open'));
  const toggleAllBtn = document.getElementById('btnToggleAllCompareRows');
  if(toggleAllBtn) toggleAllBtn.onclick = ()=>{
    const expand = toggleAllBtn.dataset.state==='collapsed';
    container.querySelectorAll('.cmp-cat-item').forEach(it=>it.classList.toggle('open', expand));
    toggleAllBtn.dataset.state = expand ? 'expanded' : 'collapsed';
    toggleAllBtn.textContent = expand ? 'Comprimi tutto' : 'Espandi tutto';
  };
  const showAllBtn = document.getElementById('btnShowAllCompareCats');
  if(showAllBtn) showAllBtn.onclick = ()=>{ compareShowAllCats = true; renderConfrontoResults(); };
  const toggleWrap = document.getElementById('compareChartTogglePills');
  if(toggleWrap) toggleWrap.querySelectorAll('.pill').forEach(pl=>{
    pl.onclick = ()=>{ compareChartView = pl.dataset.view; renderConfrontoResults(); };
  });

  if(compareChartView!=='categoria'){
    const isDark = currentTheme()!=='light';
    const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
    const textColor = isDark ? '#93A3AA' : '#5C6B72';
    if(charts.compareMain) charts.compareMain.destroy();
    const ctx = document.getElementById('chartCompareMain');
    const monthLabels = Array.from({length:12},(_,m)=>monthName(m+1).slice(0,3));
    charts.compareMain = new Chart(ctx, {
      type:'line',
      data:{ labels:monthLabels, datasets: stats.map((s,i)=>({
        label: periodLabel(periods[i]),
        data: s.monthly,
        borderColor: COMPARE_COLOR_HEX[COMPARE_COLORS[i]],
        backgroundColor: COMPARE_COLOR_HEX[COMPARE_COLORS[i]],
        tension:0.35, borderWidth:2.5, pointRadius:2.5, pointHoverRadius:5, fill:false
      })) },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{color:textColor, font:{family:'Inter',size:11}, boxWidth:9}, position:'top', align:'end' } },
        scales:{
          x:{ grid:{display:false}, ticks:{color:textColor,font:{size:11}} },
          y:{ grid:{color:gridColor}, ticks:{color:textColor,font:{size:11}, callback:v=>'€'+v} }
        }
      }
    });
  } else if(charts.compareMain){
    charts.compareMain.destroy();
    charts.compareMain = null;
  }
}

let searchMovPageSize = 100;
let searchMovVisibleCount = 100;
function doSearch(keepSelection, keepPage){
  if(!keepSelection){ searchSelected.clear(); searchMovSelCtx.active=false; searchMovSelCtx.selected.clear(); }
  if(!keepPage) searchMovVisibleCount = searchMovPageSize;
  const results = document.getElementById('searchResults');
  const statsBox = document.getElementById('searchStats');
  if(!hasActiveSearchFilters()){
    statsBox.innerHTML = '';
    results.innerHTML = `<div class="empty-state"><div class="ic">${ico('search')}</div>Scegli uno o più filtri qui sopra per iniziare a esplorare i tuoi dati.</div>`;
    return;
  }
  const { movMatches, subMatches, autoMatches } = computeSearchMatches();

  // Statistiche in tempo reale sui movimenti trovati
  const movEntrate = movimentiForTotals(movMatches).reduce((s,m)=>s+(m.entrate||0),0);
  const movUscite = movimentiForTotals(movMatches).reduce((s,m)=>s+(m.uscite||0),0);

      const fonteIcon = movimentoMetodoIconHtml(m);

        <td class="src-col">${fonteIcon}</td>
        <td>${fmtDate(m.data)}</td>
        <td>${categoryLabelAvatarHtml(m.categoria)}</td>
        <td class="desc-cell">${esc(m.descrizione||'—')}${m.note?' · <span style="color:var(--text-faint)">'+esc(m.note)+'</span>':''}${m.etichette && m.etichette.length ? `<span class="etichette-row">${m.etichette.map(t=>etichettaChipHtml(t,{small:true,clickable:true})).join('')}</span>` : ''}${rimborsoLinkBtnHtml(m, {compact:true})}</td>
        <td class="num amt ${m.entrate?'pos':'neg'}">${fmtEUR(m.entrate||m.uscite)}</td>
        <td><div class="row-actions">

        </div></td>
      </tr>`;
    });
    html += `</tbody></table></div>
    <div class="mov-day-list">${dayGroupsHtml(movMatches.slice(0,searchMovVisibleCount), {kebabCls:'searchMovKebab'})}</div>
    ${movMatches.length>searchMovVisibleCount ? `<button class="btn btn-block" id="btnSearchLoadMore" style="margin-top:10px;">Carica altri (${Math.min(searchMovPageSize, movMatches.length-searchMovVisibleCount)} di ${movMatches.length-searchMovVisibleCount} rimanenti)</button>` : ''}
    </div>`;
  }
  if(subMatches.length){
    html += `<div class="section-label">Abbonamenti (${subMatches.length})</div><div class="card list-card"><div class="table-scroll"><table class="search-res-table search-res-sub">

        <td><div class="row-actions" style="opacity:1; pointer-events:auto;">
          <button class="btn btn-icon btn-sm editSearchSub" data-id="${a.id}" title="Modifica">${ico('edit')}</button>

      </tr>`;

  }
  if(autoMatches.length){
    html += `<div class="section-label">Manutenzione Auto (${autoMatches.length})</div><div class="card list-card"><div class="table-scroll"><table class="search-res-table search-res-auto">

      html += `<tr data-id="${x.id}">
        <td class="check-col"><label class="sel-check"><input type="checkbox" class="searchCheck" data-key="man:${x.id}" ${searchSelected.has('man:'+x.id)?'checked':''}></label></td>

    });
    html += `</tbody></table></div></div>`;
  }
  results.innerHTML = html;
  wireSearchRowActions();
}
/* Selezione a tocco prolungato per l'elenco Movimenti dentro Ricerca (stesso sistema generico
   usato da Resoconto Etichetta e Cronologia Metodo). Pillola nell'header persistente, come Movimenti. */
const searchMovSelCtx = { selected:new Set(), active:false };
function renderSearchMovSelPill(){
  if(currentView!=='ricerca' || !searchMovSelCtx.active){ if(currentView==='ricerca') setMobileTopbarActions(null); return; }
  const n = searchMovSelCtx.selected.size;
  const html = `
    <span class="mobile-topbar-count">${n} selezionat${n===1?'o':'i'}</span>
    <button type="button" class="mobile-topbar-btn" id="searchSelDeselectAll" title="Deseleziona tutto">${ico('xCircle',18)}</button>
    <button type="button" class="mobile-topbar-btn" id="searchSelMenuBtn" title="Altre azioni">${ico('moreVertical',18)}</button>
  `;
  setMobileTopbarActions(html, ()=>{
    document.getElementById('searchSelDeselectAll').onclick = ()=>daySelExit(searchMovSelCfg);
    document.getElementById('searchSelMenuBtn').onclick = ()=>openDaySelMenu(document.getElementById('searchSelMenuBtn'), searchMovSelCfg);
  });
}
const searchMovSelCfg = {
  ctx: searchMovSelCtx,
  get container(){ return document.getElementById('searchResults'); },
  renderPill: renderSearchMovSelPill,
  onEdit: id=>openMovModal(id),
  refresh: ()=>doSearch()
};
function wireSearchRowActions(){
  const btnLoadMore = document.getElementById('btnSearchLoadMore');
  if(btnLoadMore) btnLoadMore.onclick = ()=>{ searchMovVisibleCount += searchMovPageSize; doSearch(true, true); };
  document.querySelectorAll('#searchResults .search-res-table tr[data-id]').forEach(row=>{
    row.onclick = (e)=>{
      if(e.target.closest('.sel-check, .row-actions, .etichetta-chip-click, [data-src-history]')) return;
      const willExpand = !row.classList.contains('row-expanded');
      row.classList.toggle('row-expanded');
      if(willExpand) suppressGhostClick(row.querySelector('.row-actions'));
    };
  });
  document.querySelectorAll('.searchCheck').forEach(cb=>cb.onchange = ()=>{
    const key = cb.dataset.key;
    if(cb.checked) searchSelected.add(key); else searchSelected.delete(key);
    updateSearchBulkBar();
  });
  document.querySelectorAll('#searchResults .etichetta-chip-click').forEach(c=>c.onclick = (e)=>{
    e.stopPropagation();
    openEtichettaReportModal(c.dataset.etichetta);
  });
  document.querySelectorAll('#searchResults [data-src-history]').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    openSourceHistoryModal(b.dataset.srcHistory);
  });
  document.querySelectorAll('.searchMovKebab').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    openKebabMenu(b, movRowKebabItems({
      onView: ()=>goToMovimento(b.dataset.id),
      onEdit: ()=>openMovModal(b.dataset.id),
      onDuplicate: ()=>duplicaMovimento(b.dataset.id, ()=>doSearch()),
      onDelete: ()=>removeByIdWithUndo(DB.movimenti, b.dataset.id, 'Movimento eliminato', ()=>doSearch())
    }));
  });
  document.querySelectorAll('.editSearchSub').forEach(b=>b.onclick = ()=>openSubModal(b.dataset.id));
  document.querySelectorAll('.delSearchSub').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.abbonamenti, b.dataset.id, 'Abbonamento eliminato', ()=>doSearch());
  });
  document.querySelectorAll('.editSearchMan').forEach(b=>b.onclick = ()=>openManutModal(b.dataset.id));
  document.querySelectorAll('.delSearchMan').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.auto.manutenzione, b.dataset.id, 'Intervento eliminato', ()=>doSearch());
  });
  const bulkBtn = document.getElementById('searchBulkDeleteBtn');
  const cancelBtn = document.getElementById('searchBulkCancelBtn');
  const selectAllBtn = document.getElementById('searchSelectAllBtn');
  const tagBtn = document.getElementById('searchBulkTagBtn');
  const metodoBtn = document.getElementById('searchBulkMetodoBtn');
  const campiBtn = document.getElementById('searchBulkCampiBtn');
  if(selectAllBtn) selectAllBtn.onclick = ()=>{
    const allKeys = Array.from(document.querySelectorAll('.searchCheck')).map(cb=>cb.dataset.key);
    const allSelected = allKeys.length>0 && allKeys.every(k=>searchSelected.has(k));
    if(allSelected){ searchSelected.clear(); } else { allKeys.forEach(k=>searchSelected.add(k)); }
    doSearch(true);
  };
  if(tagBtn) tagBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds = Array.from(searchSelected).filter(k=>k.startsWith('mov:')).map(k=>k.slice(4));
    if(!movIds.length){ toast('Nessun movimento tra i selezionati (le etichette si applicano solo ai movimenti)'); return; }
    openBulkEtichettaModal(movIds, doSearch, ()=>searchSelected.clear());
  };
  if(metodoBtn) metodoBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds = Array.from(searchSelected).filter(k=>k.startsWith('mov:')).map(k=>k.slice(4));
    const subIds = Array.from(searchSelected).filter(k=>k.startsWith('sub:')).map(k=>k.slice(4));
    if(!movIds.length && !subIds.length){ toast('Nessun movimento o abbonamento tra i selezionati'); return; }
    openBulkMetodoModal(movIds.length+subIds.length, metodo=>{
      let n = 0;
      DB.movimenti.forEach(m=>{ if(movIds.includes(m.id)){ m.metodoPagamento = metodo; n++; } });
      DB.abbonamenti.forEach(a=>{ if(subIds.includes(a.id)){ a.metodoPagamento = metodo; n++; } });
      return n;
    }, doSearch, ()=>searchSelected.clear());
  };
  if(campiBtn) campiBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds = Array.from(searchSelected).filter(k=>k.startsWith('mov:')).map(k=>k.slice(4));
    if(!movIds.length){ toast('Nessun movimento tra i selezionati (categoria/dettaglio/note si applicano solo ai movimenti)'); return; }
    openBulkCampiModal(movIds, doSearch, ()=>searchSelected.clear());
  };
  if(cancelBtn) cancelBtn.onclick = ()=>{
    searchSelected.clear();
    document.querySelectorAll('.searchCheck').forEach(cb=>cb.checked=false);
    updateSearchBulkBar();
  };
  if(bulkBtn) bulkBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds=[], subIds=[], manIds=[];
    searchSelected.forEach(k=>{
      const idx = k.indexOf(':');
      const type = k.slice(0,idx), id = k.slice(idx+1);
      if(type==='mov') movIds.push(id);
      else if(type==='sub') subIds.push(id);
      else if(type==='man') manIds.push(id);
    });
    const n = searchSelected.size;
    searchSelected.clear();
    const removedMov = movIds.length ? DB.movimenti.filter(m=>movIds.includes(m.id)) : [];
    const removedSub = subIds.length ? DB.abbonamenti.filter(a=>subIds.includes(a.id)) : [];
    const removedMan = manIds.length ? DB.auto.manutenzione.filter(x=>manIds.includes(x.id)) : [];
    if(movIds.length){ const kept = DB.movimenti.filter(m=>!movIds.includes(m.id)); DB.movimenti.length=0; DB.movimenti.push(...kept); }
    if(subIds.length){ const kept = DB.abbonamenti.filter(a=>!subIds.includes(a.id)); DB.abbonamenti.length=0; DB.abbonamenti.push(...kept); }
    if(manIds.length){ const kept = DB.auto.manutenzione.filter(x=>!manIds.includes(x.id)); DB.auto.manutenzione.length=0; DB.auto.manutenzione.push(...kept); }
    saveDB(); doSearch();
    toastUndo(`${n} elementi eliminati`, ()=>{
      DB.movimenti.push(...removedMov);
      DB.abbonamenti.push(...removedSub);
      DB.auto.manutenzione.push(...removedMan);
      saveDB(); toast('Ripristinati'); doSearch();
    });
  };
  updateSearchBulkBar();
  wireDaySelectable(searchMovSelCfg);
  renderSearchMovSelPill();
}

/* ==================== ABBONAMENTI ==================== */
let subViewMode = 'grid';
let subSortMode = 'categoria'; // 'scadenza' | 'prezzo' | 'categoria'
let subPrevTotals = null; // {mensile, annuale} — usati per animare i KPI da un render all'altro

function sortSubscriptions(list, mode){
  const arr = [...list];
  const byStatoScadenza = (a,b)=>{
    if((a.stato==='Attivo')!==(b.stato==='Attivo')) return a.stato==='Attivo'?-1:1;
    return (a.scadenza||'9999').localeCompare(b.scadenza||'9999');
  };
  if(mode==='prezzo'){
    arr.sort((a,b)=> (b.costoMensile||0) - (a.costoMensile||0));
  } else if(mode==='categoria'){
    const catOrder = DB.categorieAbbonamenti;
    arr.sort((a,b)=>{
      const ia = catOrder.indexOf(a.categoriaAbb), ib = catOrder.indexOf(b.categoriaAbb);
      const na = ia===-1?999:ia, nb = ib===-1?999:ib;
      if(na!==nb) return na-nb;
      return byStatoScadenza(a,b);
    });
  } else {
    arr.sort(byStatoScadenza);
  }
  return arr;
}
function renderAbbonamenti(){
  const el = document.getElementById('view-abbonamenti');
  // Solo gli abbonamenti con stato "Attivo" concorrono ai totali mensile/annuale.
  const attivi = DB.abbonamenti.filter(a=>a.stato==='Attivo');
  const totMensile = attivi.reduce((s,a)=>s+(a.costoMensile||0),0);
  const totAnnuale = totMensile*12;
  el.innerHTML = `
    <div class="topbar">
      <div><div class="page-title">Abbonamenti</div><div class="page-sub">${attivi.length} abbonamenti attivi su ${DB.abbonamenti.length} totali</div></div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <div class="view-toggle sortToggle">
          <button data-sort="categoria" class="${subSortMode==='categoria'?'active':''}">Categoria</button>
          <button data-sort="scadenza" class="${subSortMode==='scadenza'?'active':''}">Scadenza</button>
          <button data-sort="prezzo" class="${subSortMode==='prezzo'?'active':''}">Prezzo</button>
        </div>
        <button class="btn btn-primary" id="btnNewSub">+ Nuovo abbonamento</button>
      </div>
    </div>
    <div class="sub-toolbar-mobile">
      <div class="view-toggle sortToggle">
        <button data-sort="categoria" class="${subSortMode==='categoria'?'active':''}">Categoria</button>
        <button data-sort="scadenza" class="${subSortMode==='scadenza'?'active':''}">Scadenza</button>
        <button data-sort="prezzo" class="${subSortMode==='prezzo'?'active':''}">Prezzo</button>
      </div>
    </div>
    <div class="grid kpi-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:22px;">
      <div class="kpi-card uscite"><div class="kpi-bar"></div><div class="kpi-label">Spesa mensile ricorrente (attivi)</div><div class="kpi-value" id="kpiSubMensile"></div></div>
      <div class="kpi-card saldo"><div class="kpi-bar"></div><div class="kpi-label">Proiezione annuale (attivi)</div><div class="kpi-value" id="kpiSubAnnuale"></div></div>
    </div>
    <div class="sub-cat-legend" id="subCatLegend" style="${subSortMode==='categoria'?'display:none;':''}">${DB.categorieAbbonamenti.map(c=>`<span class="sub-cat-legend-item"><span class="sub-cat-legend-dot" style="background:${categoriaAbbColor(c)};"></span>${esc(c)}</span>`).join('')}</div>
    <div id="subContainer"></div>
  `;
  animateNumber(document.getElementById('kpiSubMensile'), subPrevTotals?subPrevTotals.mensile:null, totMensile);
  animateNumber(document.getElementById('kpiSubAnnuale'), subPrevTotals?subPrevTotals.annuale:null, totAnnuale);
  subPrevTotals = {mensile:totMensile, annuale:totAnnuale};
  document.getElementById('btnNewSub').onclick = ()=>openSubModal();
  document.querySelectorAll('.sortToggle button').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.sort===subSortMode) return;
      subSortMode = b.dataset.sort;
      document.querySelectorAll('.sortToggle button').forEach(x=>x.classList.toggle('active', x.dataset.sort===subSortMode));
      const legend = document.getElementById('subCatLegend');
      if(legend) legend.style.display = subSortMode==='categoria' ? 'none' : '';
      renderSubList(true);
    };
  });
  renderSubList(false);
}

/* Renderizza solo il contenuto di #subContainer (tabella o griglia), senza toccare il resto della
   pagina (topbar, KPI, legenda): usata dal cambio di ordinamento per poter animare il riordino delle
   card con la tecnica FLIP (si misura la posizione di ogni card prima e dopo il riordino, e si anima
   la differenza) invece di far scattare tutto istantaneamente in una nuova posizione. */
function renderSubList(animate){
  const sorted = sortSubscriptions(DB.abbonamenti, subSortMode);
  const container = document.getElementById('subContainer');

  // FLIP step 1 (First): posizioni attuali delle card prima di ricostruire il DOM.
  const oldRects = {};
  if(animate && subViewMode==='grid'){
    container.querySelectorAll('.sub-card[data-id]').forEach(card=>{
      oldRects[card.dataset.id] = card.getBoundingClientRect();
    });
  }

  if(subViewMode==='list'){
    container.innerHTML = `<div class="card list-card"><div class="table-scroll"><table>
      <thead><tr><th></th><th>Servizio</th><th>Stato</th><th>Periodicità</th><th class="num">Costo</th><th class="num">Costo mensile</th><th>Metodo</th><th>Scadenza</th><th></th></tr></thead>
      <tbody>${sorted.map(a=>{
        const periodicita = a.mesi==12 ? 'Annuale' : a.mesi>1 ? a.mesi+' mesi' : a.mesi==1 ? 'Mensile' : '—';
        return `<tr data-id="${a.id}" style="border-left:3px solid ${categoriaAbbColor(a.categoriaAbb)};">
          <td><button class="sub-bell ${subAvvisoOn(a)?'on':''}" data-id="${a.id}" title="${subAvvisoOn(a)?'Notifica scadenza attiva':'Notifica scadenza disattivata'}">${subAvvisoOn(a)?ico('bell'):ico('bellOff')}</button></td>
          <td>${esc(a.servizio)}</td>
          <td>${a.stato==='Attivo'?`${ico('checkCircle')} Attivo`:'⏸ Non attivo'}</td>
          <td>${periodicita}</td>
          <td class="num amt">${a.costo?fmtEUR(a.costo):'—'}</td>
          <td class="num amt">${a.costoMensile?fmtEUR(a.costoMensile):'—'}</td>
          <td>${esc(a.metodoPagamento||'—')}</td>
          <td>${fmtDate(a.scadenza)} ${countdownBadge(a.scadenza)}</td>
          <td><div class="row-actions" style="opacity:1; pointer-events:auto;">
            <button class="btn btn-icon btn-sm editSub" data-id="${a.id}" title="Modifica">${ico('edit')}</button>
            <button class="btn btn-icon btn-sm delSubCard" data-id="${a.id}" title="Elimina">${ico('trash')}</button>
          </div></td>
        </tr>`;
      }).join('') || `<tr><td colspan="9" style="text-align:center;color:var(--text-faint);padding:20px;">Nessun abbonamento registrato</td></tr>`}</tbody>
    </table></div></div>`;
  } else {
    // In ordinamento per categoria, le card restano tutte dirette figlie di #subGrid (stessa griglia
    // CSS): le intestazioni di categoria sono semplicemente elementi che occupano l'intera riga
    // (grid-column:1/-1), non un contenitore separato — questo tiene tutte le .sub-card allo stesso
    // livello, il che è quello che serve alla FLIP per calcolare correttamente gli spostamenti.
    let lastCat = undefined;
    const cardsHtml = sorted.map(a=>{
      let headerHtml = '';
      if(subSortMode==='categoria' && a.categoriaAbb!==lastCat){
        lastCat = a.categoriaAbb;
        const inCat = DB.abbonamenti.filter(x=>x.categoriaAbb===lastCat && x.stato==='Attivo');
        const mensileCat = inCat.reduce((s,x)=>s+(x.costoMensile||0),0);
        headerHtml = `<div class="sub-cat-header">
          <div class="sub-cat-header-name"><span class="sub-cat-dot" style="background:${categoriaAbbColor(lastCat)};"></span>${esc(lastCat||'Senza categoria')}</div>
          <div class="sub-cat-header-tot">${fmtEUR(mensileCat)}/mese · ${fmtEUR(mensileCat*12)}/anno</div>
        </div>`;
      }
      const periodicita = a.mesi==12 ? 'Annuale' : a.mesi>1 ? a.mesi+' mesi' : 'Mensile';
      return headerHtml + `<div class="sub-card ${a.stato!=='Attivo'?'inactive':''}" data-id="${a.id}">
        <div class="sub-card-top">
          <div class="sub-card-name"><span class="sub-cat-dot" style="background:${categoriaAbbColor(a.categoriaAbb)};"></span><span class="sub-name">${esc(a.servizio)}</span></div>
          <div class="row-actions">
            <button class="btn btn-icon btn-sm editSub" data-id="${a.id}" title="Modifica">${ico('edit')}</button>
            <button class="btn btn-icon btn-sm delSubCard" data-id="${a.id}" title="Elimina">${ico('trash')}</button>
          </div>
        </div>
        <div class="sub-meta">${periodicita} · ${esc(a.metodoPagamento||'—')} · ${esc(a.rinnovo||'—')}</div>
        <div class="sub-price">${a.costo?fmtEUR(a.costo):'—'} <small>/ ${a.mesi==12?'anno':'mese'}</small></div>
        <div class="sub-scad-line">
          <span class="sub-scad-left">
            <button class="sub-card-bell ${subAvvisoOn(a)?'on':''}" data-id="${a.id}" title="${subAvvisoOn(a)?'Notifica scadenza attiva':'Notifica scadenza disattivata'}">${subAvvisoOn(a)?ico('bell'):ico('bellOff')}</button>
            Scade il <b>${fmtDate(a.scadenza)}</b>
          </span>
          ${countdownBadge(a.scadenza, a.stato==='Attivo'?'Scadenza non impostata':'Non attivo')}
        </div>
      </div>`;
    }).join('') || `<div class="empty-state">Nessun abbonamento registrato.</div>`;
    container.innerHTML = `<div class="sub-grid" id="subGrid">${cardsHtml}</div>`;

    // FLIP step 2-3 (Last + Invert + Play): per ogni card ancora presente, calcola lo spostamento
    // rispetto alla posizione misurata prima del riordino e lo anima invece di lasciarlo istantaneo.
    if(animate && Object.keys(oldRects).length){
      const newCards = container.querySelectorAll('.sub-card[data-id]');
      newCards.forEach(card=>{
        const old = oldRects[card.dataset.id];
        if(!old) return;
        const now = card.getBoundingClientRect();
        const dx = old.left - now.left, dy = old.top - now.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
        card.style.transition = 'none';
        card.style.transform = `translate(${dx}px,${dy}px)`;
        requestAnimationFrame(()=>{
          card.style.transition = 'transform .32s cubic-bezier(.4,0,.2,1)';
          card.style.transform = '';
        });
      });
    }
  }

  container.querySelectorAll('.sub-bell, .sub-card-bell').forEach(b=>b.onclick = ()=>{
    const a = DB.abbonamenti.find(x=>x.id===b.dataset.id);
    if(!a) return;
    a.avviso = !subAvvisoOn(a);
    saveDB();
    renderSubList(false);
  });
  container.querySelectorAll('.editSub').forEach(b=>b.onclick = ()=>openSubModal(b.dataset.id));
  container.querySelectorAll('.delSubCard').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.abbonamenti, b.dataset.id, 'Abbonamento eliminato', renderAbbonamenti);
  });
  // Su mobile le azioni (modifica/elimina) sono nascoste finché non si tocca la card — stesso
  // pattern usato in Movimenti/Ricerca. Evita di toccare azioni "invisibili" per sbaglio.
  container.querySelectorAll('.sub-card[data-id]').forEach(card=>{
    card.onclick = (e)=>{
      if(e.target.closest('.row-actions, .sub-card-bell')) return;
      const willExpand = !card.classList.contains('expanded');
      card.classList.toggle('expanded');
      if(willExpand) suppressGhostClick(card.querySelector('.row-actions'));
    };
  });
}

function computeAutoSpesePerAnno(){
  const byYear = {};
  movimentiForTotals(DB.movimenti).forEach(m=>{
    if(m.categoria!=='Auto' || !m.data || !m.uscite) return;
    const y = m.data.slice(0,4);
    byYear[y] = (byYear[y]||0) + m.uscite;
  });
  const years = Object.keys(byYear).sort();
  return { years, values: years.map(y=>byYear[y]) };
}

/* ---- Gasolio: statistiche di spesa (totale, medie, andamento mensile, incidenza, costo/km) ----
   range: 'all' | '12m' | '3y' | '5y' — filtra le card KPI e il riepilogo (incidenza + costo/km);
   il grafico mensile resta sempre fisso sugli ultimi 12 mesi, indipendentemente dal periodo scelto. */
function computeGasolioStats(range){
  range = range || 'all';
  const norm = s => (s||'').toString().trim().toLowerCase();
  const refCat = norm(DB.gasolioRef && DB.gasolioRef.categoria);
  const refDet = norm(DB.gasolioRef && DB.gasolioRef.dettaglio);
  const allRows = movimentiForTotals(DB.movimenti).filter(m=>norm(m.categoria)===refCat && norm(m.descrizione)===refDet && m.uscite && m.data);

  // Aggregazione completa (serve al grafico, che resta sempre sugli ultimi 12 mesi) e al calcolo costo/km per anno
  const byMonthAll = {}, byYearAll = {};
  allRows.forEach(m=>{
    const km = m.data.slice(0,7); byMonthAll[km] = (byMonthAll[km]||0)+Number(m.uscite);
    const ky = m.data.slice(0,4); byYearAll[ky] = (byYearAll[ky]||0)+Number(m.uscite);
  });
  const monthKeysAll = Object.keys(byMonthAll).sort();
  const chartMonthKeys = monthKeysAll.slice(-12);

  // Finestra temporale per card KPI + riepilogo
  const now = new Date();
  let cutoffKey = null; // 'YYYY-MM', incluso
  if(range==='12m' || range==='3y' || range==='5y'){
    const monthsBack = range==='12m' ? 11 : range==='3y' ? 35 : 59;
    const d = new Date(now.getFullYear(), now.getMonth()-monthsBack, 1);
    cutoffKey = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }
  const rows = cutoffKey ? allRows.filter(m=>m.data.slice(0,7)>=cutoffKey) : allRows;

  const total = rows.reduce((s,m)=>s+Number(m.uscite),0);
  const count = rows.length;
  const avgFillUp = count ? total/count : 0;

  let avgMonthly = 0, avgYearly = 0;
  if(cutoffKey){
    const windowMonths = range==='12m' ? 12 : range==='3y' ? 36 : 60;
    avgMonthly = total/windowMonths;
    avgYearly = avgMonthly*12;
  } else if(rows.length){
    const mk = Array.from(new Set(rows.map(m=>m.data.slice(0,7)))).sort();
    const first = mk[0], last = mk[mk.length-1];
    const span = (parseInt(last.slice(0,4),10)-parseInt(first.slice(0,4),10))*12 + (parseInt(last.slice(5,7),10)-parseInt(first.slice(5,7),10)) + 1;
    avgMonthly = total/Math.max(1,span);
    avgYearly = avgMonthly*12;
  }

  // Incidenza sul totale Auto, nello stesso periodo selezionato
  const totalAuto = movimentiForTotals(DB.movimenti)
    .filter(m=>norm(m.categoria)===refCat && m.uscite && m.data && (!cutoffKey || m.data.slice(0,7)>=cutoffKey))
    .reduce((s,m)=>s+Number(m.uscite),0);
  const pctOfAuto = totalAuto>0 ? (total/totalAuto*100) : null;

  // Costo indicativo al km: solo sugli anni con lettura km di fine anno registrata,
  // limitati agli ultimi N anni corrispondenti al periodo scelto (i km si registrano una volta l'anno, al 31/12)
  const kmAnni = (DB.auto && DB.auto.kmAnnuali && DB.auto.kmAnnuali.anni) || {};
  let anniConsiderati = Object.keys(kmAnni);
  if(range!=='all'){
    const yearsBack = range==='12m' ? 1 : range==='3y' ? 3 : 5;
    const minYear = now.getFullYear()-yearsBack+1;
    anniConsiderati = anniConsiderati.filter(y=>Number(y)>=minYear);
  }
  let gasolioAnniCompleti = 0, kmAnniCompleti = 0;
  anniConsiderati.forEach(y=>{
    gasolioAnniCompleti += (byYearAll[y]||0);
    kmAnniCompleti += (kmAnni[y].annuali||0);
  });
  const costoKm = kmAnniCompleti>0 ? gasolioAnniCompleti/kmAnniCompleti : null;

  return { total, count, avgFillUp, avgMonthly, avgYearly, pctOfAuto, costoKm, costoKmAnniCount: anniConsiderati.length, chartMonthKeys, byMonth: byMonthAll };
}

/* ---- Link auto: helper per smistare assicurazione/bollo/amazon dagli "altri link" ---- */
function splitAutoLinks(){
  const links = DB.auto.linkUtili || [];
  const norm = s => (s||'').toLowerCase();
  const assic = links.find(l=>norm(l.nome).includes('assicurazion'));
  const bollo = links.find(l=>norm(l.nome).includes('bollo'));
  const amazon = links.find(l=>norm(l.nome).includes('amazon'));
  const used = new Set([assic,bollo,amazon].filter(Boolean).map(l=>l.id));
  const others = links.filter(l=>!used.has(l.id));
  return {assic, bollo, amazon, others};
}
function autoLinkOpenBtn(link){
  return (link && link.url) ? `<a class="sub-bell" href="${esc(linkUtiliHref(link.url))}" target="_blank" rel="noopener" title="${esc(link.nome)}">${ico('link')}</a>` : '';
}
/* Crea/aggiorna/rimuove il link assicurazione/bollo/amazon a partire da un url (usata dalle modali aggregate) */
function setAutoLinkByCategory(cat, url){
  const { assic, bollo, amazon } = splitAutoLinks();
  const existing = cat==='assicurazione' ? assic : cat==='bollo' ? bollo : amazon;
  const defaultNome = cat==='assicurazione' ? 'Assicurazione' : cat==='bollo' ? 'Bollo' : 'Lista Amazon';
  if(!url){
    if(existing){ const idx = DB.auto.linkUtili.findIndex(l=>l.id===existing.id); if(idx!==-1) DB.auto.linkUtili.splice(idx,1); }
    return;
  }
  if(existing) existing.url = url;
  else DB.auto.linkUtili.push({ id: uid('alu'), nome: defaultNome, url });
}

function recomputeKmAnnuali(){
  // 'totali' (km attuali inseriti dall'utente per ciascun anno) è il dato sorgente.
  // 'annuali' = totali dell'anno - totali dell'anno precedente registrato (o Km iniziali se è il primo).
  const anni = DB.auto.kmAnnuali.anni || {};
  const years = Object.keys(anni).map(Number).sort((x,y)=>x-y);
  let prevTotale = DB.auto.kmAnnuali.kmIniziali || 0;
  years.forEach(y=>{
    const rec = anni[String(y)];
    rec.annuali = (rec.totali||0) - prevTotale;
    prevTotale = rec.totali||0;
  });
}

function renderKmSummary(){
  const a = DB.auto;
  const summaryEl = document.getElementById('kmSummary');
  const listEl = document.getElementById('kmYearsList');
  if(!summaryEl || !listEl) return;

  const years = Object.keys(a.kmAnnuali.anni||{}).sort((x,y)=>Number(x)-Number(y));
  const latestYear = years[years.length-1];
  const kmTotaliAttuali = latestYear ? (a.kmAnnuali.anni[latestYear].totali||0) : (a.kmAnnuali.kmIniziali||0);
  const kmFmt = v => fmtKm(v) + ' km';

  summaryEl.innerHTML = `
    <div class="kpi-card">
      <div class="kpi-bar" style="background:var(--blue);"></div>
      <div class="kpi-label">${ico('road')} Km totali percorsi</div>
      <div class="kpi-value" id="kpiKmTotali"></div>
      <div class="kpi-compare">${latestYear ? 'aggiornato al '+esc(latestYear) : 'nessun dato ancora'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-bar" style="background:var(--mint);"></div>
      <div class="kpi-label">${ico('flag')} Km iniziali (acquisto) <button class="btn btn-icon btn-sm editKmIniziali" style="width:22px;height:22px;margin-left:auto;" title="Modifica km iniziali">${ico('edit')}</button></div>
      <div class="kpi-value" id="kpiKmIniziali"></div>
    </div>
  `;
  animateNumber(document.getElementById('kpiKmTotali'), kmPrevTotals?kmPrevTotals.totali:null, kmTotaliAttuali, kmFmt);
  animateNumber(document.getElementById('kpiKmIniziali'), kmPrevTotals?kmPrevTotals.iniziali:null, a.kmAnnuali.kmIniziali, kmFmt);
  kmPrevTotals = {totali:kmTotaliAttuali, iniziali:a.kmAnnuali.kmIniziali};
  summaryEl.querySelector('.editKmIniziali').onclick = openKmInizialiModal;

  if(!years.length){
    listEl.innerHTML = `<div class="empty-state" style="padding:16px 0;">Nessun dato ancora — usa "Registra lettura fine anno" per iniziare a tenere lo storico.</div>`;
    return;
  }
  const maxAnnuali = Math.max(...years.map(y=>a.kmAnnuali.anni[y].annuali||0), 1);
  listEl.innerHTML = years.slice().reverse().map(y=>{
    const rec = a.kmAnnuali.anni[y];
    const pct = Math.max(4, (rec.annuali||0)/maxAnnuali*100);
    return `<div class="km-year-row">
      <span class="km-year-label">${esc(y)}</span>
      <span class="km-year-bar-wrap"><span class="km-year-bar" style="width:${pct}%;"></span></span>
      <span class="km-year-val">${fmtKm(rec.annuali)} km <small>(tot. ${fmtKm(rec.totali)})</small></span>
    </div>`;
  }).join('');
}

function renderAutoLinkUtiliList(){
  const listEl = document.getElementById('autoLinkUtiliList');
  if(!listEl) return;
  const items = DB.auto.linkUtili;
  listEl.innerHTML = items.length ? items.map(l=>`
    <div class="cm-item" data-id="${l.id}" style="cursor:default;">
      <div class="cm-head" style="cursor:default;">
        <span class="cm-name" style="flex:1;">
          <div style="font-weight:600;">${esc(l.nome)}</div>
          <div class="page-sub" style="font-size:11.5px;margin-top:2px;word-break:break-all;">${esc(l.url)}</div>
        </span>
        <div class="row-actions" style="opacity:1; pointer-events:auto;">
          <a class="btn btn-icon btn-sm" href="${esc(linkUtiliHref(l.url))}" target="_blank" rel="noopener" title="Apri">${ico('arrowUpRight')}</a>
          <button class="btn btn-icon btn-sm editAutoLink" data-id="${l.id}" title="Modifica">${ico('edit')}</button>
          <button class="btn btn-icon btn-sm delAutoLink" data-id="${l.id}" title="Elimina">${ico('trash')}</button>
        </div>
      </div>
    </div>`).join('') : `<div class="empty-state" style="padding:16px;">Nessun link salvato. Aggiungine uno qui sotto.</div>`;
  listEl.querySelectorAll('.editAutoLink').forEach(b=>b.onclick = async ()=>{
    const item = DB.auto.linkUtili.find(l=>l.id===b.dataset.id);
    if(!item) return;
    const nuovoNome = await customPrompt('Nome del link:', item.nome);
    if(nuovoNome===null) return;
    const nuovoUrl = await customPrompt('URL:', item.url);
    if(nuovoUrl===null) return;
    if(!nuovoNome.trim() || !nuovoUrl.trim()) return;
    item.nome = nuovoNome.trim(); item.url = nuovoUrl.trim();
    saveDB(); renderAutoLinkUtiliList();
  });
  listEl.querySelectorAll('.delAutoLink').forEach(b=>b.onclick = ()=>{
    const idx = DB.auto.linkUtili.findIndex(l=>l.id===b.dataset.id);
    if(idx===-1) return;
    const removed = DB.auto.linkUtili.splice(idx,1)[0];
    saveDB(); renderAutoLinkUtiliList();
    toastUndo(`Link "${removed.nome}" eliminato`, ()=>{
      DB.auto.linkUtili.splice(idx,0,removed); saveDB(); renderAutoLinkUtiliList();
    });
  });
}

function openScadenzaModal(tipo){

    bollo: { title:'Modifica Bollo', fields:['importo','scadenza'] },
    revisione: { title:'Modifica Revisione', fields:['scadenza'] },
    tagliando: { title:'Modifica Tagliando', fields:['kmProssimo'] }
  }[tipo];
  const obj = a[tipo];
  const fieldHtml = cfg.fields.map(f=>{
    if(f==='compagnia') return `<div class="field"><label>Compagnia</label><input type="text" id="scadCompagnia" value="${esc(obj.compagnia||'')}"></div>`;
    if(f==='importo') return `<div class="field"><label>Importo (€)</label><input type="number" step="0.01" inputmode="decimal" id="scadImporto" value="${obj.importo!==null&&obj.importo!==undefined?obj.importo:''}"></div>`;

  openModal(`
    <div class="modal-head"><h3>${cfg.title}</h3><button class="close-x" id="scClose">${ico('x')}</button></div>
    <div class="modal-body">${fieldHtml}</div>
    <div class="modal-foot"><button class="btn" id="scCancel">Annulla</button><button class="btn btn-primary" id="scSave">Salva</button></div>
  `);
  document.getElementById('scClose').onclick = closeModal;
  document.getElementById('scCancel').onclick = closeModal;

    if(cfg.fields.includes('compagnia')) obj.compagnia = document.getElementById('scadCompagnia').value.trim()||null;
    if(cfg.fields.includes('importo')) obj.importo = parseFloat(document.getElementById('scadImporto').value)||null;

  };

/* ==================== IMPOSTAZIONI ==================== */

/* ---- Pulizia dettagli duplicati: trova descrizioni scritte in modo diverso ma probabilmente uguali ---- */
function normalizeDupKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function findDuplicateDetails(){
  const groups = {};
  DB.movimenti.forEach(m=>{
    if(!m.descrizione) return;
    const norm = normalizeDupKey(m.descrizione);
    if(!norm) return;
    const key = (m.categoria||'')+'|||'+norm;
    groups[key] = groups[key] || { categoria: m.categoria, norm, variants: {} };
    groups[key].variants[m.descrizione] = (groups[key].variants[m.descrizione]||0) + 1;
  });
  return Object.values(groups).filter(g => Object.keys(g.variants).length > 1);
}
function mergeDuplicateVariants(categoria, normKey, keeper){
  let count = 0;
  DB.movimenti.forEach(m=>{
    if((m.categoria||'')===categoria && normalizeDupKey(m.descrizione)===normKey && m.descrizione!==keeper){
      m.descrizione = keeper; count++;
    }
  });
  if(count) saveDB();
  return count;
}
function renderDupCleanupList(){
  const container = document.getElementById('dupCleanupList');
  if(!container) return;
  const groups = findDuplicateDetails();
  if(!groups.length){
    container.innerHTML = `<div class="empty-state" style="padding:14px 0;">Nessun duplicato evidente trovato ${ico('checkCircle')}</div>`;
    return;
  }
  container.innerHTML = groups.map((g,gi)=>{
    const variants = Object.entries(g.variants).sort((a,b)=>b[1]-a[1]);
    const subList = DB.sottocategorie[g.categoria]||[];
    const suggested = variants.find(([t])=>subList.includes(t));
    const defaultKeeper = suggested ? suggested[0] : variants[0][0];
    return `<div class="dup-group" data-idx="${gi}">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;"><b>${esc(g.categoria||'—')}</b> — ${variants.length} varianti trovate, scegli quella da tenere</div>
      <div class="dup-variants" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        ${variants.map(([text,count])=>`<label class="dup-variant-chip">
          <input type="radio" name="dupKeeper${gi}" value="${esc(text)}" ${text===defaultKeeper?'checked':''}>
          <span>"${esc(text)}"</span><span style="color:var(--text-faint);">×${count}</span>
        </label>`).join('')}
      </div>
      <button class="btn btn-sm btn-primary dupMergeBtn" data-idx="${gi}">Unisci in una sola scrittura</button>
    </div>`;
  }).join('');
  container.querySelectorAll('.dupMergeBtn').forEach(btn=>{
    btn.onclick = ()=>{
      const gi = parseInt(btn.dataset.idx,10);
      const g = groups[gi];
      const checked = container.querySelector(`input[name="dupKeeper${gi}"]:checked`);
      if(!checked) return;
      const keeper = checked.value;
      const n = mergeDuplicateVariants(g.categoria, g.norm, keeper);
      toast(`${n} movimenti aggiornati su "${keeper}"`);
      renderDupCleanupList();
    };
  });
}

/* ---- Gestione Categorie & Dettagli: chip a flusso libero + pannello di modifica inline
   (nome, colore, icona, dettagli) al posto della vecchia lista di righe/modale separata. */
let catSettingsTab = 'uscita';
let catExpandedCat = null;
let catReorderMode = false;
let catAddingNew = false;

function renderCategorieModalBody(){

      <div class="page-sub" style="margin-bottom:0;">
        ${catSettingsTab==='uscita' ? 'Categorie di spesa e relativi dettagli.' : 'Categorie di entrata e relativi dettagli ("Stipendio" e "Altre entrate" restano sempre qui).'}
      </div>

        <button id="catTabEntrate" class="${catSettingsTab==='entrata'?'active':''}">${ico('arrowUpRight')} Entrate</button>
      </div>
    </div>

function openCategorieModal(){
  const html = `
    <div class="modal-head"><h3>Categorie &amp; Dettagli</h3><button class="close-x" id="catmClose">${settingsCloseIcon()}</button></div>
    <div class="modal-body">${renderCategorieModalBody()}</div>

  `;
  openSettingsPanel(html);
  document.getElementById('modalBox').classList.add('modal-narrow');
  document.getElementById('modalBox').dataset.kind = 'categorie';
  const close = ()=>{ closeModal(); renderImpostazioni(); };
  document.getElementById('catmClose').onclick = close;
  document.getElementById('catmCloseBtn').onclick = close;

}
function refreshCategorieModal(){
  const box = document.getElementById('modalBox');
  if(box.dataset.kind==='categorie'){
    box.querySelector('.modal-body').innerHTML = renderCategorieModalBody();
    wireCategorieSection();
  } else if(currentView==='impostazioni'){ renderImpostazioni(); }
}

function wireCategorieSection(){
  document.getElementById('catTabUscite').onclick = ()=>{ catSettingsTab='uscita'; catExpandedCat=null; catAddingNew=false; catReorderMode=false; refreshCategorieModal(); };
  document.getElementById('catTabEntrate').onclick = ()=>{ catSettingsTab='entrata'; catExpandedCat=null; catAddingNew=false; catReorderMode=false; refreshCategorieModal(); };
  renderCatCardList();
}

function renderCatCardList(){
  const list = catSettingsTab==='uscita' ? DB.categorieUscite : DB.categorieEntrate;
  const listEl = document.getElementById('catCardList');
  const toolbar = list.length>1 ? `<div class="list-toolbar"><button type="button" class="sort-toggle-btn ${catReorderMode?'active':''}" id="catSortToggle">${ico('arrowsSort',13)} ${catReorderMode?'Fatto':'Ordina'}</button></div>` : '';
  listEl.innerHTML = toolbar + list.map(cat=>renderCatCardHtml(cat)).join('') + (catReorderMode ? '' : (catAddingNew ? `
    <div class="card-add-inline"><input type="text" id="newCatInput" placeholder="${catSettingsTab==='uscita'?'Nuova categoria di uscita…':'Nuova categoria di entrata…'}"><button class="btn btn-sm" id="addCatBtn">Aggiungi</button></div>
  ` : `<button type="button" class="card-add" id="catAddChip">${ico('plus',14)} Aggiungi categoria</button>`));

  if(list.length>1) document.getElementById('catSortToggle').onclick = ()=>{
    catReorderMode = !catReorderMode;
    if(catReorderMode){ catExpandedCat=null; catAddingNew=false; }
    renderCatCardList();
  };

  if(!catReorderMode){
    listEl.querySelectorAll('.card-item[data-key]:not(.expanded)').forEach(card=>{
      card.onclick = ()=>{ catAddingNew=false; catExpandedCat = card.dataset.key; renderCatCardList(); };
    });

    const expandedCard = listEl.querySelector('.card-item.expanded');
    if(expandedCard) wireCatExpandedCard(expandedCard, expandedCard.dataset.key);

    if(catAddingNew){
      const input = document.getElementById('newCatInput');
      input.focus();
      function commit(){
        const val = input.value.trim();
        if(!val) return;
        const arr = catSettingsTab==='uscita' ? DB.categorieUscite : DB.categorieEntrate;
        if(arr.includes(val)){ toast('Categoria già esistente'); return; }
        arr.push(val); DB.sottocategorie[val]=[];
        saveDB(); toast('Categoria aggiunta');
        catAddingNew = false; catExpandedCat = val;
        refreshCategorieModal();
      }
      input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
      document.getElementById('addCatBtn').onclick = commit;
    } else {
      document.getElementById('catAddChip').onclick = ()=>{ catExpandedCat=null; catAddingNew=true; renderCatCardList(); };
    }
  }

  wireCardDragDrop(listEl, list, ()=>renderCatCardList());
}

function renderCatCardHtml(cat){
  const isExp = catExpandedCat===cat;
  const isAbbonamenti = cat==='Abbonamenti';
  const subs = isAbbonamenti ? abbonamentiSottocategorie() : (DB.sottocategorie[cat]||[]);
  const head = `<div class="card-item-head">
      ${catReorderMode?`<span class="reorder-handle">⠿</span>`:''}

function wireCatExpandedCard(cardEl, cat){
  const tipo = catSettingsTab;
  const isAbbonamenti = cat==='Abbonamenti';
  let dettagliReorder = false;

  cardEl.querySelector('.card-item-head').onclick = ()=>{ catExpandedCat=null; renderCatCardList(); };

  function renderDettagli(){
    if(isAbbonamenti) return;
    const subs = DB.sottocategorie[cat]||[];
    const listEl = cardEl.querySelector('#ceDettagliList');
    const toolbar = subs.length>1 ? `<div style="display:flex; justify-content:flex-end; margin-bottom:2px;"><button type="button" class="sort-toggle-btn ${dettagliReorder?'active':''}" id="ceDettagliSort">${ico('arrowsSort',12)} ${dettagliReorder?'Fatto':'Ordina'}</button></div>` : '';
    listEl.innerHTML = toolbar + (subs.length ? subs.map(s=>`
      <div class="ec-detail-row ${dettagliReorder?'reorder-row':''}" data-key="${esc(s)}" data-sub="${esc(s)}" draggable="${dettagliReorder?'true':'false'}">
        ${dettagliReorder?`<span class="reorder-handle">⠿</span>`:''}
        <input type="text" class="ec-detail-input" value="${esc(s)}">
        <span class="ec-detail-del" title="Elimina">${ico('trash',13)}</span>
      </div>`).join('') : `<div class="empty-state" style="padding:6px 0;">Nessun dettaglio.</div>`);
    if(subs.length>1){
      cardEl.querySelector('#ceDettagliSort').onclick = ()=>{ dettagliReorder = !dettagliReorder; renderDettagli(); };
    }
    if(!dettagliReorder){
      listEl.querySelectorAll('.ec-detail-input').forEach(inp=>{
        function commit(){
          const row = inp.closest('.ec-detail-row');
          const oldVal = row.dataset.sub;
          const newVal = inp.value.trim();
          if(!newVal || newVal===oldVal){ inp.value = oldVal; return; }
          const arr = DB.sottocategorie[cat]||[];
          if(arr.includes(newVal)){ toast('Dettaglio già esistente'); inp.value = oldVal; return; }
          const idx = arr.indexOf(oldVal);
          if(idx>-1) arr[idx] = newVal;
          DB.movimenti.forEach(m=>{ if(m.categoria===cat && m.descrizione===oldVal) m.descrizione = newVal; });
          renameImportRulesDettaglio(cat, oldVal, newVal);
          if(DB.gasolioRef && DB.gasolioRef.categoria===cat && DB.gasolioRef.dettaglio===oldVal) DB.gasolioRef.dettaglio = newVal;
          saveDB(); toast('Dettaglio aggiornato');
          renderDettagli();
        }
        inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
        inp.addEventListener('blur', commit);
        inp.addEventListener('mousedown', e=> e.stopPropagation());
      });
      listEl.querySelectorAll('.ec-detail-del').forEach(b=>b.onclick = ()=>{
        const sub = b.closest('.ec-detail-row').dataset.sub;
        const arr = DB.sottocategorie[cat]||[];
        const idx = arr.indexOf(sub);
        if(idx===-1) return;
        arr.splice(idx,1);
        clearImportRulesDettaglio(cat, sub);
        saveDB(); toast('Dettaglio eliminato'); renderDettagli(); refreshCatCountBadge(cardEl, cat);
      });
    }
    wireCardDragDrop(listEl, DB.sottocategorie[cat]||[], ()=>{ saveDB(); renderDettagli(); }, '.ec-detail-row[draggable="true"]');
  }
  renderDettagli();

  if(!isAbbonamenti){
    const toggleBtn = cardEl.querySelector('#ceAddDetailToggle');
    const newRow = cardEl.querySelector('#ceNewDetailRow');
    toggleBtn.onclick = ()=>{
      newRow.style.display = newRow.style.display==='none' ? 'flex' : 'none';
      if(newRow.style.display==='flex') cardEl.querySelector('#ceNewDetail').focus();
    };
    cardEl.querySelector('#ceAddDetail').onclick = ()=>{
      const input = cardEl.querySelector('#ceNewDetail');
      const val = input.value.trim();
      if(!val) return;
      DB.sottocategorie[cat] = DB.sottocategorie[cat]||[];
      if(DB.sottocategorie[cat].includes(val)){ toast('Dettaglio già esistente'); return; }
      DB.sottocategorie[cat].push(val);
      saveDB(); input.value=''; renderDettagli(); refreshCatCountBadge(cardEl, cat);
    };
    cardEl.querySelector('#ceNewDetail').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); cardEl.querySelector('#ceAddDetail').click(); } });
  } else {
    cardEl.querySelector('#ceGoAbb').onclick = ()=>{ closeModal(); switchView('abbonamenti'); };
  }

  const ceColorRow = cardEl.querySelector('#ceColorRow');
  const ceIconRow = cardEl.querySelector('#ceIconRow');
  ceColorRow.querySelectorAll('.cat-color-swatch').forEach(b=>b.onclick = ()=>{
    if(!ceColorRow.classList.contains('expanded')){ ceColorRow.classList.add('expanded'); return; }
    DB.categorieColori[cat] = b.dataset.color;
    saveDB(); toast('Colore aggiornato'); refreshCategorieModal();
  });
  ceIconRow.querySelectorAll('.cat-icon-swatch').forEach(b=>b.onclick = ()=>{
    if(!ceIconRow.classList.contains('expanded')){ ceIconRow.classList.add('expanded'); return; }
    DB.categorieIcone[cat] = b.dataset.icon;
    saveDB(); toast('Icona aggiornata'); refreshCategorieModal();
  });

  const nomeInput = cardEl.querySelector('#ceNome');
  nomeInput.addEventListener('mousedown', e=> e.stopPropagation());
  async function commitNome(){
    const nuovoNome = nomeInput.value.trim();
    if(!nuovoNome || nuovoNome===cat){ nomeInput.value = cat; return; }
    const arr = tipo==='uscita' ? DB.categorieUscite : DB.categorieEntrate;
    if(arr.includes(nuovoNome)){ toast('Esiste già una categoria con questo nome'); nomeInput.value = cat; return; }
    const doCascade = await customConfirm(`Vuoi aggiornare anche i movimenti già registrati con il nuovo nome "${nuovoNome}"?`);
    const idx = arr.indexOf(cat);
    if(idx>-1) arr[idx] = nuovoNome;
    if(DB.sottocategorie[cat]!==undefined){ DB.sottocategorie[nuovoNome] = DB.sottocategorie[cat]; delete DB.sottocategorie[cat]; }
    if(DB.categorieColori[cat]!==undefined){ DB.categorieColori[nuovoNome] = DB.categorieColori[cat]; delete DB.categorieColori[cat]; }
    if(DB.categorieIcone[cat]!==undefined){ DB.categorieIcone[nuovoNome] = DB.categorieIcone[cat]; delete DB.categorieIcone[cat]; }
    renameImportRulesCategoria(cat, nuovoNome);
    if(doCascade){ DB.movimenti.forEach(m=>{ if(m.categoria===cat) m.categoria = nuovoNome; }); }
    if(DB.gasolioRef && DB.gasolioRef.categoria===cat) DB.gasolioRef.categoria = nuovoNome;
    saveDB(); toast('Categoria rinominata');
    catExpandedCat = nuovoNome;
    refreshCategorieModal();
  }
  nomeInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); nomeInput.blur(); } });
  nomeInput.addEventListener('blur', commitNome);

  cardEl.querySelector('#ceDelete').onclick = async ()=>{
    if(!(await customConfirm(`Eliminare la categoria "${cat}"? I movimenti già registrati non verranno modificati.`, {danger:true, okLabel:'Elimina'}))) return;
    const arr = tipo==='uscita' ? DB.categorieUscite : DB.categorieEntrate;
    const idx = arr.indexOf(cat);
    if(idx>-1) arr.splice(idx,1);
    delete DB.sottocategorie[cat];
    clearImportRulesCategoria(cat);
    saveDB(); toast('Categoria eliminata');
    catExpandedCat = null;
    refreshCategorieModal();
  };
}
function refreshCatCountBadge(cardEl, cat){
  const subs = cat==='Abbonamenti' ? abbonamentiSottocategorie() : (DB.sottocategorie[cat]||[]);
  const badge = cardEl.querySelector('.card-item-count');
  if(badge) badge.textContent = subs.length;

/* ---- Drag & drop generico verticale (categorie, metodi, categorie abbonamenti, dettagli) ---- */
function wireCardDragDrop(listEl, arr, afterReorder, itemSelector){
  itemSelector = itemSelector || '.card-item[draggable="true"]';
  listEl.querySelectorAll(itemSelector).forEach(item=>{
    const key = item.dataset.key;
    item.addEventListener('dragstart', e=>{
      cardDragInfo = key;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', key);
    });
    item.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      listEl.querySelectorAll(itemSelector).forEach(x=>x.classList.remove('drag-over-top','drag-over-bottom'));
      cardDragInfo = null;
    });
    item.addEventListener('dragover', e=>{
      if(!cardDragInfo || cardDragInfo===key) return;
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      item.classList.toggle('drag-over-top', before);
      item.classList.toggle('drag-over-bottom', !before);
    });
    item.addEventListener('dragleave', ()=>{ item.classList.remove('drag-over-top','drag-over-bottom'); });
    item.addEventListener('drop', e=>{
      if(!cardDragInfo || cardDragInfo===key) return;
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      let toIdx = arr.indexOf(key);
      if(!before) toIdx++;
      const fromIdx = arr.indexOf(cardDragInfo);
      if(fromIdx>-1 && toIdx>-1){
        arr.splice(fromIdx,1);
        if(fromIdx<toIdx) toIdx--;
        arr.splice(toIdx,0,cardDragInfo);
        saveDB(); afterReorder();
      }
    });
  });
}

function wireCatAbbExpandedCard(cardEl, c){
  cardEl.querySelector('.card-item-head').onclick = ()=>{ catAbbExpanded=null; renderCatAbbCardList(); };

  const nomeInput = cardEl.querySelector('#cabNome');
  nomeInput.addEventListener('mousedown', e=> e.stopPropagation());
  function commitNome(){
    const nuovo = nomeInput.value.trim();
    if(!nuovo || nuovo===c){ nomeInput.value = c; return; }
    if(DB.categorieAbbonamenti.includes(nuovo)){ toast('Esiste già una categoria con questo nome'); nomeInput.value = c; return; }
    const idx = DB.categorieAbbonamenti.indexOf(c);
    if(idx===-1) return;
    DB.categorieAbbonamenti[idx] = nuovo;
    DB.abbonamenti.forEach(a=>{ if(a.categoriaAbb===c) a.categoriaAbb=nuovo; });
    saveDB(); toast('Categoria rinominata');
    catAbbExpanded = nuovo;
    refreshCategorieAbbModal();
  }
  nomeInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); nomeInput.blur(); } });
  nomeInput.addEventListener('blur', commitNome);

  cardEl.querySelector('#cabDelete').onclick = async ()=>{
    const idx = DB.categorieAbbonamenti.indexOf(c);
    if(idx===-1) return;
    if(DB.categorieAbbonamenti.length<=1){ toast('Deve restare almeno una categoria'); return; }
    if(!(await customConfirm(`Eliminare la categoria "${c}"? Gli abbonamenti che la usano passeranno a "${DB.categorieAbbonamenti.find(x=>x!==c)}".`, {danger:true, okLabel:'Elimina'}))) return;
    const fallback = DB.categorieAbbonamenti.find(x=>x!==c);
    DB.categorieAbbonamenti.splice(idx,1);
    DB.abbonamenti.forEach(a=>{ if(a.categoriaAbb===c) a.categoriaAbb=fallback; });
    saveDB(); toast('Categoria eliminata');
    catAbbExpanded = null;
    refreshCategorieAbbModal();
  };
}

function wireMetodoExpandedCard(cardEl, m){
  cardEl.querySelector('.card-item-head').onclick = ()=>{ metodoExpanded=null; renderMetodoCardList(); };

  const nomeInput = cardEl.querySelector('#metNome');
  nomeInput.addEventListener('mousedown', e=> e.stopPropagation());
  nomeInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); nomeInput.blur(); } });
  nomeInput.addEventListener('blur', async ()=>{
    const nuovo = nomeInput.value.trim();
    if(!nuovo || nuovo===m){ nomeInput.value = m; return; }
    if(DB.metodiPagamento.includes(nuovo)){ toast('Esiste già un metodo con questo nome'); nomeInput.value = m; return; }
    const idx = DB.metodiPagamento.indexOf(m);
    if(idx===-1) return;
    const doCascade = await customConfirm(`Vuoi rinominare in automatico "${m}" in "${nuovo}" su tutti gli abbonamenti già registrati?`);
    DB.metodiPagamento[idx] = nuovo;
    if(DB.metodiIcone && DB.metodiIcone[m]!==undefined){ DB.metodiIcone[nuovo] = DB.metodiIcone[m]; delete DB.metodiIcone[m]; }
    if(doCascade){ DB.abbonamenti.forEach(a=>{ if(a.metodoPagamento===m) a.metodoPagamento=nuovo; }); }
    saveDB(); toast('Metodo aggiornato');
    metodoExpanded = nuovo;
    refreshMetodiModal();
  });

  cardEl.querySelector('#metUploadBtn').onclick = ()=> cardEl.querySelector('#metUploadInput').click();
  cardEl.querySelector('#metUploadInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    processMetodoIconFile(file, (dataURL, err)=>{
      if(err){ toast(err); return; }
      DB.metodiIcone[m] = dataURL;
      saveDB(); toast('Icona caricata'); refreshMetodiModal();
    });
  };
  const resetBtn = cardEl.querySelector('#metResetIcon');
  if(resetBtn) resetBtn.onclick = ()=>{
    delete DB.metodiIcone[m];
    saveDB(); toast('Icona personalizzata rimossa, torna quella automatica'); refreshMetodiModal();
  };

  cardEl.querySelector('#metDelete').onclick = async ()=>{
    const idx = DB.metodiPagamento.indexOf(m);
    if(idx===-1) return;
    if(!(await customConfirm(`Eliminare il metodo "${m}"? Scomparirà solo la sua icona dai movimenti: nessun movimento verrà modificato o cancellato.`, {danger:true, okLabel:'Elimina'}))) return;
    DB.metodiPagamento.splice(idx,1);
    delete DB.metodiIcone[m];
    saveDB(); toast('Metodo eliminato');
    metodoExpanded = null;
    refreshMetodiModal();
  };
}

    listEl.innerHTML = `<div style="text-align:center;color:var(--text-faint);padding:16px;font-size:12.5px;">Nessuna regola salvata finora. Le regole compaiono qui man mano che correggi gli abbinamenti durante un import.</div>`;

    if(newKey!==key) delete rules2[key];

/* ==================== REPORT PDF ==================== */
function nowStamp(){
  const d = new Date();
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'}) + ' alle ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
function generatePdfReport(kind){
  const container = document.getElementById('printReport');
  if(!container) return;
  container.innerHTML = kind==='ricerca' ? buildRicercaReportHtml() : buildDashboardReportHtml();
  requestAnimationFrame(()=>{ window.print(); });
}
function buildDashboardReportHtml(){
  const years = getYears();
  const period = filteredMovimenti(dashFilter);
  const totEntrate = movimentiForTotals(period).reduce((s,m)=>s+(m.entrate||0),0);
  const totUscite = movimentiForTotals(period).reduce((s,m)=>s+(m.uscite||0),0);
  const saldo = totEntrate - totUscite;

  const periodoLabel = (dashFilter.anni.length ? dashFilter.anni.slice().sort().join(', ') : 'Tutti gli anni')
    + (dashFilter.mesi.length ? ' — ' + dashFilter.mesi.slice().sort((a,b)=>a-b).map(m=>monthName(parseInt(m,10))).join(', ') : '');

  const catTotals = {};
  movimentiForTotals(period).forEach(m=>{ if(m.uscite){ catTotals[m.categoria]=(catTotals[m.categoria]||0)+m.uscite; } });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

  const catRows = catEntries.map(([cat,val])=>{
    const pct = totUscite>0 ? (val/totUscite*100) : 0;
    return `<tr><td>${esc(cat)}</td><td class="num">${fmtEUR(val)}</td><td class="num">${pct.toFixed(1)}%</td></tr>`;
  }).join('') || `<tr><td colspan="3" style="color:#888;text-align:center;">Nessuna spesa nel periodo selezionato</td></tr>`;

  let scadenzeRows = '';
  const scadItems = [];
  DB.abbonamenti.forEach(a=>{ if(a.stato==='Attivo' && a.scadenza) scadItems.push({label:a.servizio, data:a.scadenza, tipo:'Abbonamento'}); });
  ['assicurazione','bollo','revisione'].forEach(k=>{
    const o = DB.auto[k];
    if(o && o.scadenza) scadItems.push({label: k==='assicurazione'?'Assicurazione auto': k==='bollo'?'Bollo auto':'Revisione auto', data:o.scadenza, tipo:'Macchina'});
  });
  scadItems.sort((a,b)=>a.data.localeCompare(b.data));
  scadenzeRows = scadItems.map(it=>`<tr><td>${esc(it.label)}</td><td>${esc(it.tipo)}</td><td class="num">${fmtDate(it.data)}</td></tr>`).join('')
    || `<tr><td colspan="3" style="color:#888;text-align:center;">Nessuna scadenza registrata</td></tr>`;

  return `
    <div class="pr-head">
      <div><h1>${ico('pieChart')} Gestionale — Riepilogo Finanziario</h1><div class="pr-sub">Periodo: ${esc(periodoLabel)}</div></div>
      <div class="pr-date">Generato il<br>${nowStamp()}</div>
    </div>
    <div class="pr-kpis">
      <div class="pr-kpi"><div class="lbl">Totale Entrate</div><div class="val">${fmtEUR(totEntrate)}</div></div>
      <div class="pr-kpi"><div class="lbl">Totale Uscite</div><div class="val">${fmtEUR(totUscite)}</div></div>
      <div class="pr-kpi"><div class="lbl">Saldo Periodo</div><div class="val">${fmtEUR(saldo)}</div></div>
    </div>
    <div class="pr-section-title">Ripartizione Spese per Categoria</div>
    <table><thead><tr><th>Categoria</th><th class="num">Importo</th><th class="num">% sul totale</th></tr></thead><tbody>${catRows}</tbody></table>
    <div class="pr-section-title">Prossime Scadenze</div>
    <table><thead><tr><th>Voce</th><th>Tipo</th><th class="num">Scadenza</th></tr></thead><tbody>${scadenzeRows}</tbody></table>
    <div class="pr-footer">Gestionale — Finance &amp; Personal Hub · Report generato automaticamente dai dati salvati nel browser.</div>
  `;
}
function buildRicercaReportHtml(){
  const { movMatches, subMatches, autoMatches } = computeSearchMatches();
  const movSum = movimentiForTotals(movMatches).reduce((s,m)=>s+(m.entrate||0)-(m.uscite||0),0);

  const f = searchFilter;
  const parts = [];
  if(f.anni.length) parts.push('Anni: '+f.anni.slice().sort().join(', '));
  if(f.mesi.length) parts.push('Mesi: '+f.mesi.slice().sort((a,b)=>a-b).map(m=>monthName(parseInt(m,10))).join(', '));
  if(f.min!=='' && f.min!=null) parts.push('Da € '+f.min);
  if(f.max!=='' && f.max!=null) parts.push('A € '+f.max);
  if((f.categoria||'').trim()) parts.push('Categoria: "'+f.categoria.trim()+'"');
  if((f.dettaglio||'').trim()) parts.push('Dettaglio: "'+f.dettaglio.trim()+'"');
  if((f.note||'').trim()) parts.push('Note: "'+f.note.trim()+'"');
  const filterLabel = parts.length ? parts.join(' · ') : 'Nessun filtro attivo';

  const movRows = movMatches.map(m=>`<tr><td>${fmtDate(m.data)}</td><td>${categoryLabelHtml(m.categoria)}</td><td>${esc(m.descrizione||'—')}${m.note?' · '+esc(m.note):''}</td><td class="num">${fmtEUR(m.entrate||m.uscite)}</td></tr>`).join('');
  const subRows = subMatches.map(a=>`<tr><td>${esc(a.servizio)}</td><td>${esc(a.metodoPagamento||'—')}</td><td>${fmtDate(a.scadenza)}</td><td class="num">${fmtEUR(a.costo)}</td></tr>`).join('');
  const manRows = autoMatches.map(x=>`<tr><td>${fmtDate(x.data)}</td><td>${esc(x.intervento)}</td><td>${esc(x.officina||'—')}</td><td class="num">${fmtEUR(x.costo)}</td></tr>`).join('');

  return `
    <div class="pr-head">
      <div><h1>${ico('pieChart')} Gestionale — Report di Ricerca</h1><div class="pr-sub">Filtri: ${esc(filterLabel)}</div></div>
      <div class="pr-date">Generato il<br>${nowStamp()}</div>
    </div>
    <div class="pr-kpis">
      <div class="pr-kpi"><div class="lbl">Movimenti trovati</div><div class="val">${movMatches.length}</div></div>
      <div class="pr-kpi"><div class="lbl">Importo totale</div><div class="val">${fmtEUR(movSum)}</div></div>
      <div class="pr-kpi"><div class="lbl">Altri risultati</div><div class="val">${subMatches.length + autoMatches.length}</div></div>
    </div>

    <table><thead><tr><th>Data</th><th>Categoria</th><th>Dettaglio</th><th class="num">Importo</th></tr></thead><tbody>${movRows}</tbody></table>` : ''}
    ${subMatches.length ? `<div class="pr-section-title">Abbonamenti (${subMatches.length})</div>
    <table><thead><tr><th>Servizio</th><th>Metodo</th><th>Scadenza</th><th class="num">Costo</th></tr></thead><tbody>${subRows}</tbody></table>` : ''}

    <div class="pr-footer">Gestionale — Finance &amp; Personal Hub · Report generato automaticamente dai dati salvati nel browser.</div>
  `;
}

/* ==================== CONTROLLO AGGIORNAMENTI APP ==================== */
const LS_UPDATE_DISMISS_BUILD = 'ledger_update_dismiss_build_v1';
let appUpdateAvailableBuild = null;

async function checkForAppUpdate(){
  try{
    // cache:'no-store' forza il browser a chiedere sempre la versione fresca
    // al server, ignorando qualunque copia locale in cache.
    const res = await fetch(location.href.split('#')[0].split('?')[0] + '?_=' + Date.now(), { cache:'no-store' });
    if(!res.ok) return;
    const text = await res.text();
    const m = text.match(/const APP_BUILD\s*=\s*['"]([^'"]+)['"]/);
    if(!m) return;
    const remoteBuild = m[1];
    if(remoteBuild && remoteBuild !== APP_BUILD){
      const dismissed = localStorage.getItem(LS_UPDATE_DISMISS_BUILD);
      appUpdateAvailableBuild = remoteBuild;
      if(dismissed !== remoteBuild) showAppUpdateBanner();
    }
  }catch(e){ /* nessuna connessione o pagina non raggiungibile: ignora silenziosamente */ }
}

function showAppUpdateBanner(){
  const el = document.getElementById('appUpdateBanner');
  if(el) el.classList.add('show');
}
function hideAppUpdateBanner(){
  const el = document.getElementById('appUpdateBanner');
  if(el) el.classList.remove('show');
}

function initAppUpdateCheck(){
  const btn = document.getElementById('appUpdateBtn');
  const dismissBtn = document.getElementById('appUpdateDismiss');
  if(btn) btn.onclick = ()=>{ location.reload(); };
  if(dismissBtn) dismissBtn.onclick = ()=>{
    if(appUpdateAvailableBuild) localStorage.setItem(LS_UPDATE_DISMISS_BUILD, appUpdateAvailableBuild);
    hideAppUpdateBanner();
  };

  // Controllo all'avvio, poi ogni 5 minuti, e ogni volta che l'app torna in primo piano
  // (utile soprattutto per l'app installata, che può restare aperta a lungo).
  checkForAppUpdate();
  setInterval(checkForAppUpdate, 5*60*1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') checkForAppUpdate();
  });
  window.addEventListener('focus', checkForAppUpdate);
}

function checkBackupBanner(){
  const banner = document.getElementById('backupBanner');
  if(!banner) return;
  if(!localStorage.getItem(LS_FIRST_USE)) localStorage.setItem(LS_FIRST_USE, String(Date.now()));

  const dismissedAt = parseInt(localStorage.getItem(LS_BACKUP_DISMISS)||'0',10);
  const daysSinceDismiss = (Date.now()-dismissedAt)/86400000;
  if(dismissedAt && daysSinceDismiss < BACKUP_SNOOZE_DAYS){ banner.style.display='none'; return; }

  const lastBackup = parseInt(localStorage.getItem(LS_LAST_BACKUP)||'0',10);
  const refDate = lastBackup || parseInt(localStorage.getItem(LS_FIRST_USE)||String(Date.now()),10);
  const daysSince = (Date.now()-refDate)/86400000;

  if(daysSince < BACKUP_REMINDER_DAYS){ banner.style.display='none'; return; }

  banner.innerHTML = `
    <div class="backup-banner-text"><span class="ic">${ico('save')}</span><span>Non esporti un backup da un po' — i tuoi dati vivono solo in questo browser. Ti conviene salvarne una copia.</span></div>
    <div class="backup-banner-actions">
      <button class="btn btn-primary btn-sm" id="backupBannerExport">Esporta ora</button>
      <button class="btn btn-sm" id="backupBannerDismiss">Più tardi</button>
    </div>`;
  banner.style.display = 'flex';
  document.getElementById('backupBannerExport').onclick = ()=>{ exportBackup(); banner.style.display='none'; };
  document.getElementById('backupBannerDismiss').onclick = ()=>{
    localStorage.setItem(LS_BACKUP_DISMISS, String(Date.now()));
    banner.style.display='none';
  };
}
