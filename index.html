.import-min-badge .import-min-dot{position:absolute; top:2px; right:2px; width:13px; height:13px; border-radius:50%; background:var(--amber); border:2px solid var(--surface); animation:importPulse 1.6s ease-in-out infinite;}
@keyframes importPulse{ 0%,100%{transform:scale(.85); opacity:1;} 50%{transform:scale(1.25); opacity:.6;} }
.import-spinner{display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; vertical-align:-2px; animation:spin .7s linear infinite; margin-right:2px;}
@keyframes spin{ to{transform:rotate(360deg);} }

/* checkbox custom animata */
.imp-checkbox{appearance:none; -webkit-appearance:none; width:19px; height:19px; border-radius:6px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; position:relative; flex-shrink:0; transition:border-color .15s, background .15s, transform .12s;}
.imp-checkbox:checked{background:var(--mint); border-color:var(--mint); transform:scale(1.12);}
.imp-checkbox:checked::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--mint-ink); font-weight:800;}
.imp-checkbox:active{transform:scale(.88);}

/* select/input "seamless" per la tabella import */
.imp-seamless{background:transparent; border:1px solid transparent; border-radius:7px; padding:6px 7px; font-size:12.5px; width:100%; max-width:100%; transition:background .15s, border-color .15s;}
.imp-seamless:hover{background:var(--surface-2);}
.imp-seamless:focus{background:var(--surface-2); border-color:var(--border); }

/* footer riepilogo import */
.imp-foot{flex-wrap:wrap; gap:10px;}
.imp-summary{display:flex; gap:16px; align-items:center; font-size:12.5px; color:var(--text-dim); margin-right:auto; flex-wrap:wrap;}
.imp-summary .pos{color:var(--money-pos); font-family:'JetBrains Mono',monospace; font-weight:600;}
.imp-summary .neg{color:var(--coral); font-family:'JetBrains Mono',monospace; font-weight:600;}
.imp-summary b{font-family:'JetBrains Mono',monospace;}

/* lampeggio righe appena importate nella tabella Movimenti — stessa animazione/colore di rowFlash sopra (tema accento) */

/* ---------- Regole import (Impostazioni) ---------- */
.imp-rule-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--border-soft); font-size:12.5px;}
.imp-rule-key{font-family:'JetBrains Mono',monospace; background:var(--surface-2); border-radius:6px; padding:3px 7px; font-size:11.5px; color:var(--text-dim); flex-shrink:0;}
.imp-rule-arrow{color:var(--text-faint); flex-shrink:0;}
.imp-rule-target{color:var(--text); flex:1;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-size:16px; font-weight:700;}
.modal-body{padding:20px; display:flex; flex-direction:column; gap:13px;}
.modal-foot{padding:16px 20px; border-top:1px solid var(--border-soft); display:flex; gap:10px; justify-content:flex-end;}
/* ==================== Form di inserimento dati: stile "slim" ====================
   Righe compatte con icona, senza riquadri attorno ai campi (solo un sottile divisore).
   Usato da Movimento, Abbonamento, intestazione Auto e Manutenzione — mobile e desktop. */
.modal-form .modal-head{padding:16px 16px 12px;}
.modal-form .modal-body{padding:0 16px 14px; gap:0;}
.modal-form .modal-foot{padding:12px 16px; gap:8px;}
.slim-switch{display:flex; gap:4px; background:var(--surface-2); border-radius:999px; padding:3px; margin:2px auto 14px; width:fit-content;}
.slim-switch-opt{padding:7px 20px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer; transition:background .15s ease, color .15s ease; user-select:none;}
.slim-switch-opt.active{background:var(--mint-dim); color:var(--mint);}
.slim-switch-opt.uscita.active{background:var(--coral-dim); color:var(--coral);}
.slim-row{display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid var(--border-soft);}
.slim-row:last-child{border-bottom:none;}
.slim-row-pair{display:flex; gap:16px; padding:10px 2px; border-bottom:1px solid var(--border-soft);}
.slim-row-pair:last-child{border-bottom:none;}
.slim-half{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.slim-icon{width:26px; height:26px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
.slim-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
.slim-main label{font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.03em; display:block;}
.slim-form input, .slim-form select, .slim-form textarea{
  background:transparent !important; border:none !important; padding:1px 0 !important; font-size:13.5px;
  color:var(--text); border-radius:0 !important; width:100%; min-height:0;
}
.slim-form select{appearance:none; -webkit-appearance:none; background-image:none !important;}
.slim-form input:focus, .slim-form select:focus, .slim-form textarea:focus{outline:none; box-shadow:none;}
.slim-form .field{gap:1px;}
.slim-form .tag-input-wrap{border:none; padding:0; background:transparent; min-height:0;}
.slim-amount input{font-size:17px !important; font-weight:800 !important; font-family:'JetBrains Mono',monospace;}
@media(min-width:881px){
  /* Un filo più di respiro sul desktop, dove lo spazio non manca */
  .modal-form .modal-head{padding:20px 22px 14px;}
  .modal-form .modal-body{padding:0 22px 16px;}
  .modal-form .modal-foot{padding:14px 22px;}
  .slim-row, .slim-row-pair{padding:11px 2px;}
  /* La card filtri Anni/Mesi della Dashboard si adatta al contenuto invece di occupare sempre
     tutta la larghezza disponibile: con pochi anni resta compatta, e si allarga da sola quando
     se ne aggiungono altri. Scoperta solo alla Dashboard (classe dedicata) e non alla card filtri
     di Ricerca, che contiene anche campi di testo libero e si comporta meglio a piena larghezza. */
  .time-selector-dash{width:fit-content; max-width:100%;}
}
.field{display:flex; flex-direction:column; gap:5px;}
.modal.modal-form{max-width:560px;}
.field-row-2{display:grid; grid-template-columns:1fr 1fr; gap:13px;}
.field-row-2 > .field{min-width:0;}
@media(max-width:520px){ .field-row-2{grid-template-columns:1fr;} }
.field label{font-size:11.5px; color:var(--text-dim); font-weight:600;}
.field textarea{width:100%; resize:vertical; min-height:88px; line-height:1.5;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.radio-row{display:flex; gap:8px;}
.radio-opt{flex:1; text-align:center; padding:9px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; font-weight:600; color:var(--text-dim); background:var(--surface-2);}
.radio-opt.sel-entrata.active{background:var(--money-pos-dim); border-color:var(--money-pos); color:var(--money-pos);}
.radio-opt.sel-uscita.active{background:var(--coral-dim); border-color:var(--coral); color:var(--coral);}
.close-x{background:none; border:none; color:var(--text-dim); font-size:18px; width:28px; height:28px; border-radius:7px;}
.close-x:hover{background:var(--surface-2); color:var(--text);}

/* ---------- CALCOLATRICE RAPIDA ---------- */
.calc-display{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:16px 14px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:25px; font-weight:600; margin-bottom:14px; overflow-x:auto; white-space:nowrap;}
.calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.calc-btn{padding:14px 0; border-radius:9px; background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); font-size:16px; font-weight:600; font-family:'JetBrains Mono',monospace; transition:all .12s;}
.calc-btn:hover{background:var(--surface-3);}
.calc-btn.calc-op{background:var(--surface-3); color:var(--text-dim);}
.calc-btn.calc-accent{background:var(--mint); color:var(--mint-ink); border-color:var(--mint);}
.calc-btn.calc-accent:hover{filter:brightness(1.07);}
.calc-btn.wide{grid-column:span 2;}

/* ---------- ABBONAMENTI / AUTO CARDS ---------- */
.sub-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:14px;}
.sub-cat-legend{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px; font-size:12px; color:var(--text-muted);}
.sub-cat-legend-item{display:flex; align-items:center; gap:6px;}
.sub-cat-legend-dot{display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.sub-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 17px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; position:relative;}
.sub-card.inactive{opacity:.52;}
.sub-card-top{display:flex; justify-content:space-between; align-items:flex-start;}
.sub-card-top .row-actions{opacity:0; pointer-events:none;}
@media(min-width:881px){
  .sub-card:hover .row-actions{opacity:1; pointer-events:auto;}
}
.sub-card-name{display:flex; align-items:center; gap:7px; min-width:0;}
.sub-cat-dot{display:inline-block; width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.sub-name{font-weight:700; font-size:14.5px;}
.sub-meta{font-size:11.5px; color:var(--text-dim);}
.sub-price{font-size:22px; font-weight:600; font-family:'JetBrains Mono'; margin-top:2px;}
.sub-price small{font-size:11px; color:var(--text-dim); font-family:'Inter'; font-weight:500;}
.sub-scad-line{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--text-dim); border-top:1px solid var(--border-soft); padding-top:9px; margin-top:2px;}
.sub-scad-line b{color:var(--text); font-weight:600;}
.sub-scad-left{display:flex; align-items:center; gap:6px; min-width:0;}
.sub-card-bell{background:none; border:none; cursor:pointer; padding:0; line-height:1; display:inline-flex; flex-shrink:0; color:var(--text-faint);}
.sub-card-bell.on{color:#E8C24F;}
.sub-cat-header{grid-column:1/-1; display:flex; align-items:baseline; justify-content:space-between; padding:0 2px 8px; border-bottom:1px solid var(--border-soft); margin:10px 0 2px;}
.sub-cat-header:first-child{margin-top:0;}
.sub-cat-header-name{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--text); text-transform:uppercase; letter-spacing:.04em;}
.sub-cat-header-tot{font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; white-space:nowrap;}
.countdown{font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:20px; display:inline-flex; width:fit-content; gap:5px; align-items:center;}
.cd-ok{background:var(--money-pos-dim); color:var(--money-pos);}
.cd-soon{background:rgba(245,185,92,.15); color:var(--amber);}
.cd-urgent{background:var(--coral-dim); color:var(--coral);}
/* Bordo che pulsa piano sulle card con una scadenza imminente/scaduta (badge rosso dentro),
   per attirare l'attenzione senza essere invadente. */
.sub-card:has(.cd-urgent), .info-card:has(.cd-urgent){ animation: urgentPulse 2.4s ease-in-out infinite; }
@keyframes urgentPulse{
  0%,100%{ box-shadow: 0 0 0 0 rgba(255,122,102,0); }
  50%{ box-shadow: 0 0 0 3px rgba(255,122,102,.22); }
}
.cd-none{background:var(--surface-3); color:var(--text-faint);}
.sub-foot{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--border-soft); padding-top:9px; margin-top:2px;}

.info-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px;}
.info-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); border-left:3px solid var(--blue);}
.info-card h4{font-size:13px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:7px;}
.info-row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); padding:3px 0;}
.info-row b{color:var(--text); font-family:'JetBrains Mono'; font-weight:600;}

.link-chip{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 13px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px; font-size:12.5px;}
.link-chip .lbl{color:var(--text-dim); font-size:11px;}

/* ---------- SETTINGS ---------- */
.settings-section{margin-bottom:20px;}
.theme-toggle-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; flex-wrap:wrap; gap:12px;}
.accent-swatch-row{display:flex; gap:9px; flex-wrap:wrap; justify-content:flex-end;}
.accent-swatch{width:27px; height:27px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer; position:relative; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .15s ease, border-color .15s ease;}
.accent-swatch-current{width:27px; height:27px; border-radius:50%; border:2px solid var(--border-soft); padding:0; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s ease;}
.accent-swatch-current:hover{transform:scale(1.12);}
.settings-info-btn{width:24px; height:24px; flex-shrink:0; border-radius:50%; border:none; background:var(--surface-2); color:var(--text-faint); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s;}
.settings-info-btn:hover{background:var(--surface-3); color:var(--text-dim);}
.settings-info-btn svg{width:14px; height:14px;}
.accent-swatch:hover{transform:scale(1.12);}
.accent-swatch.active{border-color:var(--text);}
.accent-swatch.active::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.55);}
.switch{position:relative; width:46px; height:26px; background:var(--surface-3); border:1px solid var(--border); border-radius:20px; cursor:pointer; flex-shrink:0;}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--text-dim); transition:transform .2s, background .2s;}
.switch.on{background:var(--mint-dim); border-color:var(--mint);}
.switch.on::after{transform:translateX(20px); background:var(--mint);}
.chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip-label{white-space:nowrap; padding:0 2px;}
.cat-block{border:1px solid var(--border-soft); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
.cat-block-head{display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:13px;}
.add-inline{display:flex; gap:8px; margin-top:10px;}
.add-inline input{flex:1;}
.settings-actions{display:flex; gap:10px; flex-wrap:wrap;}
.settings-link-list{display:flex; flex-direction:column; margin-top:4px;}
.settings-link-item{
  display:flex; align-items:center; gap:12px; width:100%; background:none; border:none;
  border-top:1px solid var(--border-soft); padding:13px 4px; cursor:pointer; text-align:left;
  color:var(--text); font-family:inherit; transition:background .12s ease;
}
.settings-link-list .settings-link-item:first-child{border-top:none;}
.settings-link-item:hover{background:var(--surface-2);}
.settings-link-icon{display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex-shrink:0; border-radius:9px; background:var(--surface-2); color:var(--text-dim);}
.settings-link-label{flex:1; font-weight:600; font-size:13.5px;}
.settings-link-item svg:last-child{color:var(--text-faint); flex-shrink:0;}

/* ---------- CATEGORIE & DETTAGLI MANAGER ---------- */
.cm-item{border:1px solid var(--border-soft); border-radius:11px; margin-bottom:9px; overflow:hidden; background:var(--surface-2);}
.cm-head{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; user-select:none; flex-wrap:wrap; row-gap:8px;}
.cm-head:hover{background:var(--surface-3);}
.cm-head-main{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.cm-drag-handle{cursor:grab; color:var(--text-faint); font-size:15px; padding:2px 3px; flex-shrink:0; letter-spacing:-2px; line-height:1;}
.cm-drag-handle:active{cursor:grabbing;}
.cm-drag-handle:hover{color:var(--text);}
.cm-item.dragging{opacity:.35;}
.cm-item.drag-over-top{box-shadow:inset 0 3px 0 var(--mint);}
.cm-item.drag-over-bottom{box-shadow:inset 0 -3px 0 var(--mint);}
.cm-chevron{font-size:10px; color:var(--text-faint); transition:transform .2s; flex-shrink:0;}
.cm-item.open .cm-chevron{transform:rotate(90deg);}
.cm-name{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.cm-count{font-size:11px; color:var(--text-faint); background:var(--surface-3); padding:3px 9px; border-radius:20px; flex-shrink:0;}
.cm-actions{opacity:1; flex-shrink:0; margin-left:auto; display:flex; align-items:center; gap:6px;}
.cm-body{max-height:0; overflow:hidden; transition:max-height .25s ease; background:var(--surface);}
.cm-item.open .cm-body{max-height:900px;}
.cm-sub-list{padding:6px 14px 4px;}
.cm-sub-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--border-soft);}
.cm-sub-item:last-child{border-bottom:none;}
.cm-sub-drag{cursor:grab; color:var(--text-faint); font-size:14px; flex-shrink:0; letter-spacing:-2px; line-height:1;}
.mode-switch{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:5px; margin-bottom:20px; box-shadow:var(--shadow);}
.mode-switch-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:10px 14px; border:none; border-radius:calc(var(--radius) - 4px); background:transparent; color:var(--text-faint); font-weight:600; font-size:13.5px; cursor:pointer; transition:background .15s ease, color .15s ease;}
.mode-switch-btn:hover{color:var(--text);}
.mode-switch-btn.active{background:var(--mint); color:var(--mint-ink); box-shadow:0 1px 3px rgba(0,0,0,.2);}
.compare-periods{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px;}
.compare-period-chip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border-radius:8px; padding:6px 8px; border:1px solid var(--border-soft);}
.compare-period-chip select{background:transparent; border:none; color:var(--text); font-size:12.5px; font-weight:600; cursor:pointer;}
.compare-period-chip select:focus{outline:none;}
.cp-remove{background:none; border:none; color:var(--text-faint); cursor:pointer; display:flex; align-items:center; padding:2px;}
.cp-remove:hover{color:var(--coral);}
.compare-insight{font-size:15px; line-height:1.5; color:var(--text-dim);}
.compare-insight b{color:var(--text); font-weight:700;}
.compare-strip{display:flex; flex-wrap:wrap; gap:18px; padding-top:12px; margin-top:12px; border-top:1px solid var(--border-soft);}
.compare-strip-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-faint);}
.compare-strip-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.compare-strip-label{font-weight:600; color:var(--text-dim);}
.compare-strip-num{font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--text);}
.compare-detail-toggle-wrap{text-align:center;}
.compare-kpi-row{display:flex; align-items:center; gap:16px; padding:9px 0; border-bottom:1px solid var(--border-soft);}
.compare-kpi-row:last-child{border-bottom:none;}
.compare-kpi-block{margin-bottom:14px;}
.compare-chart-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding-top:14px; border-top:1px solid var(--border-soft); margin-bottom:10px;}
.compare-chart-wrap{height:230px; min-height:230px;}
.compare-kpi-metric-label{width:70px; flex-shrink:0; font-size:12.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em;}
.compare-kpi-values{display:flex; flex-wrap:wrap; gap:18px; flex:1;}
.compare-kpi-val{display:flex; flex-direction:column; gap:2px;}
.compare-kpi-period{font-size:10.5px; font-weight:600; opacity:.85;}
.compare-kpi-num{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600;}
.compare-kpi-delta{flex-shrink:0; font-size:12.5px; font-weight:700;}
.compare-delta.pos{color:var(--money-pos);}
.compare-delta.neg{color:var(--coral);}
.compare-delta.even{color:var(--text-faint);}
.compare-detail-header, .compare-detail-row{display:grid; align-items:center; gap:8px; padding:10px 4px;}
.compare-detail-header{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:700; border-bottom:1px solid var(--border-soft);}
.compare-detail-card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}
.link-btn{background:none; border:none; color:var(--mint); font-size:12px; font-weight:600; cursor:pointer; padding:2px 4px;}
.link-btn:hover{text-decoration:underline;}
.compare-detail-list{max-height:520px; overflow-y:auto;}
.compare-detail-item{border-bottom:1px solid var(--border-soft);}
.compare-detail-item:last-child{border-bottom:none;}
.cdt-head{cursor:pointer; user-select:none;}
.cdt-head:hover{background:var(--surface-2);}
.cdt-chevron{font-size:11px; color:var(--text-faint); transition:transform .2s; width:14px; text-align:center; display:inline-block;}
.compare-detail-item.open .cdt-chevron{transform:rotate(90deg);}
.compare-detail-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.compare-detail-item.open .compare-detail-body{max-height:2000px;}
.cdt-name{display:flex; align-items:center; font-weight:600; font-size:13px; min-width:0;}
.compare-detail-row.sub-row .cdt-name{font-weight:400; font-size:12px; color:var(--text-faint); padding-left:20px;}
.cdt-col{text-align:right; font-family:'JetBrains Mono',monospace; font-size:12.5px;}
.cdt-cell{display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
.cdt-num{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text);}
.compare-detail-row.sub-row .cdt-num{font-size:11px; color:var(--text-faint);}
.cdt-bar-track{width:100%; height:4px; background:var(--surface-3); border-radius:2px; overflow:hidden;}
.compare-detail-row.sub-row .cdt-bar-track{height:3px; opacity:.75;}
.cdt-bar-fill{height:100%; border-radius:2px; transition:width .3s ease;}
.etichetta-color-btn, .cat-color-btn{width:19px; height:19px; border-radius:50%; border:2px solid var(--border-soft); padding:0; cursor:pointer; flex-shrink:0; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s ease; display:flex; align-items:center; justify-content:center; color:#fff;}
.etichetta-color-btn:hover, .cat-color-btn:hover{transform:scale(1.12);}
.etichetta-color-row, .cat-color-row{display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px 0;}
.cat-icon-row{display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px 12px; border-bottom:1px dashed var(--border-soft); margin-bottom:6px;}
.cat-icon-swatch{width:30px; height:30px; border-radius:9px; border:1.5px solid var(--border-soft); background:var(--surface-2); padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-dim); transition:transform .15s ease, border-color .15s ease, background .15s ease, color .15s ease;}
.cat-icon-swatch:hover{transform:scale(1.1);}
.cat-icon-swatch.active{background:var(--mint); border-color:var(--mint); color:var(--mint-ink);}
/* Avatar rotondo colore-categoria + icona, usato nelle righe movimento (stile Revolut) */
.cat-avatar{display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0; color:#fff; position:relative; transition:background .2s ease;}
.cat-avatar-icon, .cat-avatar-check{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition:opacity .22s ease, transform .3s cubic-bezier(.34,1.56,.64,1);}
.cat-avatar-check{opacity:0; transform:scale(.4);}
.mov-row.selected .cat-avatar-icon{opacity:0; transform:scale(.4);}
.mov-row.selected .cat-avatar-check{opacity:1; transform:scale(1);}
.mov-row.selected .cat-avatar{background:var(--mint) !important;}
.etichetta-color-swatch, .cat-color-swatch{width:22px; height:22px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer; position:relative; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s ease, border-color .15s ease;}
.etichetta-color-swatch:hover, .cat-color-swatch:hover{transform:scale(1.12);}
.etichetta-color-swatch.active, .cat-color-swatch.active{border-color:var(--text);}
.etichetta-color-swatch.active::after, .cat-color-swatch.active::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.55);}
.cm-sub-drag:active{cursor:grabbing;}
.cm-sub-drag:hover{color:var(--text);}
.cm-sub-item.dragging{opacity:.35;}
.cm-sub-item.drag-over-top{box-shadow:inset 0 2px 0 var(--mint);}
.cm-sub-item.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--mint);}
.cm-sub-label{font-size:13px; color:var(--text-dim); flex:1;}
.cm-empty{padding:12px 4px; font-size:12px; color:var(--text-faint); text-align:center;}
.cm-body .add-inline{padding:10px 14px 14px; margin-top:0;}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-3); border:1px solid var(--border); padding:11px 14px 11px 20px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s; z-index:200; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px;}
.chart-value-bubble{
  position:fixed; z-index:250; background:var(--surface-3); border:1px solid var(--border);
  padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700; color:var(--text);
  opacity:0; transform:scale(.9); pointer-events:none; transition:opacity .18s ease, transform .18s cubic-bezier(.22,.68,0,1);
  box-shadow:var(--shadow); white-space:nowrap;
}
.chart-value-bubble.show{opacity:1; transform:scale(1);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
.toast-undo-btn{background:var(--mint); color:var(--mint-ink); border:none; padding:6px 13px; border-radius:7px; font-size:12.5px; font-weight:700; cursor:pointer; flex-shrink:0;}
.toast-undo-btn:hover{filter:brightness(1.08);}

.search-box{position:relative; margin-bottom:18px;}
.search-box input{width:100%; padding:13px 16px 13px 42px; font-size:14.5px; border-radius:12px;}
.search-box .ic{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-faint);}
.empty-state{text-align:center; padding:50px 20px; color:var(--text-faint);}
.welcome-empty{max-width:420px; margin:60px auto; text-align:center; padding:32px 24px;}
.welcome-empty-icon{width:64px; height:64px; margin:0 auto 18px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent,var(--mint));}
.welcome-empty h2{font-size:19px; margin-bottom:8px;}
.welcome-empty p{color:var(--text-dim); font-size:13.5px; line-height:1.55; margin-bottom:22px;}
.welcome-empty-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.shortcut-kbd{
  font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color:var(--text-dim);
  background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:5px 9px;
  white-space:nowrap;
}
.pwa-update-banner{
  position:fixed; left:50%; bottom:18px; transform:translate(-50%,140%); z-index:500;
  display:flex; align-items:center; gap:14px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:12px; padding:11px 12px 11px 16px; box-shadow:0 10px 30px rgba(0,0,0,.28);
  font-size:13px; font-weight:600; color:var(--text); transition:transform .3s cubic-bezier(.22,.68,0,1);
}
.pwa-update-banner.show{transform:translate(-50%,0);}
@media(max-width:880px){ .pwa-update-banner{ bottom:calc(74px + env(safe-area-inset-bottom,0px)); left:16px; right:16px; transform:translateY(140%); } .pwa-update-banner.show{transform:translateY(0);} }
.empty-state .ic{font-size:30px; margin-bottom:10px;}
.section-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:22px 0 10px;}
.section-label:first-child{margin-top:0;}

/* ---------- PROSSIME SCADENZE ---------- */
.scad-row{display:flex; align-items:flex-start; gap:13px; padding:12px 6px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .12s;}
.scad-row:last-child{border-bottom:none;}
.scad-row:hover{background:var(--surface-2);}
.scad-ic{font-size:17px; flex-shrink:0; width:22px; text-align:center; margin-top:1px;}
.scad-info{flex:1; display:flex; flex-direction:column; min-width:0; gap:2px;}
.scad-label{font-size:13.5px; font-weight:600; white-space:normal; overflow-wrap:break-word; line-height:1.3;}
.scad-sub{font-size:11.5px; color:var(--text-faint);}
.scad-date{font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono'; flex-shrink:0; margin-top:1px;}
.scad-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; margin-left:8px;}

/* ---------- BACKUP BANNER ---------- */
.backup-banner{
  background:rgba(245,185,92,.12); border:1px solid rgba(245,185,92,.4); border-radius:12px;
  padding:12px 18px; margin-bottom:22px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
}
.backup-banner-text{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text); flex:1; min-width:220px;}
.backup-banner-text .ic{font-size:18px; flex-shrink:0;}
.backup-banner-actions{display:flex; gap:8px; flex-shrink:0;}

/* ---------- ACCORDION (Dettaglio spese) ---------- */
.acc-item{border-bottom:1px solid var(--border-soft);}
.acc-item:last-child{border-bottom:none;}
.acc-head{display:flex; align-items:center; gap:12px; padding:12px 4px; cursor:pointer; user-select:none;}
.acc-head:hover{background:var(--surface-2);}
.acc-chevron{font-size:11px; color:var(--text-faint); transition:transform .2s; width:14px; text-align:center;}
.acc-item.open .acc-chevron{transform:rotate(90deg);}
.acc-cat{flex:1; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px;}
.acc-amt{font-family:'JetBrains Mono'; font-size:13px; font-weight:600;}
.acc-pct{font-size:11.5px; color:var(--text-faint); width:52px; text-align:right;}
.acc-bar-wrap{background:var(--surface-3); border-radius:4px; height:6px; width:90px; overflow:hidden;}
.acc-bar{height:100%;}
.acc-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.acc-item.open .acc-body{max-height:600px;}
.acc-sub-row{display:flex; justify-content:space-between; padding:7px 4px 7px 34px; font-size:12.5px; color:var(--text-dim); border-top:1px dashed var(--border-soft);}
.acc-sub-row b{color:var(--text); font-family:'JetBrains Mono'; font-weight:500;}

/* ---------- SEARCH STATS ---------- */
.search-stats{display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.stat-chip{background:var(--surface); border:1px solid var(--border-soft); border-radius:10px; padding:11px 18px; box-shadow:var(--shadow); flex:1; min-width:160px;}
.stat-chip .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
.stat-chip .val{font-family:'JetBrains Mono'; font-size:19px; font-weight:600; margin-top:4px;}

/* ---------- VIEW TOGGLE ---------- */
.view-toggle{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px;}
.sub-toolbar-mobile{display:none;}
.view-toggle button{background:none; border:none; padding:6px 13px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--text-dim);}
.view-toggle button.active{background:var(--surface-3); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.15);}
.sub-scad-line{font-size:11.5px; color:var(--text-dim); display:flex; justify-content:space-between;}
.sub-scad-line b{color:var(--text); font-weight:600;}

/* ---------- BULK SELECT ---------- */
.sel-check{display:inline-flex; align-items:center; gap:6px; cursor:pointer;}
.sel-check input[type="checkbox"]{
  appearance:none; -webkit-appearance:none; width:19px; height:19px; border-radius:6px;
  border:1.5px solid var(--border); background:var(--surface); position:relative; flex-shrink:0; cursor:pointer; margin:0;
}
.sel-check input[type="checkbox"]:checked{background:var(--mint); border-color:var(--mint); animation:checkPop .32s cubic-bezier(.34,1.56,.64,1);}
@keyframes checkPop{0%{transform:scale(.7);} 60%{transform:scale(1.18);} 100%{transform:scale(1);}}
.sel-check input[type="checkbox"]:checked::after{
  content:''; position:absolute; left:6px; top:2px; width:5px; height:10px;
  border:solid var(--mint-ink); border-width:0 2px 2px 0; transform:rotate(45deg);
}
/* checkbox "seleziona tutto il mese": nettamente più grande e con un colore diverso rispetto
   a quelle dei singoli movimenti, per un colpo d'occhio immediato sull'inizio di ogni mese */
.month-sel-check{margin-left:-4px; padding:3px; border-radius:7px; background:var(--surface-3);}
.month-sel-check input[type="checkbox"]{width:19px; height:19px; accent-color:var(--mint); box-shadow:0 0 0 2px var(--mint) inset;}
.search-bulk-bar{
  display:grid; grid-template-rows:0fr; opacity:0; margin-bottom:0;
  transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .22s ease, margin-bottom .32s cubic-bezier(.4,0,.2,1);
}
.search-bulk-bar.is-visible{grid-template-rows:1fr; opacity:1; margin-bottom:14px;}
.search-bulk-bar .bb-inner{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; overflow:hidden; min-height:0;
  background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:9px 16px; font-size:12.5px; font-weight:600; color:var(--text-dim);
  box-shadow:inset 2.5px 0 0 var(--mint), var(--shadow);
}
.search-bulk-bar .selCount b{color:var(--mint); font-size:13.5px;}
.search-bulk-bar .bb-sep{width:1px; align-self:stretch; background:var(--border-soft); margin:0 2px;}
#movBulkBar{position:sticky; top:10px; z-index:30; box-shadow:var(--shadow);}
th.check-col, td.check-col{width:32px;}
th.src-col, td.src-col{width:26px; text-align:center; padding-left:0; padding-right:0;}
.src-badge{font-size:10px; padding:2px 7px; border-radius:5px; font-weight:700; text-transform:uppercase;}
.src-mov{background:var(--blue-dim); color:var(--blue);}
.src-sub{background:var(--violet-dim); color:var(--violet);}
.src-auto{background:var(--coral-dim); color:var(--coral);}

@media(max-width:880px){
  .sidebar{transform:translateX(-100%); width:260px !important;}
  .sidebar.open{transform:translateX(0);}
  .sidebar.collapsed{width:260px !important; padding-left:16px; padding-right:16px;}
  .sidebar.collapsed .brand-text, .sidebar.collapsed .brand-sub, .sidebar.collapsed .sidebar-footer{display:block;}
  .sidebar.collapsed .brand{justify-content:flex-start; padding:4px 10px 18px;}
  .sidebar.collapsed .nav-item{justify-content:flex-start; padding:10px 12px;}
  .sidebar.collapsed .nav-item .nav-label{display:inline;}
  .sidebar-toggle{display:none;}
  .sidebar-edge-toggle{display:none;}
  .mobile-topbar{display:flex;}
  .mobile-tabbar{display:flex;}
  /* Il titolo/sottotitolo di pagina è ora nell'header persistente in alto: nasconde il vecchio
     blocco "topbar" di ogni scheda (solo il primo, quello principale — non le intestazioni
     interne di sezione come "Manutenzione", "Assicurazione" ecc.) */
  .view > .topbar{display:none;}
  main{margin-left:0; padding:10px 16px 96px; max-width:100vw; overflow-x:hidden;}
  /* "Importa estratti conto" resta un'opzione solo desktop; "+ Nuovo movimento" è ridondante
     col "+" contestuale in alto, quindi nasconde entrambi solo su mobile. */
  #btnImportExcel, #btnNewMov{display:none !important;}
  /* Card "modulo" (grafici, dettaglio spese, sezioni impostazioni/auto): alleggerite ma
     non eliminate, per mantenere un minimo di separazione tra blocchi diversi. */
  .card{padding:14px 16px; box-shadow:none;}
  /* Card "elenco" (liste di movimenti/voci): niente più riquadro, solo righe pulite
     separate da un filo sottile — vedi anche i wrapper con classe .list-card più sotto. */
  .card.list-card{padding:0; border:none; box-shadow:none; background:transparent; border-radius:0;}
  .mov-year-group.list-card{border-bottom:1px solid var(--border-soft); margin-bottom:0;}
  .mov-year-group.list-card:last-child{border-bottom:none;}
  .mov-year-group.list-card .mov-year-head{padding:14px 2px;}
  .mov-year-group.list-card .mov-year-body{margin-top:0;}
  /* Dettaglio Spese: la barra di progresso a larghezza fissa (90px) accanto a percentuale
     e importo non ci sta sui telefoni stretti — la nascondiamo, la percentuale resta comunque
     visibile. */
  .acc-bar-wrap{display:none;}
  .acc-head{gap:8px;}
  /* Prossime Scadenze: nome libero di andare a capo, data+badge in colonna fissa a destra */
  .scad-row{align-items:flex-start;}
  .scad-label{white-space:normal;}
  /* Abbonamenti: la toolbar di ordinamento/vista viveva dentro il vecchio topbar di pagina,
     ora nascosto su mobile — le viene dato un posto proprio, sempre visibile. */
  .sub-toolbar-mobile{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  /* Storico Manutenzione: righe piatte, azioni nascoste finché non si tocca la riga */
  .ledger-manut thead{display:none;}
  .ledger-manut, .ledger-manut tbody{display:block; width:100%;}
  .ledger-manut tr[data-id]{
    display:flex; flex-wrap:wrap; align-items:baseline; column-gap:10px; row-gap:3px;
    padding:12px 4px; border-bottom:1px solid var(--border-soft); cursor:pointer;
    transition:background .15s ease; white-space:normal;
  }
  .ledger-manut tr[data-id].row-expanded{background:var(--surface-2);}
  .ledger-manut tr[data-id] td{padding:0 !important; border:none !important; background:transparent !important; position:static !important; box-shadow:none !important; width:auto; white-space:normal;}
  .ledger-manut tr[data-id] td:nth-child(2){order:1; flex:1; min-width:0; font-size:14px; font-weight:700; color:var(--text);}
  .ledger-manut tr[data-id] td.num{order:2; margin-left:auto; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-weight:800; font-size:14px;}
  .ledger-manut tr[data-id] td:nth-child(1){order:3; flex-basis:100%; font-size:11.5px; color:var(--text-faint);}
  .ledger-manut tr[data-id] td:nth-child(3){order:4; font-size:11.5px; color:var(--text-faint);}
  .ledger-manut tr[data-id] td:nth-child(3):not(:empty)::before{content:'·'; margin-right:6px; color:var(--text-faint);}
  .ledger-manut tr[data-id] td:last-child{display:none;}
  .ledger-manut tr[data-id].row-expanded td:last-child{display:block; order:9; flex-basis:100%; margin-top:6px;}
  .ledger-manut tr[data-id].row-expanded td:last-child .row-actions{opacity:1; pointer-events:auto; justify-content:flex-end;}
  /* Bottoni azione della scheda Movimenti: meno padding, testo più corto, niente animazione */
  .topbar-actions{gap:6px; flex-wrap:wrap;}
  .topbar-actions .btn{padding:7px 12px; font-size:12px;}
  .btn-label-full{display:none;}
  .btn-label-short{display:inline;}
  .btn-import .spark{display:none;}
  /* Valori nelle card KPI (inclusi km totali/medi in Macchina): testo più piccolo e
     card meno "grasse" così il numero ci sta sempre per intero, senza tagli. */
  .kpi-card{padding:13px 14px;}
  .kpi-value{font-size:18px;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .field-row{grid-template-columns:1fr;}
  .month-grid{grid-template-columns:repeat(6,1fr); max-width:none;}
  .time-reset-btn{margin-left:0;}
  /* ---------- Filtri Anni/Mesi (Dashboard + Ricerca): redesign minimale mobile ---------- */
  .time-selector{border:1px solid var(--border-soft); box-shadow:none; border-radius:16px; padding:16px; gap:18px;}
  .time-selector-row{gap:8px;}
  .time-selector-label{font-size:10px; letter-spacing:.06em; width:auto;}
  .pill{border:none; background:none; color:var(--text-dim); padding:9px 16px; font-size:12.5px; font-weight:600; flex-shrink:0;}
  .pill.active{background:var(--surface-3); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.15); font-weight:700;}
  .month-tile{border:none; background:none; padding:10px 2px; border-radius:11px; font-weight:600;}
  .month-tile.active{background:var(--surface-3); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.15); font-weight:700;}
  .month-grid{background:var(--surface-2); border-radius:14px; padding:3px;}
  /* Riga "Anni": non va più a capo (vedi anche #yearPills/#searchYearPills sopra, validi anche
     su desktop). I pulsanti (selezione multipla / reset) restano ancorati alla fine della riga
     stessa: zero rischio di sovrapposizioni o spazi vuoti, qualunque sia il numero di anni. */
  .time-selector-row:first-child{flex-wrap:nowrap; align-items:center;}
  #btnMultiToggle, #btnSearchMultiToggle, #btnResetSearchFilters{
    flex-shrink:0; margin:0 !important; border:none; background:var(--surface-2);
  }
  #btnMultiToggle, #btnSearchMultiToggle{width:32px; height:32px;}
  #btnResetSearchFilters{height:32px; padding:0 12px; font-size:11px; border-radius:9px; display:flex; align-items:center; gap:4px;}
  #btnResetSearchFilters svg{width:13px; height:13px;}
  .icon-toggle-btn.active{background:var(--mint-dim); color:var(--mint);}
  /* fix overflow totali anno nella scheda Movimenti */
  .mov-year-head{flex-wrap:wrap; row-gap:4px;}
  .mov-year-totals{margin-left:0; width:100%; justify-content:flex-end; font-size:11.5px; gap:10px;}
  /* fix overflow campi Da/A nel filtro importo della scheda Ricerca */
  .amount-range-group{flex-wrap:wrap; gap:6px; margin-left:0;}
  .amount-range-group input[type="number"]{max-width:104px !important; min-width:0;}
  /* fix icone Modifica/Elimina tagliate a destra delle righe movimenti su mobile:
     su schermi touch non esiste :hover, quindi rendiamo le azioni sempre visibili.
     Ancoriamo SOLO la colonna delle azioni (a destra) così restano sempre raggiungibili;
     non ancoriamo anche quella delle checkbox per non "rubare" troppa larghezza alla parte
     scorrevole, che altrimenti diventa troppo stretta per leggere i testi per intero. */
  .row-actions{opacity:1;}
  /* Card Abbonamenti: le azioni si mostrano solo toccando la card (classe .expanded via JS).
     pointer-events:none anche nello stato nascosto: anche in caso di stati intermedi/animazioni
     impreviste, i pulsanti restano fisicamente non cliccabili finché la card non è espansa. */
  .sub-card-top .row-actions{display:none; opacity:0; pointer-events:none;}
  .sub-card.expanded .sub-card-top .row-actions{display:flex; opacity:1; pointer-events:auto;}
  .sub-card.expanded{border-color:var(--mint);}
  .table-scroll table td:last-child, .table-scroll table th:last-child{
    position:sticky; right:0; background:var(--surface); box-shadow:-6px 0 8px -6px rgba(0,0,0,.25);
    padding-left:6px; padding-right:6px;
  }
  .table-scroll .group-row td:last-child{background:var(--surface-2); box-shadow:none;}
}

/* ---------- PRINT / PDF REPORT ---------- */
.print-report{display:none;}
@media print{
  body{background:#fff;}
  #app, #modalBackdrop, #toast, .mobile-topbar, #overlay, #backupBanner{display:none !important;}
  .print-report{
    display:block !important; background:#fff; color:#111; padding:0; margin:0;
    font-family:'Inter',sans-serif;
  }
  .print-report .money{filter:none !important;}
  .pr-head{display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #111; padding-bottom:12px; margin-bottom:18px;}
  .pr-head h1{font-size:19px; font-family:'Space Grotesk',sans-serif; letter-spacing:-.02em;}
  .pr-head .pr-sub{font-size:11px; color:#555; margin-top:3px;}
  .pr-head .pr-date{font-size:10.5px; color:#555; text-align:right;}
  .pr-kpis{display:flex; gap:14px; margin-bottom:20px;}
  .pr-kpi{flex:1; border:1px solid #ccc; border-radius:8px; padding:10px 14px;}
  .pr-kpi .lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:#666; font-weight:700;}
  .pr-kpi .val{font-family:'JetBrains Mono'; font-size:16px; font-weight:700; margin-top:4px;}
  .pr-section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#333; margin:20px 0 8px; border-bottom:1px solid #ddd; padding-bottom:5px;}
  .print-report table{width:100%; border-collapse:collapse; font-size:11px; margin-bottom:4px;}
  .print-report thead th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:#555; padding:5px 8px; border-bottom:1px solid #999;}
  .print-report tbody td{padding:5px 8px; border-bottom:1px solid #e2e2e2;}
  .print-report td.num, .print-report th.num{text-align:right; font-family:'JetBrains Mono';}
  .print-report tr{page-break-inside:avoid;}
  .pr-footer{margin-top:22px; font-size:9.5px; color:#888; border-top:1px solid #ddd; padding-top:8px;}
  @page{margin:16mm 14mm;}
}
</style>

   restano il meccanismo di migrazione: ogni volta che si aggiunge un campo nuovo al DB, la relativa
   ensure*() lo popola se mancante. DB_SCHEMA_VERSION va incrementato quando si introduce una modifica
   di schema non retrocompatibile, per poter in futuro condizionare migrazioni specifiche a "se la
   versione salvata è < N, fai X" invece di controlli sparsi sui singoli campi. */
const DB_SCHEMA_VERSION = 2;
function ensureSchemaVersion(){
  if(typeof DB.version !== 'number') DB.version = 1; // dati salvati prima dell'introduzione del versioning
  DB.version = DB_SCHEMA_VERSION;
}

function loadDB(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){
    try{ DB = JSON.parse(raw); ensureMetodiPagamento(); ensureEtichette(); ensureCategorieColori(); ensureCategorieIcone(); ensureCategorieAbbonamenti(); ensureLinkUtiliGenerici(); ensureWelfare(); ensurePianificati(); ensureAutoLinkUtili(); ensureSchemaVersion(); return; }catch(e){ console.warn('DB corrotto, ripristino seed'); }
  }
  DB = JSON.parse(JSON.stringify(SEED_DATA));
  DB.linkUtili_urls = {};
  ensureMetodiPagamento();
  ensureEtichette();
  ensureCategorieColori();
  ensureCategorieIcone();
  ensureCategorieAbbonamenti();
  ensureLinkUtiliGenerici();
  ensureWelfare();
  ensurePianificati();
  ensureAutoLinkUtili();
  ensureSchemaVersion();
  saveDB();
}
// Migra i Link Utili della scheda Macchina (vecchio formato {categoria, link1, link2} + DB.linkUtili_urls)
// nello stesso formato {id, nome, url} già usato in Impostazioni, così da poterli gestire con CRUD completo
// (solo link a pagine web, coerente con la regola di Impostazioni).
function ensureAutoLinkUtili(){
  const isNewShape = Array.isArray(DB.auto.linkUtili) && DB.auto.linkUtili.every(l=>l && typeof l==='object' && 'url' in l && !('link1' in l));
  if(isNewShape) return;
  const old = Array.isArray(DB.auto.linkUtili) ? DB.auto.linkUtili : [];
  const urls = DB.linkUtili_urls || {};
  const migrated = [];
  old.forEach((l,i)=>{
    const key1 = l.categoria+'_1', key2 = l.categoria+'_2';
    if(l.link1) migrated.push({ id: uid('alu'), nome: l.categoria + (l.link2?' — '+l.link1:''), url: urls[key1] || '' });
    if(l.link2) migrated.push({ id: uid('alu'), nome: l.categoria + ' — ' + l.link2, url: urls[key2] || '' });
  });
  DB.auto.linkUtili = migrated.filter(l=>l.url);
}

    DB.metodiPagamento = ['Conto corrente','PayPal','Satispay','Revolut','Bancomat/Contanti','Tessera Welfare'];

// Somma di tutte le uscite registrate col metodo "Tessera Welfare" (usa il metodo effettivo, compatibile
// con i movimenti storici) e rimanenza rispetto al Premio impostato manualmente dall'utente.
function welfareStats(){
  const rows = movimentiForTotals(DB.movimenti.filter(m=>movimentoMetodoEffettivo(m)==='Tessera Welfare'));
  const entrate = rows.reduce((s,m)=>s+(m.entrate||0),0);
  const uscite = rows.reduce((s,m)=>s+(m.uscite||0),0);
  return { entrate, uscite, saldo: entrate - uscite };
}

  gdriveSchedulePush();

/* ---- Indice movimenti per anno ----
   getYears() e filteredMovimenti() venivano chiamati molto spesso (ogni render di Dashboard/Movimenti/
   Ricerca) e ciascuno riscandiva l'intero array DB.movimenti da zero. Con pochi movimenti la differenza
   è impercettibile, ma con anni di storico accumulato il costo cresce linearmente ad ogni singolo render.
   _movIndex raggruppa i movimenti per anno una sola volta e viene invalidato automaticamente da saveDB()
   ad ogni modifica dei dati, quindi resta sempre coerente senza bisogno di gestirlo manualmente altrove. */
let _movIndex = null;
function invalidateMovIndex(){ _movIndex = null; }
function movIndex(){
  if(_movIndex) return _movIndex;
  const byYear = {};
  DB.movimenti.forEach(m=>{
    if(!m.data) return;
    const y = m.data.slice(0,4);
    (byYear[y] = byYear[y] || []).push(m);
  });
  _movIndex = { byYear, years: Object.keys(byYear).sort().reverse() };
  return _movIndex;
}

/* ---- Avanzamento automatico scadenze per abbonamenti a rinnovo "Automatico" ---- */
function advanceAutoRenewals(){
  if(!Array.isArray(DB.abbonamenti)) return;
  const today = new Date(); today.setHours(0,0,0,0);
  let changed = false;
  DB.abbonamenti.forEach(a=>{
    if(a.rinnovo!=='Automatico' || a.stato!=='Attivo' || !a.scadenza || !a.mesi) return;
    let dt = new Date(a.scadenza+'T00:00:00');
    if(isNaN(dt)) return;
    let advanced = false;
    while(dt < today){
      dt.setMonth(dt.getMonth()+a.mesi);
      advanced = true;
    }
    if(advanced){
      a.scadenza = dt.toISOString().slice(0,10);
      changed = true;
    }
  });
  if(changed) saveDB();
}

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* Ritarda l'esecuzione di fn finché non passano `wait` ms senza nuove chiamate: usata sui campi di
   testo della Ricerca per non ricalcolare i risultati ad ogni singolo carattere digitato. */
function debounce(fn, wait){
  let t = null;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(()=>fn.apply(this,args), wait);
  };
}

const fmtEUR = n => (n===null||n===undefined||isNaN(n)) ? '—' : `<span class="money">${n.toLocaleString('it-IT',{style:'currency',currency:'EUR'})}</span>`;
const fmtNum = n => (n===null||n===undefined||isNaN(n)) ? '—' : n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtKm = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(n).toLocaleString('it-IT');
/* Classe colore per un saldo: verde se positivo, rosso se negativo, giallo se in pareggio (soglia di mezzo centesimo per arrotondamenti). */
function saldoClass(v){ return Math.abs(v) < 0.005 ? 'even' : (v > 0 ? 'pos' : 'neg'); }

/* Mini-grafico SVG senza assi/legenda per le card KPI della Dashboard: dà un colpo d'occhio sul trend
   degli ultimi periodi senza dover aprire il grafico grande. SVG puro (non un'istanza Chart.js in più)
   per restare leggero visto che se ne possono disegnare diversi per render. */
function sparklineSVG(values, colorVar, w, h){
  w = w || 100; h = h || 26;
  if(!values || values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const step = w / (values.length - 1);
  const pts = values.map((v,i)=> `${(i*step).toFixed(1)},${(h - ((v-min)/range)*(h-3) - 1.5).toFixed(1)}`).join(' ');
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${colorVar}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* ==================== MICRO-ANIMAZIONE NUMERI ====================
   Anima un valore numerico dal precedente (startValue) al nuovo (endValue), scorrendo le cifre
   invece di aggiornarle di scatto. startValue va passato dal chiamante (tipicamente conservato in
   una variabile di modulo tra un render e l'altro): se è null/undefined, il valore viene solo
   impostato senza animazione (es. primo caricamento). */
function animateNumber(el, startValue, endValue, formatFn, duration){
  if(!el) return;
  formatFn = formatFn || fmtEUR;
  duration = duration || 700;
  const safeEnd = (endValue===null||endValue===undefined||isNaN(endValue)) ? 0 : endValue;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(el._animFrame){ cancelAnimationFrame(el._animFrame); el._animFrame = null; }
  if(reduceMotion || startValue===null || startValue===undefined || isNaN(startValue) || startValue===safeEnd){
    el.innerHTML = formatFn(safeEnd);
    return;
  }
  const t0 = performance.now();
  const step = (now)=>{
    const p = Math.min(1, (now-t0)/duration);
    const eased = 1 - Math.pow(1-p, 3); // ease-out cubic
    el.innerHTML = formatFn(startValue + (safeEnd-startValue)*eased);
    if(p<1){ el._animFrame = requestAnimationFrame(step); }
    else { el._animFrame = null; el.innerHTML = formatFn(safeEnd); }
  };
  el._animFrame = requestAnimationFrame(step);
}
/* Effetto "contachilometri": ogni cifra scivola verticalmente al proprio posto con un
   piccolo sfalsamento da sinistra a destra, invece del semplice count-up. I separatori
   (punto delle migliaia, spazio, "km") restano statici. */
function animateOdometer(el, endValue, formatFn){
  if(!el) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const text = formatFn(endValue===null||endValue===undefined||isNaN(endValue) ? 0 : endValue);
  if(reduceMotion){ el.textContent = text; return; }
  el.innerHTML = text.split('').map((c,i)=>{
    if(/[0-9]/.test(c)) return `<span class="odo-digit" style="animation-delay:${i*30}ms">${c}</span>`;
    return `<span class="odo-static">${esc(c)}</span>`;
  }).join('');
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
}
/* Data breve senza anno ("30 Ago"), per l'intestazione dei blocchi giorno in Movimenti (mobile) */
function fmtDayShort(d){
  if(!d) return 'Senza data';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  const months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  return `${dt.getDate()} ${months[dt.getMonth()]}`;
}
function monthName(m){
  return ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'][m-1] || '';
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function countdownBadge(dateStr, labelIfNone, redAt, yellowAt){
  if(!dateStr) return `<span class="countdown cd-none">${labelIfNone||'Non impostata'}</span>`;
  redAt = redAt!==undefined ? redAt : 2;
  yellowAt = yellowAt!==undefined ? yellowAt : 5;
  const d = daysUntil(dateStr);
  let cls='cd-ok', txt='';
  if(d<0){ cls='cd-urgent'; txt=`Scaduta da ${Math.abs(d)}gg`; }
  else if(d===0){ cls='cd-urgent'; txt='Scade oggi'; }
  else if(d<=redAt){ cls='cd-urgent'; txt=`Tra ${d}gg`; }
  else if(d<=yellowAt){ cls='cd-soon'; txt=`Tra ${d}gg`; }
  else { cls='cd-ok'; txt=`Tra ${d}gg`; }
  return `<span class="countdown ${cls}">${txt}</span>`;
}
/* Bolla con l'importo, posizionata accanto al punto toccato (fetta della torta o voce di
   legenda) invece del toast generico in fondo alla pagina — resta sempre dentro lo schermo. */
function showChartValueBubble(msg, x, y){
  let el = document.getElementById('chartValueBubble');
  if(!el){
    el = document.createElement('div');
    el.id = 'chartValueBubble';
    el.className = 'chart-value-bubble';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove('show');
  const pad = 12;
  const w = el.offsetWidth || 120, h = el.offsetHeight || 34;
  let left = x - w/2;
  let top = y - h - 16;
  left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));
  if(top < pad) top = y + 16;
  top = Math.min(top, window.innerHeight - h - pad);
  el.style.left = left+'px';
  el.style.top = top+'px';
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = '';
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---- Toast con "Annulla" per le eliminazioni (5s) ---- */
function toastUndo(msg, restoreFn){
  const t = document.getElementById('toast');
  clearTimeout(toast._t);
  clearTimeout(t._undoTimeout);
  t.innerHTML = `<span>${esc(msg)}</span><button class="toast-undo-btn" id="toastUndoBtn">Annulla</button>`;
  t.classList.add('show');
  const btn = document.getElementById('toastUndoBtn');
  t._undoTimeout = setTimeout(()=>{ t.classList.remove('show'); }, 5000);
  btn.onclick = ()=>{
    clearTimeout(t._undoTimeout);
    t.classList.remove('show');
    restoreFn();
  };
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ico(name, size){
  size = size || 15;
  const inner = ICONS[name] || '';
  return `<svg class="ic-svg" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* ==================== ICONE METODI DI PAGAMENTO ====================
   PayPal e Revolut mantengono il loro aspetto storico (emoji 🅿️ / badge "R").
   Ogni altro metodo, se non ha un'icona personalizzata caricata in DB.metodiIcone,
   riceve un badge sintetico generato automaticamente (iniziali + colore stabile). */
const METODO_BADGE_PALETTE = ['#5FA8FF','#B592FF','#4FD1A5','#F5B942','#FF7A7A','#4FC3D9','#FF9AD5','#8C9EFF'];
function metodoBadgeColor(nome){
  let hash = 0;
  const s = String(nome||'');
  for(let i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) >>> 0; }
  return METODO_BADGE_PALETTE[hash % METODO_BADGE_PALETTE.length];
}
function metodoBadgeInitials(nome){
  const words = String(nome||'').trim().split(/\s+/).filter(Boolean);
  if(!words.length) return '?';
  if(words.length===1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0]+words[1][0]).toUpperCase();
}
// Restituisce l'HTML dell'icona per un metodo di pagamento: icona personalizzata caricata,
// aspetto storico per PayPal/Revolut, oppure badge sintetico automatico per tutti gli altri.
// extraAttrs (stringa opzionale) permette di aggiungere data-attribute/eventi a chi la usa (es. click per popup).
// size (opzionale, px) ingrandisce l'icona rispetto alla dimensione di default usata nelle liste (14px).
function metodoIconHtml(nome, extraAttrs, size){
  extraAttrs = extraAttrs || '';
  if(!nome || nome==='Conto corrente') return ''; // "Conto corrente" è il metodo predefinito: nessuna icona, ovunque
  const sizeStyle = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size*0.55)}px;border-radius:${Math.round(size*0.2)}px;` : '';
  const custom = DB.metodiIcone && DB.metodiIcone[nome];
  if(custom) return `<span class="mov-metodo-icon-img" style="background-image:url('${custom}');background-size:cover;${sizeStyle}" title="${esc(nome)}" ${extraAttrs}></span>`;
  if(nome==='PayPal') return `<span class="mov-src-badge" style="${sizeStyle}" title="${esc(nome)}" ${extraAttrs}>🅿️</span>`;
  if(nome==='Revolut') return `<span class="mov-src-badge-r" style="${sizeStyle}" title="${esc(nome)}" ${extraAttrs}>R</span>`;
  const bg = metodoBadgeColor(nome);
  return `<span class="mov-metodo-badge" style="background:${bg};${sizeStyle}" title="${esc(nome)}" ${extraAttrs}>${esc(metodoBadgeInitials(nome))}</span>`;
}
// Determina il metodo di pagamento "effettivo" di un movimento: usa metodoPagamento se presente,
// altrimenti (per compatibilità con i movimenti importati prima di questa funzione) lo deriva da fonteImport.
// Se il metodo non esiste più nell'elenco (es. eliminato dalle Impostazioni) non mostra nulla.
function movimentoMetodoEffettivo(m){
  let nome = m.metodoPagamento || null;
  if(!nome){
    if(m.fonteImport==='paypal_confirmato') nome = 'PayPal';
    else if(m.fonteImport==='revolut') nome = 'Revolut';
  }
  if(!nome || !DB.metodiPagamento.includes(nome)) return null;
  return nome;
}
// Icona cliccabile (apre lo storico movimenti di quel metodo) da usare nella colonna "src-col" delle liste.
function movimentoMetodoIconHtml(m){
  const nome = movimentoMetodoEffettivo(m);
  if(!nome) return '';
  return metodoIconHtml(nome, `data-src-history="${esc(nome)}"`);
}
// Ridimensiona/comprime un'immagine caricata (PNG/JPG/WEBP) in un dataURL quadrato max 64x64, per non
// appesantire il file dell'app. Gli SVG, essendo vettoriali, vengono salvati così come sono (con un limite
// di peso). cb(dataURL|null, errore|null)
const METODO_ICON_MAX_SVG_BYTES = 40*1024; // 40KB
function processMetodoIconFile(file, cb){
  if(!file) return cb(null, 'Nessun file selezionato');
  if(file.type==='image/svg+xml' || /\.svg$/i.test(file.name||'')){
    if(file.size > METODO_ICON_MAX_SVG_BYTES) return cb(null, 'SVG troppo pesante (max 40KB)');
    const reader = new FileReader();
    reader.onload = ()=> cb(reader.result, null);
    reader.onerror = ()=> cb(null, 'Errore nella lettura del file');
    reader.readAsDataURL(file);
    return;
  }
  if(!/^image\//.test(file.type)) return cb(null, 'Formato non supportato: usa PNG, JPG, WEBP o SVG');
  const img = new Image();
  const reader = new FileReader();
  reader.onload = ()=>{
    img.onload = ()=>{
      const SIZE = 64;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      // Copre il quadrato mantenendo le proporzioni (crop centrale), così l'icona riempie bene il badge.
      const ratio = Math.max(SIZE/img.width, SIZE/img.height);
      const w = img.width*ratio, h = img.height*ratio;
      ctx.drawImage(img, (SIZE-w)/2, (SIZE-h)/2, w, h);
      cb(canvas.toDataURL('image/png', 0.9), null);
    };
    img.onerror = ()=> cb(null, 'Immagine non valida');
    img.src = reader.result;
  };
  reader.onerror = ()=> cb(null, 'Errore nella lettura del file');
  reader.readAsDataURL(file);
}

/* ---- Helper generici: elimina un elemento da un array (per id) con Annulla ---- */
/* ==================== FLIP generico: le righe/card sottostanti scivolano per riempire lo
   spazio quando una viene rimossa (o si ripristina con "Annulla"), invece di scattare di
   colpo nella nuova posizione. Riusa la stessa tecnica già usata per il riordino abbonamenti,
   generalizzata a qualunque elemento con [data-id] visibile in quel momento. ==================== */
function flipCapture(){
  const rects = {};
  document.querySelectorAll('#mainContent [data-id]').forEach(el=>{
    rects[el.dataset.id] = el.getBoundingClientRect();
  });
  return rects;
}
function flipPlay(oldRects, extraDelay){
  const matched = [];
  document.querySelectorAll('#mainContent [data-id]').forEach(el=>{
    const old = oldRects[el.dataset.id];
    if(!old) return;
    const now = el.getBoundingClientRect();
    const dy = old.top - now.top;
    if(Math.abs(dy) < 1) return;
    matched.push({el, dy});
  });
  matched.forEach(({el, dy}, i)=>{
    el.style.transition = 'none';
    el.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(()=>{
      el.style.transition = `transform .32s cubic-bezier(.4,0,.2,1) ${extraDelay?Math.min(i*22,150):0}ms`;
      el.style.transform = '';
    });
  });
}
function removeByIdWithUndo(arr, id, message, onDone){
  const idx = arr.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const oldRects = flipCapture();
  const [removed] = arr.splice(idx,1);
  saveDB();
  onDone();
  requestAnimationFrame(()=>flipPlay(oldRects));
  toastUndo(message, ()=>{
    const oldRects2 = flipCapture();
    arr.push(removed);
    saveDB(); toast('Ripristinato'); onDone();
    requestAnimationFrame(()=>flipPlay(oldRects2));
  });
}
function removeManyByIdWithUndo(arr, ids, message, onDone){
  const idSet = new Set(ids);
  const removed = arr.filter(x=>idSet.has(x.id));
  if(!removed.length) return;
  const oldRects = flipCapture();
  const kept = arr.filter(x=>!idSet.has(x.id));
  arr.length = 0; arr.push(...kept);
  saveDB();
  onDone();
  // "Effetto domino": le righe rimaste scivolano su con un piccolo sfalsamento a cascata,
  // invece di spostarsi tutte insieme in un colpo solo.
  requestAnimationFrame(()=>flipPlay(oldRects, true));
  toastUndo(message, ()=>{
    const oldRects2 = flipCapture();
    arr.push(...removed);
    saveDB(); toast('Ripristinati'); onDone();
    requestAnimationFrame(()=>flipPlay(oldRects2, true));
  });
}

  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(LS_THEME, theme);
  updateQuickThemeIcons();
  applyAccentVars(); // le varianti main/dim/ink dell'accento cambiano tra chiaro e scuro
  Object.keys(charts).forEach(k=>{ if(charts[k]) renderCurrentView(); });
}

function currentAccent(){
  const a = localStorage.getItem(LS_ACCENT);
  return (a && ACCENT_PALETTE[a]) ? a : 'mint';
}
function accentColors(){
  const conf = ACCENT_PALETTE[currentAccent()];
  return currentTheme()==='light' ? conf.light : conf.dark;
}
/* Applica solo le variabili CSS (usata anche al cambio tema, per ricalcolare le varianti chiaro/scuro) */
function applyAccentVars(){
  const c = accentColors();
  const sb = ACCENT_PALETTE[currentAccent()].sidebar;
  document.documentElement.style.setProperty('--mint', c.main);
  document.documentElement.style.setProperty('--mint-dim', c.dim);
  document.documentElement.style.setProperty('--mint-ink', c.ink);
  document.documentElement.style.setProperty('--sidebar-bg', `linear-gradient(180deg,${sb[0]},${sb[1]})`);
}
function applyAccent(key){
  if(!ACCENT_PALETTE[key]) key = 'mint';
  localStorage.setItem(LS_ACCENT, key);
  applyAccentVars();
  if(Object.keys(charts).some(k=>charts[k])) renderCurrentView();
}
function updateQuickThemeIcons(){
  const iconName = currentTheme()==='light' ? 'moon' : 'sun';
  const a = document.getElementById('themeIcon'); if(a) a.innerHTML = ico(iconName);
}
function toggleThemeQuick(){
  const next = currentTheme()==='light' ? 'dark' : 'light';
  applyTheme(next);

   (poche decine di ms totali) invece di comparire già completo. */
function typewriterSubtitle(){
  const view = document.querySelector('.view.active');
  const el = view && view.querySelector('.topbar .page-sub');
  if(!el) return;
  const text = el.textContent;
  if(!text || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.textContent = '';

  const step = ()=>{

    if(i < text.length) setTimeout(step, 10);
  };
  requestAnimationFrame(step);
}
