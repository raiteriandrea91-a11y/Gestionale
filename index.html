  });
  document.getElementById('pfCategoria').onchange = refreshDescOptions;
  refreshCatOptions();
  const metodoSel = document.getElementById('pfMetodoPagamento');
  const metodoOptions = ['Conto corrente', ...DB.metodiPagamento.filter(m=>m!=='Conto corrente')];
  metodoSel.innerHTML = metodoOptions.map(m=>`<option value="${esc(m)}" ${m===((editing&&editing.metodoPagamento)||'Conto corrente')?'selected':''}>${esc(m)}</option>`).join('');

  document.getElementById('pfClose').onclick = closeModal;
  document.getElementById('pfCancel').onclick = closeModal;
  if(editing) document.getElementById('pfDelete').onclick = ()=>{
    closeModal();
    removeByIdWithUndo(DB.pianificati, editing.id, 'Voce eliminata', onSaved || renderCurrentView);
  };
  document.getElementById('pfSave').onclick = async ()=>{
    const data = document.getElementById('pfData').value;
    let descSel = document.getElementById('pfDescrizione').value;
    if(descSel==='__custom'){
      descSel = ((await customPrompt('Specifica la descrizione:')) || '').trim();
    }
    const importo = parseFloat(document.getElementById('pfImporto').value);
    const categoria = document.getElementById('pfCategoria').value;
    const metodoPagamento = document.getElementById('pfMetodoPagamento').value || 'Conto corrente';
    const note = document.getElementById('pfNote').value.trim();

    const mancanti = [];
    if(!data) mancanti.push('Data');
    if(isNaN(importo) || importo<=0) mancanti.push('Importo');
    if(!categoria) mancanti.push('Categoria');
    if(curTipo==='uscita' && !descSel) mancanti.push('Dettaglio');
    if(!metodoPagamento) mancanti.push('Metodo di pagamento');
    if(mancanti.length){ toast(`Attenzione: compila ${mancanti.join(', ')}`); return; }

    if(editing){
      editing.tipo = curTipo; editing.data = data; editing.categoria = categoria; editing.descrizione = descSel || null;
      editing.importo = importo; editing.metodoPagamento = metodoPagamento; editing.note = note || null;
    } else {
      DB.pianificati.push({ id:uid('p'), tipo:curTipo, data, categoria, descrizione:descSel||null, importo, metodoPagamento, note: note||null });
    }
    saveDB(); closeModal(); toast('Voce pianificata salvata'); (onSaved || renderCurrentView)();
  };
}

    </div>
    <div class="modal-foot"><button class="btn" id="etrCloseBtn">Chiudi</button></div>

function wireLinkUtiliModal(){
  const listEl = document.getElementById('linkUtiliList');
  listEl.querySelectorAll('.editLinkUtili').forEach(b=>b.onclick = async ()=>{
    const item = DB.linkUtiliGenerici.find(l=>l.id===b.dataset.id);
    if(!item) return;
    const nuovoNome = await customPrompt('Nome del link:', item.nome);
    if(nuovoNome===null) return;
    const nuovoUrl = await customPrompt('URL:', item.url);
    if(nuovoUrl===null) return;
    if(!nuovoNome.trim() || !nuovoUrl.trim()) return;
    item.nome = nuovoNome.trim(); item.url = nuovoUrl.trim();
    saveDB(); refreshLinkUtiliModal();
  });
  listEl.querySelectorAll('.delLinkUtili').forEach(b=>b.onclick = ()=>{

    const removed = DB.linkUtiliGenerici.splice(idx,1)[0];
    saveDB(); refreshLinkUtiliModal();
    toastUndo(`Link "${removed.nome}" eliminato`, ()=>{
      DB.linkUtiliGenerici.splice(idx,0,removed); saveDB(); refreshLinkUtiliModal();
    });

/* ==================== SCORCIATOIE DA TASTIERA ====================
   Combinazioni Ctrl/Cmd+tasto (mai un tasto da solo, per non interferire mai con la digitazione
   normale nei campi di testo). Personalizzabili da Impostazioni; salvate in localStorage come
   preferenza del dispositivo/browser, non nei dati dell'app. */
const LS_SHORTCUTS = 'ledger_shortcuts_v1';
const DEFAULT_SHORTCUTS = [
  { id:'newMov', key:'n', label:'Nuovo movimento' },
  { id:'goDashboard', key:'1', label:'Vai a Dashboard' },
  { id:'goMovimenti', key:'2', label:'Vai a Movimenti' },
  { id:'goRicerca', key:'3', label:'Vai a Ricerca e Confronto' },
  { id:'goAbbonamenti', key:'4', label:'Vai ad Abbonamenti' },
  { id:'goAuto', key:'5', label:'Vai a Macchina' },
  { id:'goImpostazioni', key:'6', label:'Vai a Impostazioni' },
  { id:'focusSearch', key:'/', label:'Cerca (apre Ricerca e mette il focus sul testo)' }
];
const SHORTCUT_ACTIONS = {
  newMov: ()=>openMovModal(null, renderCurrentView),
  goDashboard: ()=>switchView('dashboard'),
  goMovimenti: ()=>switchView('movimenti'),
  goRicerca: ()=>switchView('ricerca'),
  goAbbonamenti: ()=>switchView('abbonamenti'),
  goAuto: ()=>switchView('auto'),
  goImpostazioni: ()=>switchView('impostazioni'),
  focusSearch: ()=>{
    switchView('ricerca');
    setTimeout(()=>{ const el=document.getElementById('searchTesto'); if(el) el.focus(); }, 60);
  }
};
function getCustomShortcuts(){
  try{ return JSON.parse(localStorage.getItem(LS_SHORTCUTS)) || {}; }catch(e){ return {}; }
}
function shortcutKeyFor(id){
  const custom = getCustomShortcuts();
  if(custom[id]!==undefined) return custom[id];
  const def = DEFAULT_SHORTCUTS.find(s=>s.id===id);
  return def ? def.key : '';
}
function setShortcutKey(id, key){
  const custom = getCustomShortcuts();
  custom[id] = key;
  localStorage.setItem(LS_SHORTCUTS, JSON.stringify(custom));
}
function resetShortcuts(){ localStorage.removeItem(LS_SHORTCUTS); }
let shortcutCaptureActive = false; // true mentre l'utente sta premendo il nuovo tasto in Impostazioni
function handleGlobalShortcut(e){
  if(shortcutCaptureActive) return;
  if(!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const key = e.key.toLowerCase();
  const match = DEFAULT_SHORTCUTS.find(s=>shortcutKeyFor(s.id)===key);
  if(match && SHORTCUT_ACTIONS[match.id]){
    e.preventDefault();
    SHORTCUT_ACTIONS[match.id]();
  }
}
document.addEventListener('keydown', handleGlobalShortcut);

function shortcutKeyDisplay(key){
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
  const mod = isMac ? '⌘' : 'Ctrl';
  return `${mod} + ${key==='/' ? '/' : key.toUpperCase()}`;
}
function openShortcutsModal(){
  const html = `
    <div class="modal-head"><h3>${ico('command')} Scorciatoie da Tastiera</h3><button class="close-x" id="scClose">${settingsCloseIcon()}</button></div>
    <div class="modal-body">
      <div class="page-sub" style="margin-bottom:12px;">Combinazioni con Ctrl (⌘ su Mac), utilizzabili da qualunque punto dell'app. Clicca "Cambia" e premi la combinazione che preferisci.</div>
      <div id="shortcutsList"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="scReset">Ripristina predefinite</button>
      <button class="btn btn-primary" id="scCloseBtn">Chiudi</button>
    </div>
  `;
  openSettingsPanel(html);
  document.getElementById('scClose').onclick = closeModal;
  document.getElementById('scCloseBtn').onclick = closeModal;
  document.getElementById('scReset').onclick = ()=>{ resetShortcuts(); renderShortcutsList(); };
  renderShortcutsList();
}
function renderShortcutsList(){
  const el = document.getElementById('shortcutsList');
  if(!el) return;
  el.innerHTML = DEFAULT_SHORTCUTS.map(s=>`
    <div class="slim-row" style="align-items:center;">
      <div class="slim-main" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <span style="font-weight:600; font-size:13.5px;">${esc(s.label)}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <kbd class="shortcut-kbd" id="scKey-${s.id}">${shortcutKeyDisplay(shortcutKeyFor(s.id))}</kbd>
          <button type="button" class="btn btn-sm scChangeBtn" data-id="${s.id}">Cambia</button>
        </div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.scChangeBtn').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.id;
      const kbdEl = document.getElementById('scKey-'+id);
      const originalText = kbdEl.textContent;
      kbdEl.textContent = 'Premi un tasto…';
      b.textContent = 'Annulla';
      shortcutCaptureActive = true;
      const finish = ()=>{
        shortcutCaptureActive = false;
        document.removeEventListener('keydown', onCapture, true);
        b.onclick = null;
        renderShortcutsList();
      };
      const onCapture = (e)=>{
        e.preventDefault(); e.stopPropagation();
        if(e.key==='Escape'){ finish(); return; }
        // Ignora la pressione dei soli tasti modificatori: aspettiamo il tasto "vero".
        if(['Control','Meta','Alt','Shift'].includes(e.key)) return;
        setShortcutKey(id, e.key.toLowerCase());
        finish();
      };
      document.addEventListener('keydown', onCapture, true);
      b.onclick = finish;
    };
  });
}

function openBulkEtichettaModal(ids, onDone, clearFn){
  clearFn = clearFn || (()=>movSelected.clear());
  let pending = [];
  const html = `
    <div class="modal-head"><h3>${ico('tag')} Etichette</h3><button class="close-x" id="betClose">✕</button></div>
    <div class="modal-body">
      <div class="page-sub" style="margin-bottom:12px;">Aggiungi una o più etichette a ${ids.length} moviment${ids.length===1?'o':'i'} selezionat${ids.length===1?'o':'i'}. Le etichette già presenti sui singoli movimenti restano intatte.</div>
      <div class="etichetta-field">
        <div class="tag-input-wrap">
          <div class="tag-chips" id="betChips"></div>
          <input type="text" id="betInput" placeholder="Scrivi e premi Invio…">
        </div>
        <div class="etichetta-suggest" id="betSuggest"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="betCancel">Annulla</button><button class="btn btn-primary" id="betApply">Applica</button></div>
  `;
  openModal(html);
  document.getElementById('modalBox').classList.add('modal-tags-bulk');
  wireEtichetteChipInput('betChips','betInput', ()=>pending, (v)=>{ pending = v; }, null, 'betSuggest');
  const close = closeModal;
  document.getElementById('betClose').onclick = close;
  document.getElementById('betCancel').onclick = close;
  document.getElementById('betApply').onclick = ()=>{
    const inputEl = document.getElementById('betInput');
    if(inputEl._commitPendingEtichetta) inputEl._commitPendingEtichetta();
    if(!pending.length){ toast('Scrivi almeno un\'etichetta'); return; }
    pending.forEach(t=>{ if(!DB.etichette.includes(t)) DB.etichette.push(t); });
    let count = 0;
    DB.movimenti.forEach(m=>{
      if(ids.includes(m.id)){
        m.etichette = Array.isArray(m.etichette) ? m.etichette.slice() : [];
        pending.forEach(t=>{ if(!m.etichette.includes(t)) m.etichette.push(t); });
        count++;
      }
    });
    clearFn();
    saveDB(); closeModal(); toast(`Etichette applicate a ${count} movimenti`); onDone();
  };
}
// Genera l'HTML della barra di selezione multipla, identica in ogni elenco/popup: appare solo quando
// almeno un elemento è selezionato, con conteggio, "Seleziona tutto", Annulla, (Etichette), (Metodo di

function bulkBarHtml(idPrefix, opts){

function openBulkCampiModal(ids, onDone, clearFn){
  onDone = onDone || renderCurrentView;
  clearFn = clearFn || (()=>{});
  const allCats = [...DB.categorieUscite.map(c=>({nome:c,tipo:'uscita'})), ...DB.categorieEntrate.map(c=>({nome:c,tipo:'entrata'}))];
  const html = `

      <div class="field">
        <label><input type="checkbox" id="bcCatOn"> Categoria</label>
        <select id="bcCategoria" disabled>
          <option value="">— Categoria —</option>
          ${allCats.map(c=>`<option value="${esc(c.nome)}" data-tipo="${c.tipo}">${esc(c.nome)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label><input type="checkbox" id="bcDetOn"> Dettaglio</label>
        <select id="bcDettaglio" disabled><option value="">—</option></select>
      </div>
      <div class="field">
        <label><input type="checkbox" id="bcNoteOn"> Note</label>
        <textarea id="bcNote" rows="2" disabled placeholder="Nuove note…"></textarea>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="bcCancel">Annulla</button><button class="btn btn-primary" id="bcApply">Applica</button></div>
  `;
  openModal(html);
  const close = closeModal;
  document.getElementById('bcClose').onclick = close;
  document.getElementById('bcCancel').onclick = close;
  const catSel = document.getElementById('bcCategoria');
  const detSel = document.getElementById('bcDettaglio');
  const noteEl = document.getElementById('bcNote');
  const refreshDettaglioOptions = ()=>{
    const cat = catSel.value;
    const subs = cat ? subcategorieFor(cat) : [];
    detSel.innerHTML = `<option value="">—</option>` + subs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  };
  refreshDettaglioOptions();
  catSel.onchange = refreshDettaglioOptions;
  document.getElementById('bcCatOn').onchange = (e)=>{ catSel.disabled = !e.target.checked; };
  document.getElementById('bcDetOn').onchange = (e)=>{ detSel.disabled = !e.target.checked; };
  document.getElementById('bcNoteOn').onchange = (e)=>{ noteEl.disabled = !e.target.checked; };
  document.getElementById('bcApply').onclick = ()=>{
    const catOn = document.getElementById('bcCatOn').checked;
    const detOn = document.getElementById('bcDetOn').checked;
    const noteOn = document.getElementById('bcNoteOn').checked;
    if(!catOn && !detOn && !noteOn){ toast('Spunta almeno un campo da modificare'); return; }
    if(catOn && !catSel.value){ toast('Scegli una categoria'); return; }
    const riepilogo = [
      catOn ? `Categoria → ${catSel.value}` : null,
      detOn ? `Dettaglio → ${detSel.value || '(vuoto)'}` : null,
      noteOn ? `Note → ${noteEl.value ? '"'+noteEl.value+'"' : '(vuote)'}` : null
    ].filter(Boolean).join('<br>');
    const confirmHtml = `
      <div class="modal-head"><h3>Conferma modifica</h3><button class="close-x" id="bcConfClose">✕</button></div>
      <div class="modal-body">
        <div class="page-sub" style="margin-bottom:10px;">Stai per modificare ${ids.length} moviment${ids.length===1?'o':'i'}:</div>
        <div style="font-weight:600;line-height:1.7;">${riepilogo}</div>
      </div>
      <div class="modal-foot"><button class="btn" id="bcConfCancel">Annulla</button><button class="btn btn-primary" id="bcConfOk">Conferma</button></div>
    `;
    openModal(confirmHtml);
    const closeConf = ()=>{ openBulkCampiModal(ids, onDone, clearFn); };
    document.getElementById('bcConfClose').onclick = closeConf;
    document.getElementById('bcConfCancel').onclick = closeConf;
    document.getElementById('bcConfOk').onclick = ()=>{
      let count = 0;
      DB.movimenti.forEach(m=>{
        if(ids.includes(m.id)){
          if(catOn) m.categoria = catSel.value;
          if(detOn) m.descrizione = detSel.value || null;
          if(noteOn) m.note = noteEl.value || null;
          count++;
        }
      });
      clearFn();
      saveDB(); closeModal(); toast(`Campi aggiornati su ${count} movimenti`); onDone();
    };
  };

function wireEtichetteModal(){
  const listEl = document.getElementById('etichetteManageList');
  listEl.querySelectorAll('.cm-head-main').forEach(h=>{
    h.onclick = (e)=>{
      openEtichettaReportModal(h.closest('.cm-item').dataset.etichetta);
    };
  });
  listEl.querySelectorAll('.toggleEtichettaColor').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    b.closest('.cm-item').classList.toggle('open');
  });
  listEl.querySelectorAll('.etichetta-fav-btn').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    if(!Array.isArray(DB.etichettePreferite)) DB.etichettePreferite = [];
    const t = b.dataset.t;
    if(DB.etichettePreferite.includes(t)) DB.etichettePreferite = DB.etichettePreferite.filter(x=>x!==t);
    else DB.etichettePreferite.push(t);
    saveDB(); refreshEtichetteModal();
  });
  listEl.querySelectorAll('.etichetta-color-swatch').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    DB.etichetteColori[b.dataset.t] = b.dataset.color;
    saveDB(); toast('Colore etichetta aggiornato'); refreshEtichetteModal();
  });
  listEl.querySelectorAll('.renameEtichetta').forEach(b=>b.onclick = async (e)=>{
    e.stopPropagation();
    const nuovo = await customPrompt(`Rinomina etichetta "${b.dataset.t}" in:`, b.dataset.t);
    if(nuovo!==null) renameEtichetta(b.dataset.t, nuovo);
  });
  listEl.querySelectorAll('.delEtichetta').forEach(b=>b.onclick = async (e)=>{
    e.stopPropagation();
    const t = b.dataset.t;
    if(!(await customConfirm(`Eliminare l'etichetta "${t}"? Verrà rimossa da tutti i movimenti, che resteranno invariati per il resto.`, {danger:true, okLabel:'Elimina'}))) return;
    DB.etichette = DB.etichette.filter(x=>x!==t);
    DB.movimenti.forEach(m=>{ if(Array.isArray(m.etichette)) m.etichette = m.etichette.filter(x=>x!==t); });
    if(DB.etichetteColori) delete DB.etichetteColori[t];
    if(Array.isArray(DB.etichettePreferite)) DB.etichettePreferite = DB.etichettePreferite.filter(x=>x!==t);
    saveDB(); toast('Etichetta eliminata'); refreshEtichetteModal();
  });
}
function renameEtichetta(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return;
  if(DB.etichette.includes(newName)){ toast('Esiste già un\'etichetta con questo nome'); return; }
  const idx = DB.etichette.indexOf(oldName);
  if(idx===-1) return;
  DB.etichette[idx] = newName;
  DB.movimenti.forEach(m=>{ if(Array.isArray(m.etichette)){ const i=m.etichette.indexOf(oldName); if(i>-1) m.etichette[i]=newName; } });
  if(DB.etichetteColori && DB.etichetteColori[oldName]!==undefined){
    DB.etichetteColori[newName] = DB.etichetteColori[oldName];
    delete DB.etichetteColori[oldName];
  }
  if(Array.isArray(DB.etichettePreferite)){
    const i = DB.etichettePreferite.indexOf(oldName);
    if(i>-1) DB.etichettePreferite[i] = newName;
  }
  saveDB(); toast('Etichetta aggiornata'); refreshEtichetteModal();
}

const LS_IMPORT_RULES = 'ledger_import_rules_v1';
const IMPORT_UNCERTAIN_THRESHOLD = 100; // soglia oltre la quale un abbinamento va comunque verificato

// Import incrociato UniCredit + PayPal: finestra di ricerca della transazione PayPal
// rispetto alla data dell'addebito in banca (PayPal avviene di solito qualche giorno prima).
const PAYPAL_MATCH_DAYS_BEFORE = 7; // quanti giorni PRIMA della data UniCredit può essere la transazione PayPal
const PAYPAL_MATCH_DAYS_AFTER = 1;  // quanti giorni DOPO la data UniCredit può essere la transazione PayPal
const PAYPAL_AMOUNT_TOLERANCE = 0.01; // tolleranza in euro per considerare due importi uguali

function loadImportRules(){
  try{ return JSON.parse(localStorage.getItem(LS_IMPORT_RULES) || '{}'); }
  catch(e){ return {}; }
}
function saveImportRules(rules){ localStorage.setItem(LS_IMPORT_RULES, JSON.stringify(rules)); }
function learnImportRule(key, categoria, dettaglio){
  if(!key || !categoria) return;
  const rules = loadImportRules();
  rules[key] = { categoria, dettaglio: dettaglio||null };
  saveImportRules(rules);
}
// Tiene le regole di importazione (sia quelle imparate automaticamente sui movimenti sia i default interni,
// es. Unipol Move) allineate quando l'utente rinomina o elimina una categoria/dettaglio in Impostazioni:
// senza questo, le regole continuerebbero a puntare al nome vecchio e i futuri import proporrebbero
// categorie/dettagli che non esistono più.
function renameImportRulesCategoria(oldCat, newCat){
  const rules = loadImportRules();
  let changed = false;
  Object.keys(rules).forEach(k=>{ if(rules[k].categoria===oldCat){ rules[k].categoria = newCat; changed = true; } });
  if(changed) saveImportRules(rules);
}
function renameImportRulesDettaglio(cat, oldDet, newDet){
  const rules = loadImportRules();
  let changed = false;
  Object.keys(rules).forEach(k=>{ if(rules[k].categoria===cat && rules[k].dettaglio===oldDet){ rules[k].dettaglio = newDet; changed = true; } });
  if(changed) saveImportRules(rules);
}
function clearImportRulesCategoria(oldCat){
  const rules = loadImportRules();
  let changed = false;
  Object.keys(rules).forEach(k=>{ if(rules[k].categoria===oldCat){ delete rules[k]; changed = true; } });
  if(changed) saveImportRules(rules);
}
function clearImportRulesDettaglio(cat, oldDet){
  const rules = loadImportRules();
  let changed = false;
  Object.keys(rules).forEach(k=>{ if(rules[k].categoria===cat && rules[k].dettaglio===oldDet){ rules[k].dettaglio = null; changed = true; } });
  if(changed) saveImportRules(rules);
}

const IMPORT_STOPWORDS = new Set(['ADDEBITO','SEPA','DD','PER','FATTURA','A','VOSTRO','CARICO','INCASSO','SDD','DA','MANDATO','NR','PAGAMENTO','MASTERCARD','CONTACTLESS','ECOMMERCE','NFC','CARTA','DI','EUR','DEL','GOOGLE','PAY','BONIFICO','ISTANTANEO','ALLE','TRN','COMM','SPESE','SERV','COMMISSIONI','PROVVIGIONI','VOSTRI','EMOLUMENTI','ACCREDITO','COMPETENZE','MESE','DISPOSIZIONE','FAVORE']);
function extractMerchantKey(causale){
  const tokens = (causale||'').toUpperCase().replace(/[^A-Z0-9ÀÈÉÌÒÙ\s]/g,' ').split(/\s+/).filter(Boolean);
  const kept = tokens.filter(t=> t.length>=3 && isNaN(Number(t)) && !IMPORT_STOPWORDS.has(t));
  return kept.slice(0,3).join(' ') || (causale||'').slice(0,24).toUpperCase();
}
function extractPosMerchant(causale){
  const m = /DI EUR\s*[\d.,]+\s+(.+)$/i.exec(causale||'');
  if(!m) return null;
  return m[1].trim().toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
}

    test:(c,imp,ent)=> !ent && /MC\s?DONALD|AUTOGRILL|PAM PANORAMA|ESSELUNGA|SUSHI YAMI|BEFED|GIDA SRL|RICCI SRL|SUPERSTORE CONAD|SUPERMERCATO NOVA COOP|SERVIZIO BAR STADIO|COUNTRY SPORT VILLAGE/.test(c),
    nota:(c)=> /SERVIZIO BAR STADIO/.test(c) ? 'Stadio' : (/COUNTRY SPORT VILLAGE/.test(c) ? 'Tennis' : null) },

  { confidenza:'bassa', categoria:'Acquisti', dettaglio:'Vari', test:(c,imp,ent)=> !ent && /PAYPAL/.test(c) },
];

/* Riconoscimento condiviso di rimborsi ed esercenti noti, riusato da tutti e tre i motori di import
   (UniCredit, PayPal, Revolut) per evitare di duplicare le stesse regole in tre punti diversi. */
const REFUND_CAUSALE_RE = /RIMBORS|STORNO|\bRESO\b|REFUND/i;
function isRefundEntrata(causale, importo){
  return importo > 0 && REFUND_CAUSALE_RE.test(causale || '');
}
// Elenco di esercenti/servizi noti: usato per popolare automaticamente il campo Note con un nome pulito
// quando la causale bancaria grezza contiene codici o testo poco leggibile.
const KNOWN_MERCHANTS = [
  { re:/MC\s?DONALD/i, name:"McDonald's" },
  { re:/ESSELUNGA/i, name:'Esselunga' },
  { re:/PAM PANORAMA/i, name:'Pam Panorama' },
  { re:/AUTOGRILL/i, name:'Autogrill' },
  { re:/SUSHI YAMI/i, name:'Sushi Yami' },
  { re:/SUPERSTORE CONAD/i, name:'Conad Superstore' },
  { re:/SUPERMERCATO NOVA COOP/i, name:'Nova Coop' },
  { re:/\bILIAD\b/i, name:'Iliad' },
  { re:/WIND\s*TRE STORE|WINDTRESTORE/i, name:'WindTre Store' },
  { re:/WIND\s*TRE/i, name:'WindTre' },
  { re:/BSPORT/i, name:'Palestra' },
  { re:/FANATICS/i, name:'Juventus Store' },
  { re:/CIGLIANTOURS/i, name:'Ciglian Tours' },
  { re:/THE SPACE CINEMA/i, name:'The Space Cinema' },
  { re:/MULTIPLEX ARCADIA/i, name:'Multiplex Arcadia' },
];
function extractKnownMerchant(causale){
  const c = causale || '';
  for(const km of KNOWN_MERCHANTS){ if(km.re.test(c)) return km.name; }
  return null;
}
function guessMerchantNote(causale){
  return extractKnownMerchant(causale) || extractPosMerchant(causale);
}

/* Motore di riconoscimento condiviso (regole personalizzate + regole predefinite + fallback), usato sia per
   l'import UniCredit sia per l'import Revolut: entrambi ragionano su una "causale/descrizione" testuale e un importo. */
function guessCategoryFromRules(causale, importo){
  const c = (causale||'').toUpperCase();
  const ent = importo > 0;

  const key = extractMerchantKey(causale);
  const customRules = loadImportRules();
  if(customRules[key] && customRules[key].categoria){
    return { categoria:customRules[key].categoria, dettaglio:customRules[key].dettaglio, nota:guessMerchantNote(causale), confidenza:'alta', _fromCustomRule:true };
  }

  for(const rule of BUILTIN_IMPORT_RULES){
    if(rule.test(c, importo, ent)){
      return {
        categoria: rule.categoria,
        dettaglio: rule.dettaglio,
        nota: rule.nota ? rule.nota(c) : guessMerchantNote(causale),
        confidenza: rule.confidenza
      };
    }
  }
  if(ent) return { categoria:'Altre entrate', dettaglio:'Varie', nota:guessMerchantNote(causale), confidenza:'bassa' };
  return { categoria:'Acquisti', dettaglio:'Vari', nota:guessMerchantNote(causale), confidenza:'bassa' };
}
function guessImportRow(causale, importo){
  if(isRefundEntrata(causale, importo)){
    return Object.assign({liquidita:false, _autoRimborso:true}, guessCategoryFromRules(causale, importo));
  }
  if(/REVOLUT|SATISPAY|GIROCONTO|RICARICA|STORNO|UNIPOL\s?MOVE/i.test(causale||'')){
    return { categoria:null, dettaglio:null, nota:null, confidenza:'liquidita', liquidita:true };
  }
  return Object.assign({liquidita:false}, guessCategoryFromRules(causale, importo));
}

function excelDateToISO(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){
    const d = new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  if(typeof v === 'string'){
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(v.trim());
    if(m){ let [,dd,mm,yy]=m; if(yy.length===2) yy='20'+yy; return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`; }
    const m2 = /^(\d{4})-(\d{2})-(\d{2})/.exec(v.trim());
    if(m2) return v.trim().slice(0,10);
  }
  return null;
}

function parseUnicreditRows(rows){
  let headerIdx = -1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r = (rows[i]||[]).map(x=>String(x||'').toLowerCase());
    if(r.some(c=>c.includes('causale')) && r.some(c=>c.includes('descrizione')) && r.some(c=>c.includes('importo'))){
      headerIdx = i; break;
    }
  }
  if(headerIdx===-1) return [];
  const header = rows[headerIdx].map(x=>String(x||'').toLowerCase());
  let idxData = header.findIndex(h=>h.includes('data valuta'));
  if(idxData===-1) idxData = header.findIndex(h=>h.includes('data registrazione'));
  if(idxData===-1) idxData = header.findIndex(h=>h.includes('data'));
  const idxDescr = header.findIndex(h=>h.includes('descrizione'));
  const idxImporto = header.findIndex(h=>h.includes('importo'));
  if(idxData===-1 || idxDescr===-1 || idxImporto===-1) return [];

  const out = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    const descr = r[idxDescr];
    const importoRaw = r[idxImporto];
    if(descr==null && importoRaw==null) continue;
    const importo = parseFloat(String(importoRaw).replace(',','.'));
    if(isNaN(importo) || importo===0) continue; // scarta le righe a importo zero (es. COMPETENZE)
    const dataISO = excelDateToISO(r[idxData]);
    out.push({ data:dataISO, causale:String(descr||'').trim(), importo });
  }
  return out;
}

/* ---- Import incrociato: parsing CSV PayPal ---- */
function parseLocaleAmount(str){
  if(str===null || str===undefined) return NaN;
  let s = String(str).trim();
  if(!s) return NaN;
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if(hasComma && hasDot){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(hasComma){
    s = s.replace(',', '.');
  }
  return parseFloat(s);
}
function parsePaypalDateToISO(v){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(String(v||'').trim());
  if(!m) return null;
  let [,dd,mm,yy] = m;
  if(yy.length===2) yy = '20'+yy;
  return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
}
function parseCSVLine(line){
  // parser CSV minimale ma robusto ai campi tra virgolette contenenti virgole
  const out = [];
  let cur = ''; let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch==='"'){
        if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false;
      } else cur += ch;
    } else {
      if(ch==='"') inQ = true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}
const PAYPAL_COL_ALIASES = { data:['data','date'], nome:['nome','name'], importo:['lordo','gross'] };
function findPaypalCol(headerLower, aliases){
  for(const a of aliases){
    const idx = headerLower.findIndex(h=> h===a || h.startsWith(a));
    if(idx!==-1) return idx;
  }
  return -1;
}
function parsePaypalCSV(text){
  if(!text) return [];
  const clean = text.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const header = parseCSVLine(lines[0]).map(h=>h.toLowerCase().trim());
  const idxData = findPaypalCol(header, PAYPAL_COL_ALIASES.data);
  const idxNome = findPaypalCol(header, PAYPAL_COL_ALIASES.nome);
  const idxImporto = findPaypalCol(header, PAYPAL_COL_ALIASES.importo);
  if(idxData===-1 || idxImporto===-1) return [];
  const out = [];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    if(!cols.length) continue;
    const dataISO = parsePaypalDateToISO(cols[idxData]);
    const importo = parseLocaleAmount(cols[idxImporto]);
    if(!dataISO || isNaN(importo) || importo>=0) continue; // teniamo solo i pagamenti effettivi (importo negativo)
    out.push({ data:dataISO, nome:(idxNome!==-1?String(cols[idxNome]||'').trim():'') || 'Esercente sconosciuto', importo });
  }
  return out;
}
function normalizePaypalName(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function isGenericPaypalCausale(causale){ return /PAYPAL/i.test(causale||''); }
function findPaypalMatches(row, paypalRows){
  if(!paypalRows || !paypalRows.length || !row.data) return [];
  const rowDate = new Date(row.data+'T00:00:00');
  if(isNaN(rowDate)) return [];
  return paypalRows.filter(p=>{
    if(Math.abs(p.importo - row.importo) > PAYPAL_AMOUNT_TOLERANCE) return false;
    const pDate = new Date(p.data+'T00:00:00');
    if(isNaN(pDate)) return false;
    const diffDays = Math.round((rowDate - pDate)/86400000);
    return diffDays >= -PAYPAL_MATCH_DAYS_AFTER && diffDays <= PAYPAL_MATCH_DAYS_BEFORE;
  });
}

/* ---- Import CSV Revolut (movimenti a sé stanti, non incrociati con UniCredit) ----
   Formato dell'export Revolut (in inglese o italiano, a seconda della lingua impostata nell'app):
   Type/Tipo, Product/Prodotto, Started Date/Data di inizio, Completed Date/Data di completamento,
   Description/Descrizione, Amount/Importo, Fee/Costo, Currency/Valuta, State, Balance/Saldo
   (la colonna "State" a volte resta in inglese anche nell'export italiano: è un'incoerenza nota di Revolut). */
const REVOLUT_COL_ALIASES = {
  tipo:['type','tipo'],
  descrizione:['description','descrizione'],
  importo:['amount','importo'],
  stato:['state','stato'],
  dataCompletamento:['completed date','data di completamento'],
  dataInizio:['started date','data di inizio'],
};
function findRevolutCol(headerLower, aliases){
  for(const a of aliases){
    const idx = headerLower.findIndex(h=> h===a || h.startsWith(a));
    if(idx!==-1) return idx;
  }
  return -1;
}
function parseRevolutDateToISO(v){
  const s = String(v||'').trim();
  if(!s) return null;
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s);
  if(m){ let [,dd,mm,yy]=m; if(yy.length===2) yy='20'+yy; return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`; }
  return null;
}
// Solo questi stati sono transazioni effettivamente avvenute; qualsiasi altro valore (in sospeso, fallita,
// annullata/"OPERAZIONE ANNULLATA", rifiutata, ecc., in inglese o italiano) viene scartato.
const REVOLUT_COMPLETED_STATES = new Set(['COMPLETED','COMPLETATO','COMPLETATA']);
// Tipi Revolut che rappresentano solo uno spostamento di denaro interno (ricarica dal conto/carta collegata,
// cambio valuta): vanno trattati come "liquidità" esattamente come i bonifici UniCredit -> Revolut, per non
// contare due volte lo stesso denaro. Il match è per prefisso e case-insensitive, in inglese o italiano
// ("Ricarica", "TOPUP", "Cambio valuta", "EXCHANGE", ...).
const REVOLUT_LIQUIDITY_TYPE_RE = /^(TOPUP|RICARIC|EXCHANGE|CAMBIO)/i;
// Alcuni movimenti Revolut verso/da persone sono in realtà giroconti verso i tuoi stessi altri conti
// (Revolut li classifica come "Pagamento"/"Ricarica" verso una persona, ma non sono spesa/entrata reale):
// vanno trattati come liquidità anch'essi, indipendentemente dal Tipo.
const REVOLUT_SELF_TRANSFER_RE = /RAITERI\s+ANDREA|ANDREA\s+RAITERI/i;
function parseRevolutCSV(text){
  if(!text) return [];
  const clean = text.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const header = parseCSVLine(lines[0]).map(h=>h.toLowerCase().trim());
  const idxTipo = findRevolutCol(header, REVOLUT_COL_ALIASES.tipo);
  const idxDataCompletamento = findRevolutCol(header, REVOLUT_COL_ALIASES.dataCompletamento);
  const idxDataInizio = findRevolutCol(header, REVOLUT_COL_ALIASES.dataInizio);
  const idxDescr = findRevolutCol(header, REVOLUT_COL_ALIASES.descrizione);
  const idxImporto = findRevolutCol(header, REVOLUT_COL_ALIASES.importo);
  const idxStato = findRevolutCol(header, REVOLUT_COL_ALIASES.stato);
  if((idxDataCompletamento===-1 && idxDataInizio===-1) || idxDescr===-1 || idxImporto===-1) return [];
  const out = [];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    if(!cols.length) continue;
    const stato = idxStato!==-1 ? String(cols[idxStato]||'').trim().toUpperCase() : 'COMPLETED';
    if(stato && !REVOLUT_COMPLETED_STATES.has(stato)) continue; // scarta transazioni pending/fallite/annullate
    // Preferisce la data di completamento; se assente per questa riga, usa la data di inizio.
    const dataISO = (idxDataCompletamento!==-1 && parseRevolutDateToISO(cols[idxDataCompletamento]))
      || (idxDataInizio!==-1 && parseRevolutDateToISO(cols[idxDataInizio]));
    const importo = parseLocaleAmount(cols[idxImporto]);
    if(!dataISO || isNaN(importo) || importo===0) continue;
    const tipo = idxTipo!==-1 ? String(cols[idxTipo]||'').trim() : '';
    out.push({ data:dataISO, causale:String(cols[idxDescr]||'').trim(), importo, tipo });
  }
  return out;
}

/* ---- Import Excel Unipol Move (movimenti a sé stanti, non incrociati con UniCredit) ----
   Colonne del file d'export Unipol Move: A=Data uscita, C=Stazione ingresso, D=Stazione uscita,
   G=Importo totale (le altre colonne, Ora/Dispositivo/Importo scontato, non ci servono).
   Ogni riga è sempre un'uscita (un pedaggio autostradale); il campo Note viene composto come
   "Stazione ingresso - Stazione uscita" in stile "Iniziali maiuscole" (non tutto maiuscolo). */
// Categoria/dettaglio di destinazione: salvati come una normale regola di importazione (con una chiave
// fissa dedicata) invece che scritti fissi nel codice, così se in futuro rinomini "Auto" o il dettaglio
// scelto da Impostazioni, la stessa sincronizzazione delle regole (vedi renameImportRulesCategoria/
// renameImportRulesDettaglio) aggiorna automaticamente anche questo default.
const UNIPOLMOVE_DEFAULT_RULE_KEY = 'unipolmove:default';
function unipolMoveDefaultCategoria(){
  const rules = loadImportRules();
  const r = rules[UNIPOLMOVE_DEFAULT_RULE_KEY];
  if(r && r.categoria) return r;
  const def = { categoria:'Auto', dettaglio:'Pedaggi e Parcheggi' };
  learnImportRule(UNIPOLMOVE_DEFAULT_RULE_KEY, def.categoria, def.dettaglio);
  return def;
}
function titleCaseParole(s){
  return String(s||'').trim().toLowerCase().split(/\s+/).filter(Boolean)
    .map(w=>{
      if(w.includes('/')) return w.toUpperCase(); // sigle tipo "D/N", "D/S": restano tutte maiuscole
      return w.charAt(0).toUpperCase()+w.slice(1);
    }).join(' ');
}
function parseUnipolMoveDateToISO(v){
  const s = String(v||'').trim();
  if(!s) return null;
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s);
  if(m){ let [,dd,mm,yy]=m; if(yy.length===2) yy='20'+yy; return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`; }
  return null;
}
function parseUnipolMoveAmount(v){
  return parseLocaleAmount(String(v||'').replace(/[€\s]/g,''));
}
const UNIPOLMOVE_COL_ALIASES = { data:['data uscita','data'], ingresso:['stazione ingresso'], uscita:['stazione uscita'], importo:['importo totale'] };
function findUnipolMoveCol(headerLower, aliases){
  for(const a of aliases){
    const idx = headerLower.findIndex(h=> h===a || h.startsWith(a));
    if(idx!==-1) return idx;
  }
  return -1;
}
function parseUnipolMoveRows(rows){
  let headerIdx = -1;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const r = (rows[i]||[]).map(x=>String(x||'').toLowerCase().trim());
    if(r.some(c=>c.includes('stazione ingresso')) && r.some(c=>c.includes('stazione uscita')) && r.some(c=>c.includes('importo totale'))){
      headerIdx = i; break;
    }
  }
  if(headerIdx===-1) return [];
  const header = rows[headerIdx].map(x=>String(x||'').toLowerCase().trim());
  const idxData = findUnipolMoveCol(header, UNIPOLMOVE_COL_ALIASES.data);
  const idxIngresso = findUnipolMoveCol(header, UNIPOLMOVE_COL_ALIASES.ingresso);
  const idxUscita = findUnipolMoveCol(header, UNIPOLMOVE_COL_ALIASES.uscita);
  const idxImporto = findUnipolMoveCol(header, UNIPOLMOVE_COL_ALIASES.importo);
  if(idxData===-1 || idxIngresso===-1 || idxUscita===-1 || idxImporto===-1) return [];
  const out = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    const dataISO = parseUnipolMoveDateToISO(r[idxData]);
    const importo = parseUnipolMoveAmount(r[idxImporto]);
    if(!dataISO || isNaN(importo) || importo===0) continue;
    const ingresso = titleCaseParole(r[idxIngresso]);
    const uscita = titleCaseParole(r[idxUscita]);
    const note = [ingresso, uscita].filter(Boolean).join(' - ');
    out.push({ data:dataISO, importo:-Math.abs(importo), note });
  }
  return out;
}
function buildUnipolMoveCandidates(parsedRows){
  const existingFp = existingImportFingerprints();
  const def = unipolMoveDefaultCategoria();
  return parsedRows.map((r,i)=>{
    const fp = fingerprintFor(r.data, r.importo, r.note)+'|unipolmove';
    const dup = existingFp.has(fp);
    return {
      _tmpId: 'um_'+i,
      data: r.data,
      causale: r.note,
      importo: r.importo,
      fp,
      duplicato: dup,
      categoria: def.categoria,
      dettaglio: def.dettaglio,
      note: r.note,
      confidenza: 'alta',
      liquidita: false,
      selected: !dup,
      reviewed: false,
      paypalMatched: false,
      paypalOptions: null,
      fonteSource: 'unipolmove',
      etichette: [],
    };
  });
}

      <div class="page-sub" style="margin-top:10px;">Puoi caricare uno solo dei file, oppure più insieme: i movimenti riconosciuti finiranno tutti nella stessa schermata di revisione.</div>

  openModal(html);
  document.getElementById('impFilesClose').onclick = closeModal;
  document.getElementById('impFilesCancel').onclick = closeModal;

}
async function startImport(){
  const ucFile = document.getElementById('impFileUnicredit').files[0];
  const ppFile = document.getElementById('impFilePaypal').files[0];
  const revFile = document.getElementById('impFileRevolut').files[0];
  const umFile = document.getElementById('impFileUnipolMove').files[0];
  if(!ucFile && !revFile && !umFile){ toast('Seleziona almeno un file da importare (UniCredit, Revolut e/o Unipol Move)'); return; }

  // Il parsing di Excel/CSV è l'unica operazione dell'app con un'attesa reale percepibile:
  // il pulsante mostra uno stato di caricamento finché non finisce, invece di lasciare la
  // finestra ferma senza nessun segnale che l'app sta effettivamente lavorando.
  const continueBtn = document.getElementById('impFilesContinue');
  let btnOriginalHtml = null;
  if(continueBtn){
    btnOriginalHtml = continueBtn.innerHTML;
    continueBtn.disabled = true;
    continueBtn.innerHTML = `<span class="import-spinner"></span> Elaborazione…`;
  }

  let candidates = [];
  const warnings = [];

  if(ucFile){
    try{
      const buf = await readFileAsArrayBuffer(ucFile);
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
      const parsed = parseUnicreditRows(rows);
      if(!parsed.length){
        warnings.push('Nessun movimento riconosciuto nel file UniCredit');
      } else {
        let paypalRows = [];
        if(ppFile){
          try{
            paypalRows = parsePaypalCSV(await readFileAsText(ppFile));
          }catch(err){
            console.error(err);
            warnings.push("CSV PayPal non leggibile, proseguito senza abbinamenti");
          }
        }
        candidates = candidates.concat(buildUnicreditCandidates(parsed, paypalRows));
      }
    }catch(err){
      console.error(err);
      warnings.push('Errore nella lettura del file UniCredit');
    }
  }

  if(revFile){
    try{
      const parsed = parseRevolutCSV(await readFileAsText(revFile));
      if(!parsed.length){
        warnings.push('Nessun movimento riconosciuto nel file Revolut');
      } else {
        candidates = candidates.concat(buildRevolutCandidates(parsed));
      }
    }catch(err){
      console.error(err);
      warnings.push('Errore nella lettura del file Revolut');
    }
  }

  if(umFile){
    try{
      const buf = await readFileAsArrayBuffer(umFile);
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
      const parsed = parseUnipolMoveRows(rows);
      if(!parsed.length){
        warnings.push('Nessun movimento riconosciuto nel file Unipol Move');
      } else {
        candidates = candidates.concat(buildUnipolMoveCandidates(parsed));
      }
    }catch(err){
      console.error(err);
      warnings.push('Errore nella lettura del file Unipol Move');
    }
  }

  if(!candidates.length){
    if(continueBtn){ continueBtn.disabled = false; continueBtn.innerHTML = btnOriginalHtml; }
    toast(warnings[0] || 'Nessun movimento riconosciuto nei file selezionati');
    return;
  }
  closeModal();
  openImportPreviewModal(candidates);
  if(warnings.length) toast(warnings.join(' — '));
}

function existingImportFingerprints(){
  const set = new Set();
  DB.movimenti.forEach(m=>{ if(m._impFp) set.add(m._impFp); });
  return set;
}
function fingerprintFor(data, importo, causale){
  return `${data}|${importo}|${(causale||'').slice(0,40)}`;
}

function buildUnicreditCandidates(parsedRows, paypalRows){
  const existingFp = existingImportFingerprints();
  const rules = loadImportRules();
  return parsedRows.map((r,i)=>{
    const fp = fingerprintFor(r.data, r.importo, r.causale);
    const dup = existingFp.has(fp);
    const g = guessImportRow(r.causale, r.importo);

    let confidenza = g.confidenza;
    if(!g.liquidita && confidenza==='alta' && Math.abs(r.importo) >= IMPORT_UNCERTAIN_THRESHOLD) confidenza = 'media';

    let categoria = g.categoria, dettaglio = g.dettaglio, note = g.nota || null;
    let etichette = g._autoRimborso ? ['#rimborso'] : [];
    let paypalMatched = false, paypalOptions = null;
    if(!g.liquidita && paypalRows && paypalRows.length && isGenericPaypalCausale(r.causale)){
      const matches = findPaypalMatches(r, paypalRows);
      if(matches.length===1){
        const nome = matches[0].nome;
        note = nome;
        paypalMatched = true;
        confidenza = 'alta';
        const key = 'paypal:'+normalizePaypalName(nome);
        if(rules[key] && rules[key].categoria){
          categoria = rules[key].categoria;
          dettaglio = rules[key].dettaglio;
        }
      } else if(matches.length>1){
        paypalOptions = matches.map(m=>m.nome);
      }
    }

    return {
      _tmpId: 'imp_'+i,
      data: r.data,
      causale: r.causale,
      importo: r.importo,
      fp,
      duplicato: dup,
      categoria,
      dettaglio,
      note,
      confidenza,
      liquidita: !!g.liquidita,
      selected: !g.liquidita && !dup,
      reviewed: false,
      paypalMatched,
      paypalOptions,
      fonteSource: 'unicredit',
      etichette,
    };
  });
}

function buildRevolutCandidates(parsedRows){
  const existingFp = existingImportFingerprints();
  return parsedRows.map((r,i)=>{
    const fp = fingerprintFor(r.data, r.importo, r.causale)+'|revolut';
    const dup = existingFp.has(fp);
    const isRefund = isRefundEntrata(r.causale, r.importo);
    const isLiquidita = !isRefund && (REVOLUT_LIQUIDITY_TYPE_RE.test(r.tipo) || REVOLUT_SELF_TRANSFER_RE.test(r.causale));

    let categoria = null, dettaglio = null, note = null, confidenza = 'liquidita', etichette = [];
    if(!isLiquidita){
      const g = guessCategoryFromRules(r.causale, r.importo);
      categoria = g.categoria; dettaglio = g.dettaglio; note = g.nota || null; confidenza = g.confidenza;
      if(confidenza==='alta' && Math.abs(r.importo) >= IMPORT_UNCERTAIN_THRESHOLD) confidenza = 'media';
      if(isRefund) etichette = ['#rimborso'];
    }

    return {
      _tmpId: 'rev_'+i,
      data: r.data,
      causale: r.causale,
      importo: r.importo,
      fp,
      duplicato: dup,
      categoria,
      dettaglio,
      note,
      confidenza,
      liquidita: isLiquidita,
      selected: !isLiquidita && !dup,
      reviewed: false,
      paypalMatched: false,
      paypalOptions: null,
      fonteSource: 'revolut',
      etichette,
    };
  });
}

function catOptionsHtmlImport(tipo, selected){
  const cats = tipo==='entrata' ? DB.categorieEntrate : DB.categorieUscite;
  let html = `<option value="">— Categoria —</option>`;
  html += cats.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
  return html;
}
function detOptionsHtmlImport(categoria, selected){
  const subs = subcategorieFor(categoria);
  let html = `<option value="">—</option>`;
  html += subs.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('');
  if(selected && !subs.includes(selected)) html += `<option value="${esc(selected)}" selected>${esc(selected)}</option>`;
  return html;
}

function renderImportRows(){
  const tbody = document.getElementById('impTbody');
  if(!tbody) return;
  tbody.innerHTML = importCandidates.map(cand=>{
    const tipo = cand.importo>0 ? 'entrata':'uscita';
    const needsReview = !cand.liquidita && !cand.reviewed && (cand.confidenza!=='alta' || !cand.categoria);
    const rowCls = ['imp-row'];
    if(!cand.selected) rowCls.push('imp-row-off');
    if(needsReview) rowCls.push('imp-row-warn'); else rowCls.push('imp-row-ok');
    return `<tr class="${rowCls.join(' ')}" data-tmp="${cand._tmpId}">
      <td class="check-col"><input type="checkbox" class="imp-checkbox impCheck" data-tmp="${cand._tmpId}" ${cand.selected?'checked':''} ${cand.liquidita?'disabled':''}></td>
      <td class="mono" style="white-space:nowrap;font-size:12.5px;">${fmtDate(cand.data)}${cand.duplicato?'<br><span style="color:var(--amber);font-size:10px;">possibile doppione</span>':''}</td>
      <td class="num mono" style="font-weight:600;white-space:nowrap;color:${cand.importo>0?'var(--money-pos)':'var(--coral)'};">${cand.importo>0?'+':''}${cand.importo.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})} €</td>
      <td class="imp-causale" title="${esc(cand.causale)}">${needsReview?`<span class="imp-warn-ic">${ico('alertTriangle')}</span>`:''}${cand.fonteSource==='revolut'?`<span class="mov-src-badge-r" title="Movimento dal CSV Revolut">R</span>`:''}${cand.fonteSource==='unipolmove'?metodoIconHtml('Unipol Move'):''}${cand.paypalMatched?`<span class="badge-paypal" title="Esercente riconosciuto tramite il CSV PayPal: ${esc(cand.note||'')}">🅿️ PayPal</span>`:''}${cand.paypalOptions?`<span class="badge-paypal-multi" title="Più transazioni PayPal compatibili: scegli quella giusta nella colonna Note">🅿️ scegli</span>`:''}${esc(cand.causale)}</td>
      <td>${cand.liquidita
          ? `<span class="badge-liquidity">Spostamento liquidità / Ricarica</span>`
          : `<select class="imp-seamless impCat" data-tmp="${cand._tmpId}">${catOptionsHtmlImport(tipo, cand.categoria)}</select>`}</td>
      <td>${cand.liquidita ? '' : `<select class="imp-seamless impDet" data-tmp="${cand._tmpId}">${detOptionsHtmlImport(cand.categoria, cand.dettaglio)}</select>`}</td>
      <td>${cand.liquidita ? '' : (cand.paypalOptions
          ? `<select class="imp-seamless impPaypalChoice" data-tmp="${cand._tmpId}">
              <option value="">— Scegli abbinamento PayPal —</option>
              ${cand.paypalOptions.map(n=>`<option value="${esc(n)}" ${cand.note===n?'selected':''}>${esc(n)}</option>`).join('')}
            </select>`
          : `<input type="text" class="imp-seamless impNote" data-tmp="${cand._tmpId}" value="${esc(cand.note||'')}" placeholder="Nota">`)}</td>
      <td>${cand.liquidita ? '' : `<input type="text" class="imp-seamless impEtichette" data-tmp="${cand._tmpId}" value="${esc((cand.etichette||[]).join(', '))}" placeholder="tag1, tag2">`}</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.impCheck').forEach(cb=>{
    cb.onchange = ()=>{
      const cand = importCandidates.find(c=>c._tmpId===cb.dataset.tmp);
      cand.selected = cb.checked;
      updateImportSummary();
      const tr = cb.closest('tr');
      tr.classList.toggle('imp-row-off', !cand.selected);
    };
  });
  tbody.querySelectorAll('.impCat').forEach(sel=>{
    sel.onchange = ()=>{
      const cand = importCandidates.find(c=>c._tmpId===sel.dataset.tmp);
      cand.categoria = sel.value || null;
      cand.dettaglio = null;
      cand.reviewed = true;
      renderImportRows();
      updateImportSummary();
    };
  });
  tbody.querySelectorAll('.impDet').forEach(sel=>{
    sel.onchange = ()=>{
      const cand = importCandidates.find(c=>c._tmpId===sel.dataset.tmp);
      cand.dettaglio = sel.value || null;
      cand.reviewed = true;
      const tr = sel.closest('tr');
      tr.classList.remove('imp-row-warn'); tr.classList.add('imp-row-ok');
      tr.querySelector('.imp-warn-ic')?.remove();
      updateImportSummary();
    };
  });
  tbody.querySelectorAll('.impNote').forEach(inp=>{
    inp.onchange = ()=>{
      const cand = importCandidates.find(c=>c._tmpId===inp.dataset.tmp);
      cand.note = inp.value.trim() || null;
    };
  });
  tbody.querySelectorAll('.impEtichette').forEach(inp=>{
    inp.onchange = ()=>{
      const cand = importCandidates.find(c=>c._tmpId===inp.dataset.tmp);
      cand.etichette = inp.value.split(',').map(t=>t.trim()).filter(Boolean);
    };
  });
  tbody.querySelectorAll('.impPaypalChoice').forEach(sel=>{
    sel.onchange = ()=>{
      const cand = importCandidates.find(c=>c._tmpId===sel.dataset.tmp);
      const nome = sel.value;
      if(nome){
        cand.note = nome;
        cand.paypalMatched = true;
        cand.confidenza = 'alta';
        const rules = loadImportRules();
        const key = 'paypal:'+normalizePaypalName(nome);
        if(rules[key] && rules[key].categoria){
          cand.categoria = rules[key].categoria;
          cand.dettaglio = rules[key].dettaglio;
        }
      } else {
        cand.note = null;
        cand.paypalMatched = false;
      }
      renderImportRows();
      updateImportSummary();
    };
  });
  updateImportSummary();
}

function updateImportSummary(){
  const selected = importCandidates.filter(c=>c.selected);
  const entrate = selected.filter(c=>c.importo>0).reduce((s,c)=>s+c.importo,0);
  const uscite = selected.filter(c=>c.importo<0).reduce((s,c)=>s+c.importo,0);
  const selCountEl = document.getElementById('impSelCount');
  if(selCountEl) selCountEl.textContent = selected.length;
  const sumEntrateEl = document.getElementById('impSumEntrate');
  if(sumEntrateEl) sumEntrateEl.textContent = '+' + entrate.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
  const sumUsciteEl = document.getElementById('impSumUscite');
  if(sumUsciteEl) sumUsciteEl.textContent = uscite.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';

  const uncertain = importUncertainCount();
  const badge = document.getElementById('impUncertainBadge');
  if(badge){
    if(uncertain>0){
      badge.innerHTML = `${ico('alertTriangle',13)} ${uncertain} da verificare`;
      badge.classList.remove('all-clear');
    } else {
      badge.innerHTML = `${ico('check',13)} Tutto verificato`;
      badge.classList.add('all-clear');
    }
  }
}

function confirmImport(){
  const toImport = importCandidates.filter(c=>c.selected);
  if(!toImport.length){ toast('Nessun movimento selezionato'); return; }
  const missing = toImport.filter(c=>!c.liquidita && !c.categoria);
  if(missing.length){
    toast(`Assegna una categoria a tutti i movimenti selezionati (${missing.length} mancanti)`);
    return;
  }
  const newIds = [];
  toImport.forEach(c=>{
    const id = uid('m');
    newIds.push(id);
    let fonteImport = null;
    if(c.fonteSource==='revolut'){
      fonteImport = 'revolut';
    } else if(c.fonteSource==='unipolmove'){
      fonteImport = 'unipolmove';
    } else if(!c.liquidita){
      if(c.paypalMatched) fonteImport = 'paypal_confirmato';
      else if(!c.reviewed && c.confidenza!=='alta') fonteImport = 'non_verificato';
    }
    // Precompila anche il metodo di pagamento unificato, coerente con fonteImport, così i movimenti
    // importati da Revolut/PayPal risultano già assegnati al metodo giusto (restano comunque modificabili).
    // I movimenti Unipol Move non hanno un metodo dedicato: si paga sempre da Conto corrente, Unipol Move
    // serve solo a tracciare la tratta percorsa nel campo Note.
    let metodoPagamento = null;
    if(fonteImport==='revolut') metodoPagamento = 'Revolut';
    else if(fonteImport==='paypal_confirmato') metodoPagamento = 'PayPal';
    const etichette = Array.isArray(c.etichette) ? c.etichette.filter(Boolean) : [];
    etichette.forEach(t=>{ if(!DB.etichette.includes(t)) DB.etichette.push(t); });
    DB.movimenti.push({
      id, data:c.data, categoria:c.categoria, descrizione:c.dettaglio,
      entrate: c.importo>0 ? c.importo : null,
      uscite: c.importo<0 ? Math.abs(c.importo) : null,
      note: c.note || null,
      etichette: etichette.length ? etichette : undefined,
      _impFp: c.fp,
      metodoPagamento,
      ...(fonteImport ? {fonteImport} : {})
    });
    // Auto-apprendimento: se l'utente ha corretto manualmente una riga a bassa/media confidenza, salva la regola
    if(c.reviewed && c.categoria){
      const key = extractMerchantKey(c.causale);
      learnImportRule(key, c.categoria, c.dettaglio);
    }
    // Auto-apprendimento specifico PayPal: memorizza l'abbinamento nome esercente -> categoria/dettaglio
    if(c.paypalMatched && c.note && c.categoria){
      const pkey = 'paypal:'+normalizePaypalName(c.note);
      learnImportRule(pkey, c.categoria, c.dettaglio);
    }
  });
  saveDB();
  endImportSession();
  closeModal();
  toast(`${toImport.length} movimenti importati con successo e regole aggiornate!`);
  // Espande solo gli anni in cui sono finiti i nuovi movimenti (l'app parte comunque con gli anni compressi)
  movExpandedYears = movExpandedYears || new Set();
  newIds.forEach(id=>{
    const m = DB.movimenti.find(x=>x.id===id);
    if(m && m.data) movExpandedYears.add(m.data.slice(0,4));
  });
  renderMovimenti();
  setTimeout(()=>{
    newIds.forEach(id=>{
      const tr = document.querySelector(`tr[data-id="${id}"]`);
      if(tr) tr.classList.add('row-flash');
    });
  }, 60);
}

   "app_data" (colonna jsonb "data") contiene l'intero oggetto DB, protetta da un vero login
   (Supabase Auth) + RLS lato server. Login/logout vivono nella card "Account" in cima a
   Impostazioni; qui sotto solo la logica. La sincronizzazione è in tempo reale: quando i dati
   cambiano su un dispositivo, gli altri (con la stessa sessione attiva) lo scoprono via
   Supabase Realtime senza bisogno di ricaricare la pagina — richiede che la Realtime sia
   abilitata sulla tabella "app_data" lato Supabase (Database > Replication). */
const LS_SUPABASE_URL = 'ledger_supabase_url_v1';
const LS_SUPABASE_KEY = 'ledger_supabase_key_v1';
const LS_SUPABASE_LAST_SYNC = 'ledger_supabase_last_sync_v1';
// Valori di base del progetto Supabase: la "publishable key" è pensata per stare nel codice
// pubblico (non è un segreto, la sicurezza vera è affidata alle policy RLS + login). Non ci sono
// campi in Impostazioni per modificarli: se in futuro cambi progetto o ruoti la chiave, si
// aggiornano qui.
const SUPABASE_URL_DEFAULT = 'https://tkpekqesednpyvfbahav.supabase.co';
const SUPABASE_KEY_DEFAULT = 'sb_publishable_3a0V4aVVdu31lfxERPznEA_tuj3BEj-';

let sbClient = null;
let sbRealtimeChannel = null;
let supabasePushTimer = null;
let supabaseStatus = 'disconnesso'; // disconnesso | sync | connesso | errore
let lastPushedSyncTimestamp = null; // usato per riconoscere ed ignorare l'eco del nostro stesso salvataggio via Realtime
function supabaseUrlVal(){ return localStorage.getItem(LS_SUPABASE_URL) || SUPABASE_URL_DEFAULT; }
function supabaseKeyVal(){ return localStorage.getItem(LS_SUPABASE_KEY) || SUPABASE_KEY_DEFAULT; }
function supabaseConfigured(){ return !!(supabaseUrlVal() && supabaseKeyVal()); }
function supabaseClient(){
  if(sbClient) return sbClient;
  if(!supabaseConfigured() || typeof window.supabase==='undefined') return null;
  sbClient = window.supabase.createClient(supabaseUrlVal(), supabaseKeyVal());
  return sbClient;
}
async function supabaseCurrentUser(){
  const c = supabaseClient(); if(!c) return null;
  const { data } = await c.auth.getSession();
  return (data && data.session) ? data.session.user : null;
}
function supabaseSetStatus(s){ supabaseStatus = s; renderAccountArea(); }
function supabaseSchedulePush(){
  if(!supabaseClient()) return;
  clearTimeout(supabasePushTimer);
  supabasePushTimer = setTimeout(supabasePushNow, 1500);
}
async function supabasePushNow(){
  const c = supabaseClient(); if(!c) return;
  const user = await supabaseCurrentUser();
  if(!user) return;
  try{
    supabaseSetStatus('sync');
    const priorLocalUpdated = DB._syncMeta && DB._syncMeta.updatedAt;
    const { data: existing, error: selErr } = await c.from('app_data').select('id, data').eq('owner', user.id).maybeSingle();
    if(selErr) throw selErr;
    const remoteUpdated = existing && existing.data && existing.data._syncMeta && existing.data._syncMeta.updatedAt;
    // Prima di sovrascrivere, controlliamo che nel frattempo un altro dispositivo non abbia già
    // salvato qualcosa di più recente di quanto sapessimo noi: altrimenti lo cancelleremmo in
    // silenzio (è esattamente il bug segnalato con le categorie di Viaggi). Se è successo,
    // adottiamo il remoto invece di sovrascriverlo e avvisiamo.
    if(remoteUpdated && (!priorLocalUpdated || remoteUpdated > priorLocalUpdated)){
      DB = existing.data;
      ensureMetodiPagamento(); ensureEtichette(); ensureCategorieColori(); ensureCategorieIcone(); ensureCategorieAbbonamenti(); ensureLinkUtiliGenerici(); ensureWelfare(); ensurePianificati(); ensureAutoLinkUtili(); ensureGasolioRef(); ensureSchemaVersion();
      localStorage.setItem(LS_KEY, JSON.stringify(DB));
      invalidateMovIndex();
      renderCurrentView();
      toast('Erano arrivati aggiornamenti più recenti da un altro dispositivo: li ho caricati. Se avevi appena modificato qualcosa qui, ricontrollalo.');
      supabaseSetStatus('connesso');
      return;
    }
    DB._syncMeta = DB._syncMeta || {}; DB._syncMeta.updatedAt = new Date().toISOString();
    lastPushedSyncTimestamp = DB._syncMeta.updatedAt;
    if(existing){
      const { error } = await c.from('app_data').update({ data: DB, updated_at: new Date().toISOString() }).eq('id', existing.id);
      if(error) throw error;
    } else {
      const { error } = await c.from('app_data').insert({ owner: user.id, data: DB, updated_at: new Date().toISOString() });
      if(error) throw error;
    }
    localStorage.setItem(LS_SUPABASE_LAST_SYNC, String(Date.now()));
    supabaseSetStatus('connesso');
  }catch(e){ console.error(e); supabaseSetStatus('errore'); }
}
/* Piccola icona che appare/scompare in un angolo quando i dati vengono aggiornati in automatico
   da Supabase (es. via Realtime da un altro dispositivo) — feedback discreto, non un avviso
   che interrompe quello che si sta facendo. */
function showSyncFlash(){
  const el = document.getElementById('syncFlash');
  if(!el) return;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>el.classList.remove('show'), 1400);
}
async function supabasePullAndMerge(){
  const c = supabaseClient(); if(!c) return;
  const user = await supabaseCurrentUser();
  if(!user) return;
  try{
    supabaseSetStatus('sync');
    const { data: row, error } = await c.from('app_data').select('data').eq('owner', user.id).maybeSingle();
    if(error) throw error;
    if(row && row.data){
      const remote = row.data;
      const remoteUpdated = remote._syncMeta && remote._syncMeta.updatedAt;
      const localUpdated = DB._syncMeta && DB._syncMeta.updatedAt;
      if(remoteUpdated && (!localUpdated || remoteUpdated > localUpdated)){
        DB = remote;
        ensureMetodiPagamento(); ensureEtichette(); ensureCategorieColori(); ensureCategorieIcone(); ensureCategorieAbbonamenti(); ensureLinkUtiliGenerici(); ensureWelfare(); ensurePianificati(); ensureAutoLinkUtili(); ensureGasolioRef(); ensureSchemaVersion();
        localStorage.setItem(LS_KEY, JSON.stringify(DB));
        invalidateMovIndex();
        showSyncFlash();
        renderCurrentView();
      } else if(!remoteUpdated || !localUpdated || localUpdated > remoteUpdated){
        await supabasePushNow(); // il locale è più recente (o manca ancora una riga remota completa): spediamo il nostro
      }
      // se sono uguali, siamo già allineati: nessuna azione
    } else {
      await supabasePushNow(); // prima sincronizzazione: la riga remota non esiste ancora, la creiamo
    }
    localStorage.setItem(LS_SUPABASE_LAST_SYNC, String(Date.now()));
    supabaseSetStatus('connesso');
  }catch(e){ console.error(e); supabaseSetStatus('errore'); }
}
/* Realtime: appena la nostra riga cambia su Supabase (da un altro dispositivo), lo veniamo a
   sapere all'istante e aggiorniamo i dati, senza dover ricaricare la pagina o premere nulla.
   L'evento generato dal NOSTRO stesso salvataggio viene riconosciuto e ignorato (altrimenti si
   creerebbe un rimbalzo push→pull→push senza fine). */
function supabaseSubscribeRealtime(user){
  const c = supabaseClient(); if(!c || !user || sbRealtimeChannel) return;
  sbRealtimeChannel = c.channel('app_data_own_row')
    .on('postgres_changes', { event:'*', schema:'public', table:'app_data', filter:`owner=eq.${user.id}` }, (payload)=>{
      const remote = payload.new && payload.new.data;
      const remoteUpdated = remote && remote._syncMeta && remote._syncMeta.updatedAt;
      if(remoteUpdated && remoteUpdated===lastPushedSyncTimestamp) return; // è l'eco del nostro salvataggio
      supabasePullAndMerge();
    })
    .subscribe();
}
function supabaseUnsubscribeRealtime(){
  if(sbRealtimeChannel){ sbRealtimeChannel.unsubscribe(); sbRealtimeChannel = null; }
}
async function supabaseLogin(email, password){
  const c = supabaseClient();
  if(!c) return { error: 'Configurazione Supabase mancante.' };
  const { data, error } = await c.auth.signInWithPassword({ email, password });
  if(error) return { error: error.message };
  supabaseSetStatus('sync');
  await supabasePullAndMerge();
  supabaseSubscribeRealtime(data.user);
  renderAccountArea();
  return {};
}
async function supabaseLogout(){
  const c = supabaseClient(); if(!c) return;
  supabaseUnsubscribeRealtime();
  await c.auth.signOut();
  supabaseSetStatus('disconnesso');
  renderAccountArea();
}
function supabaseInitOnLoad(){
  if(!supabaseConfigured()) return;
  supabaseCurrentUser().then(user=>{
    if(user){ supabaseSetStatus('sync'); supabasePullAndMerge(); supabaseSubscribeRealtime(user); }
  });
}
/* Sui telefoni il sistema operativo interrompe la connessione Realtime quando l'app va in
   background (schermo spento, cambio app) per risparmiare batteria — non si riconnette da sola.
   Per non dover chiudere e riaprire l'app ogni volta, controlliamo gli aggiornamenti anche solo
   tornando a guardarla (sblocco schermo, ritorno da un'altra app), non solo al primo avvio. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  if(!supabaseConfigured()) return;
  supabaseCurrentUser().then(user=>{
    if(user){ supabasePullAndMerge(); supabaseUnsubscribeRealtime(); supabaseSubscribeRealtime(user); }
  });
});

/* ==================== RICERCA ==================== */
/* Etichette che escludono un movimento dai totali/aggregazioni di Entrate e Uscite (Dashboard e Ricerca),
   pur lasciandolo regolarmente visibile nello storico della scheda Movimenti. NB: "rimborsato" NON è
   in questo elenco: è l'etichetta puramente visiva applicata automaticamente sulla spesa collegata a un
   rimborso (vedi applyRimborsatoTag) — il suo effetto sui totali è già gestito dal netting per categoria
   in movimentiForTotals, quindi non deve anche escludere il movimento (altrimenti la spesa sparirebbe
   due volte dai calcoli, come nel bug segnalato dall'utente il 07/09/2026). "rimborso" resta per un
   eventuale uso manuale dell'etichetta da parte dell'utente, non legato a questo meccanismo.
   */
/* Il vecchio meccanismo di esclusione manuale dai totali tramite etichetta è stato ritirato:
   con lo storno diretto per categoria (vedi movimentiForTotals) e l'etichetta "Rimborsato"
   puramente visiva non serve più nessuna etichetta che escluda un movimento dai totali.
   L'elenco resta vuoto per compatibilità con isExcludedFromTotals/computeEtichettaStats, che
   continuano a funzionare correttamente (nessuna esclusione) senza bisogno di essere riscritti. */
const TOTALS_EXCLUDED_TAGS = [];
function normalizeEtichettaForMatch(t){
  return String(t||'').trim().toLowerCase().replace(/^#/, '');
}
function isExcludedFromTotals(m){
  return Array.isArray(m.etichette) && m.etichette.some(t=>TOTALS_EXCLUDED_TAGS.includes(normalizeEtichettaForMatch(t)));
}
function movimentiForTotals(list){
  // Storno diretto su categoria di spesa: un movimento marcato come "rimborso di una spesa"
  // (rimborsoSpesa) resta un'entrata a tutti gli effetti nella scheda Movimenti, ma ai soli
  // fini del calcolo dei totali (Dashboard, Ricerca, Confronto, ecc.) viene trattato come una
  // uscita negativa nella stessa categoria — riducendo la spesa netta di quella categoria e
  // senza gonfiare il Totale Entrate. Il saldo complessivo resta invariato rispetto al calcolo
  // "grezzo" (è solo una riclassificazione, non nuovo denaro).
  return (list || DB.movimenti).filter(m=>!isExcludedFromTotals(m)).map(m=>{
    if(m.rimborsoSpesa && m.entrate) return Object.assign({}, m, { entrate:0, uscite:-m.entrate });
    return m;
  });
}
let searchFilter = { anni:[], mesi:[], min:'', max:'', dataMin:'', dataMax:'', categoria:'', dettaglio:'', note:'', etichette:[], multi:false, tipo:'tutti', metodo:'tutti' };
let searchAdvancedOpen = false;
let searchSelected = new Set();
function hasActiveSearchFilters(){
  const f = searchFilter;
  return f.anni.length>0 || f.mesi.length>0 || (f.min!=='' && f.min!=null) || (f.max!=='' && f.max!=null) || (f.dataMin!=='' && f.dataMin!=null) || (f.dataMax!=='' && f.dataMax!=null) || (f.categoria||'').trim()!=='' || (f.dettaglio||'').trim()!=='' || (f.note||'').trim()!=='' || f.etichette.length>0 || (f.tipo && f.tipo!=='tutti') || (f.metodo && f.metodo!=='tutti');
}
function computeSearchMatches(){
  const f = searchFilter;
  const catL = (f.categoria||'').trim().toLowerCase();
  const dtlL = (f.dettaglio||'').trim().toLowerCase();
  const noteL = (f.note||'').trim().toLowerCase();
  const min = (f.min!=='' && f.min!=null && !isNaN(parseFloat(f.min))) ? parseFloat(f.min) : null;
  const max = (f.max!=='' && f.max!=null && !isNaN(parseFloat(f.max))) ? parseFloat(f.max) : null;
  const dataMin = (f.dataMin!=='' && f.dataMin!=null) ? f.dataMin : null;
  const dataMax = (f.dataMax!=='' && f.dataMax!=null) ? f.dataMax : null;

  const movMatches = DB.movimenti.filter(m=>{
    if(f.tipo==='entrata' && !m.entrate) return false;
    if(f.tipo==='uscita' && !m.uscite) return false;
    if(f.metodo && f.metodo!=='tutti' && movimentoMetodoEffettivo(m)!==f.metodo) return false;
    if(f.anni.length && (!m.data || !f.anni.includes(m.data.slice(0,4)))) return false;
    if(f.mesi.length && (!m.data || !f.mesi.includes(String(parseInt(m.data.slice(5,7),10))))) return false;
    if(dataMin && (!m.data || m.data<dataMin)) return false;
    if(dataMax && (!m.data || m.data>dataMax)) return false;
    const importo = m.entrate || m.uscite || 0;
    if(min!=null && importo<min) return false;
    if(max!=null && importo>max) return false;
    if(catL && !(m.categoria && String(m.categoria).toLowerCase().includes(catL))) return false;
    if(dtlL && !(m.descrizione && String(m.descrizione).toLowerCase().includes(dtlL))) return false;
    if(noteL && !(m.note && String(m.note).toLowerCase().includes(noteL))) return false;
    if(f.etichette.length && !(Array.isArray(m.etichette) && m.etichette.some(t=>f.etichette.includes(t)))) return false;
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  const subMatches = DB.abbonamenti.filter(a=>{
    if(f.tipo==='entrata') return false; // gli abbonamenti sono sempre un costo, mai un'entrata
    if(f.metodo && f.metodo!=='tutti' && a.metodoPagamento!==f.metodo) return false;
    if(noteL) return false; // gli abbonamenti non hanno un campo Note
    if(f.etichette.length) return false; // gli abbonamenti non hanno etichette
    if(f.anni.length && (!a.scadenza || !f.anni.includes(a.scadenza.slice(0,4)))) return false;
    if(f.mesi.length && (!a.scadenza || !f.mesi.includes(String(parseInt(a.scadenza.slice(5,7),10))))) return false;
    if(dataMin && (!a.scadenza || a.scadenza<dataMin)) return false;
    if(dataMax && (!a.scadenza || a.scadenza>dataMax)) return false;
    const costo = a.costo || 0;
    if(min!=null && costo<min) return false;
    if(max!=null && costo>max) return false;
    if(catL && !(a.servizio && String(a.servizio).toLowerCase().includes(catL))) return false;
    if(dtlL && !(a.servizio && String(a.servizio).toLowerCase().includes(dtlL))) return false;
    return true;
  });

  const autoMatches = DB.auto.manutenzione.filter(x=>{
    if(f.tipo==='entrata') return false; // gli interventi auto sono sempre un costo, mai un'entrata
    if(noteL) return false; // gli interventi di manutenzione non hanno un campo Note
    if(f.etichette.length) return false; // gli interventi di manutenzione non hanno etichette
    if(f.anni.length && (!x.data || !f.anni.includes(x.data.slice(0,4)))) return false;
    if(f.mesi.length && (!x.data || !f.mesi.includes(String(parseInt(x.data.slice(5,7),10))))) return false;
    if(dataMin && (!x.data || x.data<dataMin)) return false;
    if(dataMax && (!x.data || x.data>dataMax)) return false;
    const costo = x.costo || 0;
    if(min!=null && costo<min) return false;
    if(max!=null && costo>max) return false;
    if(catL && !(x.intervento && String(x.intervento).toLowerCase().includes(catL))) return false;
    if(dtlL && !(x.intervento && String(x.intervento).toLowerCase().includes(dtlL))) return false;
    return true;
  });

  return { movMatches, subMatches, autoMatches };
}
