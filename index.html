/* ==================== MINI-DIALOG: sostituti di prompt()/confirm() ====================
   Le finestre native del browser (prompt/confirm) possono essere silenziosamente bloccate
   in certi ambienti (es. dopo che l'utente spunta "Impedisci a questa pagina di creare altre
   finestre di dialogo" in Chrome, che Chrome offre dopo un paio di conferme ravvicinate), nel
   qual caso ogni azione che dipende da esse smette di funzionare senza alcun errore visibile.
   Questi sostituti sono normali elementi della pagina: funzionano sempre, in ogni condizione,
   e restano coerenti con lo stile dell'app invece di aprire una finestra di sistema grigia.
   Si possono aprire anche sopra un'altra modale già aperta (es. rinominare un'etichetta dentro
   la finestra Etichette) grazie a un overlay dedicato con z-index più alto. */
function miniDialogBase(innerHtml){
  const overlay = document.createElement('div');
  overlay.className = 'mini-dialog-backdrop';
  overlay.innerHTML = `<div class="mini-dialog">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  return overlay;
}
function customConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = miniDialogBase(`
      <div class="mini-dialog-msg">${esc(message)}</div>
      <div class="mini-dialog-actions">
        <button type="button" class="btn" data-a="cancel">Annulla</button>
        <button type="button" class="btn ${opts.danger?'btn-danger':'btn-primary'}" data-a="ok">${esc(opts.okLabel||'Conferma')}</button>
      </div>`);
    let done = false;
    const cleanup = (val)=>{ if(done) return; done = true; overlay.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    pushBackClose(()=>cleanup(false));
    const cleanupAndConsume = (val)=>{ cleanup(val); consumeBackClose(); };
    overlay.querySelector('[data-a="ok"]').onclick = ()=>cleanupAndConsume(true);
    overlay.querySelector('[data-a="cancel"]').onclick = ()=>cleanupAndConsume(false);
    overlay.onclick = (e)=>{ if(e.target===overlay) cleanupAndConsume(false); };
    function onKey(e){ if(e.key==='Escape') cleanupAndConsume(false); else if(e.key==='Enter') cleanupAndConsume(true); }
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(()=>overlay.querySelector('[data-a="ok"]').focus());
  });
}
function customPrompt(message, defaultValue){
  return new Promise(resolve=>{
    const overlay = miniDialogBase(`
      <div class="mini-dialog-msg">${esc(message)}</div>
      <input type="text" class="mini-dialog-input" value="${esc(defaultValue||'')}">
      <div class="mini-dialog-actions">
        <button type="button" class="btn" data-a="cancel">Annulla</button>
        <button type="button" class="btn btn-primary" data-a="ok">OK</button>
      </div>`);
    const input = overlay.querySelector('.mini-dialog-input');
    let done = false;
    const cleanup = (val)=>{ if(done) return; done = true; overlay.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    pushBackClose(()=>cleanup(null));
    const cleanupAndConsume = (val)=>{ cleanup(val); consumeBackClose(); };
    overlay.querySelector('[data-a="ok"]').onclick = ()=>cleanupAndConsume(input.value);
    overlay.querySelector('[data-a="cancel"]').onclick = ()=>cleanupAndConsume(null);
    overlay.onclick = (e)=>{ if(e.target===overlay) cleanupAndConsume(null); };
    input.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); cleanupAndConsume(input.value); }
    });
    function onKey(e){ if(e.key==='Escape') cleanupAndConsume(null); }
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(()=>{ input.focus(); input.select(); });
  });
}

/* ==================== SWIPE-BACK: trascina dal bordo sinistro per chiudere ====================
   Stesso gesto delle app native (iOS in particolare): un tocco che parte dai ~28px più a
   sinistra dello schermo, se il movimento è prevalentemente orizzontale, fa scorrere la
   "pagina" di Impostazioni assieme al dito; rilasciando oltre 1/3 dello schermo (o con uno
   scatto deciso) la pagina si chiude, altrimenti torna elasticamente al suo posto.
   Resta inattivo su tutto il resto dello schermo, quindi non interferisce mai con lo scroll
   verticale delle liste. Un solo listener globale: nessun rischio di ascoltatori duplicati
   ogni volta che si apre una nuova pagina. */
(function setupModalSwipeBack(){
  /* Swipe dal bordo sinistro O dal bordo destro per tornare indietro: vale sia per le pagine a
     scorrimento (Impostazioni e simili) sia per i popup "classici" (form di Movimento,
     Abbonamento, Auto, Manutenzione, ecc.) — stesso gesto, stessa sensazione, da entrambi i lati. */
  const EDGE_ZONE = 28, CLOSE_RATIO = 0.33, FLICK_VELOCITY = 0.55; // px/ms
  let active=false, decided=false, horizontal=false, mode=null, dir=1;
  let startX=0, startY=0, startT=0, lastX=0, lastT=0, velocity=0;

  document.addEventListener('touchstart', (e)=>{
    const backdrop = document.getElementById('modalBackdrop');
    if(backdrop.classList.contains('closing')) return;
    if(backdrop.classList.contains('settings-page-mode')) mode = 'settings';
    else if(backdrop.classList.contains('show')) mode = 'modal';
    else { mode = null; return; }
    const t = e.touches[0];
    const fromLeft = t.clientX <= EDGE_ZONE;
    const fromRight = t.clientX >= window.innerWidth - EDGE_ZONE;
    if(!fromLeft && !fromRight) return;
    dir = fromLeft ? 1 : -1; // 1 = trascina verso destra (bordo sx), -1 = verso sinistra (bordo dx)
    active = true; decided = false; horizontal = false;
    startX = lastX = t.clientX; startY = t.clientY; startT = lastT = e.timeStamp; velocity = 0;
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(!active) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(!decided){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      decided = true;
      horizontal = Math.abs(dx) > Math.abs(dy) && Math.sign(dx||1)===dir;
      if(!horizontal){ active = false; return; }
      document.getElementById('modalBox').style.transition = 'none';
    }
    if(!horizontal) return;
    e.preventDefault();
    const x = dir>0 ? Math.max(0, dx) : Math.min(0, dx);
    velocity = (t.clientX - lastX) / Math.max(1, e.timeStamp - lastT);
    lastX = t.clientX; lastT = e.timeStamp;
    document.getElementById('modalBox').style.transform = `translateX(${x}px)`;
  }, {passive:false});

  document.addEventListener('touchend', ()=>{
    if(!active || !horizontal){ active = false; return; }
    active = false;
    const box = document.getElementById('modalBox');
    const width = window.innerWidth;
    const x = dir>0 ? Math.max(0, lastX - startX) : Math.min(0, lastX - startX);
    const shouldClose = Math.abs(x) > width*CLOSE_RATIO || (dir>0 ? velocity : -velocity) > FLICK_VELOCITY;
    box.style.transition = 'transform .26s cubic-bezier(.22,.68,0,1)';
    if(shouldClose){
      box.style.transform = `translateX(${dir>0 ? width : -width}px)`;
      if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
      setTimeout(()=>{
        // La chiusura visiva l'ha già fatta lo swipe: qui puliamo lo stato direttamente
        // (stessa pulizia di closeModal(), senza far ripartire una seconda animazione sopra
        // quella appena fatta) e consumiamo la voce di cronologia creata all'apertura, come fa
        // closeModal(), così il tasto/gesture indietro resta allineato a ciò che è aperto.
        document.getElementById('modalBackdrop').classList.remove('show','settings-page-mode','closing');
        box.innerHTML = ''; box.className = 'modal'; box.style.transform=''; box.style.transition='';
        consumeBackClose();
      }, 260);
    } else {
      box.style.transform = 'translateX(0)';
      setTimeout(()=>{ box.style.transition=''; }, 260);
    }
  }, {passive:true});
})();

/* ==================== RIMBALZO ELASTICO SUI BORDI DELLE LISTE ====================
   Android (a differenza di iOS) non ha di natura il "rubber band" quando si scorre oltre
   inizio/fine di un contenitore scrollabile: qui lo simuliamo su #mainContent, che è l'unico
   elemento che scorre davvero nell'app (vedi nota su html,body{overflow:hidden}). Si attiva
   solo quando si è già all'inizio/fine e si continua a trascinare oltre: il contenuto si
   allunga leggermente seguendo il dito, poi torna elasticamente al suo posto al rilascio. */
(function setupEdgeBounce(){
  const MAX_STRETCH = 70, DAMP = 0.4;
  let el=null, startY=0, dragging=false, edge=null;
  document.addEventListener('touchstart', (e)=>{
    el = document.getElementById('mainContent');
    if(!el) return;
    const atTop = el.scrollTop <= 0;
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
    if(!atTop && !atBottom) { el = null; return; }
    edge = atTop ? 'top' : 'bottom';
    startY = e.touches[0].clientY;
    dragging = false;
  }, {passive:true});
  document.addEventListener('touchmove', (e)=>{
    if(!el) return;
    const dy = e.touches[0].clientY - startY;
    const pulling = (edge==='top' && dy>0) || (edge==='bottom' && dy<0);
    if(!pulling){ if(dragging){ el.style.transform=''; el.style.transition=''; dragging=false; } return; }
    // Se non siamo più davvero al bordo opposto (contenuto rientrato), interrompe
    const atTop = el.scrollTop <= 0, atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
    if((edge==='top' && !atTop) || (edge==='bottom' && !atBottom)) return;
    dragging = true;
    el.style.transition = 'none';
    const stretch = Math.min(MAX_STRETCH, Math.abs(dy) * DAMP) * (edge==='top' ? 1 : -1);
    el.style.transform = `translateY(${stretch}px)`;
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('touchend', ()=>{
    if(!el || !dragging){ el=null; return; }
    el.style.transition = 'transform .35s cubic-bezier(.34,1.4,.64,1)';
    el.style.transform = '';
    dragging = false; el = null;
  }, {passive:true});
})();

/* ==================== OMBRA TABBAR REATTIVA ALLO SCROLL ====================
   Più si scorre velocemente la lista sotto, più l'ombra sotto la pillola di navigazione si
   accentua (dà sensazione di profondità/velocità), poi si rilassa quando lo scroll rallenta/si ferma. */
(function setupTabbarScrollShadow(){
  const main = document.getElementById('mainContent');
  if(!main) return;
  let lastTop = main.scrollTop, lastT = performance.now(), decayTimer = null;
  main.addEventListener('scroll', ()=>{
    const now = performance.now();
    const dt = Math.max(16, now-lastT);
    const dy = Math.abs(main.scrollTop - lastTop);
    const speed = dy / dt; // px/ms
    lastTop = main.scrollTop; lastT = now;
    const boost = Math.min(1, speed / 1.8);
    document.documentElement.style.setProperty('--scroll-boost', boost.toFixed(2));
    clearTimeout(decayTimer);
    decayTimer = setTimeout(()=>{ document.documentElement.style.setProperty('--scroll-boost', '0'); }, 200);
  }, {passive:true});
})();

function openCalculatorModal(){

        <button class="calc-btn wide" data-d="0">0</button>

        <button class="calc-btn calc-accent" id="calcEqBtn">=</button>
      </div>
    </div>
  `);
  document.getElementById('calcCloseBtn').onclick = closeModal;
  wireCalculator();
}
function updateCalcDisplay(){
  const el = document.getElementById('calcDisplay');
  if(el) el.textContent = calcState.cur;
}
function calcInputDigit(d){
  if(calcState.resetNext || calcState.cur==='0'){ calcState.cur = d; calcState.resetNext=false; }
  else if(calcState.cur.length<16) calcState.cur += d;
  updateCalcDisplay();
}
function calcInputDot(){
  if(calcState.resetNext){ calcState.cur='0.'; calcState.resetNext=false; updateCalcDisplay(); return; }
  if(!calcState.cur.includes('.')) calcState.cur += '.';
  updateCalcDisplay();
}
function calcClear(){ calcState = { cur:'0', prev:null, op:null, resetNext:false }; updateCalcDisplay(); }
function calcToggleSign(){ calcState.cur = String(parseFloat(calcState.cur||'0')*-1); updateCalcDisplay(); }
function calcPercent(){ calcState.cur = String(parseFloat(calcState.cur||'0')/100); updateCalcDisplay(); }
function calcSetOp(op){
  if(calcState.op && !calcState.resetNext) calcCompute();
  calcState.prev = parseFloat(calcState.cur);
  calcState.op = op;
  calcState.resetNext = true;
}
function calcCompute(){
  if(calcState.op===null || calcState.prev===null) return;
  const a = calcState.prev, b = parseFloat(calcState.cur);
  let r;
  switch(calcState.op){
    case '+': r=a+b; break;
    case '-': r=a-b; break;
    case '×': r=a*b; break;
    case '÷': r = b===0 ? NaN : a/b; break;
  }
  calcState.cur = String(Number.isFinite(r) ? Math.round(r*1e8)/1e8 : 'Errore');
  calcState.op = null; calcState.prev = null; calcState.resetNext = true;
  updateCalcDisplay();
}
function wireCalculator(){
  document.querySelectorAll('.calc-btn[data-d]').forEach(b=>b.onclick=()=>calcInputDigit(b.dataset.d));
  document.getElementById('calcDotBtn').onclick = calcInputDot;
  document.getElementById('calcClearBtn').onclick = calcClear;
  document.getElementById('calcSignBtn').onclick = calcToggleSign;
  document.getElementById('calcPercentBtn').onclick = calcPercent;
  document.querySelectorAll('.calc-btn[data-op]').forEach(b=>b.onclick=()=>calcSetOp(b.dataset.op));
  document.getElementById('calcEqBtn').onclick = calcCompute;
}

function getYears(){
  return movIndex().years;
}
let dashFilter = { anni:[], mesi:[], multi:false };
function initDashDefaultPeriod(){
  let latest = null;
  DB.movimenti.forEach(m=>{ if(m.data && (!latest || m.data>latest)) latest = m.data; });
  if(latest){
    dashFilter.anni = [latest.slice(0,4)];
    dashFilter.mesi = [String(parseInt(latest.slice(5,7),10))];
  }
}

function filteredMovimenti(f){
  // Se sono selezionati anni specifici, si parte solo dai movimenti di quegli anni (via indice)
  // invece di scandire l'intero storico: con più anni di dati accumulati riduce di molto il lavoro
  // per il caso più comune (filtro Dashboard su un anno/mese preciso).
  const base = (f.anni && f.anni.length)
    ? f.anni.flatMap(y => movIndex().byYear[y] || [])
    : DB.movimenti;
  return base.filter(m=>{
    if(!m.data) return false;
    if(f.mesi && f.mesi.length && !f.mesi.includes(String(parseInt(m.data.slice(5,7),10)))) return false;
    return true;
  });
}

/* ---- Confronto spesa vs periodo precedente equivalente (mese vs mese scorso, anno vs anno scorso) ---- */
function computeComparisonInsight(){
  function sumUscite(y, m){
    return DB.movimenti.reduce((s,x)=>{
      if(!x.data || !x.uscite || isExcludedFromTotals(x)) return s;
      if(x.data.slice(0,4)!==String(y)) return s;
      if(m!==null && parseInt(x.data.slice(5,7),10)!==m) return s;
      return s + x.uscite;
    },0);
  }
  let curLabel, prevLabel, curTot, prevTot;
  if(dashFilter.anni.length===1 && dashFilter.mesi.length===1){
    const y = parseInt(dashFilter.anni[0],10), m = parseInt(dashFilter.mesi[0],10);
    let py=y, pm=m-1; if(pm<1){ pm=12; py=y-1; }
    curTot = sumUscite(y,m); prevTot = sumUscite(py,pm);
    curLabel = monthName(m); prevLabel = monthName(pm);
  } else if(dashFilter.anni.length===1 && dashFilter.mesi.length===0){
    const y = parseInt(dashFilter.anni[0],10), py = y-1;
    curTot = sumUscite(y,null); prevTot = sumUscite(py,null);
    curLabel = String(y); prevLabel = String(py);
  } else if(dashFilter.anni.length===0 && dashFilter.mesi.length===0){
    let latest = null;
    DB.movimenti.forEach(x=>{ if(x.data && (!latest || x.data>latest)) latest = x.data; });
    if(!latest) return null;
    const y = parseInt(latest.slice(0,4),10), m = parseInt(latest.slice(5,7),10);
    let py=y, pm=m-1; if(pm<1){ pm=12; py=y-1; }
    curTot = sumUscite(y,m); prevTot = sumUscite(py,pm);
    curLabel = monthName(m)+' '+y; prevLabel = monthName(pm)+' '+py;
  } else {
    return null; // selezione multipla/ambigua: confronto non mostrato
  }
  if(!prevTot) return null;
  const deltaPct = ((curTot-prevTot)/prevTot)*100;
  return { curLabel, prevLabel, deltaPct, positive: deltaPct<=0 };
}

/* ---- Aggiornamento dati Dashboard (KPI, elenco categorie, grafici) ----
   Separata dalla costruzione della struttura HTML (renderDashboard sopra): quando l'utente cambia
   solo il filtro anno/mese, i pulsanti dei filtri richiamano SOLO questa funzione invece di ricostruire
   l'intera pagina. Questo lascia intatti i <canvas> dei grafici tra un click e l'altro, permettendo a
   Chart.js di aggiornarli con chart.update() invece di doverli distruggere e ricreare da zero ad ogni
   cambio di filtro — meno lavoro per il browser e un aggiornamento visivamente più fluido. */
function updateDashboardData(){
  const wStats = welfareStats();
  const kWelfare = document.getElementById('kpiWelfare');
  kWelfare.className = `kpi-value ${saldoClass(wStats.saldo)}`;
  animateNumber(kWelfare, dashPrevWelfare, wStats.saldo);
  // Riflesso "carta fisica" quando il saldo Welfare sale rispetto al render precedente.
  if(dashPrevWelfare!==null && wStats.saldo > dashPrevWelfare){
    const card = document.getElementById('kpiWelfareCard');
    card.classList.remove('card-shine'); void card.offsetWidth; card.classList.add('card-shine');
  }
  dashPrevWelfare = wStats.saldo;

  renderProssimeScadenze();
  renderScadenzeBanner();

  const period = movimentiForTotals(filteredMovimenti(dashFilter));
  const totEntrate = period.reduce((s,m)=>s+(m.entrate||0),0);
  const totUscite = period.reduce((s,m)=>s+(m.uscite||0),0);
  const saldo = totEntrate - totUscite;

  const prev = dashPrevTotals;
  const kEntrate = document.getElementById('kpiEntrate');
  kEntrate.className = 'kpi-value pos';
  animateNumber(kEntrate, prev?prev.entrate:null, totEntrate);
  const cmp = computeComparisonInsight();
  const kUscite = document.getElementById('kpiUscite');
  kUscite.className = 'kpi-value neg';
  kUscite.innerHTML = `<span class="kpi-num"></span>` + (cmp ? `<div class="kpi-compare ${cmp.positive?'pos':'neg'}">${cmp.positive?'▼':'▲'} ${Math.abs(cmp.deltaPct).toFixed(0)}% vs ${esc(cmp.prevLabel)}</div>` : '');
  animateNumber(kUscite.querySelector('.kpi-num'), prev?prev.uscite:null, totUscite);
  const kSaldo = document.getElementById('kpiSaldo');
  kSaldo.className='kpi-value '+saldoClass(saldo);
  animateNumber(kSaldo, prev?prev.saldo:null, saldo);
  dashPrevTotals = {entrate:totEntrate, uscite:totUscite, saldo:saldo};

  // category breakdown (uscite only) for the period, with sub-breakdown by descrizione
  const catTotals = {};
  const catSubTotals = {};
  period.forEach(m=>{
    if(m.uscite){
      catTotals[m.categoria]=(catTotals[m.categoria]||0)+m.uscite;
      catSubTotals[m.categoria] = catSubTotals[m.categoria] || {};
      const sub = m.descrizione || 'Altro';
      catSubTotals[m.categoria][sub] = (catSubTotals[m.categoria][sub]||0) + m.uscite;
    }
  });
  const catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);

  const accList = document.getElementById('accCatList');
  accList.innerHTML = catEntries.length ? catEntries.map(([cat,val])=>{
    const pct = totUscite>0 ? (val/totUscite*100) : 0;
    const subs = Object.entries(catSubTotals[cat]||{}).sort((a,b)=>b[1]-a[1]);
    const subRows = subs.map(([sub,sv])=>`<div class="acc-sub-row">
        <span>${esc(sub)}</span>
        <b>${fmtEUR(sv)}</b>
      </div>`).join('');
    return `<div class="acc-item" data-cat="${esc(cat)}">
      <div class="acc-head">
        <span class="acc-chevron">▶</span>
        <span class="acc-cat"><span class="tag-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${categoryColor(cat)};"></span>${esc(cat)}</span>
        <span class="acc-pct">${pct.toFixed(1)}%</span>
        <span class="acc-bar-wrap"><span class="acc-bar" style="background:${categoryColor(cat)};width:${Math.max(0,pct)}%;display:block;"></span></span>
        <span class="acc-amt">${fmtEUR(val)}</span>
      </div>
      <div class="acc-body">${subRows}</div>
    </div>`;
  }).join('') : `<div class="empty-state" style="padding:24px;">Nessuna spesa nel periodo selezionato</div>`;
  accList.querySelectorAll('.acc-head').forEach(h=>h.onclick = ()=>{
    h.parentElement.classList.toggle('open');
  });

  // Trend chart: monthly aggregation
  let trendLabels=[], trendEntrate=[], trendUscite=[];
  if(dashFilter.anni.length===1){
    const y = dashFilter.anni[0];
    const byMonth = {};
    for(let m=1;m<=12;m++) byMonth[m]={e:0,u:0};
    movimentiForTotals(DB.movimenti).filter(m=>m.data && m.data.slice(0,4)===y).forEach(m=>{
      const mo = parseInt(m.data.slice(5,7),10);
      byMonth[mo].e+=m.entrate||0; byMonth[mo].u+=m.uscite||0;
    });
    trendLabels = Object.keys(byMonth).map(m=>monthName(parseInt(m)).slice(0,3));
    trendEntrate = Object.values(byMonth).map(v=>v.e);
    trendUscite = Object.values(byMonth).map(v=>v.u);
  } else if(dashFilter.anni.length>1){
    // più anni selezionati: totali annuali a confronto
    const sel = dashFilter.anni.slice().sort();
    const byYear = {};
    sel.forEach(y=>byYear[y]={e:0,u:0});
    movimentiForTotals(DB.movimenti).filter(m=>m.data && sel.includes(m.data.slice(0,4))).forEach(m=>{
      const y = m.data.slice(0,4);
      byYear[y].e+=m.entrate||0; byYear[y].u+=m.uscite||0;
    });
    trendLabels = sel;
    trendEntrate = sel.map(y=>byYear[y].e);
    trendUscite = sel.map(y=>byYear[y].u);
  } else {
    // nessun anno selezionato = tutti: ultimi 12 mesi presenti nei dati
    const byMonth = {};
    movimentiForTotals(DB.movimenti).forEach(m=>{ if(!m.data) return; const key=m.data.slice(0,7); byMonth[key]=byMonth[key]||{e:0,u:0}; byMonth[key].e+=m.entrate||0; byMonth[key].u+=m.uscite||0; });
    const keys = Object.keys(byMonth).sort().slice(-12);
    trendLabels = keys.map(k=>{ const [y,mo]=k.split('-'); return monthName(parseInt(mo)).slice(0,3)+' \''+y.slice(2); });
    trendEntrate = keys.map(k=>byMonth[k].e);
    trendUscite = keys.map(k=>byMonth[k].u);
  }

  const isDark = currentTheme()!=='light';
  const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
  const textColor = isDark ? '#93A3AA' : '#5C6B72';

  // Sparkline nelle card KPI: stesso array dati già calcolato per il grafico Andamento, quindi a costo
  // pressoché nullo in più. Il saldo periodo per periodo è semplicemente entrate-uscite punto per punto.
  const sparkEntrateEl = document.getElementById('sparkEntrate');
  const sparkUsciteEl = document.getElementById('sparkUscite');
  const sparkSaldoEl = document.getElementById('sparkSaldo');
  if(sparkEntrateEl) sparkEntrateEl.innerHTML = sparklineSVG(trendEntrate, '#49D9A8');
  if(sparkUsciteEl) sparkUsciteEl.innerHTML = sparklineSVG(trendUscite, '#FF7A66');
  if(sparkSaldoEl) sparkSaldoEl.innerHTML = sparklineSVG(trendEntrate.map((e,i)=>e-(trendUscite[i]||0)), 'var(--text-dim)');

  // Il canvas #chartTrend resta lo stesso nodo DOM tra un cambio filtro e l'altro (updateDashboardData
  // non ricostruisce più l'HTML della Dashboard): se l'istanza Chart.js esiste ancora ed è agganciata
  // a quel canvas, le aggiorniamo solo i dati con update() invece di distruggerla e ricrearla.
  const chartTrendEl = document.getElementById('chartTrend');
  if(charts.trend && charts.trend.canvas === chartTrendEl){
    charts.trend.data.labels = trendLabels;
    charts.trend.data.datasets[0].data = trendEntrate;
    charts.trend.data.datasets[1].data = trendUscite;
    charts.trend.options.plugins.legend.labels.color = textColor;
    charts.trend.options.scales.x.ticks.color = textColor;
    charts.trend.options.scales.y.ticks.color = textColor;
    charts.trend.options.scales.y.grid.color = gridColor;
    charts.trend.update();
  } else {
    if(charts.trend) charts.trend.destroy();
    charts.trend = new Chart(chartTrendEl, {
      type:'bar',
      data:{ labels:trendLabels, datasets:[
        {label:'Entrate', data:trendEntrate, backgroundColor:'#49D9A8', borderRadius:4, maxBarThickness:22},
        {label:'Uscite', data:trendUscite, backgroundColor:'#FF7A66', borderRadius:4, maxBarThickness:22}
      ]},
      options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:{duration:650, easing:'easeOutQuart'},
        plugins:{ legend:{ labels:{color:textColor, font:{family:'Inter',size:11.5}}, position:'top', align:'end' } },
        scales:{
          x:{ grid:{display:false}, ticks:{color:textColor,font:{size:11}} },
          y:{ grid:{color:gridColor}, ticks:{color:textColor,font:{size:11}, callback:v=>'€'+v} }
        }
      }
    });
  }

  const sliceOffsets = catEntries.map(()=>8);
  const chartCatEl = document.getElementById('chartCat');
  // Al tap/click su una fetta mostriamo l'importo con un toast dell'app (coerente con il resto
  // dell'interfaccia), invece di affidarci al tooltip nativo di Chart.js che su alcuni browser
  // mobile mostra un testo poco chiaro al tocco. Ridefinito ad ogni render per non restare
  // legato a dati vecchi quando il grafico viene solo aggiornato (non ricreato).
  const catSliceOnClick = (evt, elements)=>{
    if(!elements.length) return;
    const idx = elements[0].index;
    const entry = catEntries[idx];
    if(!entry) return;
    const msg = `${entry[0]}: ${entry[1].toLocaleString('it-IT',{style:'currency',currency:'EUR'})}`;
    const native = evt && evt.native;
    if(native && (native.clientX || (native.touches && native.touches[0]))){
      const pt = native.touches && native.touches[0] ? native.touches[0] : native;
      showChartValueBubble(msg, pt.clientX, pt.clientY);
    } else {
      // Click dalla legenda (nessuna posizione del tocco): mostra la bolla accanto al centro del grafico.
      const rect = chartCatEl.getBoundingClientRect();
      showChartValueBubble(msg, rect.left + rect.width/2, rect.top + rect.height/2);
    }
  };
  if(charts.cat && charts.cat.canvas === chartCatEl){
    charts.cat.data.labels = catEntries.map(e=>e[0]);
    charts.cat.data.datasets[0].data = catEntries.map(e=>e[1]);
    charts.cat.data.datasets[0].backgroundColor = catEntries.map(e=>categoryColor(e[0]));
    charts.cat.data.datasets[0].borderColor = isDark ? '#161D21' : '#FFFFFF';
    charts.cat.data.datasets[0].offset = sliceOffsets;
    charts.cat.options.plugins.legend.labels.color = textColor;
    charts.cat.options.onClick = catSliceOnClick;
    charts.cat.update();
  } else {
    if(charts.cat) charts.cat.destroy();
    charts.cat = new Chart(chartCatEl, {
      type:'pie',
      data:{ labels:catEntries.map(e=>e[0]), datasets:[{
        data:catEntries.map(e=>e[1]),
        backgroundColor:catEntries.map(e=>categoryColor(e[0])),
        borderColor: isDark ? '#161D21' : '#FFFFFF',
        borderWidth:3,
        offset: sliceOffsets,
        hoverOffset: 16,
        borderRadius:4
      }] },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        radius:'86%',
        onClick: catSliceOnClick,
        plugins:{
          legend:{
            position:'right', labels:{color:textColor, boxWidth:9, font:{family:'Inter',size:11}, padding:9},
            onClick:(evt, legendItem, legend)=>{
              // Sostituisce il comportamento di default (nasconde la fetta): la "stacca"
              // brevemente come al tocco diretto, mostrando anche l'importo.
              const chart = legend.chart, idx = legendItem.index;
              chart.setActiveElements([{datasetIndex:0, index:idx}]);
              chart.update();
              catSliceOnClick(evt, [{index:idx}]);
              setTimeout(()=>{ chart.setActiveElements([]); chart.update(); }, 700);
            }
          },
          tooltip:{ enabled:false }
        }
      }
    });
  }
}

let movSelected = new Set();
/* Modalità selezione dell'elenco Movimenti mobile (attivata da tocco prolungato): quando attiva,
   un tocco singolo su qualunque riga aggiunge/toglie la selezione invece di espanderla. */
let movSelectionMode = false;
let movExpandedYears = null;

function subcategorieFor(cat){
  const manual = cat==='Abbonamenti' ? [] : (DB.sottocategorie[cat] || []);
  const mirrored = abbonamentiSottocategorie(cat);
  const seen = new Set(manual.map(normalizeMatch));
  const merged = manual.slice();
  mirrored.forEach(s=>{ const k = normalizeMatch(s); if(!seen.has(k)){ seen.add(k); merged.push(s); } });
  return merged;
}
/* Sottocategorie abbonamenti = specchio degli abbonamenti attivi la cui "categoriaMovimento" combacia
   con la categoria richiesta (default "Abbonamenti" per gli abbonamenti creati prima di questo campo).
   Nessuna gestione manuale su questo specchio: si gestisce solo dalla scheda Abbonamenti. */
function abbonamentiSottocategorie(catFilter){
  const seen = [];
  DB.abbonamenti.filter(a=>a.stato==='Attivo' && a.servizio && (a.categoriaMovimento||'Abbonamenti')===catFilter).forEach(a=>{
    const key = normalizeMatch(a.servizio);
    if(!seen.some(s=>normalizeMatch(s)===key)) seen.push(a.servizio);
  });
  return seen;
}

/* ---- Colore stabile per categoria: sempre lo stesso ovunque nell'app (dashboard, ricerca, PDF) ---- */
const CATEGORY_COLOR_PALETTE = ['#49D9A8','#5FA8FF','#B592FF','#FF7A66','#F5B95C','#4FC3E8','#E88BD8','#8CE05C','#E8C24F','#7A8CFF','#FF6B9E'];
/* Palette ampia e indipendente per la personalizzazione manuale del colore delle etichette */
const ETICHETTA_COLOR_PALETTE = ['#49D9A8','#2FBF8F','#6BDD7A','#8CE05C','#C4E063','#F5D547','#F5B95C','#FF9852','#FF7A66','#FF6B9E','#E88BD8','#D08CF0','#B592FF','#8C7AFF','#7A8CFF','#5FA8FF','#4FC3E8','#4FD6C8','#9AA5B1','#D6D6D6'];
function categoryColor(cat){
  if(DB.categorieColori && DB.categorieColori[cat]) return DB.categorieColori[cat];
  let idx = DB.categorieUscite.indexOf(cat);
  if(idx===-1) idx = DB.categorieEntrate.indexOf(cat);
  if(idx===-1){
    // fallback per categorie non censite: hash stabile del nome
    idx = Math.abs(String(cat||'').split('').reduce((h,c)=>((h*31)+c.charCodeAt(0))|0,7));
  }
  return CATEGORY_COLOR_PALETTE[idx % CATEGORY_COLOR_PALETTE.length];
}
/* ---- Colore stabile per categoria abbonamento (bordo laterale colorato nelle card/righe Abbonamenti) ---- */
function categoriaAbbColor(cat){
  let idx = DB.categorieAbbonamenti.indexOf(cat);
  if(idx===-1) idx = Math.abs(String(cat||'').split('').reduce((h,c)=>((h*31)+c.charCodeAt(0))|0,17));
  return CATEGORY_COLOR_PALETTE[idx % CATEGORY_COLOR_PALETTE.length];
}
/* Indicatore minimale (pallino pieno) per la categoria, usato ovunque compaia il nome categoria di un movimento */
function categoryDotHtml(cat){
  return `<span class="cat-dot" style="background:${categoryColor(cat)}"></span>`;
}
function categoryLabelHtml(cat){

}
/* Variante con avatar colore+icona (invece del solo pallino) per le righe delle tabelle
   elenco movimenti — stesso linguaggio visivo introdotto per le card mobile, ora anche
   nelle tabelle desktop/Ricerca/Resoconto Etichetta/Cronologia Metodo. */
function categoryLabelAvatarHtml(cat){

}

/* ---- Etichette: colore personalizzabile per etichetta (fallback: colore stabile derivato dal nome) ---- */
function etichettaColor(nome){
  if(DB.etichetteColori && DB.etichetteColori[nome]) return DB.etichetteColori[nome];
  let idx = DB.etichette.indexOf(nome);
  if(idx===-1) idx = Math.abs(String(nome||'').split('').reduce((h,c)=>((h*31)+c.charCodeAt(0))|0,11));
  return CATEGORY_COLOR_PALETTE[idx % CATEGORY_COLOR_PALETTE.length];
}
function etichettaChipHtml(nome, opts){
  opts = opts || {};
  const c = etichettaColor(nome);
  const cls = 'etichetta-chip' + (opts.small?' etichetta-chip-sm':'') + (opts.clickable?' etichetta-chip-click':'');
  const attrs = opts.clickable ? ` data-etichetta="${esc(nome)}"` : '';
  const removeBtn = opts.removable ? `<button type="button" class="etichetta-chip-remove" data-t="${esc(nome)}">×</button>` : '';
  return `<span class="${cls}"${attrs} style="background:${c}22;color:${c};border:1px solid ${c}55;">${esc(nome)}${removeBtn}</span>`;
}
function computeEtichettaStats(nome){
  const rows = DB.movimenti.filter(m=>Array.isArray(m.etichette) && m.etichette.includes(nome)).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  // I movimenti #rimborso/#rimborsato contano nei totali solo quando si sta guardando proprio quell'etichetta;
  // altrove restano visibili nell'elenco ma esclusi dai totali (Entrate/Uscite/Saldo).
  const isRefundTagView = TOTALS_EXCLUDED_TAGS.includes(normalizeEtichettaForMatch(nome));
  const totRows = isRefundTagView ? rows : movimentiForTotals(rows);
  const entrate = totRows.reduce((s,m)=>s+(m.entrate||0),0);
  const uscite = totRows.reduce((s,m)=>s+(m.uscite||0),0);
  return { rows, entrate, uscite, saldo: entrate-uscite };
}
/* Wiring riusabile per un campo a chip di etichette (usato nel modulo Movimento, nella modifica in
   blocco e nel filtro Ricerca). Se viene passato suggestElId, mostra sotto al campo una tendina in
   stile app (sostituisce il vecchio <datalist> nativo): a campo vuoto/al focus elenca le sole
   etichette preferite (A-Z); digitando, la ricerca si allarga a tutte le etichette esistenti (A-Z). */
function wireEtichetteChipInput(chipsElId, inputElId, getList, setList, onChange, suggestElId){
  function render(){
    const wrap = document.getElementById(chipsElId);
    wrap.innerHTML = getList().map(t=>etichettaChipHtml(t, {removable:true})).join('');
    wrap.querySelectorAll('.etichetta-chip-remove').forEach(b=>b.onclick = ()=>{
      setList(getList().filter(t=>t!==b.dataset.t));
      render();
      if(onChange) onChange();
      if(suggestEl) renderSuggest();
    });
  }
  render();
  const input = document.getElementById(inputElId);
  function addTag(val){
    val = String(val||'').trim();
    if(val && !getList().includes(val)){
      setList([...getList(), val]);
      render();
      if(onChange) onChange();
    }
  }
  function commitPending(){
    const val = input.value.trim().replace(/,$/,'');
    addTag(val);
    input.value = '';
  }
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      commitPending();
      if(suggestEl) renderSuggest();
    }
  });
  input.addEventListener('blur', ()=>{ commitPending(); closeSuggest(); });
  input._commitPendingEtichetta = commitPending;

  const suggestEl = suggestElId ? document.getElementById(suggestElId) : null;
  function renderSuggest(){}
  function closeSuggest(){}
  if(suggestEl){
    const favoriteTags = ()=>(Array.isArray(DB.etichettePreferite) ? DB.etichettePreferite : [])
      .filter(t=>DB.etichette.includes(t)).sort((a,b)=>a.localeCompare(b));
    const matchingTags = q=>{
      const ql = q.toLowerCase();
      return DB.etichette.filter(t=>t.toLowerCase().includes(ql)).sort((a,b)=>a.localeCompare(b));
    };
    renderSuggest = function(){
      const q = input.value.trim();
      const selected = getList();
      const items = (q ? matchingTags(q) : favoriteTags()).filter(t=>!selected.includes(t));
      if(!items.length){
        suggestEl.innerHTML = `<div class="etichetta-suggest-empty">${q ? 'Nessuna etichetta trovata' : 'Nessuna preferita'}</div>`;
      } else {
        suggestEl.innerHTML = items.map(t=>{
          const c = etichettaColor(t);
          return `<div class="etichetta-suggest-item" data-t="${esc(t)}"><span class="etichetta-suggest-dot" style="background:${c};"></span><span>${esc(t)}</span></div>`;
        }).join('');
        suggestEl.querySelectorAll('.etichetta-suggest-item').forEach(it=>{
          it.addEventListener('mousedown', e=>{
            e.preventDefault();
            addTag(it.dataset.t);
            input.value = '';
            renderSuggest();
          });
        });
      }
      suggestEl.classList.add('open');
    };
    closeSuggest = function(){ suggestEl.classList.remove('open'); };
    input.addEventListener('focus', renderSuggest);
    input.addEventListener('input', renderSuggest);
    suggestEl.addEventListener('mousedown', e=>e.preventDefault());
  }
}

/* Pillola destra dell'header, in modalità selezione: contatore + deseleziona-tutto + menù "..." */

/* Tocco breve = espande i dettagli della riga; tocco prolungato (~450ms) = entra in modalità
   selezione; con la selezione già attiva, ogni tocco (anche breve) aggiunge/toglie la riga. */
function wireMovDayRows(container){
  const SWIPE_REVEAL = 128; // larghezza del layer azioni (2 bottoni da 64px)
  const SWIPE_CLOSE_RATIO = 0.4;
  let openRow = null; // riga attualmente "aperta" (azioni rivelate), una sola alla volta

  function closeRow(row, animate=true){
    const content = row.querySelector('.mov-row-content');
    if(!content) return;
    content.style.transition = animate ? '' : 'none';
    content.style.transform = 'translateX(0)';
    row.classList.remove('swipe-open');
    if(openRow===row) openRow = null;
    if(!animate) void content.offsetWidth, content.style.transition = '';
  }

  container.querySelectorAll('.mov-day-list .mov-row[data-id]').forEach(row=>{
    const content = row.querySelector('.mov-row-content');
    const editBtn = row.querySelector('.mov-swipe-edit');
    const deleteBtn = row.querySelector('.mov-swipe-delete');
    if(editBtn) editBtn.onclick = (e)=>{
      e.stopPropagation();
      closeRow(row);
      openMovModal(row.dataset.id);
    };
    if(deleteBtn) deleteBtn.onclick = (e)=>{
      e.stopPropagation();
      closeRow(row);
      removeByIdWithUndo(DB.movimenti, row.dataset.id, 'Movimento eliminato', renderMovimenti);
    };

    let pressTimer = null, longPressed = false;
    let swiping=false, swipeDecided=false, swipeStartX=0, swipeStartY=0, swipeLastX=0, swipeBaseX=0, justSwiped=false;

    row.addEventListener('touchstart', (e)=>{
      if(movSelectionMode) return;
      longPressed = false;
      pressTimer = setTimeout(()=>{
        pressTimer = null; longPressed = true;
        enterMovSelectionMode(row.dataset.id);
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
      }, 450);
      const t = e.touches[0];
      swiping = true; swipeDecided = false; justSwiped = false;
      swipeStartX = swipeLastX = t.clientX; swipeStartY = t.clientY;
      swipeBaseX = row.classList.contains('swipe-open') ? -SWIPE_REVEAL : 0;
    }, {passive:true});

    const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
    row.addEventListener('touchmove', (e)=>{
      cancelPress();
      if(movSelectionMode || !swiping) return;
      const t = e.touches[0];
      const dx = t.clientX - swipeStartX, dy = t.clientY - swipeStartY;
      if(!swipeDecided){
        if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        swipeDecided = Math.abs(dx) > Math.abs(dy);
        if(!swipeDecided){ swiping = false; return; }
        if(openRow && openRow!==row) closeRow(openRow);
        content.style.transition = 'none';
      }
      e.preventDefault();
      swipeLastX = t.clientX;
      const x = Math.min(0, Math.max(-SWIPE_REVEAL - 24, swipeBaseX + dx));
      content.style.transform = `translateX(${x}px)`;
    }, {passive:false});

    row.addEventListener('touchend', ()=>{
      cancelPress();
      if(!swiping){ return; }
      swiping = false;
      if(!swipeDecided) return;
      justSwiped = true;
      setTimeout(()=>{ justSwiped = false; }, 50);
      const x = swipeBaseX + (swipeLastX - swipeStartX);
      content.style.transition = '';
      const shouldOpen = x < -SWIPE_REVEAL*SWIPE_CLOSE_RATIO;
      if(shouldOpen){
        content.style.transform = `translateX(${-SWIPE_REVEAL}px)`;
        row.classList.add('swipe-open');
        openRow = row;
        if(navigator.vibrate) try{ navigator.vibrate(6); }catch(e){}
      } else {
        closeRow(row);
      }
    }, {passive:true});

    row.onclick = (e)=>{
      if(longPressed){ longPressed=false; return; }
      if(justSwiped) return;
      if(e.target.closest('.mov-row-swipe-actions')) return;
      if(row.classList.contains('swipe-open')){ closeRow(row); return; }
      if(e.target.closest('input, button, a, label')) return;
      if(movSelectionMode){ toggleMovRowSelect(row.dataset.id); return; }
      const willExpand = !row.classList.contains('row-expanded');
      row.classList.toggle('row-expanded');
      if(willExpand) suppressGhostClick(row.querySelector('.row-actions'));
    };
  });
  updateMovRowSelectionVisuals();
}

/* ==================== Sistema generico "seleziona con tocco prolungato" ====================
   Riusato da Ricerca, Resoconto Etichetta e Cronologia Metodo (Movimenti ha la propria versione
   sopra, già collegata alla pillola dell'header persistente). Ogni pagina passa un "ctx" con il
   proprio Set di selezionati/stato e una funzione che disegna la propria pillola (nell'header
   persistente per Ricerca, nell'intestazione della pagina a scorrimento per le altre). */
function wireDaySelectable(cfg){
  cfg.container.querySelectorAll('.mov-row[data-id]').forEach(row=>{
    row.classList.toggle('selected', cfg.ctx.selected.has(row.dataset.id));
    let pressTimer = null, longPressed = false;
    row.addEventListener('touchstart', ()=>{
      if(cfg.ctx.active) return;
      longPressed = false;
      pressTimer = setTimeout(()=>{
        pressTimer = null; longPressed = true;
        cfg.ctx.active = true; cfg.ctx.selected.clear(); cfg.ctx.selected.add(row.dataset.id);
        if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
        daySelRefreshVisuals(cfg);
        cfg.renderPill();
      }, 450);
    }, {passive:true});
    const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
    row.addEventListener('touchend', cancelPress, {passive:true});
    row.addEventListener('touchmove', cancelPress, {passive:true});
    row.onclick = (e)=>{
      if(longPressed){ longPressed=false; return; }
      if(e.target.closest('input, button, a, label')) return;
      if(cfg.ctx.active){
        const id = row.dataset.id;
        if(cfg.ctx.selected.has(id)) cfg.ctx.selected.delete(id); else cfg.ctx.selected.add(id);
        if(cfg.ctx.selected.size===0) cfg.ctx.active = false;
        daySelRefreshVisuals(cfg);
        cfg.renderPill();
        return;
      }
      const willExpand = !row.classList.contains('row-expanded');
      row.classList.toggle('row-expanded');
      if(willExpand) suppressGhostClick(row.querySelector('.row-actions'));
    };
  });
}
function daySelRefreshVisuals(cfg){
  cfg.container.querySelectorAll('.mov-row[data-id]').forEach(row=>{
    row.classList.toggle('selected', cfg.ctx.selected.has(row.dataset.id));
  });
}
function daySelExit(cfg){
  cfg.ctx.active = false; cfg.ctx.selected.clear();
  daySelRefreshVisuals(cfg);
  cfg.renderPill();
}
/* Pillola di selezione dentro l'header di una pagina a scorrimento (modal-head), riusata da

function renderModalSelPill(pillId, cfg){
  const el = document.getElementById(pillId);

    <button type="button" class="mobile-topbar-btn" id="${pillId}MenuBtn" title="Altre azioni">${ico('moreVertical',18)}</button>
  `;
  document.getElementById(pillId+'DeselectAll').onclick = ()=>daySelExit(cfg);
  document.getElementById(pillId+'MenuBtn').onclick = ()=>openDaySelMenu(document.getElementById(pillId+'MenuBtn'), cfg);
}

/* ==================== MENU "..." RIGHE MOVIMENTO ====================
   Sostituisce le icone Visualizza/Modifica/Elimina in fondo a ogni riga di movimento (Movimenti,
   Ricerca, Storico Etichetta, Storico Revolut/PayPal/Metodo di pagamento) con un unico pulsante
   che apre un piccolo menu a comparsa, sia su desktop che su mobile. */
function closeKebabMenuOnOutside(e){
  const menu = document.querySelector('.kebab-menu');
  if(menu && !menu.contains(e.target) && !e.target.closest('.kebab-btn')){ closeKebabMenu(); }
}
function closeKebabMenu(){
  const menu = document.querySelector('.kebab-menu');
  if(menu){ menu.classList.remove('show'); setTimeout(()=>menu.remove(), 200); }
  document.removeEventListener('click', closeKebabMenuOnOutside, true);
}
function openKebabMenu(triggerBtn, items){
  closeKebabMenu();
  const menu = document.createElement('div');
  menu.className = 'kebab-menu';
  menu.innerHTML = items.map((it,i)=>`<button type="button" class="kebab-menu-item ${it.danger?'danger':''}" data-i="${i}">${ico(it.icon||'',15)} ${esc(it.label)}</button>`).join('');
  document.body.appendChild(menu);
  const rect = triggerBtn.getBoundingClientRect();
  // Ancorato in alto a destra del pulsante; si capovolge sopra se non c'è spazio sotto (righe
  // vicine al fondo dello schermo in elenchi lunghi).
  const menuH = menu.offsetHeight;
  const top = (rect.bottom + menuH + 8 > window.innerHeight) ? (rect.top - menuH - 8) : (rect.bottom + 8);
  menu.style.top = Math.max(8, top) + 'px';
  menu.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
  requestAnimationFrame(()=>menu.classList.add('show'));
  menu.querySelectorAll('.kebab-menu-item').forEach((btn,i)=>{
    btn.onclick = ()=>{ closeKebabMenu(); items[i].onClick(); };
  });
  setTimeout(()=>document.addEventListener('click', closeKebabMenuOnOutside, true), 0);
}
/* Costruisce l'elenco standard Visualizza/Modifica/Elimina per una riga di movimento; onView è
   opzionale (solo la Ricerca ha il collegamento "Visualizza in Movimenti"). */
function movRowKebabItems({onView, onEdit, onDuplicate, onDelete}){
  const items = [];
  if(onView) items.push({label:'Visualizza in Movimenti', icon:'arrowUpRight', onClick:onView});
  items.push({label:'Modifica', icon:'edit', onClick:onEdit});
  if(onDuplicate) items.push({label:'Duplica', icon:'copy', onClick:onDuplicate});
  items.push({label:'Elimina', icon:'trash', danger:true, onClick:onDelete});
  return items;
}
/* Apre il modulo "Nuovo movimento" precompilato con i dati del movimento id (categoria, dettaglio,
   importo, metodo, note), pronto per essere salvato come voce NUOVA. Data e Etichette non vengono
   copiate: la data parte da oggi (il caso d'uso tipico è "registra di nuovo una spesa simile ora"),
   le etichette restano vuote per non trascinare per sbaglio tag specifici dell'originale (es. #rimborso).
   Data e nota restano comunque liberamente modificabili nel modulo, come tutti gli altri campi. */
function duplicaMovimento(id, onSaved){
  const src = DB.movimenti.find(m=>m.id===id);
  if(!src) return;
  openMovModal(null, onSaved, src);
}
/* Naviga al movimento collegato (usata dall'icona link su un rimborso) scrollandolo in vista
   ed evidenziandolo per qualche secondo. Stesso comportamento (ritardo, classe, durata, colore)
   di goToMovimento in Ricerca, per restare coerente in tutta l'app. Espande l'anno se necessario
   e chiude un'eventuale modale aperta (l'icona può comparire anche dentro storici/etichette in
   un popup). */
// Popup con l'elenco delle spese collegate a un unico rimborso, quando sono più di una:
// ogni riga naviga alla spesa scelta, come farebbe il pulsante singolo con una sola spesa.
function openLinkedSpeseModal(ids){
  const rows = ids.map(id=>DB.movimenti.find(m=>m.id===id)).filter(Boolean);
  const html = `
    <div class="modal-head"><h3>${ico('link',16)} Spese collegate</h3><button class="close-x" id="lsmClose">${ico('x')}</button></div>
    <div class="modal-body">
      ${rows.length ? rows.map(m=>`
        <button type="button" class="linked-spesa-row" data-id="${m.id}">
          <span class="linked-spesa-main">${categoryLabelAvatarHtml(m.categoria)}<span class="linked-spesa-desc">${esc(m.descrizione||m.note||'')}</span></span>
          <span class="linked-spesa-right"><span class="mono neg">${fmtEUR(m.uscite)}</span><span class="linked-spesa-date">${fmtDate(m.data)}</span></span>
        </button>
      `).join('') : `<div class="empty-state" style="padding:14px;">Nessuna spesa trovata.</div>`}
    </div>
  `;
  openModal(html);
  document.getElementById('lsmClose').onclick = closeModal;
  document.querySelectorAll('.linked-spesa-row').forEach(r=>{
    r.onclick = ()=>{ closeModal(); goToLinkedMovimento(r.dataset.id); };
  });
}
function goToLinkedMovimento(targetId){
  const target = DB.movimenti.find(m=>m.id===targetId);
  if(!target){ toast('Movimento collegato non trovato'); return; }
  closeModal();
  const year = target.data ? target.data.slice(0,4) : 'Senza data';
  if(!movExpandedYears) movExpandedYears = new Set();
  movExpandedYears.add(year);
  switchView('movimenti');
  setTimeout(()=>{
    const row = document.querySelector(`#view-movimenti tr[data-id="${CSS.escape(targetId)}"], #view-movimenti .mov-row[data-id="${CSS.escape(targetId)}"]`);
    if(row){
      row.scrollIntoView({behavior:'smooth', block:'center'});
      row.classList.add('row-flash');
      setTimeout(()=>row.classList.remove('row-flash'), 6000);
    }
  }, 90);
}
// Trova l'id del movimento di rimborso (entrata) collegato a una spesa (uscita), se esiste.
function findRimborsoIdFor(uscitaId){
  const r = DB.movimenti.find(x=>x.rimborsoSpesa && Array.isArray(x.rimborsoDiIds) && x.rimborsoDiIds.includes(uscitaId));
  return r ? r.id : null;
}
// Pulsante di navigazione tra spesa e rimborso collegati, in entrambe le direzioni (dall'entrata
// verso le spese originali — anche più di una — o viceversa dalla spesa verso il rimborso che l'ha
// coperta). opts.compact: solo icona (tabelle desktop) — altrimenti icona + testo (righe mobile).
function rimborsoLinkBtnHtml(m, opts){
  opts = opts || {};
  const linkedIds = (m.rimborsoSpesa && Array.isArray(m.rimborsoDiIds)) ? m.rimborsoDiIds : [];
  if(linkedIds.length===1){
    return opts.compact
      ? `<button type="button" class="mov-link-btn" data-goto="${linkedIds[0]}" title="Vai alla spesa collegata">${ico('link',12)}</button>`
      : `<button type="button" class="mov-link-btn" data-goto="${linkedIds[0]}" title="Vai alla spesa collegata">${ico('link',13)} Vedi spesa collegata</button>`;
  }
  if(linkedIds.length>1){
    return opts.compact
      ? `<button type="button" class="mov-link-btn" data-goto-multi="${esc(linkedIds.join(','))}" title="Vedi le ${linkedIds.length} spese collegate">${ico('link',12)}</button>`
      : `<button type="button" class="mov-link-btn" data-goto-multi="${esc(linkedIds.join(','))}" title="Vedi le spese collegate">${ico('link',13)} Vedi le ${linkedIds.length} spese collegate</button>`;
  }
  if(m.uscite){
    const rId = findRimborsoIdFor(m.id);
    if(rId){
      return opts.compact
        ? `<button type="button" class="mov-link-btn" data-goto="${rId}" title="Vai al rimborso collegato">${ico('link',12)}</button>`
        : `<button type="button" class="mov-link-btn" data-goto="${rId}" title="Vai al rimborso collegato">${ico('link',13)} Vedi il rimborso</button>`;
    }
  }
  return '';
}
function dayGroupsHtml(rows, opts){
  opts = opts || {};
  const kebabCls = opts.kebabCls || 'movKebab';
  const byDay = {}; const order = [];
  rows.forEach(m=>{
    const day = m.data || 'n/d';
    if(!byDay[day]){ byDay[day] = []; order.push(day); }
    byDay[day].push(m);
  });
  return order.map(day=>{
    const items = byDay[day];
    const dayTotal = items.reduce((s,m)=>s+(m.entrate||0)-(m.uscite||0), 0);
    const rowsHtml = items.map(m=>{
      const isNeg = !m.entrate && m.uscite;
      const amt = m.entrate ? m.entrate : (m.uscite||0);
      const fonteIcon = movimentoMetodoIconHtml(m);
      return `<div class="mov-row" data-id="${m.id}">
        <div class="mov-row-swipe-actions">
          <button type="button" class="mov-swipe-btn mov-swipe-edit" data-id="${m.id}" aria-label="Modifica">${ico('edit',18)}</button>
          <button type="button" class="mov-swipe-btn mov-swipe-delete" data-id="${m.id}" aria-label="Elimina">${ico('trash',18)}</button>
        </div>
        <div class="mov-row-content">
          ${movRowAvatarHtml(m.categoria)}
          <div class="mov-row-mid">
            <div class="mov-row-title">${esc(m.descrizione||m.categoria||'—')}</div>
            <div class="mov-row-sub">${esc(m.categoria||'—')}${m.note?`<span class="mov-row-note-ic" title="Ha una nota">${ico('fileText',11)}</span>`:''}</div>
          </div>
          <div class="mov-row-amt ${isNeg?'neg':'pos'}">${isNeg?'-':'+'}${fmtEUR(amt)}</div>
          <div class="mov-row-extra"><div class="mov-row-extra-inner">
            <div class="mov-row-extra-line">${fonteIcon} ${esc(m.metodoPagamento||movimentoMetodoEffettivo(m)||'—')}</div>
            ${m.note?`<div class="mov-row-extra-line">${ico('fileText',13)} ${esc(m.note)}</div>`:''}
            ${m.etichette && m.etichette.length?`<div class="mov-row-extra-line"><span class="etichette-row">${m.etichette.map(t=>etichettaChipHtml(t,{small:true,clickable:true})).join('')}</span></div>`:''}
            ${rimborsoLinkBtnHtml(m) ? `<div class="mov-row-extra-line">${rimborsoLinkBtnHtml(m)}</div>` : ''}
            <div class="row-actions">
              <button class="btn btn-icon btn-sm kebab-btn ${kebabCls}" data-id="${m.id}" title="Altre azioni">${ico('moreVertical')}</button>
            </div>
          </div></div>
        </div>
      </div>`;
    }).join('');
    return `<div class="mov-day-block">
      <div class="mov-day-head">
        <span class="mov-day-label">${fmtDayShort(day==='n/d'?null:day)}</span>
        <span class="mov-day-total">${dayTotal>=0?'+':'-'}${fmtEUR(Math.abs(dayTotal))}</span>
      </div>
      <div class="mov-day-card">${rowsHtml}</div>
    </div>`;
  }).join('');
}
function renderMovimenti(){
  const el = document.getElementById('view-movimenti');

  // Raggruppa i movimenti per anno (i movimenti senza data finiscono in un gruppo a parte, in coda)
  const byYear = {};
  DB.movimenti.forEach(m=>{
    const y = m.data ? m.data.slice(0,4) : 'Senza data';
    byYear[y] = byYear[y] || [];
    byYear[y].push(m);

function syncMonthCheckState(group){
  if(!group) return;
  const monthCb = document.querySelector(`.movMonthCheck[data-month="${group}"]`);
  if(!monthCb) return;
  const idsInMonth = DB.movimenti.filter(m=>(m.data?m.data.slice(0,7):'n/d')===group).map(m=>m.id);
  monthCb.checked = idsInMonth.length>0 && idsInMonth.every(id=>movSelected.has(id));
}

/* Helper condiviso tra il form "Nuovo/Modifica movimento" e il form "Voce pianificata": entrambi
   hanno identica logica di aggiornamento Categoria/Dettaglio in base al tipo (Entrata/Uscita),
   solo con id dei campi diversi. Evita di mantenere due copie della stessa logica in giro. */
function wireCategoriaDettaglioFields(catSelId, descSelId, getTipo, editing, opts){
  opts = opts || {};
  // Nel form Movimento le Entrate non mostrano "Altro (specifica)" (categorie/sottocategorie entrata
  // sono chiuse); nel form Voce pianificata invece l'opzione resta disponibile anche per le Entrate.
  // Comportamento distinto per ciascun form, mantenuto qui tramite questo flag.
  const showCustomForEntrata = opts.showCustomForEntrata !== false;
  // isRimborso: quando l'entrata è marcata come "reso/rimborso di una spesa", il campo Categoria
  // deve mostrare le categorie di USCITA (storno diretto sulla categoria di spesa originale)
  // invece delle categorie di entrata standard.
  const isRimborso = opts.isRimborso || (()=>false);
  const ENTRATA_CATEGORIE = ['Stipendio','Rimborsi','Altre entrate'];
  function refreshDescLabel(){
    const lbl = document.querySelector('#'+descSelId)?.closest('.field')?.querySelector('label');
    if(lbl) lbl.textContent = (getTipo()==='uscita' || isRimborso()) ? 'Dettaglio' : 'Dettaglio (opzionale)';
  }
  function refreshDescOptions(){
    const catSel = document.getElementById(catSelId);
    const descSel = document.getElementById(descSelId);
    if(getTipo()==='entrata' && !isRimborso() && !showCustomForEntrata){
      const opts2 = subcategorieFor(catSel.value);
      descSel.innerHTML = opts2.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
      if(editing && opts2.includes(editing.descrizione)) descSel.value = editing.descrizione;
      return;
    }
    const subs = subcategorieFor(catSel.value);
    if(subs.length){
      descSel.innerHTML = subs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('') + `<option value="__custom">Altro (specifica)…</option>`;
      if(editing && subs.includes(editing.descrizione)) descSel.value = editing.descrizione;
    } else {
      descSel.innerHTML = `<option value="__custom">Altro (specifica)…</option>`;
    }
  }
  function refreshCatOptions(){
    const catSel = document.getElementById(catSelId);
    const cats = (getTipo()==='entrata' && !isRimborso()) ? ENTRATA_CATEGORIE : DB.categorieUscite;
    catSel.innerHTML = cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if(editing && cats.includes(editing.categoria)) catSel.value = editing.categoria;
    refreshDescLabel();
    refreshDescOptions();
  }
  return { refreshCatOptions, refreshDescOptions, refreshDescLabel };
}
/* Etichetta puramente visiva (nessun effetto sui totali, gestiti dal netting in movimentiForTotals)
   applicata automaticamente sull'uscita collegata quando si registra un rimborso ad essa legato. */
function applyRimborsatoTag(uscitaId){
  const target = DB.movimenti.find(m=>m.id===uscitaId);
  if(!target) return;
  target.etichette = target.etichette || [];
  if(!target.etichette.includes('Rimborsato')) target.etichette.push('Rimborsato');
  if(!DB.etichette.includes('Rimborsato')) DB.etichette.push('Rimborsato');
}
function removeRimborsatoTagIfUnused(uscitaId){
  if(!uscitaId) return;
  const stillUsed = DB.movimenti.some(m=>Array.isArray(m.rimborsoDiIds) && m.rimborsoDiIds.includes(uscitaId));
  if(stillUsed) return;
  const target = DB.movimenti.find(m=>m.id===uscitaId);
  if(target && Array.isArray(target.etichette)) target.etichette = target.etichette.filter(t=>t!=='Rimborsato');
}
/* ==================== TASTIERINO IMPORTO (mobile) ====================
   Sostituisce la tastiera di sistema per il campo Importo del form Movimento con un tastierino
   dedicato: si digita l'importo "normalmente" (es. 5-0 → 50 €, non serve scrivere gli zeri dei
   centesimi) e si usa il tasto virgola solo se servono i centesimi (es. 5-0-,-5-0 → 50,50 €).
   Il separatore delle migliaia compare dal vivo. La prima cifra digitata su un importo già
   presente (es. modifica di un movimento esistente) riparte da zero, come un normale campo che
   si sovrascrive iniziando a scrivere. Il valore reale del campo #mImporto resta un numero
   pulito (es. "1234.56"), quindi tutta la logica di salvataggio/validazione esistente continua
   a funzionare invariata. */
let importoKeypadEl = null;
function setupImportoKeypad(){
  const input = document.getElementById('mImporto');
  const display = document.getElementById('mImportoDisplay');
  if(!input || !display || !isMobileViewport()) return;
  input.readOnly = true;

  let intDigits = '0', decDigits = '', hasComma = false, freshStart = true;
  const initNum = parseFloat(input.value);
  if(!isNaN(initNum) && initNum>0){
    const [ip, dp] = initNum.toFixed(2).split('.');
    intDigits = String(parseInt(ip,10));
    decDigits = dp;
  }

  function render(){
    const intFmt = intDigits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const decFmt = decDigits.padEnd(2,'0');
    display.textContent = `${intFmt},${decFmt} €`;
    input.value = `${parseInt(intDigits,10)}.${decFmt}`;
    input.dispatchEvent(new Event('input', {bubbles:true}));
  }
  render();
  input._importoKeypadReset = ()=>{
    intDigits = '0'; decDigits = ''; hasComma = false; freshStart = true;
    render();
    const kv = document.getElementById('importoKeypadValue');
    if(kv) kv.textContent = display.textContent;
  };
  if(!importoKeypadEl){
    importoKeypadEl = document.createElement('div');
    importoKeypadEl.className = 'importo-keypad-backdrop';
    importoKeypadEl.id = 'importoKeypadBackdrop';
    importoKeypadEl.innerHTML = `
      <div class="importo-keypad">
        <div class="importo-keypad-value" id="importoKeypadValue"></div>
        <div class="importo-keypad-grid">
          ${['1','2','3','4','5','6','7','8','9'].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}
          <button type="button" class="ik-comma" data-k="," aria-label="Virgola">,</button>
          <button type="button" data-k="0">0</button>
          <button type="button" class="ik-del" data-k="del" aria-label="Cancella">⌫</button>
        </div>
        <button type="button" class="ik-done-full" data-k="done">${ico('check',18)} Fatto</button>
      </div>`;
    document.body.appendChild(importoKeypadEl);
  }
  const keypad = importoKeypadEl;
  const valueEl = document.getElementById('importoKeypadValue');
  const syncValue = ()=>{ valueEl.textContent = display.textContent; };
  const closeKeypadReal = ()=>{ keypad.classList.remove('show'); };
  const openKeypad = ()=>{ syncValue(); keypad.classList.add('show'); pushBackClose(closeKeypadReal); };
  const closeKeypad = ()=>{ closeKeypadReal(); consumeBackClose(); };

  display.onclick = openKeypad;
  display.addEventListener('touchend', (e)=>{ e.preventDefault(); openKeypad(); }, {passive:false});
  keypad.onclick = (e)=>{ if(e.target===keypad) closeKeypad(); };
  keypad.querySelectorAll('[data-k]').forEach(btn=>{
    btn.onclick = ()=>{
      const k = btn.dataset.k;
      if(k==='done'){ closeKeypad(); return; }
      if(k===','){
        if(freshStart){ intDigits='0'; decDigits=''; freshStart=false; }
        hasComma = true;
      } else if(k==='del'){
        freshStart = false;
        if(hasComma){
          if(decDigits.length>0) decDigits = decDigits.slice(0,-1);
          else hasComma = false;
        } else {
          intDigits = intDigits.length>1 ? intDigits.slice(0,-1) : '0';
        }
      } else {
        if(freshStart){ intDigits='0'; decDigits=''; hasComma=false; freshStart=false; }
        if(hasComma){
          if(decDigits.length<2) decDigits += k;
        } else {
          intDigits = (intDigits==='0' ? k : intDigits+k).slice(0,9);
        }
      }
      render();
      syncValue();
      if(navigator.vibrate) try{ navigator.vibrate(4); }catch(e){}
    };
  });
}

  const box = document.getElementById('modalBox');
  box.className = 'modal modal-form';
  box.innerHTML = html;
  showModalBackdrop();
  let curTipo = tipo;
  let curIsRimborso = !!(prefill && prefill.rimborsoSpesa);
  const { refreshCatOptions, refreshDescOptions } = wireCategoriaDettaglioFields('mCategoria', 'mDescrizione', ()=>curTipo, prefill, { showCustomForEntrata:false, isRimborso: ()=>curIsRimborso });
  function refreshRimborsoRowsVisibility(){
    document.getElementById('mRimborsoRow').style.display = curTipo==='entrata' ? '' : 'none';
    document.getElementById('mRimborsoDiRow').style.display = (curTipo==='entrata' && curIsRimborso) ? '' : 'none';
    document.getElementById('mRimborsoChip').classList.toggle('checked', curIsRimborso);
    if(curTipo!=='entrata'){ curIsRimborso = false; document.getElementById('mIsRimborso').checked = false; }
    refreshRimborsoMismatch();
  }
  // Avviso non bloccante: confronta l'importo del movimento con la somma delle spese collegate,
  // per far notare la differenza (es. un rimborso "arrotondato" che copre più del dovuto) senza
  // impedire il salvataggio — l'utente decide se dividerlo in due movimenti o lasciarlo così.
  function refreshRimborsoMismatch(){
    const box = document.getElementById('mRimborsoMismatch');
    if(!box) return;
    const importo = parseFloat(document.getElementById('mImporto').value);
    const linkedIds = rimborsoDiRows.filter(Boolean);
    if(!(curTipo==='entrata' && curIsRimborso) || !linkedIds.length || isNaN(importo)){
      box.style.display = 'none'; box.innerHTML = ''; return;
    }
    const sum = linkedIds.reduce((s,id)=>{ const m = DB.movimenti.find(x=>x.id===id); return s + (m?m.uscite||0:0); }, 0);
    const diff = importo - sum;
    if(Math.abs(diff)<0.005){ box.style.display = 'none'; box.innerHTML = ''; return; }
    const verbo = diff>0 ? 'in più' : 'in meno';
    box.style.display = '';
    box.innerHTML = `<div class="rimborso-mismatch">
      <span class="ic">${ico('alertTriangle',16)}</span>
      <span>Le spese collegate sommano <b>${fmtEUR(sum)}</b>, ma l'importo è <b>${fmtEUR(importo)}</b> — <b>${fmtEUR(Math.abs(diff))} ${verbo}</b>.</span>
    </div>`;
  }
  // Righe "Collega alla spesa": una di default, con un "+" per collegare un unico rimborso a più
  // spese (es. un bonifico che copre più acquisti). rimborsoDiRows tiene l'id scelto per ogni riga
  // ('' se vuota); ogni riga esclude dalle proprie opzioni le spese già scelte nelle altre righe.
  let rimborsoDiRows = (prefill && Array.isArray(prefill.rimborsoDiIds) && prefill.rimborsoDiIds.length) ? prefill.rimborsoDiIds.slice() : [''];
  function renderRimborsoDiRows(){
    const wrap = document.getElementById('mRimborsoDiRows');
    wrap.innerHTML = rimborsoDiRows.map((val,i)=>`
      <div class="slim-row rimborso-di-row" style="padding:0;">
        <select class="mRimborsoDiSelect" data-idx="${i}" style="flex:1;"></select>
        ${rimborsoDiRows.length>1 ? `<button type="button" class="rimborso-di-remove" data-idx="${i}" title="Rimuovi riga">${ico('x',13)}</button>` : ''}
      </div>
    `).join('') + `<button type="button" class="link-btn rimborso-di-add-btn" id="mRimborsoDiAdd">${ico('plus',13)} Aggiungi un'altra spesa</button>`;
    const usciteList = DB.movimenti.filter(m=>m.uscite).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    wrap.querySelectorAll('.mRimborsoDiSelect').forEach(sel=>{
      const idx = +sel.dataset.idx;
      const otherSelected = rimborsoDiRows.filter((v,j)=>j!==idx && v);
      const opts = usciteList.filter(m=>!otherSelected.includes(m.id));
      sel.innerHTML = '<option value="">— Nessun collegamento —</option>' + opts.map(m=>
        `<option value="${m.id}" ${rimborsoDiRows[idx]===m.id?'selected':''}>${esc(m.data)} · ${esc(m.categoria)}${m.descrizione?' · '+esc(m.descrizione):''} · ${fmtEUR(m.uscite)}${m.note?' · '+esc(m.note):''}</option>`
      ).join('');
      sel.onchange = ()=>{
        rimborsoDiRows[idx] = sel.value;
        const linked = DB.movimenti.find(m=>m.id===sel.value);
        if(linked){
          document.getElementById('mCategoria').value = linked.categoria;
          refreshDescOptions();
          if(linked.descrizione) document.getElementById('mDescrizione').value = linked.descrizione;
        }
        renderRimborsoDiRows();
      };
    });
    wrap.querySelectorAll('.rimborso-di-remove').forEach(b=>{
      b.onclick = ()=>{ rimborsoDiRows.splice(+b.dataset.idx,1); renderRimborsoDiRows(); };
    });
    document.getElementById('mRimborsoDiAdd').onclick = ()=>{ rimborsoDiRows.push(''); renderRimborsoDiRows(); };
    refreshRimborsoMismatch();
  }
  document.querySelectorAll('.slim-switch-opt').forEach(r=>r.onclick = ()=>{
    curTipo = r.dataset.tipo;
    document.querySelectorAll('.slim-switch-opt').forEach(x=>x.classList.remove('active'));
    r.classList.add('active');
    refreshRimborsoRowsVisibility();
    refreshCatOptions();
  });
  document.getElementById('mIsRimborso').onchange = (e)=>{
    curIsRimborso = e.target.checked;
    refreshRimborsoRowsVisibility();
    refreshCatOptions();
  };
  document.getElementById('mCategoria').onchange = refreshDescOptions;
  document.getElementById('mImporto').addEventListener('input', refreshRimborsoMismatch);
  curIsRimborso && (document.getElementById('mIsRimborso').checked = true);
  refreshRimborsoRowsVisibility();
  renderRimborsoDiRows();
  refreshCatOptions();
  // "Conto corrente" è sempre la prima opzione e quella selezionata di default (nessuna icona associata).
  const metodoSel = document.getElementById('mMetodoPagamento');
  const metodoOptions = ['Conto corrente', ...DB.metodiPagamento.filter(m=>m!=='Conto corrente')];
  function refreshMetodoOptions(selected){
    metodoSel.innerHTML = metodoOptions.map(m=>`<option value="${esc(m)}" ${m===selected?'selected':''}>${esc(m)}</option>`).join('');
  }
  refreshMetodoOptions((prefill && prefill.metodoPagamento) ? prefill.metodoPagamento : 'Conto corrente');
  let mEtichette = editing ? (editing.etichette||[]).slice() : [];
  wireEtichetteChipInput('mEtichetteChips','mEtichetteInput', ()=>mEtichette, (v)=>{ mEtichette = v; }, null, 'mEtichetteSuggest');

  document.getElementById('mClose').onclick = closeModal;
  const pad2 = n=>String(n).padStart(2,'0');
  const toISODate = d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  document.getElementById('mDataOggi').onclick = ()=>{ document.getElementById('mData').value = toISODate(new Date()); };
  document.getElementById('mDataIeri').onclick = ()=>{ const d = new Date(); d.setDate(d.getDate()-1); document.getElementById('mData').value = toISODate(d); };
  setupImportoKeypad();
  document.getElementById('mCancel').onclick = closeModal;
  if(editing) document.getElementById('mDelete').onclick = ()=>{
    closeModal();
    removeByIdWithUndo(DB.movimenti, editing.id, 'Movimento eliminato', onSaved || renderCurrentView);
  };
  document.getElementById('mSave').onclick = async ()=>{
    const mEtichetteInputEl = document.getElementById('mEtichetteInput');
    if(mEtichetteInputEl && mEtichetteInputEl._commitPendingEtichetta) mEtichetteInputEl._commitPendingEtichetta();
    const data = document.getElementById('mData').value;
    let descSel = document.getElementById('mDescrizione').value;
    if(descSel==='__custom'){
      descSel = ((await customPrompt('Specifica la descrizione:')) || '').trim();
    }
    const importoRaw = document.getElementById('mImporto').value;
    const importo = parseFloat(importoRaw);
    const categoria = document.getElementById('mCategoria').value;
    const metodoPagamento = document.getElementById('mMetodoPagamento').value || 'Conto corrente';
    const note = document.getElementById('mNote').value.trim();

    // Validazione: obbligatori Data, Importo, Categoria, Metodo di pagamento e Dettaglio (solo per le Uscite).
    // Le uniche voci facoltative sono Note ed Etichette.
    const mancanti = [];
    if(!data) mancanti.push('Data');
    if(isNaN(importo) || importo<=0) mancanti.push('Importo');
    if(!categoria) mancanti.push('Categoria');
    if((curTipo==='uscita' || curIsRimborso) && !descSel) mancanti.push('Dettaglio');
    if(!metodoPagamento) mancanti.push('Metodo di pagamento');
    if(mancanti.length){ toast(`Attenzione: compila ${mancanti.join(', ')}`); return; }

    mEtichette.forEach(t=>{ if(!DB.etichette.includes(t)) DB.etichette.push(t); });
    const rimborsoSpesa = curTipo==='entrata' && curIsRimborso;
    const rimborsoDiIds = rimborsoSpesa ? rimborsoDiRows.filter(Boolean) : [];
    if(editing){
      const oldRimborsoDiIds = Array.isArray(editing.rimborsoDiIds) ? editing.rimborsoDiIds.slice() : [];
      editing.data = data; editing.categoria = categoria; editing.descrizione = descSel || null;
      editing.entrate = curTipo==='entrata' ? importo : null;
      editing.uscite = curTipo==='uscita' ? importo : null;
      editing.note = note || null;
      editing.etichette = mEtichette;
      editing.metodoPagamento = metodoPagamento;
      editing.rimborsoSpesa = rimborsoSpesa || undefined;
      editing.rimborsoDiIds = rimborsoDiIds.length ? rimborsoDiIds : undefined;
      oldRimborsoDiIds.filter(id=>!rimborsoDiIds.includes(id)).forEach(removeRimborsatoTagIfUnused);
      rimborsoDiIds.forEach(applyRimborsatoTag);
      if(movExpandedYears) movExpandedYears.add(data.slice(0,4));
      saveDB(); closeModal(); toastSuccess('Movimento salvato'); (onSaved || renderCurrentView)();
      return;
    }
    // Nuovo movimento: salva ma NON chiude la finestra, per agevolare l'inserimento di più movimenti
    // consecutivi. Restano invariati Data, Categoria, Dettaglio, Metodo di pagamento; si azzerano solo
    // Importo, Note, Etichette e il collegamento al rimborso (per non collegare per sbaglio due
    // rimborsi diversi alla stessa spesa).
    const newMov = { id:uid('m'), data, categoria, descrizione:descSel||null, entrate: curTipo==='entrata'?importo:null, uscite: curTipo==='uscita'?importo:null, note: note||null, etichette: mEtichette, metodoPagamento, rimborsoSpesa: rimborsoSpesa||undefined, rimborsoDiIds: rimborsoDiIds.length ? rimborsoDiIds : undefined };
    DB.movimenti.push(newMov);
    rimborsoDiIds.forEach(applyRimborsatoTag);
    if(movExpandedYears) movExpandedYears.add(data.slice(0,4));
    saveDB(); toastSuccess('Movimento salvato'); (onSaved || renderCurrentView)();
    document.getElementById('mImporto')._importoKeypadReset ? document.getElementById('mImporto')._importoKeypadReset() : (document.getElementById('mImporto').value = '');
    document.getElementById('mNote').value = '';
    mEtichette = [];
    document.getElementById('mEtichetteChips').innerHTML = '';
    rimborsoDiRows = [''];
    renderRimborsoDiRows();
    document.getElementById('mImporto').focus();
  };
}

/* ==================== MOVIMENTI PIANIFICATI ====================
   Promemoria di debiti/crediti futuri (es. un pagamento in attesa di credito, un rimborso da ricevere).
   Vivono in DB.pianificati, un array separato: non toccano mai DB.movimenti né i totali reali dell'app.
   "Segna come avvenuto" si limita a rimuovere la voce dall'elenco (con possibilità di annullare). */
function pianificatoIconHtml(p){ return metodoIconHtml(p.metodoPagamento, ''); }
function openPianificatiModal(){
  ensurePianificati();
  const sorted = [...DB.pianificati].sort((a,b)=>(a.data||'9999').localeCompare(b.data||'9999'));
  const uscite = sorted.filter(p=>p.tipo==='uscita');
  const entrate = sorted.filter(p=>p.tipo==='entrata');
  const totUscite = uscite.reduce((s,p)=>s+(p.importo||0),0);
  const totEntrate = entrate.reduce((s,p)=>s+(p.importo||0),0);
  const rigaHtml = (p)=>`<tr data-id="${p.id}">
    <td class="mono" style="white-space:nowrap;">${fmtDate(p.data)}</td>
    <td><span class="tag">${categoryLabelHtml(p.categoria)}</span></td>
    <td class="desc-cell">${esc(p.descrizione||'—')}${p.note?' · <span style="color:var(--text-faint)">'+esc(p.note)+'</span>':''}</td>
    <td>${pianificatoIconHtml(p)}</td>
    <td class="num amt ${p.tipo==='entrata'?'pos':'neg'}">${fmtEUR(p.importo)}</td>
    <td><div class="row-actions" style="opacity:1; pointer-events:auto;">
      <button class="btn btn-icon btn-sm pianDone" data-id="${p.id}" title="Segna come avvenuto">${ico('check')}</button>
      <button class="btn btn-icon btn-sm pianEdit" data-id="${p.id}" title="Modifica">${ico('edit')}</button>
      <button class="btn btn-icon btn-sm pianDelete" data-id="${p.id}" title="Elimina">${ico('trash')}</button>
    </div></td>
  </tr>`;
  const sectionHtml = (titolo, rows, emptyMsg)=> `
    <div class="section-label">${titolo}</div>
    ${rows.length ? `<div class="table-scroll"><table class="ledger-table ledger-mobile-plain">
      <thead><tr><th>Data</th><th>Categoria</th><th>Dettaglio</th><th></th><th class="num">Importo</th><th></th></tr></thead>
      <tbody>${rows.map(rigaHtml).join('')}</tbody>
    </table></div>` : `<div class="empty-state" style="padding:14px 0;">${emptyMsg}</div>`}
  `;
  const html = `
    <div class="modal-head"><h3>${ico('calendar')} Movimenti pianificati</h3><button class="close-x" id="pianClose">${settingsCloseIcon()}</button></div>
    <div class="modal-body">
      <div class="page-sub" style="margin-top:-6px;margin-bottom:2px;">Promemoria di debiti e crediti futuri: non vengono conteggiati nei Movimenti finché non li registri tu stesso.</div>
      <div class="search-stats" style="margin-bottom:6px;">
        <div class="stat-chip"><div class="lbl">Da pagare</div><div class="val neg">${fmtEUR(totUscite)}</div></div>
        <div class="stat-chip"><div class="lbl">Da ricevere</div><div class="val pos">${fmtEUR(totEntrate)}</div></div>
      </div>
      <button class="btn btn-primary btn-sm" id="pianAddBtn" style="align-self:flex-start;">+ Aggiungi voce</button>
      ${sectionHtml('Uscite (da pagare)', uscite, 'Nessuna uscita pianificata.')}
      ${sectionHtml('Entrate (da ricevere)', entrate, 'Nessuna entrata pianificata.')}
    </div>
    <div class="modal-foot"><button class="btn" id="pianCloseBtn">Chiudi</button></div>
  `;
  openSettingsPanel(html);
  const back = ()=>{ renderCurrentView(); openPianificatiModal(); };
  document.getElementById('pianClose').onclick = closeModal;
  document.getElementById('pianCloseBtn').onclick = closeModal;
  document.getElementById('pianAddBtn').onclick = ()=>openPianificatoFormModal(null, back);
  document.querySelectorAll('.pianEdit').forEach(b=>b.onclick = ()=>openPianificatoFormModal(b.dataset.id, back));
  document.querySelectorAll('.pianDone').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.pianificati, b.dataset.id, 'Segnato come avvenuto', back);
  });
  document.querySelectorAll('.pianDelete').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.pianificati, b.dataset.id, 'Voce eliminata', back);
  });
}
function openPianificatoFormModal(id, onSaved){
  ensurePianificati();
  const editing = id ? DB.pianificati.find(p=>p.id===id) : null;
  const tipo = editing ? editing.tipo : 'uscita';
  const html = `
    <div class="modal-head"><h3>${ico('calendar')} ${editing?'Modifica voce pianificata':'Nuova voce pianificata'}</h3><button class="close-x" id="pfClose">${ico('x')}</button></div>
    <div class="modal-body">
      <div class="radio-row">
        <div class="radio-opt sel-entrata ${tipo==='entrata'?'active':''}" data-tipo="entrata">${ico('arrowUpRight')} Entrata (da ricevere)</div>
        <div class="radio-opt sel-uscita ${tipo==='uscita'?'active':''}" data-tipo="uscita">${ico('arrowDownRight')} Uscita (da pagare)</div>

      </div>
      <div class="field-row-2">
        <div class="field"><label>Importo (€)</label><input type="number" step="0.01" inputmode="decimal" min="0" id="pfImporto" value="${editing?editing.importo||'':''}" placeholder="0.00"></div>
        <div class="field"><label>Note (opzionale)</label><input type="text" id="pfNote" value="${editing?esc(editing.note||''):''}" placeholder="Aggiungi una nota"></div>

    <div class="modal-foot">
      ${editing?'<button class="btn btn-danger" id="pfDelete">Elimina</button>':''}
      <button class="btn" id="pfCancel">Annulla</button>
      <button class="btn btn-primary" id="pfSave">Salva</button>
    </div>
  `;
  const box = document.getElementById('modalBox');
  box.className = 'modal modal-form';
  box.innerHTML = html;
  showModalBackdrop();
  let curTipo = tipo;
  const { refreshCatOptions, refreshDescOptions } = wireCategoriaDettaglioFields('pfCategoria', 'pfDescrizione', ()=>curTipo, editing);
  document.querySelectorAll('.radio-opt').forEach(r=>r.onclick = ()=>{
    curTipo = r.dataset.tipo;
    document.querySelectorAll('.radio-opt').forEach(x=>x.classList.remove('active'));
    r.classList.add('active');
