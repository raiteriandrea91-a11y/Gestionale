<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Gestionale — Finance &amp; Personal Hub</title>
<!-- PWA: rende l'app installabile, con icona propria e senza barra del browser -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1316">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestionale">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1316; --surface:#161D21; --surface-2:#1D262B; --surface-3:#242F35;
  --border:#2A363C; --border-soft:#212B30;
  --text:#E9EEF0; --text-dim:#93A3AA; --text-faint:#5E6E75;
  --mint:#49D9A8; --mint-dim:#2A7A62; --mint-ink:#062E22;
  --coral:#FF7A66; --coral-dim:#8C4136;
  --blue:#5FA8FF; --blue-dim:#2E5A8C;
  --violet:#B592FF; --violet-dim:#5D4A8C;
  --amber:#F5B95C;
  --flash-yellow: rgba(255, 224, 90, .55);
  --money-pos:#49D9A8; --money-pos-dim:#2A7A62;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --tabbar-bg: rgba(22,29,33,.72);
  --tab-indicator-bg: #313E46;
  --glass-bg: rgba(35,43,49,.5);
  --glass-border: rgba(255,255,255,.14);
  --glass-highlight: rgba(255,255,255,.09);
  --radius:14px; --radius-sm:9px;
  --sidebar-w:236px;
  --sidebar-bg: linear-gradient(180deg,#123D33,#0C2A22);
  color-scheme: dark;
}
html[data-theme="light"]{
  --bg:#F5F8FC; --surface:#FFFFFF; --surface-2:#F1F5FA; --surface-3:#E7EEF7;
  --border:#DCE5F0; --border-soft:#E8EFF7;
  --text:#132038; --text-dim:#54637C; --text-faint:#93A2B8;
  --coral-dim:#FFDCD4; --blue-dim:#DCE9FC; --violet-dim:#E9DFFF;
  --money-pos-dim:#CDEFE2;
  --flash-yellow: rgba(255, 219, 40, .6);
  --shadow: 0 1px 2px rgba(20,40,80,.05), 0 8px 24px rgba(20,40,80,.06);
  --tabbar-bg: rgba(255,255,255,.72);
  --tab-indicator-bg: var(--surface-3);
  --glass-bg: rgba(255,255,255,.46);
  --glass-border: rgba(255,255,255,.75);
  --glass-highlight: rgba(255,255,255,.55);
  color-scheme: light;
}
html[data-theme="light"] .btn-primary{background:var(--mint); border-color:var(--mint); color:var(--mint-ink);}
html[data-theme="light"] .btn-primary:hover{filter:brightness(1.08);}
html[data-theme="light"] input:focus, html[data-theme="light"] select:focus, html[data-theme="light"] textarea:focus{border-color:var(--mint);}
/* Tema scuro su mobile: nero vero per lo sfondo pagina invece del grigio-blu scuro del desktop.
   Le card restano su un grigio molto scuro (non nero) per rimanere leggibili come elementi "sollevati". */
@media(max-width:880px){
  html:not([data-theme="light"]){
    --bg:#000000; --surface:#121619; --surface-2:#181D21; --surface-3:#1E252A;
    --border:#262E33; --border-soft:#1B2125; --tabbar-bg: rgba(18,22,25,.72);
    --tab-indicator-bg: #2C363D; --glass-bg: rgba(28,34,38,.48); --glass-border: rgba(255,255,255,.13);
  }
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden;} /* solo #mainContent scorre: vedi nota sotto */
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4,.brand,.nav-item,.stepper-label{font-family:'Space Grotesk',sans-serif;}
.mono, .num, td.num, .kpi-value, .amt{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
.money{transition:filter .15s ease; border-radius:4px;}
html[data-privacy="on"] .money{filter:blur(5px); user-select:none; cursor:default;}
html[data-privacy="on"] .money:hover, html[data-privacy="on"] .money:active{filter:blur(0);}
html[data-privacy="on"] .money.privacy-revealed{filter:blur(0);}
html[data-privacy="on"] canvas{filter:blur(6px); transition:filter .15s ease;}
html[data-privacy="on"] canvas:hover{filter:blur(0);}
::selection{background:var(--mint-dim); color:var(--text);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13.5px; outline:none; transition:border-color .15s;}
/* Il popup nativo della tendina di <select> resta a sfondo chiaro a prescindere dal tema
   (limite del rendering nativo, soprattutto su Android): forziamo un colore scuro sul testo
   delle opzioni sempre, altrimenti nel tema scuro risultano bianco su bianco e illeggibili. */
select option{color:#12181c !important; background:#fff !important;}
input:focus,select:focus,textarea:focus{border-color:var(--mint);}
input::placeholder{color:var(--text-faint);}
/* ==== Tendina personalizzata: sostituisce l'aspetto nativo di <select> in tutta l'app ====
   Il <select> originale resta nel DOM (invisibile) come unica fonte di verità per valore/opzioni,
   così tutto il codice esistente (onchange, .value, refreshCatOptions ecc.) continua a funzionare
   invariato; enhanceSelect() in fondo al file lo riveste con questa UI. */
.cs-wrap{position:relative; width:100%;}
.cs-native{position:absolute; inset:0; opacity:0; pointer-events:none; width:100%; height:100%;}
.cs-trigger{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 11px;
  font-size:13.5px; color:var(--text); cursor:pointer; user-select:none; transition:border-color .15s; text-align:left;}
.cs-trigger:hover{border-color:var(--text-faint);}
.cs-trigger.open{border-color:var(--mint);}
.cs-trigger.disabled{opacity:.5; cursor:not-allowed;}
.cs-trigger .cs-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
.cs-trigger .cs-label.ph{color:var(--text-faint);}
.cs-chev{flex:0 0 auto; color:var(--text-dim); display:flex; transition:transform .15s;}
.cs-trigger.open .cs-chev{transform:rotate(180deg);}
.slim-form .cs-trigger{background:transparent; border:none; padding:1px 0;}
.cs-panel{position:fixed; z-index:9999;
  background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);
  max-height:280px; display:flex; flex-direction:column; overflow:hidden;}
.cs-search{padding:8px; border-bottom:1px solid var(--border-soft); flex:0 0 auto;}
.cs-search input{width:100%; margin:0;}
.cs-options{overflow-y:auto; padding:5px;}
.cs-option{padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; color:var(--text);}
.cs-option:hover, .cs-option.cs-hi{background:var(--surface-2);}
.cs-option.cs-sel{color:var(--mint); font-weight:700;}
.cs-empty{padding:14px; text-align:center; color:var(--text-faint); font-size:13px;}
/* Chip isolato "Rimborso", vicino allo switch Entrata/Uscita nel form movimento */
.rimborso-chip-wrap{display:flex; justify-content:center; margin:-4px 0 10px;}
.mini-dialog-backdrop{position:fixed; inset:0; z-index:10000; background:rgba(6,10,12,.6); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px;}
.mini-dialog{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; width:100%; max-width:380px;}
.mini-dialog-msg{font-size:14px; color:var(--text); line-height:1.4; margin-bottom:14px;}
.mini-dialog-input{width:100%; margin-bottom:16px;}
.mini-dialog-actions{display:flex; justify-content:flex-end; gap:8px;}
.cat-edit-dialog{max-width:520px; text-align:left; max-height:85vh; overflow-y:auto;}
.cat-edit-dialog .field label{font-size:10.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:5px;}
.ec-detail-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.ec-detail-row .ec-detail-input{flex:1;}
.rimborso-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:20px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:12.5px;
  font-weight:700; cursor:pointer; user-select:none; transition:.15s;}
.rimborso-chip input{position:absolute; opacity:0; width:0; height:0;}
.rimborso-chip.checked{background:var(--mint-dim); border-color:var(--mint); color:var(--mint);}
html[data-theme="light"] .rimborso-chip.checked{background:var(--money-pos-dim); color:#0d7a5c;}
/* Icona "vai alla spesa collegata" sul rimborso — discreta, si accende solo all'hover */
.mov-link-btn{display:inline-flex; align-items:center; gap:5px; margin-left:6px; padding:2px 6px;
  border:none; background:transparent; color:var(--text-faint); font-size:11.5px; border-radius:6px;
  cursor:pointer; vertical-align:middle; transition:.15s;}
.mov-link-btn:hover{background:var(--surface-2); color:var(--mint);}
.mov-row-extra-line .mov-link-btn{margin-left:0; padding:2px 4px;}
/* Popup "Spese collegate" (openLinkedSpeseModal) quando un rimborso copre più di una spesa */
.linked-spesa-row{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; text-align:left; transition:border-color .15s;}
.linked-spesa-row:last-child{margin-bottom:0;}
.linked-spesa-row:hover{border-color:var(--mint);}
.linked-spesa-main{display:flex; align-items:center; gap:8px; min-width:0; font-size:13px; font-weight:600;}
.linked-spesa-desc{color:var(--text-faint); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.linked-spesa-right{display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0;}
.linked-spesa-date{font-size:10.5px; color:var(--text-faint);}
/* Righe multiple "Collega alla spesa" nel form movimento (più spese per un unico rimborso) */
.rimborso-di-row{align-items:center;}
.rimborso-di-remove{width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-faint); cursor:pointer; transition:all .15s; margin-left:6px;}
.rimborso-di-remove:hover{background:var(--coral); border-color:var(--coral); color:#fff;}
.rimborso-di-add-btn{display:inline-flex; align-items:center; gap:6px; margin:2px 0 4px 30px;}
/* Avviso non bloccante quando l'importo del rimborso non coincide con la somma delle spese collegate */
.rimborso-mismatch{display:flex; align-items:flex-start; gap:9px; background:rgba(245,185,92,.1); border-left:3px solid var(--amber); border-radius:8px; padding:10px 12px; margin:0 0 2px 30px; font-size:12.5px; line-height:1.5;}
.rimborso-mismatch .ic{color:var(--amber); flex-shrink:0; margin-top:1px;}
.rimborso-mismatch b{color:var(--text);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

/* ---------- APP SHELL ----------
   #app occupa esattamente l'altezza del viewport ed è l'unico elemento che può "scrollare" tramite
   il suo interno #mainContent: prima l'intera pagina scorreva col body, quindi su schermate con
   contenuto molto più alto (es. Dashboard con grafici e KPI) il browser mobile nascondeva/mostrava
   la barra degli indirizzi in modo diverso rispetto a schede più corte, facendo sembrare il menu
   in fondo alla sidebar (tema/privacy/calcolatrice) posizionato più in alto o più in basso a seconda
   della scheda aperta. Con la sidebar fissata a un viewport che non cambia mai altezza, resta sempre
   nello stesso punto qualunque sia la scheda attiva. */
#app{display:flex; height:100vh; height:100dvh;}

.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--sidebar-bg);
  border-right:none;
  display:flex; flex-direction:column; padding:22px 16px;
  position:fixed; top:0; bottom:0; left:0; z-index:60;
  transition:transform .28s cubic-bezier(.4,0,.2,1), width .22s ease, padding .22s ease, background .25s ease;
  overflow-x:hidden;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 10px 18px 10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--mint),var(--blue)); display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.brand-text{font-weight:700; font-size:16.5px; letter-spacing:-.02em; white-space:nowrap; color:#FFFFFF;}
.brand-sub{font-size:10.5px; color:rgba(255,255,255,.55); font-family:'Inter'; letter-spacing:.04em; text-transform:uppercase; margin-top:1px; white-space:nowrap;}

.sidebar-toggle{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:8px 10px; margin-bottom:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); border-radius:9px; color:rgba(255,255,255,.6); font-size:12px; font-weight:600; transition:all .15s;}
.sidebar-toggle:hover{color:#fff; background:rgba(255,255,255,.14);}
.sidebar-toggle .arrow{transition:transform .25s ease; font-size:13px;}
.sidebar.collapsed .sidebar-toggle{padding:8px 0;}

/* ---------- SIDEBAR EDGE TOGGLE (collapse/expand) ---------- */
.sidebar-edge-toggle{
  position:fixed; top:36px; left:var(--sidebar-w); transform:translate(-50%,-50%);
  width:25px; height:25px; border-radius:50%; z-index:61;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
  font-size:11px; box-shadow:var(--shadow); transition:left .22s ease, top .22s ease, color .15s, border-color .15s, background .15s;
}
.sidebar-edge-toggle:hover{color:var(--text); border-color:var(--text-faint); background:var(--surface-2);}

/* ---------- SIDEBAR BOTTOM TOOLS (calcolatrice + footer) ---------- */
.sidebar-bottom{margin-top:auto;}

.nav-list{list-style:none; display:flex; flex-direction:column; gap:2px; margin-top:6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:rgba(255,255,255,.68); font-size:13.5px; font-weight:500; cursor:pointer; user-select:none;
  transition:background .15s, color .15s;
}
.nav-item .ic{width:18px; text-align:center; font-size:15px; opacity:.9; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.nav-item .ic svg{width:18px; height:18px; display:block; stroke:currentColor;}
.nav-item .nav-label{white-space:nowrap; overflow:hidden;}
.nav-item{position:relative;}
.nav-badge{position:absolute; left:22px; top:4px; min-width:15px; height:15px; padding:0 4px; border-radius:8px; background:var(--coral); color:#fff; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; line-height:1; box-shadow:0 0 0 2px var(--sidebar-bg, var(--bg));}
.sidebar.collapsed .nav-badge{left:auto; right:6px; top:6px;}
.sub-bell{background:none; border:none; cursor:pointer; font-size:14px; opacity:.55; padding:2px 4px; line-height:1; flex-shrink:0;}
.sub-bell:hover{opacity:1;}
.sub-bell.on{opacity:.95;}
.scad-banner{display:flex; align-items:flex-start; gap:12px; background:var(--coral-dim); border:1px solid var(--coral); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
.scad-banner .scb-ic{font-size:20px; flex-shrink:0;}
.scad-banner .scb-body{flex:1; min-width:0;}
.scad-banner .scb-title{font-weight:700; font-size:13.5px; margin-bottom:3px;}
.scad-banner .scb-list{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
.scad-banner .scb-close{background:none; border:none; cursor:pointer; font-size:15px; opacity:.6; flex-shrink:0;}
.scad-banner .scb-close:hover{opacity:1;}
.notif-row{display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px solid var(--border-soft);}
.notif-row:last-child{border-bottom:none;}
.notif-row .nr-info{flex:1; min-width:0;}
.notif-row .nr-label{font-weight:600; font-size:13px;}
.notif-row .nr-sub{font-size:11.5px; color:var(--text-faint);}
.etichetta-chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap;}
.etichetta-chip-sm{padding:2px 7px; font-size:10px; margin-left:6px;}
.ic-svg{display:inline-block; vertical-align:-3px; flex-shrink:0;}
button .ic-svg, .btn .ic-svg{vertical-align:-3px;}
.etichetta-chip-click{cursor:pointer; transition:filter .12s;}
.etichetta-chip-click:hover{filter:brightness(1.15);}
.etichetta-chip-remove{background:none; border:none; cursor:pointer; color:inherit; font-size:13px; line-height:1; padding:0; margin-left:2px; opacity:.75;}
.etichetta-chip-remove:hover{opacity:1;}
.etichette-row{display:inline-flex; flex-wrap:wrap; gap:4px; vertical-align:middle;}
.tag-input-wrap{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:7px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2);}
.tag-input-wrap input{flex:1; min-width:120px; border:none; background:none; outline:none; color:var(--text); font-size:13px; padding:3px 0;}
.etichetta-field{position:relative;}
.etichetta-suggest{position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,.4); max-height:220px; overflow-y:auto; z-index:60; padding:6px; display:none;}
.etichetta-suggest.open{display:block;}
.etichetta-suggest-empty{padding:12px 10px; font-size:12.5px; color:var(--text-faint); text-align:center;}
.etichetta-suggest-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text); transition:background .12s ease;}
.etichetta-suggest-item:hover{background:var(--surface-2);}
.etichetta-suggest-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.tag-chips{display:flex; flex-wrap:wrap; gap:6px;}
.nav-item:hover{background:rgba(255,255,255,.09); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.15); color:#fff;}
.sidebar .nav-item.active{box-shadow:inset 2.5px 0 0 var(--mint);}
.sidebar-footer{padding:12px 10px 2px; font-size:11px; color:rgba(255,255,255,.42); border-top:1px solid rgba(255,255,255,.14); padding-top:16px; white-space:nowrap; overflow:hidden;}

/* ---------- SIDEBAR COLLAPSED STATE ---------- */
.sidebar.collapsed{padding-left:12px; padding-right:12px;}
.sidebar.collapsed .brand{justify-content:center; padding:4px 0 18px;}
.sidebar.collapsed .brand-text, .sidebar.collapsed .brand-sub{display:none;}
.sidebar.collapsed .sidebar-toggle span.label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center; padding:11px 0;}
.sidebar.collapsed .nav-item .nav-label{display:none;}
.sidebar.collapsed .sidebar-footer{display:none;}

.overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:55; backdrop-filter:blur(2px);}
.overlay.show{display:block;}

/* Header persistente mobile: pillola Impostazioni fissa a sinistra, nome scheda centrato
   (sempre, indipendentemente da cosa contengono le pillole ai lati), pillola con le azioni
   contestuali alla pagina a destra — stesso linguaggio "vetro smerigliato" della tabbar in basso. */
.mobile-topbar{
  display:none; position:relative; align-items:center; justify-content:space-between; gap:8px;
  min-height:40px; background:transparent; box-sizing:border-box; margin-bottom:10px;
}
.mobile-topbar-pill{
  display:flex; align-items:center; gap:4px; min-height:40px; padding:0 3px; border-radius:999px;
  background:var(--tabbar-bg); border:1px solid var(--border-soft);
  backdrop-filter:blur(20px) saturate(1.7); -webkit-backdrop-filter:blur(20px) saturate(1.7);
  transition:opacity .2s ease, transform .2s ease;
}
.mobile-topbar-pill:empty{background:transparent; border-color:transparent; backdrop-filter:none; -webkit-backdrop-filter:none;}
.mobile-topbar-title{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16.5px; letter-spacing:-.01em;
  color:var(--text); white-space:nowrap; pointer-events:none;
  animation:topbarTitleFade .25s ease;
}
@keyframes topbarTitleFade{
  from{opacity:0; transform:translate(-50%,-50%) translateY(4px);}
  to{opacity:1; transform:translate(-50%,-50%) translateY(0);}
}
.mobile-topbar-btn{
  width:34px; height:34px; flex-shrink:0; border-radius:999px; background:transparent; border:none;
  color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  transition:background .15s ease, color .15s ease, transform .1s ease;
}
.mobile-topbar-btn:active{background:var(--surface-3); transform:scale(.92);}
.mobile-topbar-btn.accent{color:var(--mint);}
.mobile-topbar-count{
  padding:0 12px; font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600; color:var(--text-dim);
  white-space:nowrap;
}
/* Bolla di navigazione in basso: stile app Orologio Android — pillola "sollevata" dallo
   sfondo (superficie più chiara + ombra marcata), icona attiva su un cerchio grigio neutro
   (non nero, non colorato), spaziatura generosa tra le icone. */
.mobile-tabbar{
  display:none; position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:70;
  align-items:center; justify-content:center; gap:2px;
  background:var(--tabbar-bg); border:1px solid var(--border-soft); border-radius:999px;
  padding:6px; box-shadow:0 calc(10px + var(--scroll-boost,0)*6px) calc(28px + var(--scroll-boost,0)*14px) rgba(0,0,0,calc(.14 + var(--scroll-boost,0)*.1)), 0 2px 8px rgba(0,0,0,.08);
  box-sizing:border-box; max-width:calc(100vw - 24px); transition:box-shadow .25s ease;
  backdrop-filter:blur(20px) saturate(1.7); -webkit-backdrop-filter:blur(20px) saturate(1.7);
}
.mobile-tab{
  width:48px; height:40px; flex-shrink:0; border-radius:999px; display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); background:transparent; transition:color .15s ease; position:relative; z-index:1;
  border:none; outline:none; appearance:none; -webkit-appearance:none; box-shadow:none;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.mobile-tab svg{width:22px; height:22px;}
.mobile-tab.active{color:var(--text);}
.mobile-tab-indicator{
  position:absolute; top:0; left:0; width:48px; height:40px; border-radius:999px;
  background:var(--tab-indicator-bg); box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  z-index:0; pointer-events:none; opacity:0;
  transition:transform .42s cubic-bezier(.16,.8,.24,1), opacity .2s ease;
}
/* Pulsante flottante "Nuovo movimento": visibile solo nella scheda Movimenti (classe .show
   aggiunta/rimossa da switchView), sollevato sopra la pillola di navigazione. Toni discreti,
   coerenti con le superfici dell'app, non un cerchio pieno a tinta accesa. */
.mobile-fab{
  display:none; position:fixed; right:18px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:65;
  width:44px; height:44px; border-radius:50%; align-items:center; justify-content:center;
  background:var(--surface-3); color:var(--accent,var(--mint)); border:1px solid var(--border); cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.22); transition:transform .15s ease;
}
.mobile-fab.show{display:flex;}
.mobile-fab:active{transform:scale(.93);}
@media(min-width:881px){ .mobile-fab{display:none !important;} }
/* Feedback discreto per l'aggiornamento automatico dei dati (Realtime Supabase): appare e
   scompare in un angolo, senza interrompere ciò che l'utente sta facendo. */
.sync-flash{
  position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); right:16px; z-index:200;
  width:32px; height:32px; border-radius:50%; background:var(--tabbar-bg); border:1px solid var(--border-soft);
  backdrop-filter:blur(16px) saturate(1.7); -webkit-backdrop-filter:blur(16px) saturate(1.7);
  display:flex; align-items:center; justify-content:center; color:var(--money-pos);
  opacity:0; transform:scale(.75); pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.sync-flash.show{opacity:1; transform:scale(1);}

/* Pulsante "espandi" in fondo alla pillola di navigazione: apre un pannello vetro sospeso sopra
   la tabbar con le sezioni secondarie (Mutuo, Utenze, …), ancorato al bordo destro del pulsante
   stesso (non centrato sotto la pillola). La freccia è rivolta verso l'alto a riposo (invito ad
   espandere) e si capovolge quando il pannello è aperto. */
.mobile-tab-more svg{width:18px; height:18px; transform:rotate(180deg); transition:transform .25s cubic-bezier(.16,.8,.24,1);}
.mobile-tab-more.open svg{transform:rotate(0deg);}
.mobile-more-panel{
  display:none; position:fixed; bottom:calc(18px + 40px + 12px + env(safe-area-inset-bottom,0px)); z-index:69;
  flex-direction:column; gap:2px; min-width:196px; padding:6px; overflow:hidden;
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:20px;
  backdrop-filter:blur(28px) saturate(2.2); -webkit-backdrop-filter:blur(28px) saturate(2.2);
  box-shadow:inset 0 1px 0 var(--glass-highlight), 0 14px 32px rgba(0,0,0,.22), 0 2px 10px rgba(0,0,0,.12);
  transform-origin:bottom right; transform:translateY(10px) scale(.92); opacity:0; pointer-events:none;
  transition:transform .25s cubic-bezier(.16,.8,.24,1), opacity .18s ease;
}
.mobile-more-panel.open{transform:translateY(0) scale(1); opacity:1; pointer-events:auto;}
.mobile-more-item{
  display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:14px;
  background:transparent; border:none; color:var(--text-dim); font-family:'Inter',sans-serif;
  font-size:14px; font-weight:600; text-align:left; width:100%;
  -webkit-tap-highlight-color:transparent; transition:background .15s ease, color .15s ease;
}
.mobile-more-item svg{width:18px; height:18px; flex-shrink:0;}
.mobile-more-item:active{background:rgba(127,127,127,.18);}
.mobile-more-item.active{background:var(--tab-indicator-bg); color:var(--text);}
.settings-mobile-only{display:none;}
@media(max-width:880px){ .settings-mobile-only{display:block;} }


main{margin-left:var(--sidebar-w); flex:1; min-width:0; max-width:100%; padding:28px 34px 60px; transition:margin-left .22s ease; height:100vh; height:100dvh; overflow-y:auto; overflow-x:hidden;}

.topbar{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:14px; flex-wrap:wrap;}
.page-title{font-size:22px; font-weight:700; letter-spacing:-.02em;}
.page-sub{color:var(--text-dim); font-size:13px; margin-top:3px;}

.view{display:none; animation:fadein .3s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
.odo-digit{display:inline-block; animation:odoRoll .5s cubic-bezier(.22,.68,0,1) both;}
.odo-static{display:inline-block;}
@keyframes odoRoll{from{transform:translateY(65%); opacity:0;} to{transform:translateY(0); opacity:1;}}
/* L'icona dell'auto "arriva" da sinistra con un lieve rimbalzo finale, come se stesse parcheggiando */
.auto-park-icon{display:inline-flex; animation:autoPark .55s cubic-bezier(.22,.85,.4,1.15) both;}
@keyframes autoPark{from{transform:translateX(-40px); opacity:0;} 70%{transform:translateX(3px); opacity:1;} to{transform:translateX(0); opacity:1;}}
/* Bagliore diagonale che attraversa la card quando il saldo Welfare sale, come lo shine di una carta fisica */
.card-shine::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%);
  background-size:220% 220%; background-position:150% -50%;
  animation:cardShineSweep .9s ease-out;
}
@keyframes cardShineSweep{from{background-position:150% -50%;} to{background-position:-50% 150%;}}
#ricercaBody.ricerca-morph-l{animation:ricercaMorphL .32s cubic-bezier(.22,.68,0,1) both;}
#ricercaBody.ricerca-morph-r{animation:ricercaMorphR .32s cubic-bezier(.22,.68,0,1) both;}
@keyframes ricercaMorphL{from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:translateX(0);}}
@keyframes ricercaMorphR{from{opacity:0; transform:translateX(-18px);} to{opacity:1; transform:translateX(0);}}

/* ---------- CARDS / GRID ---------- */
.card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
/* ---------- Riepilogo mensile (card "commercialista") ---------- */
.report-card{cursor:pointer; user-select:none; margin-bottom:20px;}
.report-card-head{display:flex; align-items:flex-start; gap:12px;}
.report-card-icon{flex-shrink:0; width:34px; height:34px; border-radius:10px; background:var(--accent-dim,var(--mint-dim)); color:var(--accent,var(--mint)); display:flex; align-items:center; justify-content:center;}
.report-card-body{flex:1; min-width:0;}
.report-card-title{font-size:14px; font-weight:700; color:var(--text); margin-bottom:2px;}
.report-card-teaser{font-size:13px; color:var(--text-dim); line-height:1.5;}
.report-card-chevron{font-size:11px; color:var(--text-faint); transition:transform .2s ease; flex-shrink:0; margin-top:3px;}
.report-card.open .report-card-chevron{transform:rotate(90deg);}
.report-nav{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.report-nav-btn{
  width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:8px;
  background:var(--surface-2); border:none; color:var(--text-dim); cursor:pointer; transition:background .12s;
}
.report-nav-btn:hover:not(:disabled){background:var(--surface-3); color:var(--text);}
.report-nav-btn:disabled{opacity:.35; cursor:default;}
.report-card.no-data .report-card-teaser{color:var(--text-faint);}
.report-card-full{max-height:0; overflow:hidden; transition:max-height .28s ease;}
.report-card.open .report-card-full{max-height:900px;}
.report-card-full-inner{padding-top:14px; margin-top:14px; border-top:1px solid var(--border-soft);}
.report-card-full-inner p{font-size:13.5px; line-height:1.7; color:var(--text); margin:0 0 10px;}
.report-card-full-inner p:last-child{margin-bottom:0;}
.report-card-full-inner b{color:var(--text); font-weight:700;}
.report-card-empty{font-size:13px; color:var(--text-faint);}
.card-title{font-size:13px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px;}
.grid{display:grid; gap:16px;}
.kpi-grid{grid-template-columns:repeat(4,1fr); margin-bottom:20px;}
.kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.kpi-grid.cols-2{grid-template-columns:repeat(2,1fr);}
.charts-grid{grid-template-columns:1.3fr 1fr; margin-bottom:20px;}
.two-col{grid-template-columns:1fr 1fr;}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr);} .kpi-grid.cols-3{grid-template-columns:repeat(2,1fr);} .charts-grid{grid-template-columns:1fr;} .two-col{grid-template-columns:1fr;}}

.kpi-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:17px 19px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.kpi-label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; font-weight:600; display:flex; align-items:center; gap:6px;}
.kpi-card .sparkline{display:block; width:100%; height:24px; margin-top:6px; opacity:.8;}
.kpi-value{font-size:23px; font-weight:600; margin-top:9px; letter-spacing:-.01em; transition:color .4s ease;}
.kpi-compare{font-size:11px; font-weight:600; margin-top:5px; letter-spacing:0; font-family:'Inter',sans-serif;}
.kpi-compare.pos{color:var(--money-pos);}
.kpi-compare.neg{color:var(--coral);}

/* ---------- CHILOMETRAGGIO ---------- */
.km-years-list{display:flex; flex-direction:column;}
.km-year-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--border-soft);}
.km-year-row:first-child{border-top:none;}
.km-year-label{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; width:46px; flex-shrink:0;}
.km-year-bar-wrap{flex:1; height:9px; border-radius:5px; background:var(--surface-3); overflow:hidden;}
.km-year-bar{height:100%; background:linear-gradient(90deg,var(--blue),var(--violet)); border-radius:5px;}
.km-year-val{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim); white-space:nowrap; flex-shrink:0;}
.km-year-val small{color:var(--text-faint);}

/* ---------- PULIZIA DUPLICATI ---------- */
.dup-group{border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:10px; background:var(--surface-2);}
.dup-variant-chip{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; transition:border-color .15s;}
.dup-variant-chip:hover{border-color:var(--text-faint);}
.dup-variant-chip input{accent-color:var(--mint);}
.kpi-bar{position:absolute; left:0; top:0; bottom:0; width:3px;}
.kpi-card.entrate .kpi-bar{background:var(--money-pos);}
.kpi-card.uscite .kpi-bar{background:var(--coral);}
.kpi-card.saldo .kpi-bar{background:var(--blue);}
.kpi-card.risparmio .kpi-bar{background:var(--violet);}
.pos{color:var(--money-pos);} .neg{color:var(--coral);} .even{color:var(--amber);}

.filters-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.filters-row select, .filters-row input{min-width:120px;}

/* ---------- TIME SELECTOR (pills + tiles) ---------- */
.time-selector{display:flex; flex-direction:column; gap:12px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); margin-bottom:20px;}
/* Scheda Ricerca: i campi base (Anni/Mesi/Categoria/Dettaglio/Note) sono sempre visibili, distribuiti
   su due colonne — "Cosa" (testo) e "Quando" (anni/mesi) — per non sprecare lo spazio orizzontale su
   schermi larghi. Tipo/Metodo/Importo/Etichette vivono invece dentro il pannello pieghevole "Ricerca
   avanzata" più sotto. Su mobile le colonne tornano a impilarsi (media query sotto). */
.search-filters-grid{display:grid; grid-template-columns:1fr 1.25fr; gap:8px 28px; align-items:start;}
.search-col{display:flex; flex-direction:column; gap:12px; min-width:0;}
.search-col-what .time-selector-row input[type="text"],
.search-col-what .time-selector-row select{flex:1; min-width:0;}
@media(max-width:880px){ .search-filters-grid{grid-template-columns:1fr; gap:18px;} }
.time-selector-row{display:flex; align-items:center; gap:10px; flex-wrap:nowrap;}
.time-selector-row > .amount-range-group, .time-selector-row > .etichetta-field{flex:1; min-width:0;}
.time-selector-row:first-child{flex-wrap:nowrap;}
.time-selector-label{font-size:10.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; width:72px; flex-shrink:0;}
.amount-range-group{display:flex; align-items:center; gap:8px; margin-left:8px;}
.pill-group{display:flex; gap:2px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:3px;}
/* Anni: sempre a scorrimento orizzontale (mobile e desktop), così qualunque numero di anni
   presenti nei movimenti resta raggiungibile senza andare a capo né tagliarsi. */
#yearPills{flex:1; min-width:0; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; max-width:100%;}
#yearPills::-webkit-scrollbar{display:none;}
/* Anni in Ricerca: a differenza della Dashboard, qui tutti gli anni devono restare visibili senza
   scorrimento nascosto — quindi vanno a capo invece di scorrere orizzontalmente. */
#searchYearPills{flex:1; min-width:0; flex-wrap:wrap;}
#yearPills .pill, #searchYearPills .pill{flex-shrink:0;}
.search-filters-foot{display:flex; justify-content:flex-end; padding-top:4px; margin-top:2px;}
.pill{background:none; border:none; color:var(--text-dim); padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .15s; user-select:none;}
.pill:hover{color:var(--text);}
.pill.active{background:var(--surface-3); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.15); font-weight:700;}
/* Griglia mesi: 6 colonne su due righe (celle più larghe, testo del mese più leggibile),
   uniforme tra mobile e desktop. */
.month-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:2px; flex:1; min-width:220px; max-width:340px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:3px;}
.month-tile{background:none; border:none; color:var(--text-dim); padding:7px 2px; border-radius:11px; font-size:11.5px; font-weight:600; cursor:pointer; text-align:center; transition:all .15s; user-select:none;}
.month-tile:hover{color:var(--text);}
.month-tile.active{background:var(--surface-3); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.15); font-weight:700;}
.icon-toggle-btn{position:relative; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:34px; height:34px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; cursor:pointer; transition:all .15s;}
.icon-toggle-btn svg{width:16px; height:16px; display:block;}
.icon-toggle-btn:hover{border-color:var(--text-faint); color:var(--text); background:var(--surface-3);}
.icon-toggle-btn.active{background:var(--mint-dim); border-color:var(--mint); color:var(--mint);}
.icon-toggle-btn::after{
  content:attr(data-tooltip); position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(-4px);
  background:var(--surface-3); color:var(--text); border:1px solid var(--border); box-shadow:var(--shadow);
  padding:6px 10px; border-radius:7px; font-size:11.5px; font-weight:500; white-space:nowrap; text-transform:none; letter-spacing:normal;
  opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease; z-index:80;
}
.icon-toggle-btn:hover::after{opacity:1; transform:translateX(-50%) translateY(0);}
.time-reset-btn{display:inline-flex; align-items:center; gap:5px; background:none; border:1px dashed var(--border); color:var(--text-faint); padding:6px 13px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap; margin-left:auto;}
.time-reset-btn:hover{border-color:var(--coral); color:var(--coral);}

/* ---------- RICERCA: toggle "Ricerca avanzata" ---------- */
.search-advanced-toggle{
  display:flex; align-items:center; gap:6px; align-self:flex-start; background:none; border:none;
  color:var(--text-faint); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  cursor:pointer; padding:6px 2px; margin-top:2px;
}
.search-advanced-toggle:hover{ color:var(--text); }
.search-advanced-toggle .sat-chevron{ transition:transform .15s ease; }
.search-advanced-toggle.open .sat-chevron{ transform:rotate(180deg); }
.search-advanced-body{ display:none; padding-top:2px; }
.search-advanced-body.open{ display:block; }

/* ---------- MOVIMENTI: accordion per anno ---------- */
.mov-year-group{margin-bottom:14px;}
.mov-year-head{display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none;}
.mov-year-chevron{transition:transform .2s ease; font-size:12px; color:var(--text-faint); flex-shrink:0; display:inline-block;}
.mov-year-group.open .mov-year-chevron{transform:rotate(90deg);}
.mov-year-label{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
.mov-year-count{color:var(--text-faint); font-size:12px; font-weight:500;}
.mov-year-totals{margin-left:auto; display:flex; gap:16px; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; flex-shrink:0;}
.mov-year-totals .pos{color:var(--money-pos);}
.mov-year-totals .neg{color:var(--coral);}
.mov-year-body{margin-top:14px;}

/* ---------- MOVIMENTI: redesign "ledger minimale" ---------- */
.mov-year-group.card{box-shadow:none; border-radius:10px; padding:14px 16px;}
.mov-table, .ledger-table{font-size:12.5px;}
@media(min-width:881px){
  /* Ingresso a dissolvenza per le righe delle tabelle desktop (solo opacità: il transform su
     <tr> è inaffidabile tra browser), stessa cura già presente nelle card mobile. */
  .mov-table tbody tr[data-id], .ledger-table tbody tr[data-id], .search-res-table tbody tr[data-id]{
    animation: rowFadeInDesktop .25s ease both;
  }
  .mov-table tbody tr:nth-of-type(1), .ledger-table tbody tr:nth-of-type(1), .search-res-table tbody tr:nth-of-type(1){animation-delay:.02s;}
  .mov-table tbody tr:nth-of-type(2), .ledger-table tbody tr:nth-of-type(2), .search-res-table tbody tr:nth-of-type(2){animation-delay:.05s;}
  .mov-table tbody tr:nth-of-type(3), .ledger-table tbody tr:nth-of-type(3), .search-res-table tbody tr:nth-of-type(3){animation-delay:.08s;}
  .mov-table tbody tr:nth-of-type(4), .ledger-table tbody tr:nth-of-type(4), .search-res-table tbody tr:nth-of-type(4){animation-delay:.11s;}
  .mov-table tbody tr:nth-of-type(5), .ledger-table tbody tr:nth-of-type(5), .search-res-table tbody tr:nth-of-type(5){animation-delay:.14s;}
  .mov-table tbody tr:nth-of-type(6), .ledger-table tbody tr:nth-of-type(6), .search-res-table tbody tr:nth-of-type(6){animation-delay:.17s;}
  .mov-table tbody tr:nth-of-type(7), .ledger-table tbody tr:nth-of-type(7), .search-res-table tbody tr:nth-of-type(7){animation-delay:.2s;}
  .mov-table tbody tr:nth-of-type(8), .ledger-table tbody tr:nth-of-type(8), .search-res-table tbody tr:nth-of-type(8){animation-delay:.23s;}
  @keyframes rowFadeInDesktop{from{opacity:0;} to{opacity:1;}}
}
.mov-table thead th, .ledger-table thead th{padding:6px 12px; border-bottom:1px solid var(--border);}

@media(max-width:880px){
  /* ---------- Elenco Movimenti (mobile): stile Revolut — card per giorno, niente checkbox

  /* Qualunque tabella reflow che abbia come fratello la lista a card (mov-day-list) va nascosta

  .table-scroll:has(~ .mov-day-list){display:none;}

  .mov-day-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04);}

  .mov-row-swipe-actions{position:absolute; top:0; right:0; bottom:0; display:flex; align-items:stretch; z-index:0;}

  /* Layer di contenuto, quello che l'utente trascina */
  .mov-row-content{
    position:relative; z-index:1; background:var(--surface);

    transition:background .18s ease, transform .18s ease;

  .mov-row.selected .mov-row-swipe-actions{display:none;}

  .mov-row-sub{font-size:11.5px; color:var(--text-faint); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mov-row-note-ic{display:inline-flex; vertical-align:-1px; margin-left:5px; opacity:.7;}

  .mov-row-amt.pos{color:var(--money-pos);}

  .mov-row-extra{

  }

  /* La barra di selezione multipla "classica" (basata su checkbox) resta per Ricerca/Etichette/

  /* Intestazione di mese ("AGOSTO 2026"): resta un'etichetta separatrice leggibile */

  /* ---------- Elenco movimenti: righe piatte con separatore, niente card ----------

  .mov-table tr[data-id] .etichette-row{display:none;}

  .mov-table tr[data-id].row-expanded td.note-col{display:block; order:9; flex-basis:100%; color:var(--text-faint); font-size:12.5px; padding-top:6px !important; border-top:1px solid var(--border-soft); margin-top:4px;}

  .mov-table tr[data-id].row-expanded td:last-child .row-actions{justify-content:flex-end;}
  /* ---------- Risultati Ricerca: stesso trattamento a righe piatte, niente scroll

  #searchResults .table-scroll{overflow-x:visible;}
  .search-res-table thead{display:none;}

  .search-res-table tr[data-id]{

  .search-res-table tr[data-id].row-expanded{background:var(--surface-2);}

  .search-res-mov tr[data-id] td:nth-child(4){order:3; flex-basis:100%; font-size:11.5px; color:var(--text-faint);}
  .search-res-mov tr[data-id] td:nth-child(3){order:4; font-size:11.5px; color:var(--text-faint);}
  .search-res-mov tr[data-id] td:nth-child(3)::before{content:'·'; margin-right:6px; color:var(--text-faint);}
  /* Abbonamenti: Servizio+Costo in evidenza, Metodo · Scadenza secondaria */
  .search-res-sub tr[data-id] td:nth-child(2){order:1; flex:1; min-width:0; font-size:14.5px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .search-res-sub tr[data-id] td:nth-child(3){order:3; flex-basis:100%; font-size:11.5px; color:var(--text-faint);}
  .search-res-sub tr[data-id] td:nth-child(4){order:4; font-size:11.5px; color:var(--text-faint);}
  .search-res-sub tr[data-id] td:nth-child(4)::before{content:'·'; margin-right:6px; color:var(--text-faint);}
  /* Manutenzione Auto: Intervento+Costo in evidenza, Officina · Data secondaria */
  .search-res-auto tr[data-id] td:nth-child(3){order:1; flex:1; min-width:0; font-size:14.5px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- Movimenti pianificati / Resoconto Etichetta / Cronologia Metodo: stesso

  .ledger-mobile-plain thead, .ledger-mobile-check thead{display:none;}

  .ledger-mobile-plain tr[data-id] td:nth-child(3){order:1; flex:1; min-width:0; font-size:14.5px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .ledger-mobile-check tr[data-id]{cursor:pointer; transition:background .15s ease;}
  .ledger-mobile-check tr[data-id].row-expanded{background:var(--surface-2);}
  .ledger-mobile-check tr[data-id] .check-col, .ledger-mobile-check tr[data-id] td:last-child{display:none;}
  .ledger-mobile-check tr[data-id].row-expanded .check-col{display:block; order:-2; flex-shrink:0;}
  .ledger-mobile-check tr[data-id] td:nth-child(4){order:1; flex:1; min-width:0; font-size:14.5px; font-weight:700; color:var(--text);}

  .ledger-mobile-check tr[data-id] td:nth-child(2){order:4; font-size:11.5px; color:var(--text-faint);}
  .ledger-mobile-check tr[data-id] td:nth-child(2)::before{content:'·'; margin-right:6px; color:var(--text-faint);}
  .ledger-mobile-check tr[data-id] td:nth-child(5){display:none;}
  .ledger-mobile-check tr[data-id].row-expanded td:nth-child(5){display:block; order:9; flex-basis:100%; color:var(--text-faint); font-size:12.5px; padding-top:6px !important; border-top:1px solid var(--border-soft); margin-top:4px;}
  .ledger-mobile-check tr[data-id].row-expanded td:last-child{display:block; order:10; flex-basis:100%; margin-top:4px;}
  .ledger-mobile-check tr[data-id].row-expanded td:last-child .row-actions{justify-content:flex-end;}
  /* Ingresso a cascata: le righe compaiono con un piccolo fade + slide-up invece che di colpo */
  .mov-table tr[data-id], .search-res-table tr[data-id], .ledger-mobile-plain tr[data-id], .ledger-mobile-check tr[data-id]{animation:cardIn .3s cubic-bezier(.22,.68,0,1) both;}
  .mov-table tbody tr:nth-of-type(1), .search-res-table tbody tr:nth-of-type(1), .ledger-mobile-plain tbody tr:nth-of-type(1), .ledger-mobile-check tbody tr:nth-of-type(1){animation-delay:.02s;}
  .mov-table tbody tr:nth-of-type(2), .search-res-table tbody tr:nth-of-type(2), .ledger-mobile-plain tbody tr:nth-of-type(2), .ledger-mobile-check tbody tr:nth-of-type(2){animation-delay:.05s;}
  .mov-table tbody tr:nth-of-type(3), .search-res-table tbody tr:nth-of-type(3), .ledger-mobile-plain tbody tr:nth-of-type(3), .ledger-mobile-check tbody tr:nth-of-type(3){animation-delay:.08s;}
  .mov-table tbody tr:nth-of-type(4), .search-res-table tbody tr:nth-of-type(4), .ledger-mobile-plain tbody tr:nth-of-type(4), .ledger-mobile-check tbody tr:nth-of-type(4){animation-delay:.11s;}
  .mov-table tbody tr:nth-of-type(5), .search-res-table tbody tr:nth-of-type(5), .ledger-mobile-plain tbody tr:nth-of-type(5), .ledger-mobile-check tbody tr:nth-of-type(5){animation-delay:.14s;}
  .mov-table tbody tr:nth-of-type(6), .search-res-table tbody tr:nth-of-type(6), .ledger-mobile-plain tbody tr:nth-of-type(6), .ledger-mobile-check tbody tr:nth-of-type(6){animation-delay:.17s;}
  .mov-table tbody tr:nth-of-type(7), .search-res-table tbody tr:nth-of-type(7), .ledger-mobile-plain tbody tr:nth-of-type(7), .ledger-mobile-check tbody tr:nth-of-type(7){animation-delay:.2s;}

  @keyframes cardIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  /* Micro-feedback al tocco: leggero "schiacciamento" su pillole, pulsanti e voci cliccabili */
  .pill, .month-tile, .mobile-tab, .btn, .settings-link-item, .search-advanced-toggle,
  .settings-info-btn, .accent-swatch-current, .accent-swatch, .mobile-topbar-btn, .icon-toggle-btn,

  .search-advanced-toggle:active, .settings-info-btn:active, .accent-swatch-current:active, .accent-swatch:active,
  .mobile-topbar-btn:active, .icon-toggle-btn:active, .time-reset-btn:active,
  .cat-color-btn:active, .etichetta-color-btn:active, .cat-color-swatch:active, .etichetta-color-swatch:active{
    transform:scale(.93);
  }

@keyframes rowFlash{ 0%{background:var(--flash-yellow);} 83%{background:var(--flash-yellow);} 100%{background:transparent;} }
/* !important necessario: le tabelle hanno una regola di ingresso a dissolvenza (rowFadeInDesktop,
   vedi sopra) con specificità CSS maggiore di una singola classe, che altrimenti sovrascriverebbe
   silenziosamente questa animazione senza dare alcun errore. */
tr.row-flash{ animation:rowFlash 6s ease-out !important; }
.mov-row.row-flash{ animation:rowFlash 6s ease-out !important; }

.btn-pianificati{background:transparent; border-color:var(--border); color:var(--text-dim); position:relative; overflow:visible;}
.btn-pianificati:hover{background:var(--surface-2); color:var(--text);}
.btn-pianificati .pian-badge{position:absolute; top:-6px; right:-6px; display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--text-faint); color:var(--bg); font-size:10px; font-weight:800;}
.btn-danger:hover{background:var(--coral-dim);}
.btn-sm{padding:6px 11px; font-size:12px;}
.btn-icon{width:32px; height:32px; padding:0; justify-content:center; border-radius:8px;}
.btn:disabled{opacity:.3; cursor:not-allowed; pointer-events:none;}

/* ---------- TABLE ---------- */
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600; padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody td{padding:10px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap;}
tbody tr{transition:background .12s;}
tbody tr:hover{background:var(--surface-2);}
td.num{text-align:right;}
th.num{text-align:center;}
.group-row td{background:var(--surface-2); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); padding:8px 12px; border-bottom:1px solid var(--border);}
.tag{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.cat-label{display:inline-flex; align-items:center; gap:6px;}
.cat-label-avatar{gap:8px;}
.cat-label-avatar .cat-avatar{flex-shrink:0;}
.cat-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block;}
.tag-dot{width:6px; height:6px; border-radius:50%;}
.row-actions{display:flex; gap:6px; opacity:0; pointer-events:none; transition:opacity .12s;}
/* Menu "..." per le singole righe di movimento (Movimenti, Ricerca, Storico Etichetta/Metodo di
   pagamento): sostituisce le icone Visualizza/Modifica/Elimina in fondo riga con un unico pulsante
   che apre un piccolo menu a comparsa. Stessa estetica del menu contestuale di selezione multipla
   (.mov-sel-menu, mobile-only) ma definito qui a livello globale così funziona anche su desktop. */
.kebab-menu{
  position:fixed; z-index:200; min-width:190px; background:var(--surface); border:1px solid var(--border);
  border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.28); padding:6px; opacity:0; transform:scale(.94) translateY(-6px);
  transform-origin:top right; transition:opacity .16s ease, transform .16s cubic-bezier(.22,.68,0,1); pointer-events:none;
}
.kebab-menu.show{opacity:1; transform:scale(1) translateY(0); pointer-events:auto;}
.kebab-menu-item{
  display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; border:none; background:none;
  border-radius:9px; font-size:13.5px; font-weight:600; color:var(--text); text-align:left; cursor:pointer; font-family:inherit;
}
.kebab-menu-item:hover{background:var(--surface-2);}
.kebab-menu-item:active{background:var(--surface-2); transform:scale(.97);}
.kebab-menu-item.danger{color:var(--coral);}
tbody tr:hover .row-actions{opacity:1; pointer-events:auto;}
.desc-cell{max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- MODAL ---------- */
.modal-backdrop{display:none; position:fixed; inset:0; background:rgba(6,10,12,.6); backdrop-filter:blur(3px); z-index:100; align-items:center; justify-content:center; padding:20px;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal.modal-wide{max-width:1160px;}
.modal.modal-wide.modal-etichette{max-width:580px;}
/* Popup "Etichette" della selezione multipla (openBulkEtichettaModal): è breve e non ha bisogno
   di scroll proprio, ma il menu a tendina dei suggerimenti (posizionato in absolute sotto il
   campo) veniva tagliato dall'overflow-y:auto ereditato da .modal. Lo disattiviamo qui. */
.modal.modal-tags-bulk{overflow:visible;}
.modal.modal-narrow{max-width:640px;}
@media(max-width:880px){
  /* Pannelli di Impostazioni (Categorie, Metodi, Etichette, ecc.): su mobile diventano una vera
     "pagina" a tutto schermo che scorre da destra, invece del popup centrale con sfondo scurito. */
  .modal-backdrop.settings-page-mode{background:transparent; backdrop-filter:none; align-items:stretch; justify-content:stretch; padding:0;}
  .modal-backdrop.settings-page-mode .modal-settings-page{
    width:100%; height:100%; max-width:100%; max-height:100%; border-radius:0; border:none; margin:0;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:-10px 0 30px rgba(0,0,0,.22);
    animation:settingsPageIn .3s cubic-bezier(.22,.68,0,1) both;
  }
  .modal-backdrop.settings-page-mode.closing .modal-settings-page{
    animation:settingsPageOut .22s cubic-bezier(.4,0,1,1) both;
  }
  .modal-settings-page .modal-body{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .modal-settings-page .modal-head{gap:14px; flex-shrink:0; padding:16px; padding-top:calc(16px + env(safe-area-inset-top, 0px)); justify-content:flex-start;}
  .modal-settings-page .modal-head h3{order:2; font-size:16px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .modal-settings-page .modal-head .close-x{order:1; width:30px; height:30px; background:var(--surface-2); border-radius:9px;}
  /* Pillola di selezione dentro l'header di pagina (Resoconto Etichetta, Cronologia Metodo):
     quando è vuota resta invisibile e non ruba spazio; quando compare, sostituisce il titolo. */
  .modal-sel-pill{order:2; display:flex; align-items:center; gap:8px; flex:1; min-width:0; animation:fadein .2s ease;}
  .modal-sel-pill:empty{display:none; animation:none;}
  .modal-head:has(.modal-sel-pill:not(:empty)) h3{display:none;}
  .modal-settings-page .modal-foot{display:none;}
  @keyframes settingsPageIn{from{transform:translateX(100%);} to{transform:translateX(0);}}
  @keyframes settingsPageOut{from{transform:translateX(0);} to{transform:translateX(100%);}}
  /* Apertura più morbida (scala+dissolvenza) per i popup "classici" rimasti su mobile */
  .modal-backdrop:not(.settings-page-mode) .modal{animation:modalPopIn .22s cubic-bezier(.22,.68,0,1) both;}
  .modal-backdrop.closing:not(.settings-page-mode) .modal{animation:modalPopOut .18s cubic-bezier(.4,0,1,1) both;}
  @keyframes modalPopOut{from{opacity:1; transform:scale(1) translateY(0);} to{opacity:0; transform:scale(.94) translateY(6px);}}
  @keyframes modalPopIn{from{opacity:0; transform:scale(.94) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
}

/* ---------- CHART MOBILE FIX ---------- */
.chart-wrap{position:relative; width:100%; height:260px; min-height:260px;}
.chart-wrap canvas{position:absolute; inset:0; width:100% !important; height:100% !important;}
.chart-wrap-sm{position:relative; width:100%; height:210px; min-height:210px;}
.chart-wrap-sm canvas{position:absolute; inset:0; width:100% !important; height:100% !important;}

/* ---------- SIDEBAR TOOLTIP (icone in fondo al menu, solo da collassata) ---------- */
.sidebar-toggle{position:relative;}
.sidebar-toggle[data-tooltip]::after{
  content:attr(data-tooltip); position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%) translateX(-4px);
  background:var(--surface-3); color:var(--text); border:1px solid var(--border); box-shadow:var(--shadow);
  padding:6px 10px; border-radius:7px; font-size:11.5px; font-weight:500; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .12s ease, transform .12s ease; z-index:120;
}
.sidebar.collapsed .sidebar-toggle[data-tooltip]:hover::after{opacity:1; transform:translateY(-50%) translateX(0);}

/* ---------- IMPORT EXCEL: pulsante ---------- */
.btn-import{background:linear-gradient(135deg, var(--mint-dim), var(--blue-dim)); border:1px solid var(--mint); color:var(--text); position:relative; overflow:hidden;}
html[data-theme="light"] .btn-import{color:#0B3A2E;}
.btn-import:hover{filter:brightness(1.08); border-color:var(--mint);}
.btn-import .spark{display:inline-block; animation:sparkle 1.8s ease-in-out infinite;}
@keyframes sparkle{ 0%,100%{opacity:.55; transform:scale(.9);} 50%{opacity:1; transform:scale(1.15);} }
.btn-label-short{display:none;}

/* ---------- IMPORT EXCEL: badge & toolbar modale ---------- */
.badge-count{background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;}
.badge-uncertain{background:rgba(245,185,92,.14); border:1px solid var(--amber); color:var(--amber); font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap; transition:background .3s ease, border-color .3s ease, color .3s ease;}
.badge-uncertain.all-clear{background:rgba(73,217,168,.14); border-color:var(--money-pos); color:var(--money-pos);}
.badge-liquidity{display:inline-block; background:var(--surface-3); color:var(--text-faint); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:5px 9px; border-radius:999px; opacity:.75; white-space:nowrap;}
.imp-toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 20px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap;}

/* ---------- IMPORT EXCEL: tabella ---------- */
.imp-table-wrap{position:relative;}
.imp-scroll{max-height:48vh; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin;}
.imp-scroll::-webkit-scrollbar{width:5px; height:5px;}
.imp-scroll::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
.imp-table-wrap::before, .imp-table-wrap::after{content:""; position:absolute; left:0; right:0; height:14px; pointer-events:none; z-index:5;}
.imp-table-wrap::before{top:0; background:linear-gradient(var(--surface), transparent);}
.imp-table-wrap::after{bottom:0; background:linear-gradient(transparent, var(--surface));}
.imp-scroll table{width:100%; border-collapse:collapse; table-layout:fixed;}
.imp-scroll thead{position:sticky; top:0; z-index:4; background:var(--surface);}
.imp-scroll thead th{background:var(--surface); box-shadow:0 1px 0 var(--border);}
.imp-scroll td{vertical-align:middle;}
.imp-causale{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--text-dim); cursor:help;}
tr.imp-row{transition:background .3s ease, opacity .2s ease;}
tr.imp-row-off{opacity:.4;}
tr.imp-row-warn{background:rgba(245,185,92,.08); border-left:3px solid var(--amber); transition:background .3s ease, border-left-color .3s ease;}
tr.imp-row-warn.imp-row-ok{background:transparent; border-left:3px solid transparent;}
.imp-warn-ic{margin-right:4px;}
.badge-paypal{display:inline-flex; align-items:center; gap:4px; background:rgba(95,168,255,.16); border:1px solid var(--blue); color:var(--blue); font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; margin-right:6px; cursor:help;}
.badge-paypal-multi{display:inline-flex; align-items:center; gap:4px; background:rgba(181,146,255,.16); border:1px solid var(--violet); color:var(--violet); font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; margin-right:6px; cursor:help;}
.mov-src-badge{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:7px; cursor:pointer; font-size:19px; line-height:1; vertical-align:middle;}
.mov-src-badge-r{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:7px; cursor:pointer; background:#FFFFFF; color:#000000; font-size:12px; font-weight:800; font-family:'Inter',sans-serif; border-radius:4px; vertical-align:middle; box-shadow:0 0 0 1px rgba(0,0,0,.18);}
.mov-metodo-badge{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:7px; cursor:pointer; color:#FFFFFF; font-size:10px; font-weight:800; font-family:'Inter',sans-serif; border-radius:4px; vertical-align:middle; box-shadow:0 0 0 1px rgba(0,0,0,.18);}
.mov-metodo-icon-img{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:7px; cursor:pointer; vertical-align:middle; border-radius:4px; object-fit:cover; box-shadow:0 0 0 1px rgba(0,0,0,.18);}
.mm-icon-preview{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:6px; overflow:hidden; flex:0 0 auto;}
.mm-icon-preview .mov-metodo-badge, .mm-icon-preview .mov-src-badge-r, .mm-icon-preview .mov-src-badge, .mm-icon-preview .mov-metodo-icon-img{width:30px; height:30px; font-size:13px; margin-right:0;}
@media(max-width:880px){
  /* Area toccabile allargata (~38px) per le piccole icone metodo/fonte pagamento nell'elenco
     Movimenti, senza ingrandirne l'aspetto visivo: un ::after invisibile espande solo la zona
     sensibile al tocco, restando sotto la soglia raccomandata di 44px ma molto più vicina. */
  .mov-src-badge, .mov-src-badge-r, .mov-metodo-badge, .mov-metodo-icon-img{ position:relative; }
  .mov-src-badge::after, .mov-src-badge-r::after, .mov-metodo-badge::after, .mov-metodo-icon-img::after{
    content:''; position:absolute; inset:-9px;
  }
  /* Tasto "×" di rimozione etichetta: stessa logica, area di tocco più generosa senza spostare
     il layout (padding compensato da un margine negativo di pari misura). */
  .etichetta-chip-remove{ padding:8px; margin:-8px -8px -8px 2px; }
}

/* ---------- IMPORT EXCEL: icona di sessione minimizzata ---------- */
.import-min-badge{position:fixed; right:22px; bottom:22px; z-index:150; display:none; align-items:center; justify-content:center;
  width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg, var(--mint-dim), var(--blue-dim)); border:1px solid var(--mint);
  color:var(--text); font-size:21px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.35); transition:transform .15s ease;}
html[data-theme="light"] .import-min-badge{color:#0B3A2E;}
.import-min-badge.show{display:flex;}
.import-min-badge:hover{transform:scale(1.06);}
.import-min-badge .import-min-dot{position:absolute; top:2px; right:2px; width:13px; height:13px; border-radius:50%; background:var(--amber); border:2px solid var(--surface); animation:importPulse 1.6s ease-in-out infinite;}
@keyframes importPulse{ 0%,100%{transform:scale(.85); opacity:1;} 50%{transform:scale(1.25); opacity:.6;} }
.import-spinner{display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; vertical-align:-2px; animation:spin .7s linear infinite; margin-right:2px;}
@keyframes spin{ to{transform:rotate(360deg);} }

/* checkbox custom animata */
.imp-checkbox{appearance:none; -webkit-appearance:none; width:19px; height:19px; border-radius:6px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; position:relative; flex-shrink:0; transition:border-color .15s, background .15s, transform .12s;}
.imp-checkbox:checked{background:var(--mint); border-color:var(--mint); transform:scale(1.12);}
.imp-checkbox:checked::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--mint-ink); font-weight:800;}
.imp-checkbox:active{transform:scale(.88);}

/* select/input "seamless" per la tabella import */
.imp-seamless{background:transparent; border:1px solid transparent; border-radius:7px; padding:6px 7px; font-size:12.5px; width:100%; max-width:100%; transition:background .15s, border-color .15s;}
.imp-seamless:hover{background:var(--surface-2);}
.imp-seamless:focus{background:var(--surface-2); border-color:var(--border); }

/* footer riepilogo import */
.imp-foot{flex-wrap:wrap; gap:10px;}
.imp-summary{display:flex; gap:16px; align-items:center; font-size:12.5px; color:var(--text-dim); margin-right:auto; flex-wrap:wrap;}
.imp-summary .pos{color:var(--money-pos); font-family:'JetBrains Mono',monospace; font-weight:600;}
.imp-summary .neg{color:var(--coral); font-family:'JetBrains Mono',monospace; font-weight:600;}
.imp-summary b{font-family:'JetBrains Mono',monospace;}

/* lampeggio righe appena importate nella tabella Movimenti — stessa animazione/colore di rowFlash sopra (tema accento) */

/* ---------- Regole import (Impostazioni) ---------- */
.imp-rule-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--border-soft); font-size:12.5px;}
.imp-rule-key{font-family:'JetBrains Mono',monospace; background:var(--surface-2); border-radius:6px; padding:3px 7px; font-size:11.5px; color:var(--text-dim); flex-shrink:0;}
.imp-rule-arrow{color:var(--text-faint); flex-shrink:0;}
.imp-rule-target{color:var(--text); flex:1;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-size:16px; font-weight:700;}
.modal-body{padding:20px; display:flex; flex-direction:column; gap:13px;}
.modal-foot{padding:16px 20px; border-top:1px solid var(--border-soft); display:flex; gap:10px; justify-content:flex-end;}
/* ==================== Form di inserimento dati: stile "slim" ====================
   Righe compatte con icona, senza riquadri attorno ai campi (solo un sottile divisore).
   Usato da Movimento, Abbonamento, intestazione Auto e Manutenzione — mobile e desktop. */
.modal-form .modal-head{padding:16px 16px 12px;}
.modal-form .modal-body{padding:0 16px 14px; gap:0;}
.modal-form .modal-foot{padding:12px 16px; gap:8px;}
.slim-switch{display:flex; gap:4px; background:var(--surface-2); border-radius:999px; padding:3px; margin:2px auto 14px; width:fit-content;}
.slim-switch-opt{padding:7px 20px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer; transition:background .15s ease, color .15s ease; user-select:none;}
.slim-switch-opt.active{background:var(--mint-dim); color:var(--mint);}
.slim-switch-opt.uscita.active{background:var(--coral-dim); color:var(--coral);}
.slim-row{display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid var(--border-soft);}
.date-quick-chips{display:flex; gap:6px; flex-shrink:0;}
.date-quick-chip{background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:999px; cursor:pointer; white-space:nowrap;}
.date-quick-chip:hover{color:var(--text); border-color:var(--text-faint);}
.date-quick-chip:active{transform:scale(.94);}
.slim-row:last-child{border-bottom:none;}
.slim-row-pair{display:flex; gap:16px; padding:10px 2px; border-bottom:1px solid var(--border-soft);}
.slim-row-pair:last-child{border-bottom:none;}
.slim-half{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.slim-icon{width:26px; height:26px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
.slim-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
.mimporto-display{display:none;}
@media(max-width:880px){
  /* Sul campo Importo del form Movimento, la tastiera di sistema è sostituita da un tastierino
     dedicato: l'input reale resta nel DOM (per la logica di salvataggio) ma invisibile, al suo
     posto si vede questo display con importo formattato, che apre il tastierino al tocco. */
  .slim-amount #mImporto{display:none;}
  .mimporto-display{
    display:block; font-family:'JetBrains Mono',monospace; font-size:21px; font-weight:700;
    color:var(--text); padding:5px 0; cursor:pointer; letter-spacing:-.01em;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
}
.importo-keypad-backdrop{

  align-items:flex-end; justify-content:center;
}
.importo-keypad-backdrop.show{display:flex;}
.importo-keypad{
  width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.3);
  animation:importoKeypadIn .22s cubic-bezier(.22,.68,0,1) both;
}
@keyframes importoKeypadIn{from{transform:translateY(100%);} to{transform:translateY(0);}}
.importo-keypad-value{

  padding:6px 0 16px; color:var(--text);
}
.importo-keypad-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
.importo-keypad-grid button{
  background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
  font-size:21px; font-weight:700; color:var(--text); padding:15px 0; cursor:pointer;
}
.importo-keypad-grid button:active{background:var(--surface-3); transform:scale(.96);}
.importo-keypad-grid .ik-comma{color:var(--text-dim);}
.ik-done-full{
  width:100%; margin-top:9px; padding:15px 0; border-radius:14px; border:none; cursor:pointer;

  display:flex; align-items:center; justify-content:center; gap:8px;
}
