  const c = causale || '';
  for(const km of KNOWN_MERCHANTS){ if(km.re.test(c)) return km.name; }
  return null;
}
function guessMerchantNote(causale){
  return extractKnownMerchant(causale) || extractPosMerchant(causale);
}

/* Motore di riconoscimento condiviso (regole personalizzate + regole predefinite + fallback), usato sia per
   l'import UniCredit sia per l'import Revolut: entrambi ragionano su una "causale/descrizione" testuale e un importo. */
function guessCategoryFromRules(causale, importo){
  const c = (causale||'').toUpperCase();
  const ent = importo > 0;

  const key = extractMerchantKey(causale);
  const customRules = loadImportRules();
  if(customRules[key] && customRules[key].categoria){
    return { categoria:customRules[key].categoria, dettaglio:customRules[key].dettaglio, nota:guessMerchantNote(causale), confidenza:'alta', _fromCustomRule:true };
  }

  for(const rule of BUILTIN_IMPORT_RULES){
    if(rule.test(c, importo, ent)){
      return {
        categoria: rule.categoria,
        dettaglio: rule.dettaglio,
        nota: rule.nota ? rule.nota(c) : guessMerchantNote(causale),
        confidenza: rule.confidenza
      };
    }
  }
  if(ent) return { categoria:'Altre entrate', dettaglio:'Varie', nota:guessMerchantNote(causale), confidenza:'bassa' };
  return { categoria:'Acquisti', dettaglio:'Vari', nota:guessMerchantNote(causale), confidenza:'bassa' };
}
function guessImportRow(causale, importo){
  if(isRefundEntrata(causale, importo)){
    return Object.assign({liquidita:false, _autoRimborso:true}, guessCategoryFromRules(causale, importo));
  }
  if(/REVOLUT|SATISPAY|GIROCONTO|RICARICA|STORNO/i.test(causale||'')){
    return { categoria:null, dettaglio:null, nota:null, confidenza:'liquidita', liquidita:true };
  }
  return Object.assign({liquidita:false}, guessCategoryFromRules(causale, importo));
}

function excelDateToISO(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){
    const d = new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  if(typeof v === 'string'){
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(v.trim());
    if(m){ let [,dd,mm,yy]=m; if(yy.length===2) yy='20'+yy; return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`; }
    const m2 = /^(\d{4})-(\d{2})-(\d{2})/.exec(v.trim());
    if(m2) return v.trim().slice(0,10);
  }
  return null;
}

function parseUnicreditRows(rows){
  let headerIdx = -1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r = (rows[i]||[]).map(x=>String(x||'').toLowerCase());
    if(r.some(c=>c.includes('causale')) && r.some(c=>c.includes('descrizione')) && r.some(c=>c.includes('importo'))){
      headerIdx = i; break;
    }
  }
  if(headerIdx===-1) return [];
  const header = rows[headerIdx].map(x=>String(x||'').toLowerCase());
  let idxData = header.findIndex(h=>h.includes('data valuta'));
  if(idxData===-1) idxData = header.findIndex(h=>h.includes('data registrazione'));
  if(idxData===-1) idxData = header.findIndex(h=>h.includes('data'));
  const idxDescr = header.findIndex(h=>h.includes('descrizione'));
  const idxImporto = header.findIndex(h=>h.includes('importo'));
  if(idxData===-1 || idxDescr===-1 || idxImporto===-1) return [];

  const out = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.length) continue;
    const descr = r[idxDescr];
    const importoRaw = r[idxImporto];
    if(descr==null && importoRaw==null) continue;
    const importo = parseFloat(String(importoRaw).replace(',','.'));
    if(isNaN(importo) || importo===0) continue; // scarta le righe a importo zero (es. COMPETENZE)
    const dataISO = excelDateToISO(r[idxData]);
    out.push({ data:dataISO, causale:String(descr||'').trim(), importo });
  }
  return out;
}

/* ---- Import incrociato: parsing CSV PayPal ---- */
function parseLocaleAmount(str){
  if(str===null || str===undefined) return NaN;
  let s = String(str).trim();
  if(!s) return NaN;
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  if(hasComma && hasDot){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(hasComma){
    s = s.replace(',', '.');
  }
  return parseFloat(s);
}
function parsePaypalDateToISO(v){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(String(v||'').trim());
  if(!m) return null;
  let [,dd,mm,yy] = m;
  if(yy.length===2) yy = '20'+yy;
  return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
}
function parseCSVLine(line){
  // parser CSV minimale ma robusto ai campi tra virgolette contenenti virgole
  const out = [];
  let cur = ''; let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch==='"'){
        if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false;
      } else cur += ch;
    } else {
      if(ch==='"') inQ = true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}
const PAYPAL_COL_ALIASES = { data:['data','date'], nome:['nome','name'], importo:['lordo','gross'] };
function findPaypalCol(headerLower, aliases){
  for(const a of aliases){
    const idx = headerLower.findIndex(h=> h===a || h.startsWith(a));
    if(idx!==-1) return idx;
  }
  return -1;
}
function parsePaypalCSV(text){
  if(!text) return [];
  const clean = text.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const header = parseCSVLine(lines[0]).map(h=>h.toLowerCase().trim());
  const idxData = findPaypalCol(header, PAYPAL_COL_ALIASES.data);
  const idxNome = findPaypalCol(header, PAYPAL_COL_ALIASES.nome);
  const idxImporto = findPaypalCol(header, PAYPAL_COL_ALIASES.importo);
  if(idxData===-1 || idxImporto===-1) return [];
  const out = [];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    if(!cols.length) continue;
    const dataISO = parsePaypalDateToISO(cols[idxData]);
    const importo = parseLocaleAmount(cols[idxImporto]);
    if(!dataISO || isNaN(importo) || importo>=0) continue; // teniamo solo i pagamenti effettivi (importo negativo)
    out.push({ data:dataISO, nome:(idxNome!==-1?String(cols[idxNome]||'').trim():'') || 'Esercente sconosciuto', importo });
  }
  return out;
}
function normalizePaypalName(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function isGenericPaypalCausale(causale){ return /PAYPAL/i.test(causale||''); }
function findPaypalMatches(row, paypalRows){
  if(!paypalRows || !paypalRows.length || !row.data) return [];
  const rowDate = new Date(row.data+'T00:00:00');
  if(isNaN(rowDate)) return [];
  return paypalRows.filter(p=>{
    if(Math.abs(p.importo - row.importo) > PAYPAL_AMOUNT_TOLERANCE) return false;
    const pDate = new Date(p.data+'T00:00:00');
    if(isNaN(pDate)) return false;
    const diffDays = Math.round((rowDate - pDate)/86400000);
    return diffDays >= -PAYPAL_MATCH_DAYS_AFTER && diffDays <= PAYPAL_MATCH_DAYS_BEFORE;
  });
}

/* ---- Import CSV Revolut (movimenti a sé stanti, non incrociati con UniCredit) ----
   Formato dell'export Revolut (in inglese o italiano, a seconda della lingua impostata nell'app):
   Type/Tipo, Product/Prodotto, Started Date/Data di inizio, Completed Date/Data di completamento,
   Description/Descrizione, Amount/Importo, Fee/Costo, Currency/Valuta, State, Balance/Saldo
   (la colonna "State" a volte resta in inglese anche nell'export italiano: è un'incoerenza nota di Revolut). */
const REVOLUT_COL_ALIASES = {
  tipo:['type','tipo'],
  descrizione:['description','descrizione'],
  importo:['amount','importo'],
  stato:['state','stato'],
  dataCompletamento:['completed date','data di completamento'],
  dataInizio:['started date','data di inizio'],
};
function findRevolutCol(headerLower, aliases){
  for(const a of aliases){
    const idx = headerLower.findIndex(h=> h===a || h.startsWith(a));
    if(idx!==-1) return idx;
  }
  return -1;
}
function parseRevolutDateToISO(v){
  const s = String(v||'').trim();
  if(!s) return null;
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s);
  if(m){ let [,dd,mm,yy]=m; if(yy.length===2) yy='20'+yy; return `${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`; }
  return null;
}
// Solo questi stati sono transazioni effettivamente avvenute; qualsiasi altro valore (in sospeso, fallita,
// annullata/"OPERAZIONE ANNULLATA", rifiutata, ecc., in inglese o italiano) viene scartato.
const REVOLUT_COMPLETED_STATES = new Set(['COMPLETED','COMPLETATO','COMPLETATA']);
// Tipi Revolut che rappresentano solo uno spostamento di denaro interno (ricarica dal conto/carta collegata,
// cambio valuta): vanno trattati come "liquidità" esattamente come i bonifici UniCredit -> Revolut, per non
// contare due volte lo stesso denaro. Il match è per prefisso e case-insensitive, in inglese o italiano
// ("Ricarica", "TOPUP", "Cambio valuta", "EXCHANGE", ...).
const REVOLUT_LIQUIDITY_TYPE_RE = /^(TOPUP|RICARIC|EXCHANGE|CAMBIO)/i;
// Alcuni movimenti Revolut verso/da persone sono in realtà giroconti verso i tuoi stessi altri conti
// (Revolut li classifica come "Pagamento"/"Ricarica" verso una persona, ma non sono spesa/entrata reale):
// vanno trattati come liquidità anch'essi, indipendentemente dal Tipo.
const REVOLUT_SELF_TRANSFER_RE = /RAITERI\s+ANDREA|ANDREA\s+RAITERI/i;
function parseRevolutCSV(text){
  if(!text) return [];
  const clean = text.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const header = parseCSVLine(lines[0]).map(h=>h.toLowerCase().trim());
  const idxTipo = findRevolutCol(header, REVOLUT_COL_ALIASES.tipo);
  const idxDataCompletamento = findRevolutCol(header, REVOLUT_COL_ALIASES.dataCompletamento);
  const idxDataInizio = findRevolutCol(header, REVOLUT_COL_ALIASES.dataInizio);
  const idxDescr = findRevolutCol(header, REVOLUT_COL_ALIASES.descrizione);
  const idxImporto = findRevolutCol(header, REVOLUT_COL_ALIASES.importo);
  const idxStato = findRevolutCol(header, REVOLUT_COL_ALIASES.stato);
  if((idxDataCompletamento===-1 && idxDataInizio===-1) || idxDescr===-1 || idxImporto===-1) return [];
  const out = [];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    if(!cols.length) continue;
    const stato = idxStato!==-1 ? String(cols[idxStato]||'').trim().toUpperCase() : 'COMPLETED';
    if(stato && !REVOLUT_COMPLETED_STATES.has(stato)) continue; // scarta transazioni pending/fallite/annullate
    // Preferisce la data di completamento; se assente per questa riga, usa la data di inizio.
    const dataISO = (idxDataCompletamento!==-1 && parseRevolutDateToISO(cols[idxDataCompletamento]))
      || (idxDataInizio!==-1 && parseRevolutDateToISO(cols[idxDataInizio]));
    const importo = parseLocaleAmount(cols[idxImporto]);
    if(!dataISO || isNaN(importo) || importo===0) continue;
    const tipo = idxTipo!==-1 ? String(cols[idxTipo]||'').trim() : '';
    out.push({ data:dataISO, causale:String(cols[idxDescr]||'').trim(), importo, tipo });
  }
  return out;
}

function readFileAsArrayBuffer(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsArrayBuffer(file);
  });
}
function readFileAsText(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsText(file, 'UTF-8');
  });
}

async function startImport(){
  const ucFile = document.getElementById('impFileUnicredit').files[0];
  const ppFile = document.getElementById('impFilePaypal').files[0];
  const revFile = document.getElementById('impFileRevolut').files[0];
  if(!ucFile && !revFile){ toast('Seleziona almeno un file da importare (UniCredit e/o Revolut)'); return; }

  // Il parsing di Excel/CSV è l'unica operazione dell'app con un'attesa reale percepibile:
  // il pulsante mostra uno stato di caricamento finché non finisce, invece di lasciare la
  // finestra ferma senza nessun segnale che l'app sta effettivamente lavorando.
  const continueBtn = document.getElementById('impFilesContinue');
  let btnOriginalHtml = null;
  if(continueBtn){
    btnOriginalHtml = continueBtn.innerHTML;
    continueBtn.disabled = true;
    continueBtn.innerHTML = `<span class="import-spinner"></span> Elaborazione…`;
  }

  let candidates = [];
  const warnings = [];

  if(ucFile){
    try{
      const buf = await readFileAsArrayBuffer(ucFile);
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
      const parsed = parseUnicreditRows(rows);
      if(!parsed.length){
        warnings.push('Nessun movimento riconosciuto nel file UniCredit');
      } else {
        let paypalRows = [];
        if(ppFile){
          try{
            paypalRows = parsePaypalCSV(await readFileAsText(ppFile));
          }catch(err){
            console.error(err);
            warnings.push("CSV PayPal non leggibile, proseguito senza abbinamenti");
          }
        }
        candidates = candidates.concat(buildUnicreditCandidates(parsed, paypalRows));
      }
    }catch(err){
      console.error(err);
      warnings.push('Errore nella lettura del file UniCredit');
    }
  }

  if(revFile){
    try{
      const parsed = parseRevolutCSV(await readFileAsText(revFile));
      if(!parsed.length){
        warnings.push('Nessun movimento riconosciuto nel file Revolut');
      } else {
        candidates = candidates.concat(buildRevolutCandidates(parsed));
      }
    }catch(err){
      console.error(err);
      warnings.push('Errore nella lettura del file Revolut');
    }
  }

  if(!candidates.length){
    if(continueBtn){ continueBtn.disabled = false; continueBtn.innerHTML = btnOriginalHtml; }
    toast(warnings[0] || 'Nessun movimento riconosciuto nei file selezionati');
    return;
  }
  closeModal();
  openImportPreviewModal(candidates);
  if(warnings.length) toast(warnings.join(' — '));
}

function existingImportFingerprints(){
  const set = new Set();
  DB.movimenti.forEach(m=>{ if(m._impFp) set.add(m._impFp); });
  return set;
}
function fingerprintFor(data, importo, causale){
  return `${data}|${importo}|${(causale||'').slice(0,40)}`;
}

function buildUnicreditCandidates(parsedRows, paypalRows){
  const existingFp = existingImportFingerprints();
  const rules = loadImportRules();
  return parsedRows.map((r,i)=>{
    const fp = fingerprintFor(r.data, r.importo, r.causale);
    const dup = existingFp.has(fp);
    const g = guessImportRow(r.causale, r.importo);

    let confidenza = g.confidenza;
    if(!g.liquidita && confidenza==='alta' && Math.abs(r.importo) >= IMPORT_UNCERTAIN_THRESHOLD) confidenza = 'media';

    let categoria = g.categoria, dettaglio = g.dettaglio, note = g.nota || null;
    let etichette = g._autoRimborso ? ['#rimborso'] : [];
    let paypalMatched = false, paypalOptions = null;
    if(!g.liquidita && paypalRows && paypalRows.length && isGenericPaypalCausale(r.causale)){
      const matches = findPaypalMatches(r, paypalRows);
      if(matches.length===1){
        const nome = matches[0].nome;
        note = nome;
        paypalMatched = true;
        confidenza = 'alta';
        const key = 'paypal:'+normalizePaypalName(nome);
        if(rules[key] && rules[key].categoria){
          categoria = rules[key].categoria;
          dettaglio = rules[key].dettaglio;
        }
      } else if(matches.length>1){
        paypalOptions = matches.map(m=>m.nome);
      }
    }

    return {
      _tmpId: 'imp_'+i,
      data: r.data,
      causale: r.causale,
      importo: r.importo,
      fp,
      duplicato: dup,
      categoria,
      dettaglio,
      note,
      confidenza,
      liquidita: !!g.liquidita,
      selected: !g.liquidita && !dup,
      reviewed: false,
      paypalMatched,
      paypalOptions,
      fonteSource: 'unicredit',
      etichette,
    };
  });
}

function buildRevolutCandidates(parsedRows){
  const existingFp = existingImportFingerprints();
  return parsedRows.map((r,i)=>{
    const fp = fingerprintFor(r.data, r.importo, r.causale)+'|revolut';
    const dup = existingFp.has(fp);
    const isRefund = isRefundEntrata(r.causale, r.importo);
    const isLiquidita = !isRefund && (REVOLUT_LIQUIDITY_TYPE_RE.test(r.tipo) || REVOLUT_SELF_TRANSFER_RE.test(r.causale));

    let categoria = null, dettaglio = null, note = null, confidenza = 'liquidita', etichette = [];
    if(!isLiquidita){
      const g = guessCategoryFromRules(r.causale, r.importo);
      categoria = g.categoria; dettaglio = g.dettaglio; note = g.nota || null; confidenza = g.confidenza;
      if(confidenza==='alta' && Math.abs(r.importo) >= IMPORT_UNCERTAIN_THRESHOLD) confidenza = 'media';
      if(isRefund) etichette = ['#rimborso'];
    }

    return {
      _tmpId: 'rev_'+i,
      data: r.data,
      causale: r.causale,
      importo: r.importo,
      fp,
      duplicato: dup,
      categoria,
      dettaglio,
      note,
      confidenza,
      liquidita: isLiquidita,
      selected: !isLiquidita && !dup,
      reviewed: false,
      paypalMatched: false,
      paypalOptions: null,
      fonteSource: 'revolut',
      etichette,
    };
  });
}

function catOptionsHtmlImport(tipo, selected){
  const cats = tipo==='entrata' ? DB.categorieEntrate : DB.categorieUscite;
  let html = `<option value="">— Categoria —</option>`;
  html += cats.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
  return html;
}
function detOptionsHtmlImport(categoria, selected){
  const subs = subcategorieFor(categoria);
  let html = `<option value="">—</option>`;
  html += subs.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('');
  if(selected && !subs.includes(selected)) html += `<option value="${esc(selected)}" selected>${esc(selected)}</option>`;
  return html;
}

    const rowCls = ['imp-row'];
    if(!cand.selected) rowCls.push('imp-row-off');
    if(needsReview) rowCls.push('imp-row-warn'); else rowCls.push('imp-row-ok');

      <td class="check-col"><input type="checkbox" class="imp-checkbox impCheck" data-tmp="${cand._tmpId}" ${cand.selected?'checked':''} ${cand.liquidita?'disabled':''}></td>
      <td class="mono" style="white-space:nowrap;font-size:12.5px;">${fmtDate(cand.data)}${cand.duplicato?'<br><span style="color:var(--amber);font-size:10px;">possibile doppione</span>':''}</td>

      <td>${cand.liquidita
          ? `<span class="badge-liquidity">Spostamento liquidità / Ricarica</span>`
          : `<select class="imp-seamless impCat" data-tmp="${cand._tmpId}">${catOptionsHtmlImport(tipo, cand.categoria)}</select>`}</td>
      <td>${cand.liquidita ? '' : `<select class="imp-seamless impDet" data-tmp="${cand._tmpId}">${detOptionsHtmlImport(cand.categoria, cand.dettaglio)}</select>`}</td>
      <td>${cand.liquidita ? '' : (cand.paypalOptions
          ? `<select class="imp-seamless impPaypalChoice" data-tmp="${cand._tmpId}">
              <option value="">— Scegli abbinamento PayPal —</option>
              ${cand.paypalOptions.map(n=>`<option value="${esc(n)}" ${cand.note===n?'selected':''}>${esc(n)}</option>`).join('')}

      tr.classList.remove('imp-row-warn'); tr.classList.add('imp-row-ok');

  tbody.querySelectorAll('.impNote').forEach(inp=>{

  tbody.querySelectorAll('.impEtichette').forEach(inp=>{

function updateImportSummary(){
  const selected = importCandidates.filter(c=>c.selected);
  const entrate = selected.filter(c=>c.importo>0).reduce((s,c)=>s+c.importo,0);
  const uscite = selected.filter(c=>c.importo<0).reduce((s,c)=>s+c.importo,0);
  const selCountEl = document.getElementById('impSelCount');
  if(selCountEl) selCountEl.textContent = selected.length;
  const sumEntrateEl = document.getElementById('impSumEntrate');
  if(sumEntrateEl) sumEntrateEl.textContent = '+' + entrate.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
  const sumUsciteEl = document.getElementById('impSumUscite');
  if(sumUsciteEl) sumUsciteEl.textContent = uscite.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';

  const uncertain = importUncertainCount();
  const badge = document.getElementById('impUncertainBadge');
  if(badge){
    if(uncertain>0){
      badge.innerHTML = `${ico('alertTriangle',13)} ${uncertain} da verificare`;
      badge.classList.remove('all-clear');
    } else {
      badge.innerHTML = `${ico('check',13)} Tutto verificato`;
      badge.classList.add('all-clear');
    }
  }
}

function confirmImport(){
  const toImport = importCandidates.filter(c=>c.selected);
  if(!toImport.length){ toast('Nessun movimento selezionato'); return; }
  const missing = toImport.filter(c=>!c.liquidita && !c.categoria);
  if(missing.length){
    toast(`Assegna una categoria a tutti i movimenti selezionati (${missing.length} mancanti)`);
    return;
  }
  const newIds = [];
  toImport.forEach(c=>{
    const id = uid('m');
    newIds.push(id);
    let fonteImport = null;
    if(c.fonteSource==='revolut'){
      fonteImport = 'revolut';
    } else if(!c.liquidita){
      if(c.paypalMatched) fonteImport = 'paypal_confirmato';
      else if(!c.reviewed && c.confidenza!=='alta') fonteImport = 'non_verificato';
    }
    // Precompila anche il metodo di pagamento unificato, coerente con fonteImport, così i movimenti
    // importati da Revolut/PayPal risultano già assegnati al metodo giusto (restano comunque modificabili).
    let metodoPagamento = null;
    if(fonteImport==='revolut') metodoPagamento = 'Revolut';
    else if(fonteImport==='paypal_confirmato') metodoPagamento = 'PayPal';
    const etichette = Array.isArray(c.etichette) ? c.etichette.filter(Boolean) : [];
    etichette.forEach(t=>{ if(!DB.etichette.includes(t)) DB.etichette.push(t); });
    DB.movimenti.push({
      id, data:c.data, categoria:c.categoria, descrizione:c.dettaglio,
      entrate: c.importo>0 ? c.importo : null,
      uscite: c.importo<0 ? Math.abs(c.importo) : null,
      note: c.note || null,
      etichette: etichette.length ? etichette : undefined,
      _impFp: c.fp,
      metodoPagamento,
      ...(fonteImport ? {fonteImport} : {})
    });
    // Auto-apprendimento: se l'utente ha corretto manualmente una riga a bassa/media confidenza, salva la regola
    if(c.reviewed && c.categoria){
      const key = extractMerchantKey(c.causale);
      learnImportRule(key, c.categoria, c.dettaglio);
    }
    // Auto-apprendimento specifico PayPal: memorizza l'abbinamento nome esercente -> categoria/dettaglio
    if(c.paypalMatched && c.note && c.categoria){
      const pkey = 'paypal:'+normalizePaypalName(c.note);
      learnImportRule(pkey, c.categoria, c.dettaglio);
    }
  });
  saveDB();
  endImportSession();
  closeModal();
  toast(`${toImport.length} movimenti importati con successo e regole aggiornate!`);
  // Espande solo gli anni in cui sono finiti i nuovi movimenti (l'app parte comunque con gli anni compressi)
  movExpandedYears = movExpandedYears || new Set();
  newIds.forEach(id=>{
    const m = DB.movimenti.find(x=>x.id===id);
    if(m && m.data) movExpandedYears.add(m.data.slice(0,4));
  });
  renderMovimenti();
  setTimeout(()=>{
    newIds.forEach(id=>{
      const tr = document.querySelector(`tr[data-id="${id}"]`);
      if(tr) tr.classList.add('row-flash');
    });
  }, 60);
}

const LS_GDRIVE_CLIENT_ID = 'ledger_gdrive_client_id_v1';
const LS_GDRIVE_CONNECTED = 'ledger_gdrive_connected_v1';
const LS_GDRIVE_FOLDER_ID = 'ledger_gdrive_folder_id_v1';
const LS_GDRIVE_FILE_ID = 'ledger_gdrive_file_id_v1';
const LS_GDRIVE_LAST_SYNC = 'ledger_gdrive_last_sync_v1';
const GDRIVE_FOLDER_NAME = 'Gestionale Finance Hub — Dati';
const GDRIVE_FILE_NAME = 'gestionale-db.json';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

let gdriveTokenClient = null;
let gdriveAccessToken = null;
let gdrivePushTimer = null;
let gdriveStatus = 'disconnesso'; // disconnesso | connesso | sync | riconnetti | errore

function gdriveClientId(){ return localStorage.getItem(LS_GDRIVE_CLIENT_ID) || ''; }
function gdriveIsConnected(){ return localStorage.getItem(LS_GDRIVE_CONNECTED)==='1'; }

function gdriveEnsureTokenClient(){
  if(gdriveTokenClient) return gdriveTokenClient;
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
  const clientId = gdriveClientId();
  if(!clientId) return null;
  gdriveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: GDRIVE_SCOPE,
    callback: (resp)=>{
      if(resp && resp.access_token){
        gdriveAccessToken = resp.access_token;
        localStorage.setItem(LS_GDRIVE_CONNECTED,'1');
        gdriveOnConnected();
      } else {
        gdriveSetStatus('riconnetti');
      }
    }
  });
  return gdriveTokenClient;
}

function gdriveConnect(){
  const clientId = gdriveClientId();
  if(!clientId){ toast('Inserisci prima il Client ID di Google'); return; }
  const tc = gdriveEnsureTokenClient();
  if(!tc){ toast('Libreria Google non ancora pronta, riprova tra un istante'); return; }
  tc.requestAccessToken({ prompt: 'consent' });
}
function gdriveSilentReconnect(){
  if(!gdriveIsConnected()) return;
  const tc = gdriveEnsureTokenClient();
  if(!tc) return;
  tc.requestAccessToken({ prompt: '' });
}
function gdriveDisconnect(){
  if(gdriveAccessToken && typeof google!=='undefined' && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(gdriveAccessToken, ()=>{}); }catch(e){}
  }
  gdriveAccessToken = null;
  gdriveTokenClient = null;
  localStorage.removeItem(LS_GDRIVE_CONNECTED);
  localStorage.removeItem(LS_GDRIVE_FOLDER_ID);
  localStorage.removeItem(LS_GDRIVE_FILE_ID);
  gdriveSetStatus('disconnesso');
  toast('Google Drive disconnesso');
  if(currentView==='impostazioni') renderImpostazioni();
}

async function gdriveApiFetch(url, options={}){
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer '+gdriveAccessToken });
  const res = await fetch(url, options);
  if(!res.ok){
    const errText = await res.text().catch(()=>'');
    throw new Error('Drive API error '+res.status+': '+errText);
  }
  return res;
}

async function gdriveEnsureFolder(){
  let folderId = localStorage.getItem(LS_GDRIVE_FOLDER_ID);
  if(folderId) return folderId;
  const q = encodeURIComponent(`name='${GDRIVE_FOLDER_NAME.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await gdriveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length){
    folderId = data.files[0].id;
  } else {
    const createRes = await gdriveApiFetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: GDRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' })
    });
    folderId = (await createRes.json()).id;
  }
  localStorage.setItem(LS_GDRIVE_FOLDER_ID, folderId);
  return folderId;
}
async function gdriveCreateFile(folderId){
  const metadata = { name: GDRIVE_FILE_NAME, parents:[folderId], mimeType:'application/json' };
  const boundary = '-------314159265358979323846gestionale';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(DB)}\r\n`+
    `--${boundary}--`;
  const res = await gdriveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST', headers:{'Content-Type': `multipart/related; boundary=${boundary}`}, body
  });
  return (await res.json()).id;
}
async function gdriveEnsureFile(folderId){
  let fileId = localStorage.getItem(LS_GDRIVE_FILE_ID);
  if(fileId) return fileId;
  const q = encodeURIComponent(`name='${GDRIVE_FILE_NAME}' and '${folderId}' in parents and trashed=false`);
  const res = await gdriveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  fileId = (data.files && data.files.length) ? data.files[0].id : await gdriveCreateFile(folderId);
  localStorage.setItem(LS_GDRIVE_FILE_ID, fileId);
  return fileId;
}

async function gdrivePushNow(){
  if(!gdriveIsConnected() || !gdriveAccessToken) return;
  try{
    gdriveSetStatus('sync');
    const folderId = await gdriveEnsureFolder();
    const fileId = await gdriveEnsureFile(folderId);
    await gdriveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(DB)
    });
    localStorage.setItem(LS_GDRIVE_LAST_SYNC, String(Date.now()));
    gdriveSetStatus('connesso');
  }catch(e){ console.error(e); gdriveSetStatus('errore'); }
}
function gdriveSchedulePush(){
  if(!gdriveIsConnected() || !gdriveAccessToken) return;
  clearTimeout(gdrivePushTimer);
  gdrivePushTimer = setTimeout(gdrivePushNow, 1500);
}
async function gdrivePullAndMerge(){
  if(!gdriveIsConnected() || !gdriveAccessToken) return;
  try{
    gdriveSetStatus('sync');
    const folderId = await gdriveEnsureFolder();
    const fileId = await gdriveEnsureFile(folderId);
    const res = await gdriveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const text = await res.text();
    if(text && text.trim()){
      const remote = JSON.parse(text);
      const remoteUpdated = remote._syncMeta && remote._syncMeta.updatedAt;
      const localUpdated = DB._syncMeta && DB._syncMeta.updatedAt;
      if(remoteUpdated && (!localUpdated || remoteUpdated > localUpdated)){
        DB = remote;
        ensureMetodiPagamento(); ensureEtichette(); ensureCategorieColori(); ensureCategorieIcone(); ensureCategorieAbbonamenti(); ensureLinkUtiliGenerici(); ensureWelfare(); ensurePianificati(); ensureAutoLinkUtili();
        saveDB();
        toast('Dati aggiornati da Google Drive');
        renderCurrentView();
      } else {
        await gdrivePushNow();
      }
    } else {
      await gdrivePushNow();
    }
    localStorage.setItem(LS_GDRIVE_LAST_SYNC, String(Date.now()));
    gdriveSetStatus('connesso');
  }catch(e){ console.error(e); gdriveSetStatus('errore'); }
}
function gdriveOnConnected(){
  gdriveSetStatus('connesso');
  gdrivePullAndMerge();
  if(currentView==='impostazioni') renderImpostazioni();
}
function gdriveSetStatus(s){
  gdriveStatus = s;
  renderGDriveStatus();
}
function renderGDriveStatus(){
  const el = document.getElementById('gdriveStatusLine');
  if(!el) return;
  const lastSync = parseInt(localStorage.getItem(LS_GDRIVE_LAST_SYNC)||'0',10);
  const lastSyncTxt = lastSync ? new Date(lastSync).toLocaleString('it-IT') : 'mai';
  const dotColor = { disconnesso:'#8a8f98', connesso:'#49D9A8', sync:'#5FA8FF', riconnetti:'#F5B95C', errore:'#FF7A66' }[gdriveStatus] || '#8a8f98';
  const map = {
    disconnesso: 'Non connesso',
    connesso: 'Connesso — ultimo sync: '+lastSyncTxt,
    sync: 'Sincronizzazione in corso…',
    riconnetti: 'Sessione scaduta — clicca "Connetti" per riautorizzare',
    errore: 'Errore di sincronizzazione — riprova (controlla il Client ID e i permessi)'
  };
  const syncIcon = gdriveStatus==='sync' ? ico('refreshCw',13) : '';
  el.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotColor};margin-right:6px;vertical-align:1px;"></span>${syncIcon}${map[gdriveStatus] || ''}`;
}
function gdriveInitOnLoad(){
  if(!gdriveIsConnected()) return;
  gdriveSetStatus('sync');
  const tryInit = ()=>{
    const tc = gdriveEnsureTokenClient();
    if(tc) gdriveSilentReconnect();
    else setTimeout(tryInit, 300);
  };
  tryInit();
}

/* Etichette che escludono un movimento dai totali/aggregazioni di Entrate e Uscite (Dashboard e Ricerca),
   pur lasciandolo regolarmente visibile nello storico della scheda Movimenti. */
const TOTALS_EXCLUDED_TAGS = ['rimborso', 'rimborsato'];
function normalizeEtichettaForMatch(t){
  return String(t||'').trim().toLowerCase().replace(/^#/, '');
}
function isExcludedFromTotals(m){
  return Array.isArray(m.etichette) && m.etichette.some(t=>TOTALS_EXCLUDED_TAGS.includes(normalizeEtichettaForMatch(t)));
}
function movimentiForTotals(list){
  return (list || DB.movimenti).filter(m=>!isExcludedFromTotals(m));
}
let searchFilter = { anni:[], mesi:[], min:'', max:'', dataMin:'', dataMax:'', testo:'', note:'', etichette:[], multi:false, tipo:'tutti', metodo:'tutti' };
/* Filtri rapidi di data in Ricerca: alternativa via pulsante ai pill Anni/Mesi per intervalli che
   non coincidono con un mese/anno intero (es. "ultimi 30 giorni"). Impostano searchFilter.dataMin/
   dataMax e si escludono a vicenda con la selezione Anni/Mesi (attivare l'uno svuota l'altro). */
let searchQuickRangeActive = null;
const SEARCH_QUICK_RANGES = [
  { id:'30gg', label:'Ultimi 30gg' },
  { id:'mese', label:'Mese corrente' },
  { id:'trim', label:'Trimestre corrente' },
  { id:'anno', label:'Anno corrente' }
];
function computeQuickDateRange(id){
  const now = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const toStr = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if(id==='30gg'){
    const start = new Date(now); start.setDate(start.getDate()-29);
    return { dataMin: toStr(start), dataMax: toStr(now) };
  }
  if(id==='mese'){
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return { dataMin: toStr(start), dataMax: toStr(end) };
  }
  if(id==='trim'){
    const qStart = Math.floor(now.getMonth()/3)*3;
    const start = new Date(now.getFullYear(), qStart, 1);
    const end = new Date(now.getFullYear(), qStart+3, 0);
    return { dataMin: toStr(start), dataMax: toStr(end) };
  }
  if(id==='anno'){
    return { dataMin: `${now.getFullYear()}-01-01`, dataMax: `${now.getFullYear()}-12-31` };
  }
  return { dataMin:'', dataMax:'' };
}
/* Ricorda se il pannello "Ricerca avanzata" è aperto: renderRicercaSearchBody() ricostruisce
   l'intero HTML ad ogni cambio di filtro, quindi senza questo stato il pannello si richiudeva
   da solo appena si selezionava una voce al suo interno. */
let searchAdvancedOpen = false;
let searchSelected = new Set();
function hasActiveSearchFilters(){
  const f = searchFilter;
  return f.anni.length>0 || f.mesi.length>0 || (f.min!=='' && f.min!=null) || (f.max!=='' && f.max!=null) || (f.dataMin!=='' && f.dataMin!=null) || (f.dataMax!=='' && f.dataMax!=null) || (f.testo||'').trim()!=='' || (f.note||'').trim()!=='' || f.etichette.length>0 || (f.tipo && f.tipo!=='tutti') || (f.metodo && f.metodo!=='tutti');
}
function computeSearchMatches(){
  const f = searchFilter;
  const testoL = (f.testo||'').trim().toLowerCase();
  const noteL = (f.note||'').trim().toLowerCase();
  const min = (f.min!=='' && f.min!=null && !isNaN(parseFloat(f.min))) ? parseFloat(f.min) : null;
  const max = (f.max!=='' && f.max!=null && !isNaN(parseFloat(f.max))) ? parseFloat(f.max) : null;
  const dataMin = (f.dataMin!=='' && f.dataMin!=null) ? f.dataMin : null;
  const dataMax = (f.dataMax!=='' && f.dataMax!=null) ? f.dataMax : null;

  const movMatches = DB.movimenti.filter(m=>{
    if(f.tipo==='entrata' && !m.entrate) return false;
    if(f.tipo==='uscita' && !m.uscite) return false;
    if(f.metodo && f.metodo!=='tutti' && movimentoMetodoEffettivo(m)!==f.metodo) return false;
    if(f.anni.length && (!m.data || !f.anni.includes(m.data.slice(0,4)))) return false;
    if(f.mesi.length && (!m.data || !f.mesi.includes(String(parseInt(m.data.slice(5,7),10))))) return false;
    if(dataMin && (!m.data || m.data<dataMin)) return false;
    if(dataMax && (!m.data || m.data>dataMax)) return false;
    const importo = m.entrate || m.uscite || 0;
    if(min!=null && importo<min) return false;
    if(max!=null && importo>max) return false;
    if(testoL && !([m.categoria,m.descrizione].some(v=>v && String(v).toLowerCase().includes(testoL)))) return false;
    if(noteL && !(m.note && String(m.note).toLowerCase().includes(noteL))) return false;
    if(f.etichette.length && !(Array.isArray(m.etichette) && m.etichette.some(t=>f.etichette.includes(t)))) return false;
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  const subMatches = DB.abbonamenti.filter(a=>{
    if(f.tipo==='entrata') return false; // gli abbonamenti sono sempre un costo, mai un'entrata
    if(f.metodo && f.metodo!=='tutti' && a.metodoPagamento!==f.metodo) return false;
    if(noteL) return false; // gli abbonamenti non hanno un campo Note
    if(f.etichette.length) return false; // gli abbonamenti non hanno etichette
    if(f.anni.length && (!a.scadenza || !f.anni.includes(a.scadenza.slice(0,4)))) return false;
    if(f.mesi.length && (!a.scadenza || !f.mesi.includes(String(parseInt(a.scadenza.slice(5,7),10))))) return false;
    if(dataMin && (!a.scadenza || a.scadenza<dataMin)) return false;
    if(dataMax && (!a.scadenza || a.scadenza>dataMax)) return false;
    const costo = a.costo || 0;
    if(min!=null && costo<min) return false;
    if(max!=null && costo>max) return false;
    if(testoL && !(a.servizio && String(a.servizio).toLowerCase().includes(testoL))) return false;
    return true;
  });

  const autoMatches = DB.auto.manutenzione.filter(x=>{
    if(f.tipo==='entrata') return false; // gli interventi auto sono sempre un costo, mai un'entrata
    if(noteL) return false; // gli interventi di manutenzione non hanno un campo Note
    if(f.etichette.length) return false; // gli interventi di manutenzione non hanno etichette
    if(f.anni.length && (!x.data || !f.anni.includes(x.data.slice(0,4)))) return false;
    if(f.mesi.length && (!x.data || !f.mesi.includes(String(parseInt(x.data.slice(5,7),10))))) return false;
    if(dataMin && (!x.data || x.data<dataMin)) return false;
    if(dataMax && (!x.data || x.data>dataMax)) return false;
    const costo = x.costo || 0;
    if(min!=null && costo<min) return false;
    if(max!=null && costo>max) return false;
    if(testoL && !(x.intervento && String(x.intervento).toLowerCase().includes(testoL))) return false;
    return true;
  });

  return { movMatches, subMatches, autoMatches };
}

  document.getElementById('searchAdvancedToggle').onclick = ()=>{
    searchAdvancedOpen = !searchAdvancedOpen;
    document.getElementById('searchAdvancedWrap').classList.toggle('open', searchAdvancedOpen);
  };
  el.querySelectorAll('#searchQuickDatePills .pill').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.quick;
      if(searchQuickRangeActive===id){
        searchQuickRangeActive = null;
        searchFilter.dataMin = ''; searchFilter.dataMax = '';
      } else {
        searchQuickRangeActive = id;
        const range = computeQuickDateRange(id);
        searchFilter.dataMin = range.dataMin; searchFilter.dataMax = range.dataMax;
        searchFilter.anni = []; searchFilter.mesi = [];
      }
      renderRicerca();
    };
  });
  el.querySelectorAll('#searchYearPills .pill').forEach(p=>{
    p.onclick = ()=>{
      const y = p.dataset.year;
      searchQuickRangeActive = null; searchFilter.dataMin=''; searchFilter.dataMax='';
      if(searchFilter.multi){
        const idx = searchFilter.anni.indexOf(y);
        if(idx>-1) searchFilter.anni.splice(idx,1); else searchFilter.anni.push(y);
      } else {
        searchFilter.anni = (searchFilter.anni.length===1 && searchFilter.anni[0]===y) ? [] : [y];
      }
      renderRicerca();
    };
  });
  el.querySelectorAll('#searchMonthGrid .month-tile').forEach(t=>{
    t.onclick = ()=>{
      const mo = String(t.dataset.month);
      searchQuickRangeActive = null; searchFilter.dataMin=''; searchFilter.dataMax='';
      if(searchFilter.multi){
        const idx = searchFilter.mesi.indexOf(mo);
        if(idx>-1) searchFilter.mesi.splice(idx,1); else searchFilter.mesi.push(mo);
      } else {
        searchFilter.mesi = (searchFilter.mesi.length===1 && searchFilter.mesi[0]===mo) ? [] : [mo];
      }
      renderRicerca();
    };
  });
  document.getElementById('btnSearchMultiToggle').onclick = ()=>{ searchFilter.multi = !searchFilter.multi; renderRicerca(); };
  el.querySelectorAll('#searchTipoPills .pill').forEach(p=>{
    p.onclick = ()=>{ searchFilter.tipo = p.dataset.tipo; renderRicerca(); };
  });
  document.getElementById('searchMetodo').onchange = e=>{ searchFilter.metodo = e.target.value; doSearch(); };
  document.getElementById('btnResetSearchFilters').onclick = ()=>{
    searchQuickRangeActive = null;
    searchFilter = { anni:[], mesi:[], min:'', max:'', dataMin:'', dataMax:'', testo:'', note:'', etichette:[], multi:searchFilter.multi, tipo:'tutti', metodo:'tutti' };
    renderRicerca();
  };
  const debouncedSearch = debounce(()=>doSearch(), 250);
  document.getElementById('searchMin').oninput = e=>{ searchFilter.min = e.target.value; debouncedSearch(); };
  document.getElementById('searchMax').oninput = e=>{ searchFilter.max = e.target.value; debouncedSearch(); };
  document.getElementById('searchTesto').oninput = e=>{ searchFilter.testo = e.target.value; debouncedSearch(); };
  document.getElementById('searchNote').oninput = e=>{ searchFilter.note = e.target.value; debouncedSearch(); };
  refreshEtichetteDatalist();
  wireEtichetteChipInput('searchEtichetteChips','searchEtichetteInput', ()=>searchFilter.etichette, (v)=>{ searchFilter.etichette = v; }, doSearch);
  document.getElementById('btnPdfRicerca').onclick = ()=>generatePdfReport('ricerca');
  doSearch();
}

/* ==================== CONFRONTO PERIODI ==================== */
function periodLabel(p){ return p.mese ? `${monthName(parseInt(p.mese,10)).slice(0,3)} ${p.anno}` : p.anno; }
function periodMatches(m, p){
  if(!m.data) return false;
  const y = m.data.slice(0,4);
  if(p.mese) return y===p.anno && String(parseInt(m.data.slice(5,7),10))===String(p.mese);
  return y===p.anno;
}
function computePeriodStats(p){
  const list = movimentiForTotals(DB.movimenti).filter(m=>periodMatches(m,p));
  let entrate=0, uscite=0;
  const cats = {};
  const monthly = p.mese ? null : Array.from({length:12},()=>0);
  list.forEach(m=>{
    entrate += m.entrate||0; uscite += m.uscite||0;
    const cat = m.categoria || '—';
    cats[cat] = cats[cat] || { entrate:0, uscite:0, sub:{} };
    cats[cat].entrate += m.entrate||0; cats[cat].uscite += m.uscite||0;
    const subKey = m.descrizione || '—';
    cats[cat].sub[subKey] = cats[cat].sub[subKey] || { entrate:0, uscite:0 };
    cats[cat].sub[subKey].entrate += m.entrate||0; cats[cat].sub[subKey].uscite += m.uscite||0;
    if(monthly){ monthly[parseInt(m.data.slice(5,7),10)-1] += (m.uscite||0); }
  });
  return { entrate, uscite, saldo:entrate-uscite, cats, monthly };
}
function compareDeltaHtml(first, last, invert){
  const diff = last-first;
  if(Math.abs(diff)<0.005 && Math.abs(first)<0.005 && Math.abs(last)<0.005) return '';
  const pct = Math.abs(first)>0.005 ? (diff/Math.abs(first))*100 : (Math.abs(last)>0.005 ? 100 : 0);
  const up = diff>0.005, down = diff<-0.005;
  const good = invert ? !up : up;
  const cls = (!up && !down) ? 'even' : (good?'pos':'neg');
  const arrow = (!up && !down) ? '→' : (up?'▲':'▼');
  return `<span class="compare-delta ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
}
function initCompareDefaults(){
  const years = getYears();
  if(!years.length){ compareState.periods = []; return; }
  const latest = DB.movimenti.reduce((acc,m)=> (m.data && (!acc||m.data>acc)) ? m.data : acc, null);
  const latestYear = latest ? latest.slice(0,4) : years[0];
  const latestMonth = latest ? String(parseInt(latest.slice(5,7),10)) : '1';
  if(compareState.granularity==='annuale'){
    const idx = years.indexOf(latestYear);
    const prevYear = years[idx+1] || latestYear;
    compareState.periods = prevYear===latestYear ? [{anno:latestYear}] : [{anno:prevYear},{anno:latestYear}];
  } else {
    let py = parseInt(latestYear,10), pm = parseInt(latestMonth,10)-1;
    if(pm<1){ pm=12; py-=1; }
    compareState.periods = [{anno:String(py), mese:String(pm)}, {anno:latestYear, mese:latestMonth}];
  }
}
function addComparePeriod(){
  if(compareState.periods.length>=4) return;
  const years = getYears();
  const latest = DB.movimenti.reduce((acc,m)=> (m.data && (!acc||m.data>acc)) ? m.data : acc, null);
  const y = latest ? latest.slice(0,4) : (years[0]||String(new Date().getFullYear()));
  const m = latest ? String(parseInt(latest.slice(5,7),10)) : '1';
  compareState.periods.push(compareState.granularity==='annuale' ? {anno:y} : {anno:y, mese:m});
  renderConfrontoBody();
}
function removeComparePeriod(idx){
  if(compareState.periods.length<=2) return;
  compareState.periods.splice(idx,1);
  renderConfrontoBody();
}
function renderPeriodPicker(p, i){
  const years = getYears();
  const color = `var(--${COMPARE_COLORS[i]})`;
  return `<div class="compare-period-chip" style="border-left:4px solid ${color};">
    <select class="cpYear" data-idx="${i}">${years.map(y=>`<option value="${y}" ${p.anno===y?'selected':''}>${y}</option>`).join('')}</select>
    ${compareState.granularity==='mensile' ? `<select class="cpMonth" data-idx="${i}">${Array.from({length:12},(_,m)=>m+1).map(m=>`<option value="${m}" ${String(p.mese)===String(m)?'selected':''}>${monthName(m)}</option>`).join('')}</select>` : ''}
    ${compareState.periods.length>2 ? `<button type="button" class="cp-remove" data-idx="${i}" title="Rimuovi periodo">${ico('x',13)}</button>` : ''}
  </div>`;
}
function renderConfrontoBody(){
  const el = document.getElementById('ricercaBody');
  if(!compareState.periods.length) initCompareDefaults();
  if(!compareState.periods.length){
    el.innerHTML = `<div class="empty-state"><div class="ic">${ico('activity')}</div>Nessun movimento disponibile da confrontare.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="card compare-controls" style="padding:16px;margin-bottom:20px;">
      <div class="time-selector-row">
        <span class="time-selector-label">Vista</span>
        <div class="pill-group" id="compareGranPills">
          <button type="button" class="pill ${compareState.granularity==='mensile'?'active':''}" data-gran="mensile">Mensile</button>
          <button type="button" class="pill ${compareState.granularity==='annuale'?'active':''}" data-gran="annuale">Annuale</button>
        </div>
      </div>
      <div class="compare-periods" id="comparePeriodsRow">
        ${compareState.periods.map((p,i)=>renderPeriodPicker(p,i)).join('')}
        ${compareState.periods.length<4 ? `<button type="button" class="link-btn" id="btnAddPeriod">${ico('flag',14)} Aggiungi periodo</button>` : ''}
      </div>
    </div>
    <div id="compareResults"></div>
  `;
  document.getElementById('compareGranPills').querySelectorAll('.pill').forEach(pl=>{
    pl.onclick = ()=>{ compareState.granularity = pl.dataset.gran; initCompareDefaults(); compareDetailOpen=false; renderConfrontoBody(); };
  });
  document.querySelectorAll('.cpYear').forEach(s=>{ s.onchange = ()=>{ compareState.periods[+s.dataset.idx].anno = s.value; renderConfrontoResults(); }; });
  document.querySelectorAll('.cpMonth').forEach(s=>{ s.onchange = ()=>{ compareState.periods[+s.dataset.idx].mese = s.value; renderConfrontoResults(); }; });
  document.querySelectorAll('.cp-remove').forEach(b=>{ b.onclick = ()=> removeComparePeriod(+b.dataset.idx); });
  const addBtn = document.getElementById('btnAddPeriod'); if(addBtn) addBtn.onclick = addComparePeriod;
  renderConfrontoResults();
}
let compareChartView = 'categoria';
let compareDetailOpen = false; // il dettaglio categoria/sottocategoria parte nascosto, dietro un link
let compareShowAllCats = false; // dentro il dettaglio, mostra solo le prime categorie finché non richiesto
const COMPARE_DETAIL_DEFAULT_LIMIT = 6;
/* Frase riassuntiva in cima al Confronto: confronta il primo e l'ultimo periodo selezionato,
   invece di lasciare all'utente il compito di leggere la matrice di numeri e fare il calcolo a mente. */
function compareInsightSentence(stats, periods){
  const first = stats[0], last = stats[stats.length-1];
  const fLabel = esc(periodLabel(periods[0])), lLabel = esc(periodLabel(periods[periods.length-1]));
  const diff = last.uscite - first.uscite;
  if(stats.length<2 || Math.abs(diff)<0.5){
    return `A <b>${lLabel}</b> hai speso circa quanto a <b>${fLabel}</b>.`;
  }
  const pct = Math.abs(first.uscite)>0.005 ? Math.abs(diff/first.uscite*100) : 100;
  const verbo = diff>0 ? 'in più' : 'in meno';
  const cls = diff>0 ? 'neg' : 'pos';
  return `A <b>${lLabel}</b> hai speso <span class="${cls}" style="font-weight:700;">${fmtEUR(Math.abs(diff))} ${verbo}</span> rispetto a <b>${fLabel}</b> (${pct.toFixed(0)}%).`;
}
function renderConfrontoResults(){
  const container = document.getElementById('compareResults');
  const periods = compareState.periods;
  const stats = periods.map(p=>computePeriodStats(p));
  const last = stats.length-1;
  const annuale = periods.every(p=>!p.mese);
  if(!annuale) compareChartView = 'categoria';

  const catTotals = {};
  stats.forEach(s=>Object.keys(s.cats).forEach(c=>{ catTotals[c] = (catTotals[c]||0) + s.cats[c].uscite; }));
  const catLabels = Object.keys(catTotals).filter(c=>catTotals[c]>0.005).sort((a,b)=>catTotals[b]-catTotals[a]).slice(0,8);

  const stripHtml = stats.map((s,i)=>`<div class="compare-strip-item">
      <span class="compare-strip-dot" style="background:${COMPARE_COLOR_HEX[COMPARE_COLORS[i]]};"></span>
      <span class="compare-strip-label">${esc(periodLabel(periods[i]))}</span>
      <span class="compare-strip-num">${fmtEUR(s.uscite)} uscite</span>
      <span class="compare-strip-num ${saldoClass(s.saldo)}">${fmtEUR(s.saldo)} saldo</span>
    </div>`).join('');

  let html = `<div class="card compare-summary" style="padding:16px;margin-bottom:20px;">
    <div class="compare-insight">${compareInsightSentence(stats, periods)}</div>
    <div class="compare-strip">${stripHtml}</div>
    <div class="compare-chart-head">
      <div class="section-label" style="margin:0;">${compareChartView==='categoria' ? 'Spese per categoria' : 'Andamento mensile'}</div>
      ${annuale ? `<div class="pill-group" id="compareChartTogglePills">
        <button type="button" class="pill ${compareChartView==='categoria'?'active':''}" data-view="categoria">Per categoria</button>
        <button type="button" class="pill ${compareChartView==='stagionalita'?'active':''}" data-view="stagionalita">Stagionalità</button>
      </div>` : ''}
    </div>
    <div class="chart-wrap compare-chart-wrap"><canvas id="chartCompareMain"></canvas></div>
  </div>`;

  // Il dettaglio categoria/sottocategoria resta disponibile ma parte nascosto dietro un link: è la
  // stessa informazione già raccontata dal grafico sopra, in forma più densa — utile per chi vuole
  // scavare, ma non deve essere la prima cosa che si vede aprendo la scheda.
  html += `<div class="compare-detail-toggle-wrap" style="margin-bottom:${compareDetailOpen?'10px':'0'};">
    <button type="button" class="link-btn" id="btnToggleCompareDetail">${compareDetailOpen ? '▾ Nascondi dettaglio per categoria' : '▸ Vedi dettaglio per categoria e sottocategoria'}</button>
  </div>`;

  if(compareDetailOpen){
    const gridCols = `1fr repeat(${periods.length},104px) 60px`;
    const allCatLabels = Object.keys(catTotals).filter(c=>catTotals[c]>0.005).sort((a,b)=>catTotals[b]-catTotals[a]);
    const tableCatLabels = compareShowAllCats ? allCatLabels : allCatLabels.slice(0, COMPARE_DETAIL_DEFAULT_LIMIT);
    const globalMaxCat = Math.max(0.01, ...allCatLabels.flatMap(cat=>stats.map(s=> s.cats[cat] ? s.cats[cat].uscite : 0)));

    function barCellHtml(val, max, colorHex){
      const pct = max>0 ? Math.min(100, (val/max)*100) : 0;
      return `<span class="cdt-cell">
        <span class="cdt-num mono">${val>0.005 ? fmtEUR(val) : '—'}</span>
        <span class="cdt-bar-track"><span class="cdt-bar-fill" style="width:${pct}%;background:${colorHex};"></span></span>
      </span>`;
    }

    const catRows = tableCatLabels.map(cat=>{
      const subKeys = new Set();
      stats.forEach(s=>{ if(s.cats[cat]) Object.keys(s.cats[cat].sub).forEach(sk=>subKeys.add(sk)); });
      const subList = Array.from(subKeys);
      const subMax = Math.max(0.01, ...subList.flatMap(sub=>stats.map(s=> (s.cats[cat]&&s.cats[cat].sub[sub]) ? s.cats[cat].sub[sub].uscite : 0)));
      const subRows = subList
        .map(sub=>({ sub, vals: stats.map(s=> (s.cats[cat] && s.cats[cat].sub[sub]) ? s.cats[cat].sub[sub].uscite : 0) }))
        .sort((a,b)=> Math.max(...b.vals) - Math.max(...a.vals))
        .map(({sub,vals})=>`<div class="compare-detail-row sub-row" style="grid-template-columns:${gridCols};">
          <span class="cdt-name sub-name">${esc(sub)}</span>
          ${vals.map((v,i)=>barCellHtml(v, subMax, COMPARE_COLOR_HEX[COMPARE_COLORS[i]])).join('')}
          <span class="cdt-col cdt-delta">${compareDeltaHtml(vals[0], vals[last], true)}</span>
        </div>`).join('');
      const catVals = stats.map(s=> s.cats[cat] ? s.cats[cat].uscite : 0);
      return `<div class="compare-detail-item">
        <div class="compare-detail-row cdt-head" style="grid-template-columns:${gridCols};">
          <span class="cdt-chevron">▶</span>
          <span class="cdt-name"><span class="tag-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${categoryColor(cat)};margin-right:6px;flex-shrink:0;"></span>${esc(cat)}</span>
          ${catVals.map((v,i)=>barCellHtml(v, globalMaxCat, COMPARE_COLOR_HEX[COMPARE_COLORS[i]])).join('')}
          <span class="cdt-col cdt-delta">${compareDeltaHtml(catVals[0], catVals[last], true)}</span>
        </div>
        <div class="compare-detail-body">${subRows}</div>
      </div>`;
    }).join('');

    html += `<div class="card compare-detail-card" style="padding:16px;">
      <div class="compare-detail-card-head">
        <div class="section-label" style="margin:0;">Dettaglio categoria e sottocategoria</div>
        ${tableCatLabels.length ? `<button type="button" class="link-btn" id="btnToggleAllCompareRows" data-state="collapsed">Espandi tutto</button>` : ''}
      </div>
      <div class="compare-detail-header" style="grid-template-columns:${gridCols};">
        <span class="cdt-name">Categoria</span>
        ${periods.map((p,i)=>`<span class="cdt-col" style="color:var(--${COMPARE_COLORS[i]});">${esc(periodLabel(p))}</span>`).join('')}
        <span class="cdt-col">Var.</span>
      </div>
      <div class="compare-detail-list">
        ${catRows || `<div class="empty-state" style="padding:20px;">Nessuna spesa nei periodi selezionati</div>`}
      </div>
      ${!compareShowAllCats && allCatLabels.length>tableCatLabels.length ? `<div style="text-align:center;padding-top:8px;"><button type="button" class="link-btn" id="btnShowAllCompareCats">Mostra tutte le categorie (${allCatLabels.length})</button></div>` : ''}
    </div>`;
  }

  container.innerHTML = html;
  container.querySelectorAll('.cdt-head').forEach(h=>h.onclick = ()=>h.closest('.compare-detail-item').classList.toggle('open'));
  const toggleAllBtn = document.getElementById('btnToggleAllCompareRows');
  if(toggleAllBtn) toggleAllBtn.onclick = ()=>{
    const expand = toggleAllBtn.dataset.state==='collapsed';
    container.querySelectorAll('.compare-detail-item').forEach(it=>it.classList.toggle('open', expand));
    toggleAllBtn.dataset.state = expand ? 'expanded' : 'collapsed';
    toggleAllBtn.textContent = expand ? 'Comprimi tutto' : 'Espandi tutto';
  };
  const toggleWrap = document.getElementById('compareChartTogglePills');
  if(toggleWrap) toggleWrap.querySelectorAll('.pill').forEach(pl=>{
    pl.onclick = ()=>{ compareChartView = pl.dataset.view; renderConfrontoResults(); };
  });
  document.getElementById('btnToggleCompareDetail').onclick = ()=>{ compareDetailOpen = !compareDetailOpen; renderConfrontoResults(); };
  const showAllBtn = document.getElementById('btnShowAllCompareCats');
  if(showAllBtn) showAllBtn.onclick = ()=>{ compareShowAllCats = true; renderConfrontoResults(); };

  const isDark = currentTheme()!=='light';
  const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
  const textColor = isDark ? '#93A3AA' : '#5C6B72';

  if(charts.compareMain) charts.compareMain.destroy();
  const ctx = document.getElementById('chartCompareMain');
  if(compareChartView==='categoria'){
    charts.compareMain = new Chart(ctx, {
      type:'bar',
      data:{ labels:catLabels, datasets: stats.map((s,i)=>({
        label: periodLabel(periods[i]),
        data: catLabels.map(c=> s.cats[c] ? s.cats[c].uscite : 0),
        backgroundColor: COMPARE_COLOR_HEX[COMPARE_COLORS[i]],
        borderRadius:4, maxBarThickness:14
      })) },
      options:{
        indexAxis:'y',
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{color:textColor, font:{family:'Inter',size:11}, boxWidth:9}, position:'top', align:'end' } },
        scales:{
          x:{ grid:{color:gridColor}, ticks:{color:textColor,font:{size:10.5}, callback:v=>'€'+v} },
          y:{ grid:{display:false}, ticks:{color:textColor,font:{size:11.5}} }
        }
      }
    });
  } else {
    const monthLabels = Array.from({length:12},(_,m)=>monthName(m+1).slice(0,3));
    charts.compareMain = new Chart(ctx, {
      type:'line',
      data:{ labels:monthLabels, datasets: stats.map((s,i)=>({
        label: periodLabel(periods[i]),
        data: s.monthly,
        borderColor: COMPARE_COLOR_HEX[COMPARE_COLORS[i]],
        backgroundColor: COMPARE_COLOR_HEX[COMPARE_COLORS[i]],
        tension:0.35, borderWidth:2.5, pointRadius:2.5, pointHoverRadius:5, fill:false
      })) },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{color:textColor, font:{family:'Inter',size:11}, boxWidth:9}, position:'top', align:'end' } },
        scales:{
          x:{ grid:{display:false}, ticks:{color:textColor,font:{size:11}} },
          y:{ grid:{color:gridColor}, ticks:{color:textColor,font:{size:11}, callback:v=>'€'+v} }
        }
      }
    });
  }
}

let searchMovPageSize = 100;
let searchMovVisibleCount = 100;
function doSearch(keepSelection, keepPage){
  if(!keepSelection){ searchSelected.clear(); searchMovSelCtx.active=false; searchMovSelCtx.selected.clear(); }
  if(!keepPage) searchMovVisibleCount = searchMovPageSize;
  const results = document.getElementById('searchResults');
  const statsBox = document.getElementById('searchStats');
  if(!hasActiveSearchFilters()){
    statsBox.innerHTML = '';
    results.innerHTML = `<div class="empty-state"><div class="ic">${ico('search')}</div>Imposta uno o più filtri per iniziare a esplorare i tuoi dati.</div>`;
    return;
  }
  const { movMatches, subMatches, autoMatches } = computeSearchMatches();

  // Statistiche in tempo reale sui movimenti trovati
  const movEntrate = movimentiForTotals(movMatches).reduce((s,m)=>s+(m.entrate||0),0);
  const movUscite = movimentiForTotals(movMatches).reduce((s,m)=>s+(m.uscite||0),0);
  const movSum = movEntrate - movUscite;
  statsBox.innerHTML = `
    <div class="search-stats">
      <div class="stat-chip"><div class="lbl">Movimenti trovati</div><div class="val">${movMatches.length}</div></div>
      <div class="stat-chip"><div class="lbl">Totale Entrate</div><div class="val pos">${fmtEUR(movEntrate)}</div></div>
      <div class="stat-chip"><div class="lbl">Totale Uscite</div><div class="val neg">${fmtEUR(movUscite)}</div></div>
      <div class="stat-chip"><div class="lbl">Saldo Netto</div><div class="val ${saldoClass(movSum)}">${fmtEUR(movSum)}</div></div>
    </div>
    ${bulkBarHtml('search')}`;

  const total = movMatches.length + subMatches.length + autoMatches.length;
  if(!total){ results.innerHTML = `<div class="empty-state"><div class="ic">${ico('helpCircle')}</div>Nessun risultato per i filtri impostati</div>`; return; }

  let html = '';

  if(movMatches.length){
    html += `<div class="section-label">Movimenti (${movMatches.length})</div><div class="card list-card mov-search-block"><div class="table-scroll"><table class="search-res-table search-res-mov">
      <thead><tr><th class="check-col"></th><th class="src-col"></th><th>Data</th><th>Categoria</th><th>Dettaglio</th><th class="num">Importo</th><th></th></tr></thead><tbody>`;
    movMatches.slice(0,searchMovVisibleCount).forEach(m=>{
      const fonteIcon = movimentoMetodoIconHtml(m);
      html += `<tr data-id="${m.id}">
        <td class="check-col"><label class="sel-check"><input type="checkbox" class="searchCheck" data-key="mov:${m.id}" ${searchSelected.has('mov:'+m.id)?'checked':''}></label></td>
        <td class="src-col">${fonteIcon}</td>
        <td>${fmtDate(m.data)}</td>
        <td>${categoryLabelAvatarHtml(m.categoria)}</td>

   usato da Resoconto Etichetta e Cronologia Metodo). Pillola nell'header persistente, come Movimenti. */
const searchMovSelCtx = { selected:new Set(), active:false };
function renderSearchMovSelPill(){

    <span class="mobile-topbar-count">${n} selezionat${n===1?'o':'i'}</span>
    <button type="button" class="mobile-topbar-btn" id="searchSelDeselectAll" title="Deseleziona tutto">${ico('xCircle',18)}</button>
    <button type="button" class="mobile-topbar-btn" id="searchSelMenuBtn" title="Altre azioni">${ico('moreVertical',18)}</button>
  `;
  setMobileTopbarActions(html, ()=>{
    document.getElementById('searchSelDeselectAll').onclick = ()=>daySelExit(searchMovSelCfg);
    document.getElementById('searchSelMenuBtn').onclick = ()=>openDaySelMenu(document.getElementById('searchSelMenuBtn'), searchMovSelCfg);
  });
}
const searchMovSelCfg = {
  ctx: searchMovSelCtx,
  get container(){ return document.getElementById('searchResults'); },
  renderPill: renderSearchMovSelPill,
  onEdit: id=>openMovModal(id),
  refresh: ()=>doSearch()
};
function wireSearchRowActions(){
  const btnLoadMore = document.getElementById('btnSearchLoadMore');
  if(btnLoadMore) btnLoadMore.onclick = ()=>{ searchMovVisibleCount += searchMovPageSize; doSearch(true, true); };
  document.querySelectorAll('#searchResults .search-res-table tr[data-id]').forEach(row=>{
    row.onclick = (e)=>{
      if(e.target.closest('.sel-check, .row-actions, .etichetta-chip-click, [data-src-history]')) return;
      const willExpand = !row.classList.contains('row-expanded');
      row.classList.toggle('row-expanded');
      if(willExpand) suppressGhostClick(row.querySelector('.row-actions'));
    };
  });
  document.querySelectorAll('.searchCheck').forEach(cb=>cb.onchange = ()=>{
    const key = cb.dataset.key;
    if(cb.checked) searchSelected.add(key); else searchSelected.delete(key);
    updateSearchBulkBar();
  });
  document.querySelectorAll('#searchResults .etichetta-chip-click').forEach(c=>c.onclick = (e)=>{
    e.stopPropagation();
    openEtichettaReportModal(c.dataset.etichetta);
  });
  document.querySelectorAll('#searchResults [data-src-history]').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    openSourceHistoryModal(b.dataset.srcHistory);
  });
  document.querySelectorAll('.searchMovKebab').forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    openKebabMenu(b, movRowKebabItems({
      onView: ()=>goToMovimento(b.dataset.id),
      onEdit: ()=>openMovModal(b.dataset.id),
      onDuplicate: ()=>duplicaMovimento(b.dataset.id, ()=>doSearch()),
      onDelete: ()=>removeByIdWithUndo(DB.movimenti, b.dataset.id, 'Movimento eliminato', ()=>doSearch())
    }));
  });
  document.querySelectorAll('.editSearchSub').forEach(b=>b.onclick = ()=>openSubModal(b.dataset.id));
  document.querySelectorAll('.delSearchSub').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.abbonamenti, b.dataset.id, 'Abbonamento eliminato', ()=>doSearch());
  });
  document.querySelectorAll('.editSearchMan').forEach(b=>b.onclick = ()=>openManutModal(b.dataset.id));
  document.querySelectorAll('.delSearchMan').forEach(b=>b.onclick = ()=>{
    removeByIdWithUndo(DB.auto.manutenzione, b.dataset.id, 'Intervento eliminato', ()=>doSearch());
  });
  const bulkBtn = document.getElementById('searchBulkDeleteBtn');
  const cancelBtn = document.getElementById('searchBulkCancelBtn');
  const selectAllBtn = document.getElementById('searchSelectAllBtn');
  const tagBtn = document.getElementById('searchBulkTagBtn');
  const metodoBtn = document.getElementById('searchBulkMetodoBtn');
  const campiBtn = document.getElementById('searchBulkCampiBtn');
  if(selectAllBtn) selectAllBtn.onclick = ()=>{
    const allKeys = Array.from(document.querySelectorAll('.searchCheck')).map(cb=>cb.dataset.key);
    const allSelected = allKeys.length>0 && allKeys.every(k=>searchSelected.has(k));
    if(allSelected){ searchSelected.clear(); } else { allKeys.forEach(k=>searchSelected.add(k)); }
    doSearch(true);
  };
  if(tagBtn) tagBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds = Array.from(searchSelected).filter(k=>k.startsWith('mov:')).map(k=>k.slice(4));
    if(!movIds.length){ toast('Nessun movimento tra i selezionati (le etichette si applicano solo ai movimenti)'); return; }
    openBulkEtichettaModal(movIds, doSearch, ()=>searchSelected.clear());
  };
  if(metodoBtn) metodoBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds = Array.from(searchSelected).filter(k=>k.startsWith('mov:')).map(k=>k.slice(4));
    const subIds = Array.from(searchSelected).filter(k=>k.startsWith('sub:')).map(k=>k.slice(4));
    if(!movIds.length && !subIds.length){ toast('Nessun movimento o abbonamento tra i selezionati'); return; }
    openBulkMetodoModal(movIds.length+subIds.length, metodo=>{
      let n = 0;
      DB.movimenti.forEach(m=>{ if(movIds.includes(m.id)){ m.metodoPagamento = metodo; n++; } });
      DB.abbonamenti.forEach(a=>{ if(subIds.includes(a.id)){ a.metodoPagamento = metodo; n++; } });
      return n;
    }, doSearch, ()=>searchSelected.clear());
  };
  if(campiBtn) campiBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds = Array.from(searchSelected).filter(k=>k.startsWith('mov:')).map(k=>k.slice(4));
    if(!movIds.length){ toast('Nessun movimento tra i selezionati (categoria/dettaglio/note si applicano solo ai movimenti)'); return; }
    openBulkCampiModal(movIds, doSearch, ()=>searchSelected.clear());
  };
  if(cancelBtn) cancelBtn.onclick = ()=>{
    searchSelected.clear();
    document.querySelectorAll('.searchCheck').forEach(cb=>cb.checked=false);
    updateSearchBulkBar();
  };
  if(bulkBtn) bulkBtn.onclick = ()=>{
    if(!searchSelected.size) return;
    const movIds=[], subIds=[], manIds=[];
    searchSelected.forEach(k=>{
      const idx = k.indexOf(':');
      const type = k.slice(0,idx), id = k.slice(idx+1);
      if(type==='mov') movIds.push(id);
      else if(type==='sub') subIds.push(id);
      else if(type==='man') manIds.push(id);
    });
    const n = searchSelected.size;
    searchSelected.clear();
    const removedMov = movIds.length ? DB.movimenti.filter(m=>movIds.includes(m.id)) : [];
    const removedSub = subIds.length ? DB.abbonamenti.filter(a=>subIds.includes(a.id)) : [];
    const removedMan = manIds.length ? DB.auto.manutenzione.filter(x=>manIds.includes(x.id)) : [];
    if(movIds.length){ const kept = DB.movimenti.filter(m=>!movIds.includes(m.id)); DB.movimenti.length=0; DB.movimenti.push(...kept); }
    if(subIds.length){ const kept = DB.abbonamenti.filter(a=>!subIds.includes(a.id)); DB.abbonamenti.length=0; DB.abbonamenti.push(...kept); }
    if(manIds.length){ const kept = DB.auto.manutenzione.filter(x=>!manIds.includes(x.id)); DB.auto.manutenzione.length=0; DB.auto.manutenzione.push(...kept); }
    saveDB(); doSearch();
    toastUndo(`${n} elementi eliminati`, ()=>{
      DB.movimenti.push(...removedMov);
      DB.abbonamenti.push(...removedSub);
      DB.auto.manutenzione.push(...removedMan);
      saveDB(); toast('Ripristinati'); doSearch();
    });
  };
  updateSearchBulkBar();
  wireDaySelectable(searchMovSelCfg);
  renderSearchMovSelPill();
}

/* ==================== ABBONAMENTI ==================== */
let subViewMode = 'grid';
let subSortMode = 'scadenza'; // 'scadenza' | 'prezzo' | 'categoria'
let subPrevTotals = null; // {mensile, annuale} — usati per animare i KPI da un render all'altro

function sortSubscriptions(list, mode){
  const arr = [...list];
  const byStatoScadenza = (a,b)=>{
    if((a.stato==='Attivo')!==(b.stato==='Attivo')) return a.stato==='Attivo'?-1:1;
    return (a.scadenza||'9999').localeCompare(b.scadenza||'9999');
  };
  if(mode==='prezzo'){
    arr.sort((a,b)=> (b.costoMensile||0) - (a.costoMensile||0));
  } else if(mode==='categoria'){
    const catOrder = DB.categorieAbbonamenti;
    arr.sort((a,b)=>{
      const ia = catOrder.indexOf(a.categoriaAbb), ib = catOrder.indexOf(b.categoriaAbb);
      const na = ia===-1?999:ia, nb = ib===-1?999:ib;
      if(na!==nb) return na-nb;
      return byStatoScadenza(a,b);
    });
  } else {
    arr.sort(byStatoScadenza);
  }
  return arr;
}
function renderAbbonamenti(){

          <button data-sort="prezzo" class="${subSortMode==='prezzo'?'active':''}">Prezzo</button>

        <div class="view-toggle">

          <button class="vtListBtn ${subViewMode==='list'?'active':''}">${ico('menu')} Elenco</button>
        </div>

      <div class="view-toggle sortToggle">

        <button data-sort="prezzo" class="${subSortMode==='prezzo'?'active':''}">Prezzo</button>
        <button data-sort="categoria" class="${subSortMode==='categoria'?'active':''}">Categoria</button>
      </div>
      <div class="view-toggle">
        <button class="vtGridBtn ${subViewMode==='grid'?'active':''}" title="Griglia" aria-label="Griglia">▦</button>
        <button class="vtListBtn ${subViewMode==='list'?'active':''}" title="Elenco" aria-label="Elenco">${ico('menu')}</button>
      </div>
    </div>
    <div class="grid kpi-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:22px;">
      <div class="kpi-card uscite"><div class="kpi-bar"></div><div class="kpi-label">Spesa mensile ricorrente (attivi)</div><div class="kpi-value" id="kpiSubMensile"></div></div>
      <div class="kpi-card saldo"><div class="kpi-bar"></div><div class="kpi-label">Proiezione annuale (attivi)</div><div class="kpi-value" id="kpiSubAnnuale"></div></div>
    </div>
    <div class="sub-cat-legend" id="subCatLegend" style="${subSortMode==='categoria'?'display:none;':''}">${DB.categorieAbbonamenti.map(c=>`<span class="sub-cat-legend-item"><span class="sub-cat-legend-dot" style="background:${categoriaAbbColor(c)};"></span>${esc(c)}</span>`).join('')}</div>
    <div id="subContainer"></div>
  `;
  animateNumber(document.getElementById('kpiSubMensile'), subPrevTotals?subPrevTotals.mensile:null, totMensile);
  animateNumber(document.getElementById('kpiSubAnnuale'), subPrevTotals?subPrevTotals.annuale:null, totAnnuale);
  subPrevTotals = {mensile:totMensile, annuale:totAnnuale};
  document.getElementById('btnNewSub').onclick = ()=>openSubModal();
  document.querySelectorAll('.vtGridBtn').forEach(b=>b.onclick = ()=>{ subViewMode='grid'; renderAbbonamenti(); });
  document.querySelectorAll('.vtListBtn').forEach(b=>b.onclick = ()=>{ subViewMode='list'; renderAbbonamenti(); });
  document.querySelectorAll('.sortToggle button').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.sort===subSortMode) return;
      subSortMode = b.dataset.sort;
      document.querySelectorAll('.sortToggle button').forEach(x=>x.classList.toggle('active', x.dataset.sort===subSortMode));
      const legend = document.getElementById('subCatLegend');
      if(legend) legend.style.display = subSortMode==='categoria' ? 'none' : '';
      renderSubList(true);

  });
  renderSubList(false);

/* Renderizza solo il contenuto di #subContainer (tabella o griglia), senza toccare il resto della
   pagina (topbar, KPI, legenda): usata dal cambio di ordinamento per poter animare il riordino delle
   card con la tecnica FLIP (si misura la posizione di ogni card prima e dopo il riordino, e si anima
   la differenza) invece di far scattare tutto istantaneamente in una nuova posizione. */
function renderSubList(animate){
  const sorted = sortSubscriptions(DB.abbonamenti, subSortMode);
  const container = document.getElementById('subContainer');

  // FLIP step 1 (First): posizioni attuali delle card prima di ricostruire il DOM.
  const oldRects = {};
  if(animate && subViewMode==='grid'){
    container.querySelectorAll('.sub-card[data-id]').forEach(card=>{
      oldRects[card.dataset.id] = card.getBoundingClientRect();
    });
  }

  if(subViewMode==='list'){
    container.innerHTML = `<div class="card list-card"><div class="table-scroll"><table>
      <thead><tr><th></th><th>Servizio</th><th>Stato</th><th>Periodicità</th><th class="num">Costo</th><th class="num">Costo mensile</th><th>Metodo</th><th>Scadenza</th><th></th></tr></thead>
      <tbody>${sorted.map(a=>{
        const periodicita = a.mesi==12 ? 'Annuale' : a.mesi>1 ? a.mesi+' mesi' : a.mesi==1 ? 'Mensile' : '—';
        return `<tr data-id="${a.id}" style="border-left:3px solid ${categoriaAbbColor(a.categoriaAbb)};">
          <td><button class="sub-bell ${subAvvisoOn(a)?'on':''}" data-id="${a.id}" title="${subAvvisoOn(a)?'Notifica scadenza attiva':'Notifica scadenza disattivata'}">${subAvvisoOn(a)?ico('bell'):ico('bellOff')}</button></td>
          <td>${esc(a.servizio)}</td>
          <td>${a.stato==='Attivo'?`${ico('checkCircle')} Attivo`:'⏸ Non attivo'}</td>
          <td>${periodicita}</td>
          <td class="num amt">${a.costo?fmtEUR(a.costo):'—'}</td>
          <td class="num amt">${a.costoMensile?fmtEUR(a.costoMensile):'—'}</td>
          <td>${esc(a.metodoPagamento||'—')}</td>
          <td>${fmtDate(a.scadenza)} ${countdownBadge(a.scadenza)}</td>
          <td><div class="row-actions" style="opacity:1; pointer-events:auto;">
            <button class="btn btn-icon btn-sm editSub" data-id="${a.id}" title="Modifica">${ico('edit')}</button>
            <button class="btn btn-icon btn-sm delSubCard" data-id="${a.id}" title="Elimina">${ico('trash')}</button>
          </div></td>
        </tr>`;
      }).join('') || `<tr><td colspan="9" style="text-align:center;color:var(--text-faint);padding:20px;">Nessun abbonamento registrato</td></tr>`}</tbody>
    </table></div></div>`;
  } else {
    // In ordinamento per categoria, le card restano tutte dirette figlie di #subGrid (stessa griglia
    // CSS): le intestazioni di categoria sono semplicemente elementi che occupano l'intera riga
    // (grid-column:1/-1), non un contenitore separato — questo tiene tutte le .sub-card allo stesso
    // livello, il che è quello che serve alla FLIP per calcolare correttamente gli spostamenti.
    let lastCat = undefined;
    const cardsHtml = sorted.map(a=>{
      let headerHtml = '';
      if(subSortMode==='categoria' && a.categoriaAbb!==lastCat){
        lastCat = a.categoriaAbb;
        const inCat = DB.abbonamenti.filter(x=>x.categoriaAbb===lastCat && x.stato==='Attivo');
        const mensileCat = inCat.reduce((s,x)=>s+(x.costoMensile||0),0);
        headerHtml = `<div class="sub-cat-header">
          <div class="sub-cat-header-name"><span class="sub-cat-dot" style="background:${categoriaAbbColor(lastCat)};"></span>${esc(lastCat||'Senza categoria')}</div>
          <div class="sub-cat-header-tot">${fmtEUR(mensileCat)}/mese · ${fmtEUR(mensileCat*12)}/anno</div>
        </div>`;
      }
      const periodicita = a.mesi==12 ? 'Annuale' : a.mesi>1 ? a.mesi+' mesi' : 'Mensile';
      return headerHtml + `<div class="sub-card ${a.stato!=='Attivo'?'inactive':''}" data-id="${a.id}">
        <div class="sub-card-top">
          <div class="sub-card-name"><span class="sub-cat-dot" style="background:${categoriaAbbColor(a.categoriaAbb)};"></span><span class="sub-name">${esc(a.servizio)}</span></div>
          <div class="row-actions">
            <button class="btn btn-icon btn-sm editSub" data-id="${a.id}" title="Modifica">${ico('edit')}</button>
            <button class="btn btn-icon btn-sm delSubCard" data-id="${a.id}" title="Elimina">${ico('trash')}</button>
          </div>
        </div>
        <div class="sub-meta">${periodicita} · ${esc(a.metodoPagamento||'—')} · ${esc(a.rinnovo||'—')}</div>
        <div class="sub-price">${a.costo?fmtEUR(a.costo):'—'} <small>/ ${a.mesi==12?'anno':'mese'}</small></div>
        <div class="sub-scad-line">
          <span class="sub-scad-left">
            <button class="sub-card-bell ${subAvvisoOn(a)?'on':''}" data-id="${a.id}" title="${subAvvisoOn(a)?'Notifica scadenza attiva':'Notifica scadenza disattivata'}">${subAvvisoOn(a)?ico('bell'):ico('bellOff')}</button>
            Scade il <b>${fmtDate(a.scadenza)}</b>
          </span>
          ${countdownBadge(a.scadenza, a.stato==='Attivo'?'Scadenza non impostata':'Non attivo')}
        </div>
      </div>`;
    }).join('') || `<div class="empty-state">Nessun abbonamento registrato.</div>`;
    container.innerHTML = `<div class="sub-grid" id="subGrid">${cardsHtml}</div>`;

    // FLIP step 2-3 (Last + Invert + Play): per ogni card ancora presente, calcola lo spostamento
    // rispetto alla posizione misurata prima del riordino e lo anima invece di lasciarlo istantaneo.
    if(animate && Object.keys(oldRects).length){
      const newCards = container.querySelectorAll('.sub-card[data-id]');
      newCards.forEach(card=>{
        const old = oldRects[card.dataset.id];
        if(!old) return;
        const now = card.getBoundingClientRect();
        const dx = old.left - now.left, dy = old.top - now.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
        card.style.transition = 'none';
        card.style.transform = `translate(${dx}px,${dy}px)`;
        requestAnimationFrame(()=>{
          card.style.transition = 'transform .32s cubic-bezier(.4,0,.2,1)';
          card.style.transform = '';
        });
      });
    }
  }

function normalizeMatch(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function openSubModal(id){
  const editing = id ? DB.abbonamenti.find(a=>a.id===id) : null;
  const html = `
    <div class="modal-head"><h3>${editing?'Modifica abbonamento':'Nuovo abbonamento'}</h3><button class="close-x" id="sClose">${ico('x')}</button></div>
    <div class="modal-body slim-form">
